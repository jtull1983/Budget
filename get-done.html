<title>Get Shit Done</title>
<style>
:root{
  --bg:#F3F4F6; --slab:#FFFFFF; --slab2:#EAECF0; --line:#DEE1E7;
  --text:#14161C; --muted:#646C7C; --gold:#B07C12; --gold-tint:rgba(176,124,18,.10);
  --mint:#1C8A5E; --coral:#C4453C; --shadow:0 1px 2px rgba(20,22,28,.08);
  --r:14px; --pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --slab:#161A22; --slab2:#1E232D; --line:#272D39;
    --text:#E8EAEE; --muted:#8A93A4; --gold:#E8B44A; --gold-tint:rgba(232,180,74,.12);
    --mint:#4CC28E; --coral:#E8635A; --shadow:none;
  }
}
:root{--cta:255,140,0;--cta2:255,94,77;--cta-ink:#fff}
:root[data-mode="work"]{--cta:124,179,66;--cta2:201,148,86;--cta-ink:#15130F;--gold:#9A6B2F}
@media (prefers-color-scheme:dark){
  :root[data-mode="work"]:not([data-theme="light"]){
    --bg:#13110D; --slab:#1C1914; --slab2:#26211A; --line:#352E24;
    --text:#EFE8DC; --muted:#A69A85; --gold:#C9A15A; --gold-tint:rgba(201,161,90,.13); --mint:#7CB342;
  }
}
:root[data-theme="dark"][data-mode="work"]{
  --bg:#13110D; --slab:#1C1914; --slab2:#26211A; --line:#352E24;
  --text:#EFE8DC; --muted:#A69A85; --gold:#C9A15A; --gold-tint:rgba(201,161,90,.13); --mint:#7CB342;
}
:root[data-theme="dark"]{
  --bg:#0E1117; --slab:#161A22; --slab2:#1E232D; --line:#272D39;
  --text:#E8EAEE; --muted:#8A93A4; --gold:#E8B44A; --gold-tint:rgba(232,180,74,.12);
  --mint:#4CC28E; --coral:#E8635A; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:660px;margin:0 auto;padding:0 var(--pad) 120px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;
  border-bottom:1px solid transparent;transition:border-color .2s}
header.stuck{border-color:var(--line)}
.h-row{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:.01em;font-weight:800}
.h-tools{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--slab);display:grid;place-items:center;
  border:1px solid var(--line);font-size:16px;color:var(--muted)}
.icon-btn:active{background:var(--slab2)}

/* ---- section heads (brain dump only) ---- */
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--muted)}
.sec .rule{flex:1;height:1px;background:var(--line)}

.goalsbar{margin:18px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-size:14.5px;font-weight:700;color:var(--cta-ink);background:rgb(var(--cta));padding:10px 18px;border-radius:12px}
.undo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;
  background:rgba(var(--cta2),.14);border:1.5px solid rgba(var(--cta2),.6);color:rgb(var(--cta2));transition:background .2s,opacity .2s}
.undo:hover{background:rgba(var(--cta2),.26)}
.undo:active{transform:scale(.9)}
.undo svg{width:19px;height:19px}
.undo.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.undo.spin svg{animation:uspin .55s cubic-bezier(.3,1.35,.5,1)}
@keyframes uspin{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.wrap.flip{animation:flip .4s cubic-bezier(.2,.8,.3,1)}
@keyframes flip{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
.pill:active{opacity:.85}

/* ---- goals ---- */
.goal{position:relative;background:rgba(var(--gc,232,180,74),.11);border:1px solid rgba(var(--gc,232,180,74),.35);border-radius:var(--r);cursor:pointer;
  padding:13px 14px 13px 16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgb(var(--gc,232,180,74))}
.goal.dim::before{background:var(--line)}
.goal-top{display:flex;gap:10px;align-items:flex-start}
.goal-title{font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1.25;flex:1}
.goal-when{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px}
.goal-when.late{color:var(--coral)}
.goal-next{margin-top:6px;font-size:14px;color:var(--text);display:flex;gap:7px;align-items:flex-start}
.goal-next span:first-child{color:rgb(var(--gc,232,180,74));font-weight:650;flex:none;font-size:12px;padding-top:2px}
.goal-meta{margin-top:9px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:2px;background:var(--slab2);overflow:hidden}
.bar i{display:block;height:100%;background:rgb(var(--gc,232,180,74));border-radius:2px;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--slab2);color:var(--muted)}
.tag.warn{background:var(--gold-tint);color:var(--gold)}

/* ---- week ---- */
.weeknav{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 22px}
.weeknav .label{font-size:14px;font-weight:600;color:var(--muted);min-width:130px;text-align:center}
.nav-btn{width:32px;height:32px;border-radius:9px;background:var(--slab);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:14px}
.today-btn{font-size:13px;color:var(--gold);font-weight:600;padding:6px 4px}

.day{position:relative;display:flex;gap:12px;padding:8px 14px 8px 8px;margin-bottom:8px;border-radius:36px;
  background:transparent;isolation:isolate;transition:background .3s}
.day.has{background:rgba(var(--dc),.12)}
.dayfill{position:absolute;left:0;top:0;bottom:0;z-index:-1;background:rgba(var(--dc),.32);
  border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.3,1)}

<script>
(function(){
"use strict";
var APP_VERSION="1.7.0";
var MODE=(function(){try{return localStorage.getItem("stgd.mode")==="work"?"work":"play"}catch(e){return "play"}})();
var KEY=MODE==="work"?"stgd.work.v1":"stgd.v1";
var DAYNAME=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DAYSHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- state ---------- */
function uid(){return Math.random().toString(36).slice(2,9)}
function blank(){return{goals:[],tasks:[],ui:{theme:"system",goalTab:{},collapsed:{}},v:1}}
var S=blank();
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.goals&&p.tasks)S=p;}}catch(e){}
if(!S.ui)S.ui={theme:"system",goalTab:{},collapsed:{}};
if(!S.ui.goalTab)S.ui.goalTab={};
if(!S.ui.collapsed)S.ui.collapsed={};
var hist=[],lastData=null,lastPush=0;
function dataStr(){return JSON.stringify([S.goals.filter(function(g){return !g.draft}),S.tasks])}
function save(typing){
  var d=dataStr();
  if(lastData!==null&&d!==lastData){if(!typing||Date.now()-lastPush>800){hist.push(lastData);if(hist.length>50)hist.shift()}lastPush=Date.now()}
  lastData=d;
  try{S.appVersion=APP_VERSION;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Storage is full or blocked — copy a backup from the ⋯ menu")}
  updUndo();
}

/* ---------- dates ---------- */
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d.getTime());var w=(x.getDay()+6)%7;return addDays(x,-w)}
function fmtShort(d){return MON[d.getMonth()]+" "+d.getDate()}
var TODAY=iso(today());
var viewWeek=monday(today());

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function goal(id){for(var i=0;i<S.goals.length;i++)if(S.goals[i].id===id)return S.goals[i];return null}
function task(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null}
var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},2200)}
function each(el,sel,fn){[].forEach.call(el.querySelectorAll(sel),fn)}
function progress(g){
  var tot=0,don=0;
  function c(x,k){tot++;if(x[k||"done"])don++}
  (g.moves||[]).forEach(function(m){if(m.text)c(m)});
  (g.needs||[]).forEach(function(n){c(n)});
  (g.lists||[]).forEach(function(l){(l.items||[]).forEach(function(i){c(i)})});
  (g.barriers||[]).forEach(function(b){c(b,"cleared")});
  S.tasks.forEach(function(t){if(t.goalId===g.id)c(t)});
  return tot?Math.round(don/tot*100):0;
}
function touch(g){g.touched=Date.now()}
var OLDGOAL=["255,94,77","0,201,219","255,196,87","170,90,255","46,213,115","247,86,124","0,150,205","255,140,66"];
var GOALRGB=["255,105,180","64,120,255","255,214,0","0,229,160","255,120,0","120,200,255","230,80,60","210,170,255"];
function migrate(){
  S.goals=S.goals.filter(function(g){return !g.draft});
  S.goals.forEach(function(g,i){
    if(!g.rgb)g.rgb=GOALRGB[i%GOALRGB.length];
    var oi=OLDGOAL.indexOf(g.rgb);if(oi>-1)g.rgb=GOALRGB[oi];
    if(!g.moves)g.moves=g.next?[{id:uid(),text:g.next,done:false}]:[];
  });
  S.tasks.forEach(function(t){if(t.order==null)t.order=t.ts||0;if(!t.steps)t.steps=[]});
}
function byOrder(a,b){return a.order-b.order}
/* unfinished tasks from earlier days slide forward to today */
function autoRoll(){
  var late=S.tasks.filter(function(t){return !t.done&&t.day!=="parking"&&t.day<TODAY});
  if(!late.length)return;
  var here=S.tasks.filter(function(t){return t.day===TODAY}).map(function(t){return t.order});
  var min=here.length?Math.min.apply(null,here):Date.now();
  late.sort(function(a,b){return a.day<b.day?-1:a.day>b.day?1:a.order-b.order});
  late.forEach(function(t,i){t.day=TODAY;t.order=min-late.length+i});
  save();
}
function daysTo(s){return Math.round((parse(s)-today())/864e5)}
function curMove(g){var m=(g.moves||[]).filter(function(x){return x.text&&!x.done});return m[0]||null}

/* ---------- render: main ---------- */
function render(){renderAlerts();renderGoals();renderWeek()}

function renderAlerts(){
  var el=document.getElementById("rollover"),h="";
  S.goals.forEach(function(g){
    if(g.draft||g.archived||!g.target)return;
    var n=daysTo(g.target),msg=null;
    if(n<0)msg="blew past its date by "+(-n)+" day"+(n===-1?"":"s");
    else if(n===0)msg="is due today";
    else if(n<=7)msg="is due in "+n+" day"+(n===1?"":"s");
    if(msg)h+='<button class="alert" style="--gc:'+g.rgb+'" data-goal="'+g.id+'"><b>'+esc(g.title)+'</b> '+msg+'</button>';
  });
  el.innerHTML=h;
  each(el,"[data-goal]",function(n){n.onclick=function(){openGoal(n.getAttribute("data-goal"))}});
}

function renderGoals(){
  var el=document.getElementById("goals");
  var live=S.goals.filter(function(g){return !g.archived&&!g.draft});
  var done=S.goals.filter(function(g){return g.archived&&!g.draft});
  if(!live.length&&!done.length){
    el.innerHTML='<div class="empty"><b>Nothing big on the board yet.</b>Park a goal here that takes months, not minutes — then chip away at it one move at a time.</div>';
    return;
  }
  var h=live.map(goalCard).join("");
  if(done.length)h+='<div class="sec"><h2>Put to bed ('+done.length+')</h2><div class="rule"></div></div>'+done.map(goalCard).join("");
  el.innerHTML=h;
  each(el,"[data-goal]",function(n){n.onclick=function(){openGoal(n.getAttribute("data-goal"))}});
}
function goalCard(g){
  var p=progress(g),when="",cm=curMove(g);
  if(g.target){var late=!g.archived&&daysTo(g.target)<0;
    when='<div class="goal-when'+(late?" late":"")+'">'+esc(fmtShort(parse(g.target)))+'</div>'}
  var openB=(g.barriers||[]).filter(function(b){return !b.cleared}).length;
  var needs=(g.needs||[]).filter(function(n){return !n.done}).length;
  var tg="";
  if(openB)tg+='<span class="tag warn">'+openB+' in the way</span>';
  if(needs)tg+='<span class="tag">'+needs+' need'+(needs>1?"s":"")+'</span>';
  var mv=(g.moves||[]).filter(function(m){return m.text}),mvd=mv.filter(function(m){return m.done}).length;
  if(mv.length)tg+='<span class="tag">'+mvd+'/'+mv.length+' moves</span>';
  return '<div class="goal'+(g.archived?" dim":"")+'" style="--gc:'+g.rgb+'" data-goal="'+g.id+'">'+
    (p?'<div class="gfill" style="width:calc(68px + (100% - 68px) * '+(p/100)+')"></div>':"")+
    '<div class="gcirc"><b>'+p+'</b><small>%</small></div>'+
    '<div class="gbody"><div class="goal-top"><div class="goal-title">'+esc(g.title)+'</div>'+when+'</div>'+
    (cm?'<div class="goal-next"><span>Next</span><span>'+esc(cm.text)+'</span></div>':"")+
    (tg?'<div class="chips">'+tg+'</div>':"")+'</div></div>';
}

function isDesk(){return window.matchMedia("(min-width:860px)").matches}
var deskOff=0;
function dayCard(d,k){
  var key=iso(d),isT=key===TODAY,past=key<TODAY,dow=d.getDay(),isOpen=openAdd===key;
  var list=S.tasks.filter(function(t){return t.day===key}).sort(byOrder);
  var doneN=list.filter(function(t){return t.done}).length;
  var coll=!!S.ui.collapsed[key]&&!isOpen,pct=list.length?Math.round(doneN/list.length*100):0;
  var st='--dc:'+DAYRGB[dow];
  if(k!=null&&past)st+=';opacity:'+Math.max(.4,1-.13*(-k)).toFixed(2);
  return '<div class="day'+(isT?" is-today":"")+(past&&k==null?" past":"")+(list.length?" has":"")+'" style="'+st+'" data-drop="'+key+'">'+
    (pct?'<div class="dayfill" style="width:calc(68px + (100% - 68px) * '+(pct/100)+')"></div>':"")+
    '<div class="daytop" data-daytoggle="'+key+'"><div class="daymark"><div class="d">'+d.getDate()+'</div><div class="m">'+DAYSHORT[dow]+'</div></div>'+
    '<div class="dayhead"><span class="name">'+(isT?"Today":DAYNAME[dow])+'</span>'+
      (list.length?'<span class="count">'+doneN+'/'+list.length+'</span>':"")+
      '<button class="dayplus'+(isOpen?" open":"")+'" data-dayadd="'+key+'" aria-label="'+
        (isOpen?"Close":"Add to "+DAYNAME[dow])+'">+</button></div></div>'+
    '<div class="daylist" data-droplist>'+(coll?"":list.map(function(t,j){return taskRow(t,j,list.length)}).join(""))+
    (isOpen?'<div class="dayin-wrap'+(openAnim?" drop":"")+'"><input class="dayin" data-dayin="'+key+'" type="text" enterkeyhint="done" autocomplete="off" placeholder="'+
      esc(addMsg(key,addCount[key]||0))+'"><button class="dayok" data-dayok aria-label="Add it">✓</button></div>':"")+
    '</div></div>';
}
function renderWeek(fromOff){if(isDesk())renderDesk(fromOff);else renderMobile()}
function renderMobile(){
  var el=document.getElementById("week"),start=viewWeek,end=addDays(start,6);
  document.getElementById("wkLabel").textContent=
    fmtShort(start)+" – "+(start.getMonth()===end.getMonth()?end.getDate():fmtShort(end));
  var h="";
  for(var i=0;i<7;i++)h+=dayCard(addDays(start,i));
  suppressBlur=true;el.innerHTML=h;suppressBlur=false;
  openAnim=false;justAdded=null;
  wireTasks(el);wireDayAdd(el);
}
/* desktop: five full days, yesterday peeking on the left, slides a day at a time */
function renderDesk(fromOff){
  var el=document.getElementById("week");
  var cw=el.clientWidth||1200,gap=14,peek=Math.round(Math.min(110,cw*.07));
  var colW=Math.floor((cw-peek-gap*5)/5),step=colW+gap;
  if(fromOff==null)fromOff=deskOff;
  if(Math.abs(fromOff-deskOff)>10)fromOff=deskOff+(fromOff>deskOff?10:-10);
  var s=Math.min(fromOff,deskOff)-1,e=Math.max(fromOff,deskOff)+5,t0=today(),h='<div class="dtrack">';
  for(var k=s;k<=e;k++)h+='<div class="dcol'+(k===deskOff-1?" peek"+(k<0?" pastp":""):"")+'" style="width:'+colW+'px">'+dayCard(addDays(t0,k),k)+'</div>';
  suppressBlur=true;el.innerHTML=h+'</div>';suppressBlur=false;
  var tr=el.firstChild,T=function(o){return peek-colW-(o-1-s)*step};
  tr.style.transform="translateX("+T(fromOff)+"px)";
  if(fromOff!==deskOff){void tr.offsetWidth;tr.style.transition="transform .42s cubic-bezier(.2,.8,.3,1)";tr.style.transform="translateX("+T(deskOff)+"px)"}
  document.getElementById("deskToday").style.visibility=deskOff?"visible":"hidden";
  openAnim=false;justAdded=null;
  wireTasks(el);wireDayAdd(el);
  each(el,".dcol.peek",function(n){n.onclick=function(){deskGo(-1)}});
}
function deskGo(n){var f=deskOff;deskOff+=n;renderDesk(f)}

/* ---------- inline day add ---------- */
var DAYRGB=["255,140,66","255,94,77","46,213,115","255,196,87","0,150,205","247,86,124","0,201,219"];
var openAdd=null,addCount={},suppressBlur=false,plusGuard=false,openAnim=false,justAdded=null;
var LADDER=["Add even more shit","Add EVEN more shit","Add EVEN MOOOORE shit",
  "Okay, more shit. Sure.","You're a busy beaver, holy shit","Keep it coming",
  "Is this a to-do list or a novel","Your future self is sweating","Bold of you to assume there's time",
  "Holy shit, you're on a roll"];
var GENERIC=["Pile it on","Another one. DJ Khaled voice.","The list grows. The list hungers.","Sure, why not",
  "Somebody's ambitious","There are only 24 hours, just so you know","Add it before you forget it",
  "Brain to list. Go.","This is a lot of shit","Who hurt you","Delegate some of this maybe?",
  "You and what army","Write it down, deal with it later","Future you says thanks. Or screw you.",
  "The shit pile deepens","More? Really? Okay.","Stack it up","Big day energy",
  "We're gonna need a bigger list","Is any of this actually urgent","Put it on the pile",
  "Your to-do list has a to-do list","Hydrate. Then add more shit.","Somewhere a calendar is crying",
  "You're building a monument to busy","Cool cool cool cool cool","Do you ever sleep",
  "Unhinged productivity unlocked","The list is becoming sentient","Add it, crush it, forget it",
  "Make it make sense","Honestly? Respect.","Chaos, but organized","Look at you go",
  "Productivity goblin mode","Just one more. Famous last words.","What else is rattling around in there",
  "Dump it all out","Capture it before it escapes","More shit, fewer excuses",
  "Nobody's grading this, go nuts","The pile has become a mountain","Maybe skip one of these?",
  "You're in the zone","Absolute unit of a day","Is this even possible","Every item is a tiny promise",
  "Don't forget to eat lunch","Add it, you coward","Now we're cooking","Shit list: extended edition",
  "Director's cut of shit","Ok overachiever","Your inbox fears you","Plot twist: more shit",
  "The sequel nobody asked for","Keep going, I'm not judging (I'm judging)","You sure you're not two people",
  "Coffee count: rising","Might need a nap after this","This day is fully booked",
  "Congrats, you invented overtime","Load-bearing to-do list","Wow. Just wow.","Go on then",
  "Deep breath. Add it.","Stack 'em high","More shit incoming","The list demands tribute","Beaver mode: engaged"];
var DAYMSG=[
  ["Sunday scaries, activated","Meal prep counts, I guess","Rest is also a task","Sunday reset, fine",
   "Plan the week, then lie down","God rested. Just saying.","Easy there, it's Sunday"],
  ["Dude, it's a Monday. Chill.","Mondays hate you too","Starting strong, huh","Monday coffee better be strong",
   "New week, same shit","Easy, the week just started","Monday called, it's already tired","Monday energy: questionable"],
  ["Tuesday: Monday's quieter cousin","Taco Tuesday exists, remember","Tuesday's got room. Barely.",
   "Nobody's ever excited about Tuesday","Tuesday grind, activated","Two days in and look at you",
   "Tuesday is where plans actually happen","Make Tuesday earn it"],
  ["Hump day shit","Halfway there, keep pushing","Wednesday: the week's middle child","It is Wednesday, my dudes",
   "Midweek pile-up","Over the hump, under the pile","Wednesday's getting crowded","Middle of the week, middle of the chaos"],
  ["Thursday: Friday's opening act","Almost Friday, hold the line","Thursday's the new Friday, apparently",
   "One more push till Friday","Throwback to when you had free time","Thursday's filling up fast",
   "Thirsty Thursday? Not with this list","Thursday said 'why me'"],
  ["It's FRIDAY. Why are you doing this.","Friday's for finishing, not starting","The weekend is RIGHT there, man",
   "Friday shit, then freedom","Casual Friday, serious list","Leave something for next week",
   "Don't make Friday regret this","TGIF, but make it productive"],
  ["It's Saturday, go touch grass","Weekend warrior, huh","Saturday chores or Saturday fun?",
   "Saturday is for errands, apparently","You know it's the weekend, right","Saturday's supposed to be chill",
   "Weekend mode: partially enabled","Saturday shit list, unfortunately"]];
function hsh(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function addMsg(key,n){
  var dow=parse(key).getDay();
  if(n===0){if(MODE==="work")return dow===0?"Sunday? Keep it light.":"Add to "+DAYNAME[dow];
    return dow===0?"It's the day of rest, you atheist!":"Add shit to "+DAYNAME[dow]}
  if(n<=3)return LADDER[n-1];
  var pool=DAYMSG[dow].concat(DAYMSG[dow],GENERIC,LADDER.slice(3));
  return pool[hsh(key+":"+n)%pool.length];
}
function focusDayIn(){var n=document.querySelector("[data-dayin]");if(n)n.focus()}
function pushDayIn(inp){
  var v=inp.value.trim(),k=inp.getAttribute("data-dayin");
  if(!v)return false;
  addTask(v,k);justAdded=S.tasks[S.tasks.length-1].id;addCount[k]=(addCount[k]||0)+1;return true;
}
function wireDayAdd(el){
  [].forEach.call(el.querySelectorAll("[data-dayadd]"),function(n){
    n.onpointerdown=function(e){e.preventDefault();plusGuard=true;setTimeout(function(){plusGuard=false},600)};
    n.onclick=function(e){e.stopPropagation();togglePlus(n.getAttribute("data-dayadd"))}});
  var inp=el.querySelector("[data-dayin]");
  if(!inp)return;
  function nextBar(){if(pushDayIn(inp))openAnim=true;render();focusDayIn()}
  inp.onkeydown=function(e){if(e.key!=="Enter")return;e.preventDefault();nextBar()};
  var ok=el.querySelector("[data-dayok]");
  ok.onpointerdown=function(e){e.preventDefault();plusGuard=true;setTimeout(function(){plusGuard=false},600)};
  ok.onclick=function(e){e.stopPropagation();nextBar()};
  /* iOS "Done", tapping away, or tapping the field off = same as pressing done */
  inp.onblur=function(){
    if(suppressBlur||plusGuard)return;
    pushDayIn(inp);openAdd=null;render()};
}
function togglePlus(key){
  var cur=document.querySelector("[data-dayin]");
  if(cur)pushDayIn(cur);
  if(openAdd===key){openAdd=null;render();return}
  openAdd=key;addCount[key]=0;openAnim=true;
  if(S.ui.collapsed[key]){delete S.ui.collapsed[key];save()}
  render();focusDayIn();
}
function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}

  note:svg('<rect x="4.5" y="3" width="15" height="18" rx="3"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>'),

var tkOpen={};
function taskRow(t,i,n){
  var o=tkOpen[t.id]||{},st=t.steps||[],sd=st.filter(function(s){return s.done}).length;
  var a=Math.max(.28,.85-i*.12);
  var h='<div class="tk'+(t.done?" done":"")+(t.id===justAdded?" drop":"")+'" data-tk="'+t.id+'" style="border-color:rgba(var(--dc),'+a.toFixed(2)+')">'+
    '<div class="tk-row">'+
    '<button class="box" data-check="'+t.id+'" aria-label="Done">✓</button>'+
    '<button class="tk-title" data-note="'+t.id+'">'+esc(t.title)+
      (t.notes&&!o.note?'<span class="tk-dot" aria-hidden="true"></span>':"")+'</button>'+
    '<button class="tk-ic'+(o.list?" on":st.length?" has":"")+'" data-list="'+t.id+'" aria-label="List">'+IC.note+
      (st.length&&!o.list?'<span class="tk-ct">'+sd+'/'+st.length+'</span>':"")+'</button>'+
    '<button class="tk-ic" data-del="'+t.id+'" aria-label="Delete">'+IC.x+'</button></div>';
  if(o.note)h+='<div class="tk-panel drop"><textarea class="tk-note" data-notes="'+t.id+'" placeholder="Notes">'+esc(t.notes)+'</textarea></div>';
  if(o.list)h+='<div class="tk-panel drop">'+st.map(function(s){
      return '<div class="tk-item'+(s.done?" checked":"")+'"><button class="mini" data-stck="'+t.id+'|'+s.id+'">✓</button>'+
        '<span class="txt">'+esc(s.text)+'</span><button class="tk-ic sm" data-strm="'+t.id+'|'+s.id+'" aria-label="Remove">'+IC.x+'</button></div>'}).join("")+
    '<input class="tk-add" data-stadd="'+t.id+'" placeholder="Add to the list" enterkeyhint="done" autocomplete="off"></div>';
  return h+'</div>';
}
function refocus(sel){var n=document.querySelector(sel);if(n)n.focus()}
function wireTasks(el){
  each(el,"[data-tk]",function(n){n.onpointerdown=tkDown});
  each(el,"[data-daytoggle]",function(n){n.onclick=function(e){
    if(e.target.closest("[data-dayadd]"))return;
    var key=n.getAttribute("data-daytoggle");
    if(S.ui.collapsed[key])delete S.ui.collapsed[key];else S.ui.collapsed[key]=true;
    if(openAdd===key)openAdd=null;
    save();renderWeek()}});
  each(el,"[data-check]",function(n){n.onclick=function(){if(Date.now()-justDragged<400)return;var t=task(n.getAttribute("data-check"));if(!t)return;
    t.done=!t.done;t.doneTs=t.done?Date.now():null;save();render()}});
  each(el,"[data-note]",function(n){n.onclick=function(){if(Date.now()-justDragged<400)return;var id=n.getAttribute("data-note"),o=tkOpen[id]=tkOpen[id]||{};
    o.note=!o.note;render();if(o.note)refocus('[data-notes="'+id+'"]')}});
  each(el,"[data-list]",function(n){n.onclick=function(){var id=n.getAttribute("data-list"),o=tkOpen[id]=tkOpen[id]||{};
    o.list=!o.list;render();if(o.list)refocus('[data-stadd="'+id+'"]')}});
  each(el,"[data-del]",function(n){n.onclick=function(){var id=n.getAttribute("data-del");
    S.tasks=S.tasks.filter(function(x){return x.id!==id});delete tkOpen[id];save();render();toast("Deleted")}});
  each(el,"[data-notes]",function(n){n.oninput=function(){var t=task(n.getAttribute("data-notes"));if(t){t.notes=n.value;save(1)}}});
  each(el,"[data-stck]",function(n){n.onclick=function(){var p=n.getAttribute("data-stck").split("|"),t=task(p[0]);if(!t)return;
    t.steps.forEach(function(s){if(s.id===p[1])s.done=!s.done});save();render()}});
  each(el,"[data-strm]",function(n){n.onclick=function(){var p=n.getAttribute("data-strm").split("|"),t=task(p[0]);if(!t)return;
    t.steps=t.steps.filter(function(s){return s.id!==p[1]});save();render()}});
  each(el,"[data-stadd]",function(n){
    function push(){var v=n.value.trim(),id=n.getAttribute("data-stadd"),t=task(id);if(!v||!t)return false;
      n.value="";t.steps.push({id:uid(),text:v,done:false});save();return true}
    n.onkeydown=function(e){if(e.key!=="Enter")return;e.preventDefault();var id=n.getAttribute("data-stadd");
      if(push()){render();refocus('[data-stadd="'+id+'"]')}};
    n.onblur=function(){if(suppressBlur)return;if(push())render()};
  });
  each(el,"[data-add]",function(n){
    n.onkeydown=function(e){
      if(e.key!=="Enter")return;
      var v=n.value.trim();if(!v)return;
      var day=n.getAttribute("data-add");addTask(v,day);n.value="";render();refocus('[data-add="'+day+'"]');
    }});
}
function moveTask(id,dir){
  var t=task(id);if(!t)return;
  var list=S.tasks.filter(function(x){return x.day===t.day}).sort(byOrder);
  var i=list.indexOf(t),j=i+dir;if(j<0||j>=list.length)return;
  var o=t.order;t.order=list[j].order;list[j].order=o;
  if(t.order===list[j].order)t.order+=dir*.5;
  save();render();
}
function addTask(title,day,goalId){
  S.tasks.push({id:uid(),title:title,day:day,done:false,ts:Date.now(),order:Date.now(),goalId:goalId||null,
    notes:"",link:"",steps:[],effort:"",must:false});
  save();
}
function sheetDump(){
  var list=S.tasks.filter(function(t){return t.day==="parking"}).slice().sort(function(a,b){return b.ts-a.ts});
  var h=head("Brain dump","Everything you\u2019ve dumped, newest first");
  h+=list.length?list.map(function(t){
    var dt=new Date(t.ts),dow=dt.getDay();
    var when=DAYSHORT[dow]+" "+MON[dt.getMonth()]+" "+dt.getDate()+" \u00b7 "+
      dt.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    return '<div class="dmp" style="--dc:'+DAYRGB[dow]+'"><div class="dmp-when">'+esc(when)+'</div>'+taskRow(t,0,1)+'</div>';
  }).join(""):'<div class="hint">Nothing dumped yet. Tap the brain at the bottom to jot something down.</div>';
  sheetBody.innerHTML=h;wireHead();wireTasks(sheetBody);
}

/* ---------- drag tasks (mouse: drag; touch: press and hold, then drag) ---------- */
var drag=null,justDragged=0;
function tkDown(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var tg=e.target;if(tg.closest("input,textarea,a,.tk-panel"))return;
  var b=tg.closest("button");if(b&&!b.classList.contains("tk-title"))return;
  if(e.pointerType==="mouse")e.preventDefault();
  var el=e.currentTarget;
  drag={id:el.getAttribute("data-tk"),el:el,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,active:false,touch:e.pointerType!=="mouse"};
  if(drag.touch){el.classList.add("pressing");drag.timer=setTimeout(function(){if(drag&&!drag.active)startDrag()},320)}
}
function startDrag(){
  var d=drag,r=d.el.getBoundingClientRect();d.active=true;d.el.classList.remove("pressing");
  d.dx=d.x-r.left;d.dy=d.y-r.top;
  var g=d.el.cloneNode(true);g.classList.add("tk-ghost");g.style.width=r.width+"px";
  g.style.setProperty("--dc",getComputedStyle(d.el).getPropertyValue("--dc"));
  document.body.appendChild(g);d.ghost=g;
  var ph=document.createElement("div");ph.className="tk-ph";ph.style.height=r.height+"px";
  d.el.parentNode.insertBefore(ph,d.el);d.ph=ph;d.el.classList.add("dragging");
  d.day=d.el.closest("[data-drop]").getAttribute("data-drop");
  document.body.classList.add("is-dragging");
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  (function loop(){if(!drag||!drag.active)return;var y=drag.y,m=70;
    if(y<m)window.scrollBy(0,-14);else if(y>window.innerHeight-m)window.scrollBy(0,14);
    moveDrag();requestAnimationFrame(loop)})();
}
function moveDrag(){
  var d=drag;d.ghost.style.transform="translate("+(d.x-d.dx)+"px,"+(d.y-d.dy)+"px) rotate(1.2deg)";
  var hit=document.elementFromPoint(d.x,d.y);if(!hit)return;
  var dz=hit.closest("[data-drop]");if(!dz||dz.closest(".peek"))return;
  var box=dz.hasAttribute("data-droplist")?dz:dz.querySelector("[data-droplist]");if(!box)return;
  var tks=[].filter.call(box.children,function(c){return c.classList.contains("tk")&&!c.classList.contains("dragging")});
  var before=null;
  for(var i=0;i<tks.length;i++){var r=tks[i].getBoundingClientRect();if(d.y<r.top+r.height/2){before=tks[i];break}}
  if(before){if(d.ph.nextSibling!==before)box.insertBefore(d.ph,before)}
  else if(tks.length){var last=tks[tks.length-1];if(last.nextSibling!==d.ph)box.insertBefore(d.ph,last.nextSibling)}
  else if(d.ph.parentNode!==box)box.insertBefore(d.ph,box.firstChild);
  d.day=dz.getAttribute("data-drop");
}
function endDrag(){
  if(!drag)return;var d=drag;drag=null;clearTimeout(d.timer);d.el.classList.remove("pressing");
  if(!d.active)return;
  document.body.classList.remove("is-dragging");d.ghost.remove();
  var box=d.ph.parentNode,idx=0;
  [].some.call(box.children,function(c){if(c===d.ph)return true;if(c.classList.contains("tk")&&!c.classList.contains("dragging"))idx++;return false});
  var t=task(d.id);
  if(t){var list=S.tasks.filter(function(x){return x.day===d.day&&x!==t}).sort(byOrder);
    list.splice(idx,0,t);list.forEach(function(x,i){x.order=i});t.day=d.day;save()}
  justDragged=Date.now();render();
}
document.addEventListener("pointermove",function(e){
  if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;
  var dist=Math.abs(drag.x-drag.x0)+Math.abs(drag.y-drag.y0);
  if(!drag.active){
    if(drag.touch){if(dist>10){clearTimeout(drag.timer);drag.el.classList.remove("pressing");drag=null}return}
    if(dist<6)return;startDrag();
  }
  moveDrag();
});
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",function(){if(drag&&drag.active)endDrag();else if(drag){clearTimeout(drag.timer);drag.el.classList.remove("pressing");drag=null}});
document.addEventListener("touchmove",function(e){if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",function(e){if(drag)e.preventDefault()});

/* ---------- undo + two-tap confirm ---------- */
function undo(){
  if(!hist.length)return;
  var ub=document.getElementById("undoBtn");ub.classList.remove("spin");void ub.offsetWidth;ub.classList.add("spin");
  setTimeout(function(){ub.classList.remove("spin")},600);var d=JSON.parse(hist.pop());
  S.goals=S.goals.filter(function(g){return g.draft}).concat(d[0]);S.tasks=d[1];
  lastData=null;save();render();
  if(cur){if(cur.t==="goal"&&!goal(cur.id))closeSheet();else renderSheet()}
  toast("Undone");
}
function arm(btn,msg){
  if(btn.getAttribute("data-armed"))return true;
  var old=btn.textContent;btn.setAttribute("data-armed","1");btn.textContent=msg||"Tap again to confirm";btn.classList.add("armed");
  setTimeout(function(){if(btn.isConnected){btn.removeAttribute("data-armed");btn.textContent=old;btn.classList.remove("armed")}},3500);
  return false;
}

/* ---------- swipe the sheet down to dismiss (phones) ---------- */
(function(){
  var pn=sheet.querySelector(".sheet-panel"),y0=null,dy=0,on=false;
  pn.addEventListener("touchstart",function(e){
    if(window.innerWidth>=680||pn.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0;on=false},{passive:true});
  pn.addEventListener("touchmove",function(e){
    if(y0==null||drag)return;dy=e.touches[0].clientY-y0;
    if(!on&&dy>10&&pn.scrollTop<=0){on=true;pn.style.transition="none"}
    if(on){e.preventDefault();pn.style.transform="translateY("+Math.max(0,dy-10)+"px)"}},{passive:false});
  pn.addEventListener("touchend",function(){
    if(!on){y0=null;return}
    pn.style.transition="";
    if(dy>110){pn.style.transform="translateY(100%)";setTimeout(function(){pn.style.transform="";closeSheet()},200)}
    else pn.style.transform="";
    y0=null;on=false});
})();

function list(arr,key,check,ph,doneKey){

      (check?'<button class="mini" data-tick="'+key+'|'+it.id+'|'+doneKey+'">✓</button>':"")+

      '<button class="kill" data-rm="'+key+'|'+it.id+'">Remove</button></div>'}).join("");
  h+='<div class="addrow"><span class="plus">+</span><input type="text" data-push="'+key+'" placeholder="'+esc(ph)+'" data-focus="push:'+key+'" enterkeyhint="done"></div>';

function arrFor(g,key){
  if(key==="barriers")return (g.barriers=g.barriers||[]);
  if(key==="crew")return (g.crew=g.crew||[]);
  if(key.indexOf("list:")===0){var l=findIn(g.lists,key.slice(5));return l?l.items:null}
  return null;
}
function wireGoalTab(g,tab){

  });
  each(B,"[data-ndlrm]",function(n){n.onclick=function(){var p=n.getAttribute("data-ndlrm").split("|"),d=findIn(g.needs,p[0]);if(!d)return;

  each(B,"[data-ndilin]",function(n){

function dayChips(attr){
  var h="",d=today();
  for(var i=0;i<7;i++){var x=addDays(d,i),k=iso(x);
    h+='<button data-'+attr+'="'+k+'">'+(i===0?"Today":i===1?"Tomorrow":DAYSHORT[x.getDay()])+'</button>'}
  h+='<button data-'+attr+'="parking">Brain dump</button>';
  return h;
}

    '<button data-capgoal=""'+(!c.goalId?' class="on"':"")+'>Nothing bigger</button>'+
    S.goals.filter(function(g){return !g.archived}).map(function(g){
      return '<button data-capgoal="'+g.id+'"'+(c.goalId===g.id?' class="on"':"")+'>'+esc(g.title.slice(0,24))+'</button>'
    }).join("")+'</div>';
  h+='<button class="btn" data-capsave>Add it</button>';
  h+='<button class="btn ghost" data-capgoalnew>Make this a long-game goal instead</button>';
  sheetBody.innerHTML=h;wireHead();
  var B=sheetBody,inp=B.querySelector("[data-cap]");
  inp.value=c.text||"";
  inp.oninput=function(){c.text=inp.value};
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();doSave()}};
  [].forEach.call(B.querySelectorAll("[data-capday]"),function(n){
    n.onclick=function(){c.day=n.getAttribute("data-capday");renderSheet()}});
  [].forEach.call(B.querySelectorAll("[data-capgoal]"),function(n){
    n.onclick=function(){c.goalId=n.getAttribute("data-capgoal")||null;renderSheet()}});
  function doSave(){
    var v=(c.text||"").trim();if(!v){toast("Type it first");return}
    addTask(v,c.day,c.goalId);
    if(c.day!=="parking")delete S.ui.collapsed[c.day];
    closeSheet();render();toast(c.day==="parking"?"In the dump":"Added");
  }
  B.querySelector("[data-capsave]").onclick=doSave;
  B.querySelector("[data-capgoalnew]").onclick=function(){
    var v=(c.text||"").trim();if(!v){toast("Name it first");return}
    var g=newGoal(v);closeSheet();openGoal(g.id,true)};
  focusNext="cap";
}
function newGoal(title){
  var used=S.goals.map(function(g){return g.rgb});
  var free=GOALRGB.filter(function(x){return used.indexOf(x)<0});
  var c=free.length?free[Math.floor(Math.random()*free.length)]:GOALRGB[Math.floor(Math.random()*GOALRGB.length)];
  var g={id:uid(),title:title||"",dod:"",target:"",archived:false,draft:true,rgb:c,touched:Date.now(),
    moves:[],needs:[],barriers:[],notes:[],links:[],lists:[],crew:[],noteKind:"note"};
  S.goals.unshift(g);return g;
}
function jumpToTask(id){
  var t=task(id);if(!t)return;closeSheet();
  tkOpen[id]=tkOpen[id]||{};tkOpen[id].note=true;
  if(t.day!=="parking"){viewWeek=monday(parse(t.day));deskOff=daysTo(t.day);delete S.ui.collapsed[t.day]}
  render();var n=document.querySelector('[data-note="'+id+'"]');if(n)n.scrollIntoView({block:"center"});
}

/* ---------- search ---------- */
function sheetSearch(){
  var q=(cur.q||"").toLowerCase();
  var h=head("Find it","Goals, tasks, notes and links");
  h+='<input class="field" data-q value="'+esc(cur.q||"")+'" placeholder="Type a word" data-focus="q">';
  if(q.length>1){
    var gs=S.goals.filter(function(g){
      return !g.draft&&(g.title+" "+(g.dod||"")+" "+(g.moves||[]).map(function(m){return m.text}).join(" ")+" "+(g.notes||[]).map(function(n){return n.text}).join(" ")+" "+
        (g.links||[]).map(function(l){return l.label+" "+l.url}).join(" ")).toLowerCase().indexOf(q)>-1});
    var ts=S.tasks.filter(function(t){return (t.title+" "+(t.notes||"")).toLowerCase().indexOf(q)>-1});
    h+=gs.map(function(g){return '<div class="item"><div class="txt"><b data-og="'+g.id+'">'+esc(g.title)+
      '</b><small>Goal</small></div></div>'}).join("");
    h+=ts.map(function(t){return '<div class="item"><div class="txt"><b data-ot="'+t.id+'">'+esc(t.title)+
      '</b><small>'+(t.day==="parking"?"Brain dump":fmtShort(parse(t.day)))+(t.done?" · done":"")+'</small></div></div>'}).join("");
    if(!gs.length&&!ts.length)h+='<p class="hint">Nothing matches that yet.</p>';
  }
  sheetBody.innerHTML=h;wireHead();
  var i=sheetBody.querySelector("[data-q]");
  i.oninput=function(){cur.q=i.value;focusNext="q";renderSheet()};
  [].forEach.call(sheetBody.querySelectorAll("[data-og]"),function(n){
    n.onclick=function(){openGoal(n.getAttribute("data-og"))}});
  [].forEach.call(sheetBody.querySelectorAll("[data-ot]"),function(n){
    n.onclick=function(){jumpToTask(n.getAttribute("data-ot"))}});
}

/* ---------- settings ---------- */
function sheetSettings(){
  var wkStart=monday(today()),wkEnd=addDays(wkStart,6);
  var inWk=function(t){return t.day!=="parking"&&t.day>=iso(wkStart)&&t.day<=iso(wkEnd)};
  var doneWk=S.tasks.filter(function(t){return t.done&&inWk(t)}).length;
  var openWk=S.tasks.filter(function(t){return !t.done&&inWk(t)}).length;
  var h=head("Settings","Everything lives in this browser only · v"+APP_VERSION);
  h+='<p class="hint">'+doneWk+' done and '+openWk+' still open this week. '+
    S.goals.filter(function(g){return !g.archived}).length+' goals on the board.</p>';
  h+='<div class="lbl">Mode</div><button class="btn ghost" data-switch>'+(MODE==="work"?"Switch to Get Shit Done":"Switch to Work: TODO")+'</button>'+
    '<p class="hint">Work and personal keep completely separate goals and tasks. Shortcut: Alt + W.</p>';
  var perm=("Notification" in window)?Notification.permission:"unsupported";
  h+='<div class="lbl">Notifications</div><button class="btn ghost" data-testnote>Send a test notification</button>'+
    '<p class="hint">'+(perm==="granted"?"Notifications are on for this device.":
      perm==="denied"?"Notifications are blocked. Turn them on in your phone\u2019s Settings for this app, then try again.":
      perm==="unsupported"?"On iPhone, this only works once the app is on your Home Screen and opened from there.":
      "The first tap asks your permission.")+'</p>';
  h+='<div class="lbl">Look</div><div class="pick">'+
    ["system","light","dark"].map(function(x){
      return '<button data-theme="'+x+'"'+(S.ui.theme===x?' class="on"':"")+'>'+
        (x==="system"?"Match phone":x==="light"?"Light":"Dark")+'</button>'}).join("")+'</div>';
  h+='<div class="lbl">Tidy up</div>';
  h+='<button class="btn ghost" data-clear>Clear finished tasks older than 14 days</button>';
  h+='<div class="lbl">Backup</div>'+
    '<p class="hint">This app saves to this browser. Clearing site data wipes it. Copy the text below somewhere safe now and then, and paste it back to restore.</p>'+
    '<textarea class="field" data-backup style="min-height:110px;font-size:12px">'+esc(JSON.stringify(S))+'</textarea>'+
    '<div class="row2"><button class="btn ghost" data-copy>Copy backup</button>'+
    '<button class="btn ghost" data-restore>Restore from box</button></div>';
  h+='<button class="btn danger" data-wipe>Erase everything</button>';
  sheetBody.innerHTML=h;wireHead();
  var B=sheetBody;
  [].forEach.call(B.querySelectorAll("[data-theme]"),function(n){
    n.onclick=function(){S.ui.theme=n.getAttribute("data-theme");applyTheme();save();renderSheet()}});
  B.querySelector("[data-switch]").onclick=function(){switchMode()};
  B.querySelector("[data-testnote]").onclick=function(){testNotify()};
  B.querySelector("[data-clear]").onclick=function(){
    var cut=Date.now()-12096e5,n=S.tasks.length;
    S.tasks=S.tasks.filter(function(t){return !(t.done&&t.doneTs&&t.doneTs<cut)});
    save();render();renderSheet();toast(n-S.tasks.length+" cleared")};
  B.querySelector("[data-copy]").onclick=function(){
    var ta=B.querySelector("[data-backup]");ta.select();
    if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied")},
      function(){toast("Select it and copy by hand")});
    else toast("Select it and copy by hand")};
  B.querySelector("[data-restore]").onclick=function(){
    try{var p=JSON.parse(B.querySelector("[data-backup]").value);
      if(!p.goals||!p.tasks)throw 0;
      if(!arm(B.querySelector("[data-restore]"),"Tap again to replace everything"))return;
      S=p;if(!S.ui)S.ui={theme:"system",goalTab:{}};if(!S.ui.goalTab)S.ui.goalTab={};if(!S.ui.collapsed)S.ui.collapsed={};migrate();applyTheme();save();render();renderSheet();toast("Restored")}
    catch(e){toast("That text isn\u2019t a valid backup")}};
  B.querySelector("[data-wipe]").onclick=function(){
    if(!arm(B.querySelector("[data-wipe]"),"Tap again to erase everything"))return;
    S=blank();save();render();closeSheet();toast("Wiped clean")};
}
function applyTheme(){
  var t=S.ui.theme;
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

var PLAYSET=null;
function applyMode(){
  if(!PLAYSET)PLAYSET={day:DAYRGB,goal:GOALRGB,ladder:LADDER,generic:GENERIC,daymsg:DAYMSG,go:GO};
  var s=MODE==="work"?WORKSET:PLAYSET;
  DAYRGB=s.day;GOALRGB=s.goal;LADDER=s.ladder;GENERIC=s.generic;DAYMSG=s.daymsg;GO=s.go;
  document.documentElement.setAttribute("data-mode",MODE);
  document.querySelector("h1").textContent=MODE==="work"?"Work: TODO":"GET SHIT DONE";
  document.title=MODE==="work"?"Work: TODO":"Get Shit Done";
}
function updUndo(){
  var u=document.getElementById("undoBtn");if(!u)return;
  u.classList.toggle("off",!hist.length);
}
function switchMode(){
  save();if(cur)closeSheet();
  MODE=MODE==="work"?"play":"work";
  try{localStorage.setItem("stgd.mode",MODE)}catch(e){}
  KEY=MODE==="work"?"stgd.work.v1":"stgd.v1";
  var s=blank();
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.goals&&p.tasks)s=p}}catch(e){}
  S=s;if(!S.ui)S.ui={theme:"system",goalTab:{},collapsed:{}};
  if(!S.ui.goalTab)S.ui.goalTab={};if(!S.ui.collapsed)S.ui.collapsed={};
  hist=[];openAdd=null;tkOpen={};ndOpen={};deskOff=0;viewWeek=monday(today());
  applyMode();applyTheme();migrate();autoRoll();lastData=dataStr();updUndo();
  var w=document.querySelector(".wrap");w.classList.remove("flip");void w.offsetWidth;w.classList.add("flip");

});

applyMode();/* ---------- notifications ---------- */
function swReady(){
  if(!("serviceWorker" in navigator))return Promise.resolve(null);
  navigator.serviceWorker.register("sw.js").catch(function(){});
  return Promise.race([navigator.serviceWorker.ready,new Promise(function(r){setTimeout(function(){r(null)},3000)})]);
}
function testNotify(){
  if(!("Notification" in window)){
    toast(/iP(hone|ad|od)/.test(navigator.userAgent)&&!navigator.standalone?"Add it to your Home Screen first, then open it from there":"This browser can\u2019t show notifications");
    return;
  }
  var send=function(){
    var title=MODE==="work"?"Work: TODO":"Get Shit Done";
    var opts={body:MODE==="work"?"Test notification. Morning check-ins will land like this.":"Test ping. If you can see this, morning check-ins will reach you.",tag:"gsd-test"};
    swReady().then(function(r){
      if(r&&r.showNotification)return r.showNotification(title,opts).then(function(){toast("Sent. Check your notifications.")});
      new Notification(title,opts);toast("Sent. Check your notifications.");
    }).catch(function(){
      try{new Notification(title,opts);toast("Sent. Check your notifications.")}
      catch(e){toast("Couldn\u2019t send it. Is sw.js uploaded next to the app?")}
    });
  };
  if(Notification.permission==="granted")return send();
  if(Notification.permission==="denied"){toast("Notifications are blocked. Turn them on in Settings for this app.");return}
  Notification.requestPermission().then(function(p){
    if(p==="granted")send();else toast("No permission, no ping");
    if(cur&&cur.t==="settings")renderSheet();
  });
}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
var brainOpen=false;

  brainOpen=true;document.getElementById("brainFab").classList.add("hide");
  var dk=document.getElementById("brainDock");dk.classList.add("open");

}

function brainPush(){var v=bi.value.trim();if(!v)return false;bi.value="";addTask(v,"parking");return true}

document.getElementById("brainLog").addEventListener("pointerdown",function(e){

(function(){

  var parts=[sp.get("text"),sp.get("title")].filter(Boolean),url=sp.get("url");

})();
