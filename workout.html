<title>JART Training Log</title>
<style>
:root{
  --bg:#080b11; --panel:#0e1420; --panel2:#121a2a; --line:#1c2635;
  --txt:#d8e2ee; --mut:#6b7d94; --dim:#3d4c60;
  --cy:#35d0c0; --am:#f0a03c; --rd:#e2504a; --gr:#3fd97f; --vi:#9b7cf0; --pk:#f06ec0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;background:none;border:none}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar2{display:flex;align-items:center;gap:7px;padding:10px 10px;flex-wrap:nowrap}
.dayname{flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  color:var(--cy);letter-spacing:.03em;font-size:14px;white-space:nowrap;
  background:#0b1f1e;border:1px solid #1d5b55;border-radius:6px;padding:7px 9px;
  text-align:left;overflow:hidden}
.dayname:active{background:#123331;border-color:var(--cy)}
.dayname b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.dayname .swap{margin-left:auto;color:var(--cy);font-size:13px;flex:none;opacity:.85}
.burger{font-size:19px;padding:4px 2px;line-height:1;color:var(--mut);
  background:none;border:none;flex:none}
.moodrow{display:flex;justify-content:center;padding:0 10px 10px}
.moodrow.off{display:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:11px;color:var(--mut);background:var(--panel)}
.pill.on{color:var(--am);border-color:var(--am)}
.pill#startb.on{color:var(--gr);border-color:var(--gr);background:#0c1f16}
.clock{font-size:11px;color:var(--dim);letter-spacing:.06em}
.sdot{font-size:10px;letter-spacing:.05em}
.sdot.ok{color:var(--gr)} .sdot.wait{color:var(--am)} .sdot.bad{color:var(--rd)}
.icon{color:var(--mut);padding:6px 9px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel);font-size:12px}

/* ---------- blocks ---------- */
main{padding:12px 6px 140px;max-width:820px;margin:0 auto}
.blk{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;
  background:var(--panel);overflow:hidden;transition:border-color .15s}
.blk.pending{border-color:#4a1f22;background:linear-gradient(180deg,#160d10,var(--panel))}
.blk.done{border-color:var(--gr);background:linear-gradient(180deg,#0c1f16,var(--panel))}
.blk.skipped{border-color:var(--am);background:linear-gradient(180deg,#1d1509,var(--panel))}
.bhead{display:flex;align-items:center;gap:8px;padding:9px 10px 40px;
  height:74px;position:relative;overflow:hidden}
.blk.opt .bhead,.blk.test .bhead{height:46px;padding:10px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pending .dot{background:var(--rd)} .done .dot{background:var(--gr)}
.skipped .dot{background:var(--am)}
.bname{flex:1;min-width:0;letter-spacing:.02em;font-size:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pending .bname{color:var(--txt)} .done .bname{color:var(--gr)}
.skipped .bname{color:var(--am);text-decoration:line-through;text-decoration-color:var(--dim)}
.bmeta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:44%;flex:none}

/* per-exercise goal bars, absolutely placed so they never change block height */
.gbars{position:absolute;left:10px;right:10px;bottom:7px;display:block;
  pointer-events:none;font-size:0;line-height:0}
.gb2{display:block;margin-bottom:5px}
.gb2:last-child{margin-bottom:0}
.gb{display:block;width:100%;height:6px;border-radius:3px;background:#161d2b;
  overflow:hidden;border:1px solid rgba(216,226,238,.06);margin-bottom:2px}
.gb:last-child{margin-bottom:0}
.gb i{display:block;height:100%;border-radius:3px;transition:width .6s}
.gb.eoy i{background:linear-gradient(90deg,#8f2f6d,var(--pk))}
.gb.lterm i{background:linear-gradient(90deg,#1d6b62,var(--cy))}
.gb i.hit{background:linear-gradient(90deg,#1e6b3f,var(--gr))}
.gbkey{display:flex;gap:8px;align-items:center;font-size:9px;color:var(--dim);
  letter-spacing:.08em;margin:2px 2px 12px;flex-wrap:wrap}
.gbkey b{font-weight:400;margin-right:8px}
.sw{display:inline-block;width:16px;height:6px;border-radius:3px;vertical-align:middle;
  margin-right:5px}
.sw.k1{background:linear-gradient(90deg,#8f2f6d,var(--pk))}
.sw.k2{background:linear-gradient(90deg,#1d6b62,var(--cy))}
.sw.k3{background:linear-gradient(90deg,#1e6b3f,var(--gr))}

/* warm-up strip */
.warm{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);padding:12px;margin-bottom:8px}
.warm.on{border-color:var(--gr);background:linear-gradient(180deg,#0c1f16,var(--panel))}
.warm .dot{background:var(--rd)} .warm.on .dot{background:var(--gr)}
.wname{flex:1;min-width:0;font-size:11px;letter-spacing:.08em;color:var(--mut)}
.wname em{display:block;font-style:normal;font-size:11px;color:var(--dim);
  letter-spacing:.02em;margin-top:4px}
.warm.on .wname{color:var(--gr)}
.wmeta{font-size:11px;color:var(--dim)}

/* mood */
.moods{display:flex;gap:6px;justify-content:center}
.mood{border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:10px;
  color:var(--dim);background:var(--panel);letter-spacing:.05em}
.mood.on[data-mood=jacked]{color:var(--gr);border-color:var(--gr)}
.mood.on[data-mood=tired]{color:var(--am);border-color:var(--am)}
.mood.on[data-mood=meh]{color:var(--mut);border-color:var(--mut)}

/* stopwatch overlay */
.tmr{position:fixed;inset:0;background:#000d;z-index:90;display:none;
  align-items:center;justify-content:center}
.tmr.on{display:flex}
.tmrbox{background:var(--panel);border:1px solid var(--cy);border-radius:12px;
  padding:34px 38px;text-align:center;min-width:290px}
.tmrlab{font-size:11px;color:var(--mut);letter-spacing:.1em;margin-bottom:10px}
.tmrnum{font-size:82px;color:var(--cy);line-height:1.05;font-variant-numeric:tabular-nums}
.tmrnum.count{color:var(--am)}
.tmrsub{font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:6px}
.tmr .acts{justify-content:center}
.qtag{font-size:9px;color:var(--vi);border:1px solid #2e2450;border-radius:3px;
  padding:1px 4px;letter-spacing:.08em}
.info{color:var(--dim);padding:8px;font-size:13px;flex:none}
.blk.part{border-color:var(--am);background:linear-gradient(180deg,#16120b,var(--panel))}
.part .dot{background:var(--am)}
.sstag{font-size:9px;color:var(--cy);border:1px solid #164a45;border-radius:3px;flex:none;
  padding:1px 4px;letter-spacing:.08em;flex:none}
.ssnote{font-size:10px;color:var(--dim);letter-spacing:.04em;margin-bottom:10px}
.sub{border-left:2px solid var(--line);padding-left:6px;margin-bottom:14px}
.sub.done{border-left-color:var(--gr)} .sub.skipped{border-left-color:var(--am)}
.subhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ltr{color:var(--cy);font-size:11px;width:12px;flex:none}
.subname{color:var(--txt);font-size:13px;letter-spacing:.03em}
.subhead .info{margin-left:auto;border:none;background:none;padding:4px 6px}
.blk.test{border-color:#3a2d5e;background:linear-gradient(180deg,#12102a,var(--panel))}
.blk.test .dot{background:var(--vi)}
.blk.test .bname{color:var(--vi)}
.blk.opt{border-color:#5a2545;background:linear-gradient(180deg,#1a0e18,var(--panel));opacity:.9}
.blk.opt .dot{background:var(--pk)}
.blk.opt .bname{color:var(--pk)}
.poolhead{display:block;width:100%;text-align:left;font-size:10px;color:var(--pk);
  letter-spacing:.12em;margin:26px 0 10px;padding:13px 11px;border-radius:6px;
  border:1px solid #5a2545;background:linear-gradient(180deg,#1a0e18,var(--panel))}
.poolhead:active{background:#241224}
.poolhead b{font-weight:400}
.poolhead .pchev{display:inline-block;width:15px;color:var(--pk)}
.poolhead .pcount{float:right;color:var(--dim);letter-spacing:.06em}
.poolhead em{display:block;font-style:normal;color:var(--dim);letter-spacing:.03em;
  margin:7px 0 0 15px;font-size:10px;text-transform:none;line-height:1.5}
.poolhead:not(.on) em{display:none}

/* ---------- goal bars ---------- */
.gwrap{margin:4px 0 16px}
.grow{margin-bottom:14px}
.glab{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;gap:8px}
.glab b{font-weight:400;color:var(--txt)}
.glab span{color:var(--dim);text-align:right;white-space:nowrap}
.gbar{height:7px;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;overflow:hidden}
.gfill{height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#1d6b62,var(--cy));
  transition:width 1s cubic-bezier(.2,.8,.2,1)}
.gfill.hit{background:linear-gradient(90deg,#1e6b3f,var(--gr))}
.gpct{font-size:10px;color:var(--dim);margin-top:4px}
.bigstat{display:flex;gap:10px;margin:10px 0 20px}
.bs{flex:1;border:1px solid var(--line);border-radius:5px;padding:10px;text-align:center;
  background:var(--panel2)}
.bs b{display:block;font-size:20px;color:var(--cy);font-weight:400}
.bs span{font-size:9px;color:var(--dim);letter-spacing:.1em}

/* ---------- anatomy ---------- */
.anat{display:flex;gap:6px;justify-content:center;margin:16px 0 6px}
.anat svg{width:50%;max-width:168px;height:auto;opacity:.5;transition:opacity .3s}
.anat svg.lit{opacity:1}
.anat svg image{opacity:.72}
.anat svg.lit image{opacity:1}
.glow{fill:var(--cy);opacity:.16}
.glow.sec{fill:#5fa8c4;opacity:.10}
.pin{fill:var(--cy);stroke:#03151a;stroke-width:.6}
.pin.sec{fill:#5fa8c4}
.lead{stroke:var(--cy);stroke-width:.7;opacity:.75}
.llab{fill:var(--cy);font-size:6.5px;letter-spacing:.6px;
  font-family:ui-monospace,Menlo,monospace}
.vl{fill:#3d4c60;font-size:7px;letter-spacing:1.2px;text-anchor:middle}
.mlegend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  font-size:10px;letter-spacing:.05em;margin-bottom:4px}
.lg.pri{color:var(--cy)} .lg.sec{color:#4d7f96}
.diagout{margin-top:12px}
.dg{font-size:11px;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--line);
  word-break:break-word}
.body{border-top:1px solid var(--line);padding:10px 12px 14px;display:none}
.blk.open .body{display:block}

/* ---------- set rows ---------- */
.srow{display:flex;align-items:center;gap:3px;padding:5px 0;flex-wrap:nowrap}
.num{flex:1 1 46px;min-width:34px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:11px 1px;text-align:center;color:var(--txt)}
.num.big{flex:1 1 auto;padding:18px 4px;font-size:22px}
.num:focus{outline:none;border-color:var(--cy)}
.num.ghost{color:var(--dim)}
.x{color:var(--dim);font-size:11px;flex:none}
.tbtn,.f{border:1px solid var(--line);border-radius:5px;padding:11px 4px;
  font-size:9px;color:var(--dim);letter-spacing:0;background:var(--panel2);flex:none}
.tbtn.rp.on{color:var(--cy);border-color:var(--cy)}
.tbtn.fl.on{color:var(--rd);border-color:var(--rd)}
.rpn{flex:0 1 40px;min-width:28px}
.x{margin:0 -1px}
.tmrow{gap:6px}
.bigtm{flex:1;border:1px solid var(--cy);color:var(--cy);background:#08201f;
  border-radius:6px;padding:16px 10px;font-size:17px;letter-spacing:.06em;text-align:center}
.bigtm.done{border-color:var(--gr);color:var(--gr);background:#0c1f16}
.bigtm em{display:block;font-style:normal;font-size:9px;color:var(--dim);
  letter-spacing:.08em;margin-top:5px}
.pen{flex:none;border:1px solid var(--line);border-radius:5px;padding:14px 11px;
  font-size:14px;color:var(--dim);background:var(--panel2);line-height:1}
.pen.on{color:var(--gr);border-color:var(--gr)}
.f.on[data-f2=easy]{color:var(--cy);border-color:var(--cy)}
.f.on[data-f2=right]{color:var(--gr);border-color:var(--gr)}
.f.on[data-f2=tired]{color:var(--am);border-color:var(--am)}
.tbtn.tm{color:var(--cy);border-color:#164a45}
.srow.sk .num{text-decoration:line-through;opacity:.4}
.srow.sk{opacity:.55}

/* notebook */
.nbtn{position:relative;flex:none;padding:4px;border:1px solid transparent;
  border-radius:4px;line-height:0}
.nbtn.on{border-color:var(--line);background:var(--panel2)}
.nico{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nbtn.has .nico,.nbtn.on .nico{stroke:var(--cy)}
.hbtn{position:absolute;top:4px;right:34px;border:1px solid var(--line);border-radius:4px;
  padding:3px 7px;font-size:9px;color:var(--dim);letter-spacing:.08em;background:var(--panel2);z-index:2}
.hbtn.on{color:var(--am);border-color:var(--am)}
.holdtag{font-size:9px;color:var(--am);border:1px solid var(--am);border-radius:3px;
  padding:4px 4px;flex:none;line-height:1}
.ntick{position:absolute;right:-1px;bottom:-1px;font-size:9px;color:var(--gr);
  background:var(--panel);border-radius:50%;line-height:1;padding:1px}
.npad{position:relative;margin:0 0 10px 15px;border-left:2px solid var(--line);padding-left:8px}
.ncol{position:absolute;top:4px;right:6px;color:var(--dim);font-size:10px;padding:4px 6px;z-index:2}
.nta{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:8px 26px 8px 8px;color:var(--txt);min-height:52px;resize:vertical;display:block}
.nta:focus{outline:none;border-color:var(--cy)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.abtn{border:1px solid var(--line);border-radius:4px;padding:9px 13px;
  font-size:11px;color:var(--mut);letter-spacing:.06em;background:var(--panel2)}
.abtn.pri{color:var(--gr);border-color:#1e4b33}
.abtn.warn{color:var(--am);border-color:#4a3410}
.hint{font-size:10px;color:var(--dim);letter-spacing:.03em;margin-top:8px}
.rx{font-size:11px;color:var(--cy);letter-spacing:.03em;margin-bottom:8px;
  border-left:2px solid var(--cy);padding-left:8px}
.rx .why{color:var(--mut);display:block;margin-top:3px}

/* ---------- footer ---------- */
footer{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.fin{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
.gen{flex:1;border:1px solid var(--cy);color:var(--cy);border-radius:5px;
  padding:12px;letter-spacing:.08em;font-size:12px;background:#08201f}
.gen:disabled{opacity:.45;border-color:var(--line);color:var(--dim);background:var(--panel)}
.prog{height:2px;background:var(--line);margin-top:8px;border-radius:2px;overflow:hidden;
  max-width:820px;margin-left:auto;margin-right:auto}
.progf{height:100%;background:var(--gr);width:0;transition:width .25s}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#000a;z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);
  border-top:1px solid var(--line);border-radius:12px 12px 0 0;max-height:82vh;
  overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .2s;display:none}
.sheet.on{display:block;transform:translateY(0)}
@media(min-width:760px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:380px;border-radius:0;
    border-left:1px solid var(--line);border-top:none;max-height:none;
    transform:translateX(100%)}
  .sheet.on{transform:translateX(0)}
}
.sh1{font-size:15px;color:var(--cy);letter-spacing:.04em;margin:0 0 2px}
.sh2{font-size:10px;color:var(--dim);letter-spacing:.1em;margin:18px 0 7px;
  text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line);font-size:12px}
.kv span:last-child{color:var(--mut);text-align:right}
.ta{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:8px;color:var(--txt);min-height:56px;resize:vertical}
.ta:focus{outline:none;border-color:var(--cy)}
.hist{font-size:11px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
.hist b{color:var(--txt);font-weight:400}
.hist .g{color:var(--dim)}
.close{position:absolute;top:12px;right:14px;color:var(--mut);font-size:20px}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:10px 14px;font-size:12px;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.toast.bad{border-color:var(--rd);color:var(--rd)}
.empty{color:var(--dim);text-align:center;padding:48px 20px;font-size:12px;line-height:1.8}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="bar2">
    <button class="dayname" id="dayname"></button>
    <button class="pill" id="gym">HOME</button>
    <button class="pill" id="startb">START</button>
    <button class="burger" id="menu" aria-label="Menu">&#9776;</button>
  </div>
  <div class="moodrow" id="moodrow"><span class="moods" id="moods"></span></div>
</header>

<main id="main"></main>

<footer>
  <div class="fin">
    <button class="gen" id="finish">FINISH &amp; PROGRAM NEXT</button>
  </div>
  <div class="prog"><div class="progf" id="progf"></div></div>
</footer>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" id="shclose">×</button><div id="shbody"></div></div>
<div class="toast" id="toast"></div>
<div class="tmr" id="tmr"><div class="tmrbox">
  <div class="tmrlab" id="tmrlab"></div>
  <div class="tmrnum" id="tmrnum">0</div>
  <div class="tmrsub" id="tmrsub"></div>
  <div class="acts"><button class="abtn pri" id="tmrstop">STOP &amp; LOG</button>
  <button class="abtn warn" id="tmrx">CANCEL</button></div>
</div></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script>
const VERSION='1.8.0';
const KEY='jart_workout_v1';
const SEEDV=6;   // bump when seed() targets or day order change
let bootErr=null;
const $=id=>document.getElementById(id);
let S=null, openEx=null;

/* ============ seed ============ */
function seed(){
  const E=(name,o={})=>Object.assign({name,type:'load',target:[],notes:'',settings:'',
    pr:null,locked:false,homeOnly:true,optional:false,goal:null,goalF:null,
    timed:false,mode:null},o);
  const O=(name,o={})=>Object.assign(E(name,o),{optional:true});
  return {
  meta:{version:1,savedAt:null},
  prefs:{lastDayId:null,gym:'home',
    base:{day1:13,day2:12}},   // sessions already banked outside the app
  exercises:{
    /* ---------------- Day 1 — Upper ---------------- */
    chestPress:E('Incline DB Press',{target:[{w:65,r:9},{w:40,r:14},{w:40,r:15}],
      pr:{w:65,r:9},homeOnly:false,
      goal:{w:75,r:8,label:'75 lb for 8'},goalF:{w:90,r:8,label:'90 lb for 8'},
      notes:'65x9 is the standing PR, set in Session 13 running first while fresh. Free weight, so it DOES transfer between gyms. Nothing in the program presses flat.'}),
    shrugs:E('DB Shrugs',{target:[{w:65,r:15},{w:40,r:20},{w:40,r:25}],
      goal:{w:80,r:15,label:'80 lb for 15'},goalF:{w:100,r:15,label:'100 lb for 15'},
      notes:'Same weight all three sets where possible. No tapering.'}),
    backExtension:E('Back Extension',{target:[{w:0,r:10},{w:0,r:10},{w:0,r:10}],
      homeOnly:false,settings:'Height setting 6',
      goal:{r:15,label:'15 clean reps'},goalF:{r:25,label:'25 clean reps'},
      notes:'Bodyweight, and it progresses on REPS not load — the bar tracks clean reps. 10/10/10 as of Session 13. Once 25 is easy, that is the point to start holding a plate.'}),
    dbShoulderPress:E('KB Shoulder Press',{target:[{w:30,r:10},{w:30,r:10},{w:30,r:10}],
      settings:'Kettlebell, behind the wrist',
      goal:{w:40,r:10,label:'40 lb for 10'},goalF:{w:55,r:8,label:'55 lb for 8'},
      notes:'Kettlebell, behind the wrist, 30 lb. Permanently replaced the DB shoulder press. Same weight all three sets, no tapering.'}),
    deadHang:E('Dead Hang',{type:'quality',target:[{w:0,r:40},{w:0,r:35},{w:0,r:30}],
      homeOnly:false,timed:true,
      goal:{r:90,label:'90 second hang'},goalF:{r:120,label:'2 minute hang'},
      notes:'Reps field = seconds. Bodyweight from a bar, full grip, shoulders packed. Supersets with inverted row — the grip fatigue from this is why the middle row set dips.'}),
    invertedRow:E('Inverted Row',{target:[{w:0,r:10},{w:0,r:8},{w:0,r:10}],
      homeOnly:false,settings:'Bar height 9',
      goal:{r:15,label:'15 reps at height 9'},goalF:{r:20,label:'20 reps at height 9, then lower the bar'},
      notes:'Bodyweight, bar height 9 — not parallel yet. Progression is LOWERING THE BAR, not adding reps past 15. When 15 is clean, drop a notch and reset to 10. Long term this becomes a full pull-up.'}),
    cablePullThrough:E('Cable Pull-through',{target:[{w:55,r:12},{w:55,r:12},{w:55,r:15}],
      locked:true,goal:{w:80,r:12,label:'80 lb for 12'},goalF:{w:120,r:12,label:'120 lb for 12'},
      notes:'Home baseline 55 as of Session 13, locked. Outside-gym cables read wildly different. Spikes heart rate hard when supersetted with goblet squat.'}),
    gobletSquat:E('Goblet Squat',{target:[{w:55,r:12},{w:55,r:12},{w:55,r:12}],locked:true,
      homeOnly:false,goal:{w:80,r:12,label:'80 lb for 12'},goalF:{w:100,r:12,label:'100 lb for 12'},
      notes:'55 locked permanently. Transfers across gyms — free weight.'}),
    hammerCurl:E('Hammer Curl',{target:[{w:35,r:10},{w:20,r:15},{w:20,r:15}],
      goal:{w:45,r:10,label:'45 lb for 10'},goalF:{w:55,r:10,label:'55 lb for 10'},
      notes:'Replaced incline DB curl to cover the brachialis gap. Permanent.'}),
    skullCrusher:E('Skull Crusher',{type:'quality',target:[{w:50,r:10},{w:50,r:10},{w:50,r:10}],
      locked:true,goal:{w:65,r:10,label:'65 lb for 10'},goalF:{w:85,r:8,label:'85 lb for 8'},
      notes:'QUALITY LIFT. Single 50 lb dumbbell, both hands — replaced the 25-per-hand and 35-per-hand schemes. Chase clean reps; the load only moves by hand, never automatically.'}),
    latPulldown:E('Lat Pulldown',{target:[{w:140,r:8},{w:85,r:14},{w:70,r:15}],
      goal:{w:160,r:8,label:'160 lb for 8'},goalF:{w:190,r:8,label:'190 lb for 8'},
      notes:'Runs late in the order now — chest press took the fresh slot. The Session 13 dip to 130x5 was a fasted hour-two fade, not a strength drop.'}),
    cableRow:E('Cable Row',{target:[{w:135,r:6},{w:85,r:10},{w:70,r:12}],
      goal:{w:155,r:10,label:'155 lb for 10'},goalF:{w:180,r:10,label:'180 lb for 10'}}),
    plank:E('Plank Hold',{type:'quality',target:[{w:0,r:70}],homeOnly:false,timed:true,
      goal:{r:180,label:'3 minute hold'},goalF:{r:240,label:'4 minute hold'},
      notes:'Permanent finisher on both days. Reps field = seconds. 1:10 as of Session 13, goal 3:00.'}),
    /* ---------------- Day 2 — Lower + Delts + Posture ---------------- */
    hamstringCurl:E('Hamstring Curl',{target:[{w:85,r:15},{w:85,r:15},{w:85,r:20}],
      settings:'Feet 3, wheel 5',
      goal:{w:100,r:12,label:'100 lb for 12'},goalF:{w:120,r:12,label:'120 lb for 12'},
      notes:'Cannot superset with leg extension — gym layout, permanent.'}),
    legExtension:E('Leg Extension',{target:[{w:190,r:15},{w:150,r:16},{w:150,r:16}],
      goal:{w:200,r:8,label:'200 lb for 8'},goalF:{w:230,r:8,label:'230 lb for 8'},
      notes:'Cannot superset with hamstring curl. Third-set failure rep has been climbing — that is the progress here, not the load.'}),
    calfRaise:E('Calf Raise',{target:[{w:185,r:25},{w:185,r:25},{w:185,r:25}],
      goal:{w:185,r:35,label:'185 lb for 35'},goalF:{w:230,r:25,label:'230 lb for 25'},
      notes:'225 was abandoned — too hard to raise and lower cleanly. 185 flat across, chasing volume rather than load. Always the SAME weight as the Day 2 shrugs; the two move together.'}),
    shrugs2:E('Shrugs',{target:[{w:185,r:30},{w:185,r:30},{w:185,r:30}],
      goal:{w:185,r:40,label:'185 lb for 40'},goalF:{w:230,r:30,label:'230 lb for 30'},
      notes:'Ran 135 then 185 x 30 x 2 and liked the challenge at 185. Always the SAME weight as the standing calf raise — same stack, they move together.'}),
    hipAbduction:E('Hip Abduction',{target:[{w:100,r:25},{w:100,r:20},{w:100,r:20}],
      goal:{w:130,r:25,label:'130 lb for 25'},goalF:{w:160,r:25,label:'160 lb for 25'},
      settings:'Ass on seat',
      notes:'Cannot superset with cable lateral raise — gym layout, permanent.'}),
    cableLateralRaise:E('Cable Lateral Raise',{target:[{w:12.5,r:20},{w:12.5,r:18},{w:12.5,r:15}],
      settings:'Cross cable with handles, height 8',
      goal:{w:30,r:15,label:'30 lb for 15'},goalF:{w:40,r:15,label:'40 lb for 15'},
      notes:'Aesthetic priority — this is the delt cap. Moved to cross cable with handles at 12.5; the number went down, the movement got better. Do not read the 15 to 12.5 change as a regression.'}),
    farmerCarry:E('Farmer Carry',{target:[{w:50,r:1},{w:50,r:1},{w:50,r:1}],
      homeOnly:false,timed:true,mode:'laps',
      goal:{w:70,r:1,label:'70 lb per hand, one lap'},goalF:{w:100,r:1,label:'100 lb per hand, one lap'},
      notes:'Counted in LAPS, not seconds. Weight is PER HAND — 50 each hand is entered as 50, not 100. Free weight, so it transfers between gyms. Grip, traps and bracing at once. Walk tall, ribs down, do not shrug.'}),
    cableCurl:E('Cable Curl',{target:[{w:57.5,r:15},{w:57.5,r:15},{w:57.5,r:15}],
      goal:{w:70,r:15,label:'70 lb for 15'},goalF:{w:85,r:15,label:'85 lb for 15'},
      notes:'Decoupled from pushdown. Curl runs 55-70. Never match the two.'}),
    cablePushdown:E('Triceps Pushdown',{target:[{w:72.5,r:20},{w:72.5,r:20},{w:72.5,r:20}],
      goal:{w:85,r:20,label:'85 lb for 20'},goalF:{w:100,r:20,label:'100 lb for 20'},
      notes:'Decoupled from curl. Pushdown runs 65-85 — triceps are the stronger side. Ran 72.5 x 20 cleanly, so the old 70 ceiling is gone.'}),
    reversePecDeck:E('Reverse Pec Deck',{target:[{w:75,r:20},{w:75,r:20},{w:75,r:20}],
      settings:'Seat 3',goal:{w:90,r:20,label:'90 lb for 20'},goalF:{w:110,r:20,label:'110 lb for 20'}}),
    pecDeck:E('Pec Deck',{target:[{w:110,r:20},{w:110,r:20},{w:110,r:20}],
      settings:'Chair 4, arms 4',goal:{w:130,r:20,label:'130 lb for 20'},goalF:{w:160,r:20,label:'160 lb for 20'},
      notes:'Home 110. The preferred 25-per-side machine at outside gyms reads 50 — different scale, not a drop.'}),
    inclineYRaise:E('Incline Y Raise',{target:[{w:5,r:15},{w:5,r:15},{w:5,r:15}],
      goal:{w:8,r:15,label:'8 lb for 15'},goalF:{w:12,r:15,label:'12 lb for 15'},
      notes:'Form was finally coming together in Session 9.'}),

    /* ---- pink pool: not programmed, stack into a new day when you want them ---- */
    hangingLegRaise:O('Hanging Leg Raise',{target:[{w:0,r:10},{w:0,r:10},{w:0,r:10}],
      notes:'The abs gap. You have plank (anti-extension) and nothing that flexes the spine under load. Knees up first, straight legs when 12 is clean. Pairs naturally with dead hang — same bar.'}),
    cableCrunch:O('Cable Crunch',{target:[{w:80,r:15},{w:80,r:15},{w:80,r:15}],
      notes:'Loadable abs. Progressive overload for the midsection, which plank cannot give you — plank only gets longer. Round down through the spine, hips stay put.'}),
    pallofPress:O('Pallof Press',{target:[{w:30,r:12},{w:30,r:12},{w:30,r:12}],
      notes:'Anti-rotation. The missing third of core work — you train anti-extension with plank and nothing resists twist. Directly supports the weak lower back you have been rebuilding.'}),
    rdl:O('Romanian Deadlift',{target:[{w:95,r:10},{w:95,r:10},{w:95,r:10}],
      notes:'Loaded hip hinge. Pull-through and hamstring curl cover the pattern light, but nothing loads the hinge heavy. The single best answer to a weak lower back once back extensions stop being hard.'}),
    splitSquat:O('Bulgarian Split Squat',{target:[{w:25,r:10},{w:25,r:10},{w:25,r:10}],
      notes:'Unilateral legs. Everything in the program is two-legged, so side-to-side imbalance is invisible right now. Also the highest-return quad movement you are not doing.'}),
    seatedCalfRaise:O('Seated Calf Raise',{target:[{w:90,r:15},{w:90,r:15},{w:90,r:15}],
      notes:'Bent knee hits soleus; standing calf raise hits gastroc. You only train one of the two muscles down there.'}),
    facePull:O('Face Pull',{target:[{w:50,r:15},{w:50,r:15},{w:50,r:15}],
      notes:'External rotation under load. Reverse pec deck covers rear delt but not the rotator cuff, and your pressing volume is climbing. This is the insurance.'}),
    flatDbPress:O('Flat DB Press',{target:[{w:55,r:10},{w:55,r:10},{w:55,r:10}],
      notes:'Your only press is incline, so the sternal head of the chest is under-served. Flat covers the mid and lower chest that incline misses.'}),
    neckHarness:O('Neck Curl / Extension',{target:[{w:10,r:15},{w:10,r:15},{w:10,r:15}],
      notes:'Nothing in the program trains the neck. Cheap, fast, and it visibly changes how the shoulders read.'})
  },
  days:[
    {id:'day1',name:'Day 1 \u2014 Upper',warmup:'5 min \u00b7 15% incline \u00b7 2.8 mph',order:[
      ['chestPress','shrugs'],
      ['backExtension','dbShoulderPress'],
      ['deadHang','invertedRow'],
      ['cablePullThrough','gobletSquat'],
      ['hammerCurl','skullCrusher'],
      ['latPulldown','cableRow'],
      ['plank']]},
    {id:'day2',name:'Day 2 \u2014 Lower + Delts + Posture',warmup:'5 min \u00b7 15% incline \u00b7 2.8 mph',order:[
      ['hamstringCurl'],
      ['legExtension'],
      ['calfRaise','shrugs2'],
      ['hipAbduction'],
      ['cableLateralRaise','farmerCarry'],
      ['cableCurl','cablePushdown'],
      ['reversePecDeck','pecDeck'],
      ['inclineYRaise'],
      ['plank']]}
  ],
  sessions:[],
  current:null,
  prescriptions:{},
  log:[]
  };
}
function migrate(s){
  if(!s.meta) return seed();
  delete s.exercises.tester;
  (s.days||[]).forEach(d=>{ d.order=d.order.map(b=>b.filter(k=>k!=='tester')).filter(b=>b.length); });
  if(!Array.isArray(s.log)) s.log=[];
  return s;
}

/* ============ storage ============ */
let wt=null, dirty=false, lastErr=null;
function load(){
  let body=null;
  try{ body=localStorage.getItem(KEY); }
  catch(e){ bootErr='This browser is blocking local storage — nothing will save.'; }
  if(body){ try{ S=expand(JSON.parse(body)); return; }catch(e){ lastErr='saved data unreadable'; } }
  S=seed();
}
function newSessionFrom(st,dayId){
  const d=st.days.find(x=>x.id===dayId); if(!d) return null;
  const rx=st.prescriptions&&st.prescriptions[dayId];
  return {id:'s'+Date.now(),dayId,dayLabel:d.name,startedAt:null,endedAt:null,
    gym:st.prefs.gym||'home',watch:{},notes:'',mood:null,
    warm:{done:false,secs:0},events:[],
    entries:d.order.flatMap((blk,bi)=>blk.map(ex=>({exerciseId:ex,block:bi,
      status:'pending',skipReason:null,
      sets:((rx&&rx.entries&&rx.entries[ex])?rx.entries[ex]:(st.exercises[ex]||{target:[]}).target)
        .map(t=>({w:t.w,r:null,tw:t.w,tr:t.r,failed:false,rp:null,feel:null,note:'',
          npad:false,skipped:false,hold:false}))})))};
}
function compact(){
  // persist ONLY what the user changed. Seed data is rebuilt from code on load.
  const base=seed();
  const ov={};
  Object.keys(S.exercises).forEach(k=>{
    const a=S.exercises[k], b=base.exercises[k], d={};
    ['name','notes','settings','target','pr','goal','goalF','optional','locked','type',
     'timed','mode'].forEach(f=>{
      if(JSON.stringify(a[f])!==JSON.stringify(b?b[f]:undefined)) d[f]=a[f];
    });
    if(Object.keys(d).length) ov[k]=d;
  });
  const strip=(x,keepEv)=>{ if(!x) return x;
    const c=JSON.parse(JSON.stringify(x));
    if(!keepEv) delete c.events;
    c.entries=c.entries.filter(e=>e.status!=='pending'||e.sets.some(z=>z.r!=null||z.note))
      .map(e=>({exerciseId:e.exerciseId,block:e.block,status:e.status,skipReason:e.skipReason,
        sets:e.sets.map(z=>({w:z.w,r:z.r,failed:z.failed||undefined,rp:z.rp,
          feel:z.feel||undefined,note:z.note||undefined,skipped:z.skipped||undefined,
          hold:z.hold||undefined}))}));
    return c; };
  return {v:1,savedAt:new Date().toISOString(),prefs:S.prefs,
    days:S.days.map(d=>({id:d.id,name:d.name,order:d.order})),
    ex:ov, sessions:(S.sessions||[]).map(s=>strip(s)), current:strip(S.current,true),
    rx:S.prescriptions, log:S.log||[], seedv:SEEDV};
}
function expand(c){
  const S2=seed();
  if(!c||typeof c!=='object') return S2;
  const fresh=((c.seedv||0)<SEEDV);   // seed changed under them — take the new program
  S2.prefs=Object.assign(S2.prefs,c.prefs||{});
  if(!S2.prefs.base) S2.prefs.base=seed().prefs.base;
  if(c.days&&c.days.length&&!fresh) S2.days=c.days;
  if(c.days&&fresh){ // keep any days they built themselves, refresh the two built-ins
    c.days.filter(d=>!S2.days.some(x=>x.id===d.id)).forEach(d=>{
      d.order=(d.order||[]).map(b=>b.filter(k=>k!=='tester')).filter(b=>b.length);
      if(d.order.length) S2.days.push(d);
    });
  }
  Object.entries(c.ex||{}).forEach(([k,d])=>{
    if(fresh){ d=Object.assign({},d); delete d.target; delete d.goal; delete d.goalF; }
    S2.exercises[k]=Object.assign(S2.exercises[k]||{name:k,type:'load',target:[],notes:'',
      settings:'',pr:null,locked:false,homeOnly:true,optional:false,goal:null,goalF:null,
      timed:false,mode:null},d);
  });
  const fill=x=>{ if(!x) return null;
    const day=S2.days.find(d=>d.id===x.dayId);
    const full=day?newSessionFrom(S2,x.dayId):null;
    if(!full) return x;
    full.id=x.id||full.id; full.dayLabel=x.dayLabel||full.dayLabel;
    full.startedAt=x.startedAt||null; full.endedAt=x.endedAt||null;
    full.gym=x.gym||'home'; full.watch=x.watch||{}; full.notes=x.notes||'';
    full.mood=x.mood||null; full.warm=x.warm||{done:false,secs:0};
    full.events=x.events||[]; if(x.pace) full.pace=x.pace;
    (x.entries||[]).forEach(e=>{
      const t=full.entries.find(z=>z.exerciseId===e.exerciseId);
      if(!t) return;
      t.status=e.status; t.skipReason=e.skipReason;
      (e.sets||[]).forEach((z,i)=>{ if(!t.sets[i]) t.sets.push({tw:null,tr:null});
        Object.assign(t.sets[i],{w:z.w??null,r:z.r??null,failed:!!z.failed,
          rp:z.rp??null,feel:z.feel||null,note:z.note||'',skipped:!!z.skipped,
          hold:!!z.hold}); });
    });
    return full; };
  S2.sessions=(c.sessions||[]).map(fill).filter(Boolean);
  S2.current=fill(c.current);
  S2.prescriptions=c.rx||{};
  S2.log=Array.isArray(c.log)?c.log:[];
  S2.meta={version:1,savedAt:c.savedAt||null};
  return S2;
}
function writeNow(){
  const body=JSON.stringify(compact());
  try{
    localStorage.setItem(KEY,body);
    dirty=false; lastErr=null; S.meta.savedAt=new Date().toISOString(); setDot(); return true;
  }catch(e){
    lastErr=((e&&e.message)?e.message:String(e))+' ['+body.length+' chars]';
    setDot(); return false;
  }
}
function save(){
  dirty=true; setDot(); clearTimeout(wt);
  wt=setTimeout(()=>{
    if(!writeNow()) toast('Not saving: '+(lastErr||'unknown')+' — tap ··· and export.',true);
  },1200);
}
function setDot(){
  const d=$('sdot'); if(!d) return;
  d.textContent = lastErr ? '\u25cf unsaved' : (dirty ? '\u25cf saving' : '\u25cf saved');
  d.className = 'sdot '+(lastErr?'bad':(dirty?'wait':'ok'));
}

      status:'pending',skipReason:null,
      sets:(rx&&rx.entries&&rx.entries[ex]?rx.entries[ex]:S.exercises[ex].target)
        .map(t=>({w:t.w,r:null,tw:t.w,tr:t.r,failed:false,rp:null,feel:null,note:'',
          npad:false,skipped:false,hold:false}))})))};

function cur(){ if(!S.current) S.current=newSession(S.prefs.lastDayId||'day1'); return S.current; }
function ev(k,exId,setIdx){
  const c=S.current; if(!c) return;
  if(!Array.isArray(c.events)) c.events=[];
  c.events.push({t:Date.now(),k,e:exId||null,s:(setIdx==null?null:setIdx)});
  if(c.events.length>3000) c.events.splice(0,1000);
}
/* Turns the raw click stream into something worth reading: how long you actually
   rested, where you stood around, and which taps were just a peek. */
function paceStats(s){
  const E=(s.events||[]).slice().sort((a,b)=>a.t-b.t);
  if(!E.length) return null;
  const marks=[];                       // one entry per set, at its LAST input
  E.filter(x=>x.k==='input'&&x.e).forEach(x=>{
    const last=marks[marks.length-1];
    if(last&&last.e===x.e&&last.s===x.s) last.t=x.t; else marks.push({e:x.e,s:x.s,t:x.t});
  });
  const rests=[];
  for(let i=1;i<marks.length;i++){
    const g=Math.round((marks[i].t-marks[i-1].t)/1000);
    if(g>=5&&g<=1800) rests.push({g,to:marks[i].e});
  }
  let peeks=0, idle=0, idleSecs=0;
  for(let i=0;i<E.length;i++){
    if(E[i].k!=='open') continue;
    const close=E.slice(i+1).find(x=>x.k==='open'||x.k==='close');
    if(!close) continue;
    const span=Math.round((close.t-E[i].t)/1000);
    const touched=E.slice(i+1).some(x=>x.t<close.t&&(x.k==='input'||x.k==='done'||x.k==='skip'||x.k==='timer'));
    if(!touched&&span<10) peeks++;
    else if(!touched&&span>180){ idle++; idleSecs+=span; }
  }
  const g=rests.map(r=>r.g).sort((a,b)=>a-b);
  return {n:g.length, med:g.length?g[Math.floor(g.length/2)]:null,
    min:g[0]??null, max:g[g.length-1]??null,
    rushed:g.filter(x=>x<45).length, dragged:g.filter(x=>x>240).length,
    peeks, idle, idleMin:Math.round(idleSecs/60)};
}

function fmtSets(e){
  const done=e.sets.filter(s=>s.r!=null&&!s.skipped);
  if(!done.length) return '';
  return done.map(s=>`${s.w||''}${s.w?'×':''}${s.r}${s.failed?'f':''}${s.rp?'+'+s.rp:''}`).join(' / ');
}
function fmtT(v){ return v>=60?Math.floor(v/60)+':'+String(v%60).padStart(2,'0'):v+'s'; }
function setRows(e,i){

        <svg viewBox="0 0 24 24" class="nico"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v5h5"/><path d="M9 12h6M9 16h4"/></svg>

  const PAD=(s,j)=>s.npad?`<div class="npad" data-e="${i}" data-set="${j}">

      <textarea class="nta" data-f="note" placeholder="Set ${j+1} \u2014 anything worth remembering.">${s.note||''}</textarea>

  // Timed work is one big target, not a grid of tags. Stopwatch, a pencil, a note.
  if(stopwatch) return e.sets.map((s,j)=>`<div class="srow tmrow${s.skipped?' sk':''}" data-e="${i}" data-set="${j}">

        ? `<input class="num big" inputmode="numeric" data-f="r" value="${s.r??''}" placeholder="${s.tr??''}">`
        : `<button class="bigtm${s.r!=null?' done':''}" data-timer="1">
             \u23f1 ${s.r!=null?fmtT(s.r):'START'}

      <button class="pen${s.edit?' on':''}" data-edit="1" aria-label="Edit">${s.edit?'\u2713':'\u270e'}</button>
      ${s.hold?'<span class="holdtag">H</span>':''}

  return e.sets.map((s,j)=>`<div class="srow${s.skipped?' sk':''}" data-e="${i}" data-set="${j}">

        <span class="bname">${names}</span>

        ${ss?'':`<button class="info" data-info="${mem[0].e.exerciseId}" aria-label="Notes">ⓘ</button>`}

      <div class="body">
        ${ss?`<div class="ssnote">${mem.length>2?'Giant set — one set of each, straight through.':'Alternate — one set of each, back to back.'}</div>`:''}
        ${mem.map(({e,i},k)=>{
          const X=S.exercises[e.exerciseId];
          const why=rx&&rx.rationale&&rx.rationale[e.exerciseId];
          return `<div class="sub ${e.status}">
            ${ss?`<div class="subhead">

            ${why?`<div class="rx">prescribed<span class="why">${why}</span></div>`:''}
            ${setRows(e,i)}

  const done=c.entries.filter(e=>e.status!=='pending').length;
  $('progf').style.width=(done/c.entries.length*100)+'%';

  const inUse=new Set(S.days.flatMap(d=>d.order.flat()));

const VBF=197.2, VBB=192.8;
/* marker points, x in 0-100 across the figure, y in viewBox units */
const PT_F={
  neck:[[50,25]], frontDelt:[[29,34],[71,34]], sideDelt:[[17,35],[83,35]],
  chest:[[39,42],[61,42]], biceps:[[19,53],[81,53]], forearm:[[13,75],[87,75]],
  abs:[[50,60],[50,70]], obliques:[[38,68],[62,68]], quads:[[40,126],[60,126]]
};
const PT_B={
  neck:[[50,24]], traps:[[50,38]], rearDelt:[[26,35],[74,35]], sideDelt:[[16,35],[84,35]],
  lats:[[37,58],[63,58]], midBack:[[50,52]], triceps:[[19,53],[81,53]],
  erectors:[[50,78]], glutes:[[42,97],[58,97]], abductors:[[33,92],[67,92]],
  hams:[[41,126],[59,126]], calves:[[41,163],[59,163]]
};
function marks(PT,pri,sec){
  let o='';
  const add=(m,k)=>{ (PT[m]||[]).forEach(([x,y])=>{
    o+=`<circle cx="${x}" cy="${y}" r="11" class="glow ${k}"/>`+
       `<circle cx="${x}" cy="${y}" r="2.6" class="pin ${k}"/>`; }); };
  sec.forEach(m=>add(m,'sec')); if(pri) add(pri,'pri');
  return o;
}
function leader(PT,pri){
  if(!pri||!PT[pri]) return '';
  const [x,y]=PT[pri][0], L=x<50;
  const ex=L?-6:106, tx=L?-8:108;
  return `<line x1="${x}" y1="${y}" x2="${ex}" y2="${y}" class="lead"/>`+
         `<text x="${tx}" y="${y+2}" class="llab" text-anchor="${L?'end':'start'}">${MUS[pri][0].toUpperCase()}</text>`;
}
function bodySVG(exId){
  const w=WORKS[exId]||[], pri=w[0]||null, sec=w.slice(1);
  const used=[pri].concat(sec).filter(Boolean);
  const on=v=>used.some(k=>MUS[k]&&MUS[k][1]===v);
  const view=(img,PT,vb,v,label)=>{
    const p=(pri&&MUS[pri][1]===v)?pri:null;
    const s=used.filter(k=>MUS[k][1]===v&&k!==p);
    return `<svg viewBox="-30 0 160 ${vb+9}" class="${on(v)?'lit':''}">
      <image href="${img}" x="0" y="0" width="100" height="${vb}"/>
      ${marks(PT,p,s)}${leader(PT,p)}
      <text x="50" y="${vb+7}" class="vl">${label}</text></svg>`;
  };
  return `<div class="anat">
    ${view(IMG_F,PT_F,VBF,'f','FRONT')}
    ${view(IMG_B,PT_B,VBB,'b','BACK')}
  </div>
  <div class="mlegend">
    ${pri?`<span class="lg pri">\u25cf ${MUS[pri][0]}</span>`:''}
    ${sec.map(m=>MUS[m]?`<span class="lg sec">\u25cf ${MUS[m][0]}</span>`:'').join('')}
  </div>`;
}
function history(exId){
  const out=[];
  for(let i=S.sessions.length-1;i>=0&&out.length<6;i--){
    const s=S.sessions[i], e=s.entries.find(x=>x.exerciseId===exId);
    if(!e) continue;
    if(e.status==='skipped'){ out.push({d:s.startedAt,gym:s.gym,txt:'skipped ('+(e.skipReason||'')+')'}); continue; }
    const t=fmtSets(e); if(t) out.push({d:s.startedAt,gym:s.gym,txt:t});
  }
  return out;
}
function sheet(exId){
  const X=S.exercises[exId], h=history(exId);
  $('shbody').innerHTML=`
    <h2 class="sh1">${X.name}</h2>
    <div style="font-size:11px;color:var(--dim);letter-spacing:.06em">
      ${X.type==='quality'?'QUALITY LIFT — LOAD STAYS FIXED':'LOAD PROGRESSION'}
      ${X.locked?' · LOCKED':''}</div>
    ${bodySVG(exId)}
    ${(X.goal||X.goalF)?`<div class="sh2">Goals</div>
      ${X.goal?`<div class="kv"><span>End of 2026 — ${X.goal.label}</span><span>${goalPct(exId,'goal')?(goalPct(exId,'goal').pct*100).toFixed(0)+'%':''}</span></div>
        <div class="gbar" style="margin:4px 0 10px"><div class="gfill" style="width:${goalPct(exId,'goal')?(goalPct(exId,'goal').pct*100).toFixed(0):0}%;background:linear-gradient(90deg,#8f2f6d,var(--pk))"></div></div>`:''}
      ${X.goalF?`<div class="kv"><span>Long term — ${X.goalF.label}</span><span>${goalPct(exId,'goalF')?(goalPct(exId,'goalF').pct*100).toFixed(0)+'%':''}</span></div>
        <div class="gbar" style="margin:4px 0 2px"><div class="gfill" style="width:${goalPct(exId,'goalF')?(goalPct(exId,'goalF').pct*100).toFixed(0):0}%"></div></div>`:''}`:''}
    ${X.pr?`<div class="sh2">Standing PR</div><div class="kv"><span>${X.pr.w} × ${X.pr.r}</span><span>best</span></div>`:''}
    ${X.timed?`<div class="sh2">How it is counted</div>
      <div class="acts">
        <button class="abtn${X.mode!=='laps'?' pri':''}" id="modeTime">SECONDS</button>
        <button class="abtn${X.mode==='laps'?' pri':''}" id="modeLaps">LAPS</button>
      </div>
      <div class="hint">Seconds gives you the stopwatch on every set. Laps turns it off and the reps field counts trips.</div>`:''}
    <div class="sh2">Machine setup — carried into every session</div>
    <input class="ta" id="exset" style="min-height:0;padding:9px" placeholder="e.g. seat 4, arms 4" value="${(X.settings||'').replace(/"/g,'&quot;')}">
    <div class="sh2">Prescribed today</div>
    ${X.target.map((t,i)=>`<div class="kv"><span>set ${i+1}</span><span>${t.w?t.w+' × ':''}${t.r}</span></div>`).join('')}
    <div class="sh2">Last sessions</div>
    ${h.length?h.map(r=>`<div class="hist"><b>${r.txt}</b>
      <span class="g">· ${r.d?new Date(r.d).toLocaleDateString([],{month:'short',day:'numeric'}):'—'}${r.gym!=='home'?' · '+r.gym:''}</span></div>`).join('')
      :'<div class="hist g">Nothing logged yet.</div>'}
    <div class="sh2">Notes</div>
    <textarea class="ta" id="exnotes" placeholder="Form cues, machine settings, anything worth remembering.">${X.notes||''}</textarea>`;
  $('exnotes').addEventListener('input',e2=>{ X.notes=e2.target.value; save(); });
  $('exset').addEventListener('input',e2=>{ X.settings=e2.target.value; save(); });
  if($('modeTime')) $('modeTime').addEventListener('click',()=>{ X.mode='time'; save(); sheet(exId); draw(); });
  if($('modeLaps')) $('modeLaps').addEventListener('click',()=>{ X.mode='laps'; save(); sheet(exId); draw(); });
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }

/* ============ events ============ */
function switchDay(id){
  if(id===cur().dayId){ closeSheet();
    toast('Already on '+cur().dayLabel.split('\u2014')[0].trim()+'.'); return; }
  if(hasData(S.current) && !confirm('Switch day? The session in progress is not saved yet.')) return;
  S.current=newSession(id); S.prefs.lastDayId=id; openEx=null; save(); draw(); closeSheet();
  toast('Now on '+cur().dayLabel.split('\u2014')[0].trim()+' \u00b7 Session '+sessionNo(id)+'.');
}
function hasData(s){ return s&&s.entries.some(e=>e.status!=='pending'||e.sets.some(x=>x.r!=null)); }
function addDay(){
  const inUse=new Set(S.days.flatMap(d=>d.order.flat()));
  const pool=Object.entries(S.exercises).filter(([k,x])=>x.optional&&!inUse.has(k));
  if(!pool.length){ toast('Nothing left in the pool to stack.',true); return; }
  const n=prompt('Name the new day'); if(!n) return;
  const list=pool.map(([k,x],i)=>(i+1)+'. '+x.name).join('\n');
  const pick=prompt('Which ones? Numbers separated by commas, or A for all.\n\n'+list);
  if(pick==null) return;
  let chosen = /^a/i.test(pick.trim())
    ? pool.map(([k])=>k)
    : pick.split(',').map(x=>pool[parseInt(x.trim(),10)-1]).filter(Boolean).map(([k])=>k);
  if(!chosen.length){ toast('Nothing picked.',true); return; }
  const order=[]; // stack into pairs, solos last
  for(let i=0;i<chosen.length;i+=2) order.push(chosen.slice(i,i+2));
  const id='day'+(S.days.length+1);
  S.days.push({id,name:n,order});
  chosen.forEach(k=>{ S.exercises[k].optional=false; });
  S.current=newSession(id); S.prefs.lastDayId=id; openEx=null; save(); draw();
  toast(chosen.length+' stacked into '+n+'. Paired up — unpair anything that does not fit the floor.');
}
$('gym').addEventListener('click',()=>{
  const c=cur(); const opts=['home','dmv_iron','other'];
  c.gym=opts[(opts.indexOf(c.gym)+1)%opts.length];
  S.prefs.gym=c.gym; save(); drawBar();
  if(c.gym!=='home') toast('Outside gym. These numbers will not move your baselines.');
});

$('dayname').addEventListener('click',()=>{
  if(S.days.length<2){ toast('Only one day in the program right now.'); return; }
  const i=S.days.findIndex(d=>d.id===cur().dayId);
  switchDay(S.days[(i+1)%S.days.length].id);
});
$('startb').addEventListener('click',()=>{
  const c=cur();
  if(c.startedAt){ toast('Already running since '+new Date(c.startedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.'); return; }
  c.startedAt=new Date().toISOString(); ev('start'); save(); drawBar();
  toast('Clock running. Start your watch now and the two will line up.');
});
$('moods').addEventListener('click',e=>{

});
$('main').addEventListener('focusin',e=>{

});
$('main').addEventListener('keydown',e=>{
  if(e.target.dataset&&e.target.dataset.f==='note'&&e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const pad=e.target.closest('.npad');
    cur().entries[+pad.dataset.e].sets[+pad.dataset.set].npad=false;
    e.target.blur(); save(); draw();
  }
});
$('main').addEventListener('click',e=>{
  if(e.target.closest('[data-info]')){ e.stopPropagation(); sheet(e.target.closest('[data-info]').dataset.info); return; }
  if(e.target.closest('[data-warmdone]')){ const c=cur();
    c.warm.done=!c.warm.done; ev('warm'); stamp(); save(); draw(); return; }
  if(e.target.closest('[data-warmtimer]')){ openTimer('__warm',null); return; }
  if(e.target.closest('[data-pooltoggle]')){
    S.prefs.poolOpen=!S.prefs.poolOpen; save(); draw(); return; }
  const head=e.target.closest('[data-open]');
  if(head){ const b=+head.dataset.open;
    ev(openEx===b?'close':'open');
    openEx=(openEx===b?null:b); draw(); return; }

  const hit=e.target.closest('[data-e]'); if(!hit) return;
  const en=cur().entries[+hit.dataset.e];
  const row=e.target.closest('.srow');
  const j=row?+row.dataset.set:null;

  if(e.target.closest('[data-rp]')){ const s=en.sets[j]; s.rp=(s.rp==null?0:null); stamp(); save(); draw(); return; }
  if(e.target.closest('[data-fail]')){ const s=en.sets[j]; s.failed=!s.failed;
    stamp(); save(); draw(); return; }
  if(e.target.closest('[data-timer]')){ openTimer(en.exerciseId,+hit.dataset.e,j); return; }
  if(e.target.closest('[data-edit]')){ const s=en.sets[j]; s.edit=!s.edit; draw();
    if(s.edit){ const inp=document.querySelector('.srow[data-e="'+hit.dataset.e+'"][data-set="'+j+'"] .num.big');
      if(inp){ inp.focus(); try{ inp.select(); }catch(_){} } }
    return; }
  if(e.target.closest('[data-npad]')){ const s=en.sets[j]; s.npad=!s.npad; draw();
    const ta=document.querySelector('.npad[data-e="'+hit.dataset.e+'"][data-set="'+j+'"] .nta');
    if(ta) ta.focus(); return; }
  if(e.target.closest('[data-hold]')){ const s=en.sets[j];
    s.hold=!s.hold; save(); draw();
    toast(s.hold?'Held. This lift will not move next session.':'Released. It will progress normally.');
    return; }
  if(e.target.closest('[data-ncol]')){ const pad=e.target.closest('.npad');
    cur().entries[+pad.dataset.e].sets[+pad.dataset.set].npad=false; save(); draw(); return; }
  if(e.target.closest('[data-f2]')){ const s=en.sets[j], f=e.target.closest('[data-f2]').dataset.f2;
    s.feel=(s.feel===f?null:f); stamp(); save(); draw(); return; }
  if(e.target.closest('[data-addset]')){ const l=en.sets[en.sets.length-1]||{};
    en.sets.push({w:l.w??null,r:null,tw:l.tw,tr:l.tr,failed:false,rp:null,feel:null,note:'',
      npad:false,skipped:false,hold:false}); save(); draw(); return; }
  if(e.target.closest('[data-done]')){
    if(en.status==='done'){ en.status='pending'; save(); draw(); return; }
    let filled=0;
    en.sets.forEach(x=>{ if(x.r==null&&!x.skipped&&x.tr!=null){
      x.r=x.tr; if(x.w==null) x.w=x.tw; filled++; } });
    en.status='done'; en.skipReason=null; ev('done',en.exerciseId);
    stamp(); save(); draw();
    if(filled) toast(filled+' blank set'+(filled>1?'s':'')+' taken as the prescribed numbers.');
    return; }
  if(e.target.closest('[data-skip]')){
    const why=prompt('Skipped — why? Type T for time, or X for too tired.');
    if(why==null) return;
    en.skipReason=/^t/i.test(why)?'time':'tired';
    const logged=en.sets.filter(x=>x.r!=null).length;
    en.sets.forEach(x=>{ if(x.r==null) x.skipped=true; });
    en.status = logged? 'done' : 'skipped';
    ev('skip',en.exerciseId); stamp(); save(); draw();
    toast(logged
      ? logged+' set'+(logged>1?'s':'')+' kept, the rest struck out.'
      : (en.skipReason==='time'?'Logged. Rolls forward unchanged.':'Logged as fatigue. Next prescription eases off.'));
    return; }
});

/* ============ stopwatch ============ */
let TM={iv:null,e:null,ei:null,s:null,phase:null,n:0};
function tmrPaint(){
  $('tmrnum').textContent = TM.phase==='count' ? TM.n
    : Math.floor(TM.n/60)+':'+String(TM.n%60).padStart(2,'0');
  $('tmrnum').classList.toggle('count',TM.phase==='count');
  $('tmrsub').textContent = TM.phase==='count'
    ? 'get in position \u2014 tap anywhere to start now'
    : 'tap anywhere to stop and log it';
}
function openTimer(exId,ei,setIdx){
  const X=S.exercises[exId];
  TM={iv:null,e:exId,ei:(ei==null?null:ei),s:(setIdx==null?null:setIdx),phase:'count',n:10};
  $('tmrlab').textContent=(exId==='__warm'?'WARM-UP':(X?X.name.toUpperCase():''))
    +(setIdx!=null?' \u00b7 SET '+(setIdx+1):'');
  $('tmrstop').textContent='STOP & LOG';
  tmrPaint(); $('tmr').classList.add('on');
  TM.iv=setInterval(()=>{
    if(TM.phase==='count'){
      TM.n--;
      if(TM.n<=0){ TM.phase='up'; TM.n=0; }
    } else TM.n++;
    tmrPaint();
  },1000);
}
function closeTimer(){ clearInterval(TM.iv); TM.iv=null; $('tmr').classList.remove('on'); }
$('tmrx').addEventListener('click',e=>{ e.stopPropagation(); closeTimer(); });
function tmrLog(){
  const secs=TM.phase==='up'?TM.n:0;
  if(TM.e==='__warm'){
    const c=cur(); c.warm.secs=secs; c.warm.done=true;
  }else if(TM.ei!=null&&TM.s!=null){
    const en=cur().entries[TM.ei], st=en.sets[TM.s];
    st.r=secs; st.skipped=false;
    ev('timer',TM.e,TM.s);
  }
  closeTimer(); stamp(); save(); draw();
  toast(fmtT(secs)+' logged. Pencil next to it if you need to fix the number.');
}
$('tmrstop').addEventListener('click',e=>{ e.stopPropagation(); tmrLog(); });
// tap anywhere: during the countdown that jumps straight to the stopwatch,
// once it is running that stops it and logs the time
$('tmr').addEventListener('click',()=>{
  if(!TM.iv) return;
  if(TM.phase==='count'){ TM.phase='up'; TM.n=0; tmrPaint(); return; }
  tmrLog();
});

function best(exId){
  let bw=0,br=0,bs=null;
  S.sessions.forEach(s=>{ const e=s.entries.find(x=>x.exerciseId===exId); if(!e) return;
    if(s.gym!=='home'&&S.exercises[exId].homeOnly) return;
    e.sets.forEach(x=>{ if(x.r==null) return;
      const w=x.w||0;
      if(w>bw||(w===bw&&x.r>br)){ bw=w; br=x.r; bs=x; } }); });
  if(bs) return {w:bw,r:br};
  // nothing logged yet — fall back to the working numbers the program starts from,
  // so the goal bars mean something on day one instead of all reading zero
  const t=S.exercises[exId].target||[];
  let tw=0,tr=0;
  t.forEach(x=>{ const w=x.w||0; if(w>tw||(w===tw&&x.r>tr)){ tw=w; tr=x.r; } });
  return t.length?{w:tw,r:tr}:null;
}
function goalPct(exId,which){
  const X=S.exercises[exId]; if(!X) return null;
  const g=X[which||'goal']; if(!g) return null;
  const b=best(exId); if(!b) return {pct:0,now:'nothing logged'};
  let pct;
  if(g.w){ // weight goal: weight progress, reps break the tie at target weight
    pct = b.w>=g.w ? (Math.min(b.r,g.r)/g.r) : (b.w/g.w)*0.85;
  } else { pct = b.r/g.r; }
  return {pct:Math.max(0,Math.min(1,pct)),
    now:(b.w?b.w+' × ':'')+b.r+(g.w?'':'')};
}
function goalBars(ids){
  const rows=ids.map(k=>{
    const a=goalPct(k,'goal'), b=goalPct(k,'goalF');
    if(!a&&!b) return '';
    const bar=(v,cls)=>v?`<div class="gb ${cls}"><i class="${v.pct>=1?'hit':''}" style="width:${(v.pct*100).toFixed(0)}%"></i></div>`:'';
    return `<div class="gb2">${bar(a,'eoy')}${bar(b,'lterm')}</div>`;
  }).filter(Boolean).join('');
  return rows?`<div class="gbars">${rows}</div>`:'';
}
function summary(c){
  const vol=c.entries.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+((x.w||0)*(x.r||0)),0),0);

  const goals=Object.keys(S.exercises).filter(k=>S.exercises[k].goal)
    .map(k=>({k,X:S.exercises[k],g:goalPct(k,'goal'),f:goalPct(k,'goalF')})).filter(x=>x.g)
    .sort((a,b)=>b.g.pct-a.g.pct);

  $('shbody').innerHTML=`<h2 class="sh1">${c.dayLabel.split('—')[0].trim()} logged</h2>

        <div class="gbar"><div class="gfill${x.g.pct>=1?' hit':''}" data-p="${(x.g.pct*100).toFixed(0)}" data-i="${i}" style="background:linear-gradient(90deg,#8f2f6d,var(--pk))"></div></div>
        <div class="gpct">${(x.g.pct*100).toFixed(0)}% of end of 2026${x.g.pct>=1?' — cleared, time for a new number':''}</div>
        ${x.f?`<div class="gbar" style="margin-top:5px"><div class="gfill" data-p="${(x.f.pct*100).toFixed(0)}" data-i="${i}"></div></div>
        <div class="gpct">${(x.f.pct*100).toFixed(0)}% of ${x.X.goalF.label}</div>`:''}
      </div>`).join('')}</div>`;
  $('sheet').classList.add('on'); $('scrim').classList.add('on');

function digest(dayId){
  const past=S.sessions.filter(s=>s.dayId===dayId).slice(-4);
  const c=cur();
  const all=(c.dayId===dayId&&hasData(c))?past.concat([c]):past;
  return all.map(s=>{
    const head=`SESSION ${s.startedAt?s.startedAt.slice(0,10):'today'} · gym=${s.gym}`;
    const lines=s.entries.map(e=>{
      if(e.exerciseId==='tester') return null;
      const X=S.exercises[e.exerciseId];
      if(e.status==='skipped') return `  ${X.name}: SKIPPED (${e.skipReason})`;
      const sets=e.sets.filter(x=>x.r!=null).map(x=>
        `${x.w??'bw'}x${x.r}${x.failed?'(failed next)':''}${x.rp?'+rp'+x.rp:''}${x.feel?'['+x.feel+']':''}${x.note?' note:"'+x.note.replace(/"/g,"'")+'"':''}`).join(' ');
      const pair=s.entries.filter(z=>z.block===e.block&&z.exerciseId!==e.exerciseId)
        .map(z=>S.exercises[z.exerciseId].name).join(', ');
      return sets?`  ${X.name}${X.type==='quality'?' [QUALITY]':''}${X.locked?' [LOCKED]':''}${pair?' [SUPERSET with '+pair+']':''}: ${sets}`:null;
    }).filter(Boolean);
    return head+'\n'+lines.join('\n');
  }).join('\n\n')||'No sessions logged yet — prescribe the seeded targets unchanged.';
}
const RULES=`You are programming the next session for an experienced lifter who trains twice a week.

HARD RULES — these override any pattern you infer from the data:
1. FEEL BEATS REPS. Each set may be tagged EASY or RIGHT, and may separately be flagged as failed.
   - EASY at or above target reps = add load.
   - RIGHT = the load is correct; hold it and chase reps.
   - No tag = treat as RIGHT.
   - failed well short of target = drop the load.
   A set may also carry a free-text note from the lifter. Read it — a note like "shoulder pinched" outranks the rep count, and you should hold or drop rather than progress.
2. QUALITY lifts NEVER get load added, however easy they feel. They chase clean reps at a fixed weight. Same for LOCKED lifts.
3. Sessions tagged gym other than "home" set NO baselines. Machines and cams differ too much. Exception: bodyweight and free-weight movements (goblet squat, back extension, plank) transfer fine.
4. Superset structure is FIXED. Keep every pair marked SUPERSET paired, and keep every solo movement solo. Do not invent new pairings. These two pairs specifically can NEVER be supersetted, gym layout, permanent: hamstring curl + leg extension; hip abduction + cable lateral raise. A superset pair should be loaded so both halves land near their target — do not push one half so hard the other collapses.
5. Cable curl and cable pushdown are never the same weight. Curl 55-60, pushdown 65-70.
6. Rising failure reps at a held weight IS progress. Do not read it as stalling.
7. SKIPPED (time) = roll forward unchanged, no fatigue signal. SKIPPED (tired) = ease the next prescription.
8. Shrugs have been flagged too light. Raise them rather than letting a second shrug machine get grabbed.
9. "failed next" means the listed rep was the last good one and the following rep died.

Return JSON ONLY. No prose, no markdown fences. Shape:
{"entries":{"exerciseKey":[{"w":number,"r":number}]},"rationale":{"exerciseKey":"one short line on what moved and why"}}
Include rationale ONLY for exercises whose numbers changed. Use the exact exercise keys given.`;

/* ---- how big a jump this lift takes, learned from its own history ---- */
function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }
function stepFor(key){
  const ex=S.exercises[key]; if(!ex) return 0;
  const ws=new Set();
  (ex.target||[]).forEach(t=>{ if(t.w>0) ws.add(t.w); });
  (S.sessions||[]).forEach(s=>s.entries.forEach(e=>{
    if(e.exerciseId!==key) return;
    e.sets.forEach(z=>{ if(z.w>0) ws.add(z.w); if(z.tw>0) ws.add(z.tw); });
  }));
  const arr=[...ws];
  if(!arr.length) return 0;                                  // bodyweight / timed
  let st;
  if(arr.length===1){
    st=(Math.round(arr[0]*2)%10===0)?5:2.5;
  }else{
    let g=Math.round(arr[0]*2);
    arr.forEach(w=>{ g=gcd2(g,Math.round(w*2)); });
    st=g/2;
    if(st<2.5) st=2.5;
    if(st>10) st=10;
  }
  // The gap between a pyramid's sets is not the same thing as the machine's smallest
  // notch. Cap the jump at roughly a tenth of the top set so a 40/30/30 scheme does
  // not conclude that dumbbells come in 10 lb steps.
  const top=Math.max.apply(null,arr);
  let cap=Math.round((top*0.10)/2.5)*2.5;
  if(cap<2.5) cap=2.5;
  if(cap>10) cap=10;
  return Math.min(st,cap);
}
/* ---- most recent session this lift can legitimately be programmed from ---- */
function lastUsable(key){
  const ex=S.exercises[key]; if(!ex) return null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    const e=s.entries.find(z=>z.exerciseId===key);
    if(!e) continue;
    if(e.status==='skipped') return {s,e};
    if(!e.sets.some(z=>z.r!=null)) continue;
    // rule 3: another gym sets no baseline unless the movement transfers
    if(s.gym && s.gym!=='home' && ex.homeOnly!==false) continue;
    return {s,e};
  }
  return null;
}
const CLAMP={cableCurl:[55,70], cablePushdown:[65,85]};      // rule 5 — bands, never equal
const COUPLED=[['calfRaise','shrugs2']];  // run off the same stack, must match
function program(dayId){
  const d=S.days.find(x=>x.id===dayId); if(!d) return null;
  const keys=d.order.flat().filter(k=>k!=='tester'&&S.exercises[k]);
  const plan={};
  keys.forEach(key=>{
    const ex=S.exercises[key];
    const base=(ex.target||[]).map(t=>({w:t.w,r:t.r}));
    const st=stepFor(key);
    const q=(ex.type==='quality'||ex.locked===true);         // rule 2
    const shrug=/shrug/i.test(key);                          // rule 8
    const h=lastUsable(key);
    if(!h){ plan[key]={sets:base,why:null,up:0,down:0}; return; }
    const e=h.e;
    if(e.status==='skipped'){                                // rule 7
      if(e.skipReason==='time'){ plan[key]={sets:base,why:null,up:0,down:0}; return; }
      const sets=base.map(t=>(!q&&st>0&&t.w>0)
        ? {w:Math.max(st,t.w-st),r:t.r}
        : {w:t.w,r:Math.max(1,t.r-(t.r>=30?Math.max(3,Math.round(t.r*0.08)):1))});
      plan[key]={sets,why:'eased — you skipped it tired last time',up:0,down:1}; return;
    }
    if(e.sets.some(z=>z.hold)){          // an explicit HOLD, not merely a note
      plan[key]={sets:base,why:'held — you flagged HOLD on it',up:0,down:0}; return;
    }
    if(e.sets.some(z=>z.skipped)&&e.skipReason==='tired'){
      plan[key]={sets:base,why:'held — you ran out of gas partway through it',up:0,down:0}; return;
    }
    let up=0,down=0;
    const rough=(h.s&&h.s.mood==='tired');   // whole session was a slog — no drops off it
    // If he moved the whole lift to a different weight, unlogged sets follow it there
    // instead of sitting on a stale prescription.
    let lastW=null;
    e.sets.forEach(z=>{ if(z.r!=null&&!z.skipped&&z.w!=null&&z.w>0) lastW=z.w; });
    const sets=base.map((t,i)=>{
      const z=e.sets[i];
      if(!z||z.r==null||z.skipped)
        return {w:(lastW!=null&&t.w>0)?lastW:t.w, r:t.r};    // never logged, or struck out
      const w=(z.w!=null?z.w:t.w), tr=(z.tr!=null?z.tr:t.r);
      const bump=tr>=30?Math.max(3,Math.round(tr*0.08)):1;
      const feel=z.feel||(shrug?'easy':'right');             // no tag = RIGHT
      const noLoad=!(st>0)||!(w>0);
      // Blowing well past the target IS an EASY signal, tagged or not. A rep count
      // a quarter over the prescription means the load was wrong, not the effort.
      const over=z.r-tr, big=Math.max(2,Math.ceil(tr*0.25));
      if(feel==='tired'){                                    // TIRED never adds load
        if(z.r<tr && !rough && !q && !noLoad){ down++; return {w:Math.max(st,w-st),r:tr}; }
        return {w:w,r:tr};
      }
      if(over>=big){
        if(q||noLoad){ up++; return {w:w,r:tr+Math.max(bump,Math.round(over*0.6))}; }
        up++; return {w:w+st,r:tr};
      }
      if(z.r>=tr && !z.failed && feel==='easy'){
        if(q||noLoad){ up++; return {w:w,r:tr+bump}; }       // chase reps
        up++; return {w:w+st,r:tr};                          // add load
      }
      if(z.failed && z.r<=tr-3){                             // failed well short
        if(rough) return {w:w,r:tr};                         // fatigue, not regression
        if(t.w>0 && w<t.w) return {w:w,r:tr};                // he already backed it off himself
        if(q||noLoad) { down++; return {w:w,r:Math.max(1,tr-bump)}; }
        down++; return {w:Math.max(st,w-st),r:tr};
      }
      return {w:w,r:tr};                                     // rules 1 & 6 — hold
    });
    // A lift prescribed at one weight across all sets keeps one weight across all sets.
    const flat=base.length>1 && base[0].w>0 && base.every(t=>t.w===base[0].w);
    if(flat){
      const li=base.findIndex((t,i)=>{ const z=e.sets[i]; return z&&z.r!=null&&!z.skipped; });
      if(li>=0){ const W=sets[li].w; sets.forEach(x=>{ x.w=W; }); }
    }
    plan[key]={sets,why:null,up,down};
  });
  // rule 4 — don't raise one half of a superset while the other is collapsing
  d.order.forEach(blk=>{
    if(blk.length<2) return;
    const mem=blk.filter(k=>plan[k]);
    if(mem.some(k=>plan[k].down>0)) mem.forEach(k=>{
      if(plan[k].up>0 && plan[k].down===0){
        plan[k].sets=(S.exercises[k].target||[]).map(t=>({w:t.w,r:t.r}));
        plan[k].up=0; plan[k].why='held — its superset partner went backwards';
      }
    });
  });
  // rule 5 — cable curl and pushdown live in their own bands and never match
  Object.entries(CLAMP).forEach(([k,[lo,hi]])=>{
    if(!plan[k]) return;
    plan[k].sets=plan[k].sets.map(t=>({w:(t.w>0?Math.min(hi,Math.max(lo,t.w)):t.w),r:t.r}));
  });
  if(plan.cableCurl&&plan.cablePushdown){
    const cw=plan.cableCurl.sets[0], pw=plan.cablePushdown.sets[0];
    if(cw&&pw&&cw.w===pw.w) plan.cablePushdown.sets=plan.cablePushdown.sets.map(t=>({w:t.w+2.5,r:t.r}));
  }
  // lifts that share one stack move together — take the heavier decision
  COUPLED.forEach(pair=>{
    const live=pair.filter(k=>plan[k]); if(live.length<2) return;
    const top=Math.max(...live.map(k=>plan[k].sets[0]?plan[k].sets[0].w||0:0));
    live.forEach(k=>{
      const had=plan[k].sets[0]?plan[k].sets[0].w:null;
      plan[k].sets=plan[k].sets.map(t=>({w:top,r:t.r}));
      if(had!==top&&!plan[k].why){
        const other=live.find(x=>x!==k);
        plan[k].why='matched to '+S.exercises[other].name+' — same stack';
      }
    });
  });

  const entries={}, rationale={}, lines=[]; let changed=0;
  keys.forEach(key=>{
    const ex=S.exercises[key], was=ex.target||[], now=plan[key].sets;
    entries[key]=now;
    const moved=JSON.stringify(was.map(t=>[t.w,t.r]))!==JSON.stringify(now.map(t=>[t.w,t.r]));
    const fmt=a=>a.map(t=>(t.w>0?t.w+'x':'')+t.r).join(' / ');
    if(moved){
      changed++;
      const dw=(now[0]&&was[0])?(now[0].w-was[0].w):0;
      let why=plan[key].why;
      if(!why){
        if(plan[key].up>0&&dw>0) why='up '+dw+' lb — you went past the target';
        else if(plan[key].down>0&&dw<0) why='down '+Math.abs(dw)+' lb — failed well short';
        else if(dw!==0) why='rebased to the '+now[0].w+' you actually ran';
        else if(plan[key].up>0) why='reps raised — clean at target';
        else why='reps eased back';
      }
      rationale[key]=why;
      lines.push(ex.name+': '+fmt(was)+'  ->  '+fmt(now)+'  ('+rationale[key]+')');
    }else if(plan[key].why){
      rationale[key]=plan[key].why;
      lines.push(ex.name+': '+fmt(now)+'  ('+plan[key].why+')');
    }
  });
  S.prescriptions[dayId]={generatedAt:new Date().toISOString(),entries,rationale};
  keys.forEach(k=>{ if(S.exercises[k]) S.exercises[k].target=entries[k]; });
  return {changed,lines};
}

/* ---- the cumulative log ---- */
function logBlock(s,lines){
  const L=[];
  const when=(s.startedAt||s.endedAt||new Date().toISOString()).slice(0,10);
  L.push('=== '+when+'  '+s.dayLabel+'  gym='+s.gym+
    (s.mood?'  mood='+s.mood:'')+' ===');
  const wspec=(S.days.find(d=>d.id===s.dayId)||{}).warmup;
  if(s.warm&&s.warm.done) L.push('  warm-up: done'+(wspec?' \u2014 '+wspec:''));
  s.entries.forEach(e=>{
    if(e.exerciseId==='tester') return;
    const X=S.exercises[e.exerciseId]; if(!X) return;
    if(e.status==='skipped'){ L.push('  '+X.name+': SKIPPED ('+(e.skipReason||'no reason given')+')'); return; }
    const done=e.sets.filter(z=>z.r!=null&&!z.skipped);
    const struck=e.sets.filter(z=>z.skipped).length;
    if(!done.length&&!struck) return;
    const tag=(X.type==='quality'?' [QUALITY]':'')+(X.locked?' [LOCKED]':'')+
      (X.timed?(X.mode==='laps'?' [LAPS]':' [SECONDS]'):'');
    L.push('  '+X.name+tag+': '+done.map(z=>
      (z.w!=null&&z.w!==0?z.w:'bw')+'x'+z.r+(z.failed?'(failed next)':'')+
      (z.rp?'+rp'+z.rp:'')+(z.feel?'['+z.feel+']':'')).join('  ')+
      (struck?'  [+'+struck+' set'+(struck>1?'s':'')+' cut, '+(e.skipReason||'no reason')+']':''));
    e.sets.forEach((z,j)=>{
      if(z.hold) L.push('      HOLD set '+(j+1)+' — do not move this lift');
      if(z.note&&z.note.trim()) L.push('      NOTE set '+(j+1)+': '+z.note.trim()); });
  });
  if(s.notes&&s.notes.trim()) L.push('  SESSION NOTE: '+s.notes.trim());
  const w=s.watch||{};
  if(w.avgHR||w.peakHR||w.duration)
    L.push('  watch: avg '+(w.avgHR||'-')+' / peak '+(w.peakHR||'-')+' / '+(w.duration||'-')+' min');
  const P=s.pace;
  if(P&&P.n){
    L.push('  pace: '+P.n+' rests, median '+P.med+'s (range '+P.min+'-'+P.max+'s)'+
      (P.rushed?', '+P.rushed+' under 45s':'')+
      (P.dragged?', '+P.dragged+' over 4min':''));
    if(P.idle) L.push('  idle: '+P.idle+' stretch'+(P.idle>1?'es':'')+' open with nothing logged, ~'+P.idleMin+' min total');
  }
  L.push('  -- programmed for the next '+s.dayLabel.split('—')[0].trim()+' --');
  if(lines&&lines.length) lines.forEach(x=>L.push('    '+x));
  else L.push('    nothing moved');
  return L.join('\n');
}
function fullLog(){
  return 'JART TRAINING LOG — exported '+new Date().toISOString().slice(0,10)+
    '  ·  app v'+VERSION+'\n'+
    S.sessions.length+' session'+(S.sessions.length===1?'':'s')+' logged, '+
    S.log.length+' in this log.\n\n'+
    'The app programs itself from the rules below. Read the log, then tell me what to change '+
    'about the numbers or the rules themselves.\n\n'+RULES+'\n\n'+
    '='.repeat(60)+'\n\n'+(S.log||[]).join('\n\n')+'\n';
}

/* ============ misc ============ */
let tt=null;
function toast(m,bad){ const t=$('toast'); t.textContent=m; t.classList.toggle('bad',!!bad);
  t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3600); }
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

(function(){
  load();
  if(!Array.isArray(S.log)) S.log=[];
  if(!S.current) S.current=newSession(S.prefs.lastDayId||'day1');
  draw(); setDot();
  if(bootErr) toast(bootErr,true);
})();
</script>
