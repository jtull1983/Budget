<style>
:root{
  --bg:#0a0f13; --panel:#16232a; --panel2:#1d2f37; --panel3:#243c46;
  --line:#33474f; --line2:#48626c;
  --txt:#f7fdfe; --dim:#cfe2e7; --dimmer:#a9c1c9;
  --teal:#6ff0dd; --cyan:#8fe3f8; --amber:#ffc873; --red:#ff9077; --violet:#c8bcff;
  --col:190px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button,input,select,a,.ytab,.btn,.mini{touch-action:manipulation}
/* v93 \u2014 a row was `manipulation`, which hands every pan to the browser. Rows sit
   inside .rows, a vertical scroller, so the moment a drag looked even slightly
   vertical iOS started scrolling the list and took the gesture: from then on
   touchmove is uncancelable, preventDefault does nothing, and the delete simply
   never armed. `pan-y` says the up-and-down is yours, the sideways is mine \u2014 the
   list still scrolls, and a horizontal drag reliably reaches this code. */
.row{touch-action:pan-y}
html{-webkit-text-size-adjust:100%}
/* The grid never overflows — the year strip did, and one element wider than the
   screen lets the whole document be dragged sideways. That's what left a column
   half off the edge after a swipe: the page had been panned, not the grid. */
html,body{overflow-x:hidden;overscroll-behavior-x:none;overscroll-behavior-y:contain;max-width:100%}
/* iOS zooms any field under 16px on focus — so on touch, don't go under 16px */
@media(pointer:coarse){
  input,select,textarea{font-size:16px !important}
  .f input,.f select,.step input,.step select,.amtin{font-size:16px !important}
  .amtin{width:88px}
}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-track{background:#0b1216}
::-webkit-scrollbar{height:13px;width:13px}
::-webkit-scrollbar-thumb{background:#6fe0cf;border-radius:7px;border:3px solid #0b1216}
::-webkit-scrollbar-thumb:hover{background:#9df3e6}
*{scrollbar-color:#6fe0cf #0b1216;scrollbar-width:auto}

.top{position:sticky;top:0;z-index:60;background:linear-gradient(#0d1418,#0a0f13);
  border-bottom:1px solid var(--line);padding:12px 16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:11px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0}
.toprow .brand{flex:0 1 auto;min-width:0;overflow:hidden}
.brand h1{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt);white-space:nowrap;display:flex;align-items:center;gap:7px;min-width:0}
/* the title gives way on a narrow screen; the version badge never does */
.brand h1 .tt{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:760px){ .brand h1 .tt{overflow:visible} }
.brand h1 .vtag{flex:none}
.toprow2{display:flex;gap:8px;align-items:stretch}
#btnUndo,#btnFit{flex:none;white-space:nowrap}
.navarr{flex:none;display:none;align-items:center;justify-content:center;
  width:30px;padding:0;font-size:15px;line-height:1}
@media(min-width:1101px){.navarr{display:inline-flex}}
body.fitOn .navarr{display:none}
@media(max-width:1100px){#btnFit{display:none}}
/* v83 — no longer flex:1. It used to stretch across the whole row, which left
   nowhere for the assets figure to sit and pushed Menu into the middle of the
   header. Everything before the spacer now packs left at its natural width. */
/* width has to be stable for the centring maths below to mean anything */
.menupad{flex:none;width:0;min-width:0}
.menubtn{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 12px;font-size:12px;letter-spacing:.16em}
/* takes the slack the Menu button used to, so the corner stays a corner whether
   or not there are any asset accounts to show */
.toprow2 .grow{flex:1 1 auto;min-width:0}
.assets{flex:none;display:flex;align-items:center;gap:9px;cursor:pointer;
  background:transparent;border:1px solid var(--line2);border-radius:4px;
  padding:8px 13px;font:inherit;color:inherit}
.assets:hover{border-color:var(--teal)}
.assets .al{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.assets .av{font-size:13.5px;font-weight:600;color:var(--teal);white-space:nowrap}
/* On a phone the row has no width to spare, so the label goes above the number
   rather than beside it. */
@media(max-width:1100px){
  .assets{flex-direction:column;align-items:flex-end;gap:0;padding:5px 10px;line-height:1.25}
  .assets .al{font-size:8.5px;letter-spacing:.1em}
  .assets .av{font-size:13px}
}
.assetsum{display:flex;align-items:baseline;justify-content:space-between;
  padding:2px 2px 10px}
.assetsum .al{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.assetsum .av{font-size:26px;font-weight:600;color:var(--teal)}
.assetrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:10px 12px;border-bottom:1px solid var(--line)}
.assetrow:last-child{border-bottom:none}
.assetrow .an{font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.assetrow .ao{font-size:10px;letter-spacing:.08em;color:var(--dimmer)}
.assetrow .ab{font-size:13.5px;font-weight:600;white-space:nowrap}
.assetrow .ab.dim{color:var(--dimmer);font-weight:400}
.loandet .warn{color:var(--amber,#e0a458)}
.loandet{font-size:10.5px;letter-spacing:.04em;color:var(--dimmer);
  padding:0 12px 10px;margin-top:-6px;border-bottom:1px solid var(--line)}
.card > .loandet:last-child{border-bottom:none}
/* Folded sections in Sync. The panel is long enough that the thing you came for
   is usually below the fold; this puts every part of it one tap from the top.
   Child combinators throughout, because these nest one level deep and a
   descendant selector would hide an open child inside a closed parent and then
   fail to show it again. */
.acc{border:1px solid var(--line);border-radius:6px;margin:10px 0;background:var(--panel);
  overflow:hidden}
.acc .acc{background:transparent;margin:8px 0}
.acch{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.acch .accl{flex:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.acch .accn{flex:1;min-width:0;text-align:right;font-size:10px;letter-spacing:.04em;
  color:var(--dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acch .accx{flex:none;width:14px;text-align:center;font-size:15px;line-height:1;color:var(--cyan)}
.acc.on>.acch{border-bottom:1px solid var(--line)}
.acc.on>.acch .accl{color:var(--cyan)}
.acc.on>.acch .accn{opacity:.55}
.accb{display:none;padding:12px}
.acc.on>.accb{display:block}
.accb>.acc:first-child{margin-top:0}
.accb>.acc:last-child{margin-bottom:0}
.accb>.hint:first-child,.accb>.sh:first-child{margin-top:0}
@media(max-width:420px){
  .acch{padding:11px 10px;gap:8px}
  .acch .accl{font-size:10px;letter-spacing:.1em}
  .accb{padding:10px}
}
/* The consent box. Deliberately not styled to look like a toggle that might
   already be on — it has to read as something you actively did. */
.okbox{display:flex;gap:9px;align-items:flex-start;margin:10px 0 4px;
  padding:11px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);cursor:pointer}
.okbox input{margin:2px 0 0;flex:none;width:16px;height:16px;accent-color:var(--cyan)}
.okbox span{font-size:11.5px;line-height:1.5;color:var(--dim)}
.okbox a{color:var(--cyan)}
.handbox{border:1px solid var(--line2);border-radius:5px;padding:10px 12px;margin:10px 0}
.handhead{display:flex;align-items:baseline;gap:10px;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.fg2{display:flex;gap:10px}
.fg2 .f{flex:1;min-width:0}
.mini.on{border-color:var(--teal);color:var(--teal)}
.menubtn .car{font-style:normal;font-size:10px;transition:.18s;color:var(--dimmer)}
.menubtn.open .car{transform:rotate(180deg);color:var(--teal)}
.menubtn.open{color:var(--teal);border-color:var(--teal);background:#11262a}
.menupanel{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;
  padding-top:4px;border-top:1px solid var(--line)}
.menupanel.open{display:grid}
.menupanel .btn{width:100%;text-align:center;padding:11px 8px;font-size:11.5px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:linear-gradient(#0a0f13,#070b0e);border-top:1px solid var(--line2);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 26px rgba(0,0,0,.55)}
.bottombar .stats{overflow-x:auto;flex-wrap:nowrap;gap:22px;-webkit-overflow-scrolling:touch}
.bottombar .stat{flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.mini,label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.statuspill{position:fixed;left:50%;transform:translateX(-50%) translateY(-24px);
  top:calc(10px + env(safe-area-inset-top,0px));z-index:210;
  background:#12242a;border:1px solid var(--line2);border-radius:20px;
  padding:7px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);opacity:0;pointer-events:none;transition:.28s}
.statuspill.show{opacity:1;transform:translateX(-50%)}
/* on a phone it sits in the row next to Menu instead of floating over the header,
   where it covered the title. display:none while idle so it takes no room. */
@media(max-width:760px){
  .statuspill{position:static;transform:none;display:none;align-items:center;flex:0 1 auto;
    padding:6px 9px;border-radius:6px;font-size:9px;letter-spacing:.06em;
    max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .statuspill.show{display:inline-flex;transform:none}
}
/* pull-to-sync tab, dragged down from behind the header */
.pullbar{position:fixed;left:50%;top:0;z-index:205;pointer-events:none;opacity:0;
  transform:translate(-50%,-44px);
  background:#12242a;border:1px solid var(--line2);border-top:0;border-radius:0 0 12px 12px;
  padding:7px 18px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pullbar.snap{transition:transform .25s,opacity .25s}
.pullbar b{color:var(--cyan);font-weight:700}
.statuspill b{font-weight:700}
.swipehint{display:none;justify-content:center;gap:10px;align-items:center;
  padding:8px 0 96px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.swipehint button{border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
  border-radius:4px;padding:7px 15px;font-size:15px;line-height:1}
.swipehint button:disabled{opacity:.3}
.swipehint,.bottombar{display:none !important}
@media(min-width:1101px){
  .scroller{padding-bottom:14px;overflow-x:auto;overflow-y:hidden}
  .scroller:not(.fit) .rail{width:max-content;min-width:100%}
  .scroller:not(.fit) .mcol{flex:0 0 var(--colw,248px);
    width:var(--colw,248px);min-width:var(--colw,248px)}
  /* snap the whole year into view */
  .scroller.fit{overflow-x:hidden}
  .scroller.fit .rail{width:100%;min-width:0}
  .scroller.fit .mcol{flex:1 1 0;width:auto;min-width:0}
  .scroller.fit .row .lbl{font-size:10.5px}
  .row .lbl{font-size:12px}
  .row .amt{font-size:12.5px}
  .scroller::-webkit-scrollbar{height:12px}
  .scroller::-webkit-scrollbar-track{background:#0c1216;border-top:1px solid var(--line)}
  .scroller::-webkit-scrollbar-thumb{background:#6fe0cf;border-radius:6px;border:3px solid #0c1216}
  .scroller::-webkit-scrollbar-thumb:hover{background:#9df3e6}
}
@media(max-width:760px){
  .top{padding:12px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));gap:9px}
  /* one line, as it always was: the title keeps its full width and the year strip
     takes what's left and scrolls inside itself. What changed in v35 is only that
     the overflow now lives in the strip instead of stretching the whole page. */
  .toprow .brand{flex:0 0 auto;overflow:visible}
  .brand h1{font-size:12px}
  .stats{gap:14px}
  .stats .v{font-size:17px}
  .row .lbl{font-size:13.5px}
  .row .amt{font-size:14px}
  .mfoot .v{font-size:21px}
}
.statuspill .ok{color:var(--teal)} .statuspill .busy{color:var(--cyan)}
.statuspill .err{color:var(--red)} .statuspill .warn{color:var(--amber)}
.years{display:flex;gap:5px;align-items:stretch;min-width:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.years::-webkit-scrollbar{display:none}
.ytab{flex:0 0 auto}
.ytab{border:1px solid var(--line2);background:var(--panel);color:var(--dim);
  padding:8px 15px;border-radius:4px;font-size:13.5px;font-weight:700;letter-spacing:.1em;transition:.14s}
.ytab:hover{color:var(--txt);border-color:#47757a}
.ytab.on{background:#15353a;color:var(--teal);border-color:var(--teal);font-weight:600}

.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);font-weight:600}
.stat .v{font-size:15px;font-weight:600}
.v.teal{color:var(--teal)} .v.amber{color:var(--amber)} .v.red{color:var(--red)} .v.cyan{color:var(--cyan)}

.scroller{overflow:hidden;padding:0;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rail{display:flex;align-items:stretch;width:100%;height:var(--gridh,70vh)}
.mcol{position:relative;flex:1 1 0;min-width:0;border-right:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;height:100%;overflow:hidden}
.mcol.past{background:#0d151a}
.mcol.now{background:#241f0c;box-shadow:inset 0 0 0 1px var(--amber)}
.mcol:last-child{border-right:none}

/* fixed-height header so every month lines up exactly */
.mhead{flex:none;position:relative;z-index:20;height:74px;padding:10px 11px;
  background:linear-gradient(#1a272d,#141e23);border-bottom:1px solid var(--line2);
  display:flex;flex-direction:column;justify-content:space-between}
.mcol.now .mhead{background:linear-gradient(#3a2f0e,#282108);border-bottom-color:#7a6320}
.mname{height:19px;line-height:19px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.mcol.past .mname{color:var(--dim)}
.tag{height:17px;line-height:15px;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:0 6px;
  border-radius:2px;text-transform:uppercase;flex:none;display:inline-flex;align-items:center}
.tag.three{background:#3a2c14;color:var(--amber);border:1px solid #6b5325}
.tag.now{background:#4a3b10;color:#ffd98a;border:1px solid #977a24}
.onhand{display:flex;justify-content:space-between;align-items:baseline;height:22px}
.onhand .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.onhand .v{font-size:17px;font-weight:700;color:var(--cyan)}
.mcol.now .onhand .v{color:#ffd98a}

.rows{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:4px 0 2px;scrollbar-width:thin}
.rows::-webkit-scrollbar{width:6px}
.rows::-webkit-scrollbar-thumb{background:#3d545e;border-radius:3px}
/* the list slides under the header and behind the footer */
.mhead{box-shadow:0 6px 12px -8px rgba(0,0,0,.85)}
.mfoot{box-shadow:0 -8px 14px -8px rgba(0,0,0,.9)}
.mcol .addrow{flex:none}
.row{display:flex;align-items:center;gap:6px;padding:8px 11px;min-height:36px;position:relative}
.row .lbl{flex:1;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.inc .lbl{color:#e2f2f4}
.row .amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:text;
  padding:1px 3px;border-radius:2px;border:1px solid transparent}
.row.inc .amt{color:var(--teal)}
.row.exp .amt{color:#ffb8a4}
.row .amt.man{color:var(--amber)}
.row .amt.ovr{border-bottom:1px dotted #6d8d96}
/* sits outside .lbl — inside it, the label's ellipsis swallowed it on a phone */
.row .frz{flex:none;margin:0 2px;padding:1px 4px;border:1px solid #7a6320;border-radius:3px;
  color:var(--amber);font-size:9.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.row .kill{position:absolute;right:1px;top:50%;transform:translateY(-50%);opacity:0;color:var(--dimmer);font-size:13px;line-height:1;padding:0 2px;border-radius:2px;background:var(--panel2)}
.row .dot{width:4px;height:4px;border-radius:50%;flex:none;background:#3e545e}
.row.oneoff .dot{background:var(--violet)}
.row.manual .dot{background:var(--amber)}
/* A real transaction off the account. It gets a cyan dot so a glance separates
   what happened from what is only predicted. The card payment sits at half
   strength: in the column because you asked to see everything move, out of the
   arithmetic because the credit card row already carried that money out. */
.row.tx .dot{background:var(--cyan)}
.row.tx.exp .dot{background:#a8756a}
.row.ccpay{opacity:.55}
/* a month that has closed counts what happened, so the things it predicted sit
   there faded rather than pretending to still be owed */
.row.stale{opacity:.38}
/* the transaction a recurring line was made from, marked so you can find it again
   without opening every row in the month */
.row .rec{flex:none;margin:0 3px;color:var(--teal);font-size:9px;opacity:.9}
/* the two columns of a charge you can sort on. Faintly underlined so it reads as
   pressable without shouting; the one in use is solid and carries the arrow. */
.txrow .sortby{border-bottom:1px dotted #3a4550;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.txrow .sortby.sorton{border-bottom-style:solid;border-bottom-color:var(--teal);
  color:var(--teal)!important}
/* Shown once, on the way into a category: the dates pulse, then the amounts, so
   it's obvious both columns are controls. Background and underline only — the
   amount carries an inline colour and a keyframe would win over it, which would
   look like the figure itself had changed rather than the button around it. */
@keyframes sortHint{
  0%  {background:transparent;border-bottom-color:#3a4550;box-shadow:none}
  30% {background:rgba(94,214,196,.20);border-bottom-color:var(--teal);
       box-shadow:0 0 0 3px rgba(94,214,196,.12)}
  100%{background:transparent;border-bottom-color:#3a4550;box-shadow:none}
}
.txrow .sortby.flash{border-radius:3px;animation:sortHint .7s ease-out both}
.txrow .dt.sortby.flash{animation-delay:.25s}
.txrow .a.sortby.flash{animation-delay:1.0s}
@media (prefers-reduced-motion:reduce){ .txrow .sortby.flash{animation:none} }
/* a word you can press — used for the stops-after switch */
.f label .lnk{color:var(--teal);border-bottom:1px dotted currentColor;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.f label .lnk b{font-weight:700;letter-spacing:.02em}
.row .tq{flex:none;margin:0 2px;padding:1px 4px;border:1px solid #7a6320;border-radius:3px;
  color:var(--amber);font-size:9.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.row .tk{flex:none;margin:0 2px;padding:1px 4px;border:1px solid #2f6b60;border-radius:3px;
  color:var(--teal);font-size:9.5px;font-weight:700;white-space:nowrap}
.row.cc{border-top:1px solid var(--line);margin-top:3px;padding-top:8px}
/* Hover belongs to a mouse. On iOS a :hover rule makes the first tap paint the
   hover state and swallow the click — the second tap is the one that opens
   anything. That is the whole reason the credit card line needed tapping twice.
   Behind (hover:hover) these never load on a phone and one tap works. */
@media (hover:hover) and (pointer:fine){
  .row:hover{background:#1b2a31}
  .mcol.now .row:hover{background:#33290f}
  .row .amt:hover{border-color:var(--line2);background:#0e171c}
  .row .frz:hover{background:#3a2f0e}
  .row:hover .kill{opacity:1}
  .row .kill:hover{color:var(--red)}
  .row .paid:hover{background:#10302c}
  .row .tq:hover{background:#3a2f0e}
  .row .late:hover{background:#2a1e08}
}
/* swipe a row left and the delete box comes out from under its right edge */
.row .swx{position:absolute !important;right:-58px;top:0;bottom:0;width:58px;
  z-index:3;                       /* over the heat gradient (1) and its children (2) */
  display:flex;align-items:center;justify-content:center;
  background:#c0392b;color:#fff;font-size:16px;font-weight:700;line-height:1}
.row.swopen{background:#1b2a31}
/* the heat rows clip themselves to keep their gradient inside a rounded corner.
   That also clips the delete box, so the clip lifts only while it is out. */
.row.heat.swiping,.row.heat.swopen{overflow:visible}
.amtin{width:84px;font-weight:700;background:#0c1418;border:1px solid var(--teal);border-radius:2px;
  padding:1px 3px;font-size:11.5px;text-align:right;outline:none;font-variant-numeric:tabular-nums}

.addrow{padding:5px 7px 8px}
.mcol.blank{opacity:.55}
.mcol.refonly{opacity:.62}
.nodata{padding:26px 12px;text-align:center;color:var(--dimmer);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;line-height:1.7}
.nodata .nd2{font-size:9.5px;letter-spacing:.06em;opacity:.75;text-transform:none}
.addbtn{width:100%;border:1px dashed #2e424b;color:var(--dimmer);border-radius:4px;padding:8px;
  font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.addbtn:hover{border-color:#4a6f79;color:var(--teal)}

.mfoot{flex:none;position:relative;z-index:15;height:74px;padding:10px 11px;overflow:hidden;border-top:1px solid var(--line2);
  background:linear-gradient(#16232a,#101a1f)}
.mfoot .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.mfoot .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.mfoot .nowbal{font-size:10px;color:var(--dimmer);letter-spacing:.05em;margin-top:2px}
.bigpick{display:block;width:100%;text-align:left;background:#0e151b;border:1px solid var(--line);
  border-radius:10px;padding:16px 14px;margin-bottom:10px;color:var(--txt);font:inherit;
  font-size:14px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.bigpick:hover{border-color:var(--cyan);color:var(--cyan)}
.bigpick .sub{display:block;font-size:11px;font-weight:400;color:var(--dimmer);margin-top:4px;letter-spacing:0}
.txr .tg.pick{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.mfoot .nowbal.live{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px}
.mfoot .v.ok{color:var(--teal)} .mfoot .v.low{color:var(--amber)} .mfoot .v.neg{color:var(--red)}
.mfoot .delta{font-size:9.5px;color:var(--dimmer);font-variant-numeric:tabular-nums}

#tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .26s ease,transform .26s ease;
  background:#111c21;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;
  min-width:216px;max-width:290px;max-height:78vh;overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.8)}
@media(max-width:760px){
  #tip{max-width:none;min-width:0;padding:12px 14px;border-color:var(--teal);
       box-shadow:0 -6px 40px rgba(0,0,0,.9)}
  #tip .tr{font-size:12px;padding:3px 0}
  #tip .tt{font-size:12px}
}
#tip.show{opacity:1;transform:none}
#linepane .tt,#linepane .td,#linepane .tr,#linepane .note,#linepane .hr,#linepane .bar{}
#linepane .tt{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);margin-bottom:2px}
#linepane .td{font-size:11px;color:var(--dimmer);margin-bottom:10px}
#linepane .tr{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;padding:4px 0;color:var(--dim)}
#linepane .tr b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
#linepane .bar{height:5px;background:#26343b;border-radius:3px;margin:8px 0 4px;overflow:hidden}
#linepane .bar i{display:block;height:100%;background:var(--teal)}
#linepane .bar i.over{background:var(--red)}
#linepane .note{font-size:11px;color:var(--amber);margin-top:9px;line-height:1.5}
#linepane .hr{height:1px;background:var(--line);margin:10px 0}
#tip .tt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);margin-bottom:2px}
#tip .td{font-size:10px;color:var(--dimmer);margin-bottom:8px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-size:11px;padding:2px 0;color:var(--dim)}
#tip .tr b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
#tip .bar{height:4px;background:#26343b;border-radius:2px;margin:7px 0 3px;overflow:hidden}
#tip .bar i{display:block;height:100%;background:var(--teal)}
#tip .bar i.over{background:var(--red)}
#tip .note{font-size:10px;color:var(--amber);margin-top:7px;line-height:1.5}
#tip .hr{height:1px;background:var(--line);margin:7px 0}

.drawer{position:fixed;top:0;right:0;bottom:0;padding-top:env(safe-area-inset-top);width:520px;max-width:94vw;z-index:120;
  background:#0c1418;border-left:1px solid var(--line2);transform:translateX(102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgba(0,0,0,.65)}
.drawer.open{transform:none}
.dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dhead h2{margin:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;flex:1}
.xbtn{font-size:15px;line-height:1;padding:7px 12px;font-weight:400}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:11px}
.crumbs button{color:var(--teal);border:1px solid var(--line2);background:var(--panel2);
  border-radius:3px;padding:5px 9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.crumbs span{color:var(--dimmer)}
.dbody{flex:1;overflow-y:auto;padding:14px 18px 60px}
.card{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;background:var(--panel)}
.chead{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer}
.chead:hover{background:var(--panel2)}
.chead .nm{flex:1;font-size:12px;color:var(--txt)}
.chead .am{font-size:11.5px;font-variant-numeric:tabular-nums}
.chead .cad{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);
  border:1px solid var(--line2);padding:2px 5px;border-radius:2px}
.chead .car{color:var(--dimmer);font-size:10px;transition:.15s}
.card.open .chead .car{transform:rotate(90deg);color:var(--teal)}
.cbody{display:none;padding:4px 11px 12px;border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.fg{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.f{flex:1;min-width:96px}
.f label{display:block;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);margin-bottom:3px}
.f input,.f select{width:100%;background:#0c1418;border:1px solid var(--line2);border-radius:3px;
  padding:5px 7px;font-size:11.5px;outline:none}
.f input:focus,.f select:focus{border-color:var(--teal)}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:8px;cursor:pointer}
.chk input{accent-color:var(--teal)}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.more .morebody{display:none}
.more.open .morebody{display:block}
.more .mcar{display:inline-block;transition:.15s}
.more.open .mcar{transform:rotate(90deg);color:var(--teal)}
.steps{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.steps .sh{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);margin-bottom:5px}
.step{display:flex;gap:7px;align-items:center;margin-bottom:5px}
.step input{background:#0c1418;border:1px solid var(--line2);border-radius:3px;padding:4px 6px;font-size:11px;outline:none}
.step .x{color:var(--dimmer);font-size:13px}.step .x:hover{color:var(--red)}
.mini{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border:1px dashed var(--line2);border-radius:3px;padding:4px 8px}
.mini:hover{color:var(--teal);border-color:#4a6f79}
.vtag{font-size:9px;letter-spacing:.1em;color:var(--dimmer);font-weight:400;
  border:1px solid var(--line2);border-radius:3px;padding:1px 4px;vertical-align:2px}
.mini.on{color:#08111a;background:var(--teal);border-style:solid;border-color:var(--teal)}
.crow{display:flex;gap:8px;margin-top:11px;align-items:center}
.del{color:var(--dimmer);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
.del:hover{color:var(--red)}
.hint{font-size:10.5px;color:var(--dim);line-height:1.6;margin:2px 0 14px}

.flag{border:1px solid var(--line2);border-left:2px solid var(--amber);border-radius:3px;
  padding:10px 12px;margin-bottom:9px;background:var(--panel)}
.flag.bad{border-left-color:var(--red)}
.flag.good{border-left-color:var(--teal)}
.dbody .yes{color:var(--teal);font-weight:700}
.dbody .no{color:var(--red);font-weight:700}
.dbody .maybe{color:var(--amber);font-weight:700}
.dbody .dline{display:flex;justify-content:space-between;gap:14px;padding:2px 0;
  align-items:baseline}
.dbody .dline>span:first-child{flex:0 0 auto;white-space:nowrap}
.dbody .dline>span:last-child{flex:1 1 auto;text-align:right;min-width:0}
.dbody .dnote{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);
  color:var(--dimmer);font-size:11px;line-height:1.55}
.topicline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.topicline code{background:#0b1418;border:1px solid var(--line2);border-radius:4px;
  padding:4px 7px;font-size:12px;color:var(--cyan);user-select:all;word-break:break-all}
.flag .ft{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);margin-bottom:4px}
.flag .fb{font-size:11px;color:var(--dim);line-height:1.6}
.catrow{display:block;width:100%;text-align:left;background:none;border:none;padding:2px 4px;border-radius:4px}
.catrow:hover{background:var(--panel2)}
.catrow:active{background:var(--panel3)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* off-book: shown for context, not deducted */
/* A section heading. Deliberately slimmer than a row — it is a control, not a
   line of the budget, and two of them on every column would otherwise cost four
   rows of height in a place already short of it. */
.row.seg{min-height:24px;padding:4px 11px 4px 5px;cursor:pointer;gap:4px;
  border-top:1px solid var(--line);margin-top:3px}
.rows > .row.seg:first-child{border-top:none;margin-top:0}
.row.seg .lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer)}
.row.seg .gn{font-size:9px;font-weight:600;color:var(--dimmer);letter-spacing:.06em}
.row.seg .amt{font-size:11px;font-weight:700;opacity:.85;cursor:pointer}
.row.seg.inc .amt{color:var(--teal)}
.row.seg.exp .amt{color:#ffb8a4}
.row.seg.done .lbl,.row.seg.done .amt{text-decoration:line-through;opacity:.5}
/* wider than it looks: the glyph is small on purpose but the tap target has to
   clear a thumb, so the whole heading is clickable and this just aims the eye */
.row.seg .tri{font-size:11px;width:14px;text-align:center;padding-left:0;color:var(--dim)}
.row.seg .tri.up{color:var(--teal)}
.row.grp{cursor:pointer}
.row.grp .lbl{font-weight:700}
.row.grp .gn{color:var(--dimmer);font-weight:600;font-size:10px}
.row .tri{color:var(--dimmer);font-size:9px;transition:.15s;flex:none;padding-left:2px}
.row .tri.up{transform:rotate(180deg);color:var(--teal)}
.row.bud .amt{color:#9ad6a0}
.row.bud.grp .lbl{color:#9ad6a0}
.row.bud .cut{font-size:9.5px;color:var(--dimmer);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.row.child{background:rgba(255,255,255,.02)}
.row.child .lbl{padding-left:12px;font-weight:600;opacity:.9}
.row.planned{background:rgba(140,120,220,.10);box-shadow:inset 2px 0 0 #8c78dc}
.row.planned .lbl{color:#b6a6f0}
.row.planned .amt{color:#b6a6f0}
/* the cycle that's still filling in — warms up as it walks toward the target.
   every animation lives on a pseudo-element so it can't fight the spill-in
   animation the row itself already uses when a month slides into view. */
.ytab:focus-visible,.menupanel .btn:focus-visible{outline:2px solid var(--cyan);
  outline-offset:2px;border-radius:3px}
/* keyboard focus inside a drawer, and on anything we made tabbable by hand */
.dbody :focus-visible,.dbody [role="button"]:focus-visible{outline:2px solid var(--cyan);
  outline-offset:2px;border-radius:3px}
.dbody:focus{outline:none}
/* where Tab will start. deliberately loud — it is meant to be spotted. */
@keyframes kbBlink{0%,100%{outline-color:var(--cyan);box-shadow:0 0 0 0 rgba(110,231,240,0)}
  50%{outline-color:#eafcff;box-shadow:0 0 12px 2px rgba(110,231,240,.45)}}
.kbfocus{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px;
  animation:kbBlink .85s ease-in-out infinite}
/* the accumulating card row flashes like the current month does, two beats later.
   it rides on a child element, not a pseudo-element, because the heat ramp already
   owns ::before and ::after on this row. */
@keyframes ccFlash{0%,100%{opacity:0}45%{opacity:.42}}
.mcol .row>.rowflash{position:absolute;inset:0;z-index:46;pointer-events:none;opacity:0;
  border-radius:3px;background:linear-gradient(#ffd98a,#ffb851);box-shadow:inset 0 0 0 2px #ffe1a3}
.mcol .row.livepulse>.rowflash{animation:ccFlash 1s ease-in-out 2 both;animation-delay:2s}
.row.heat{border-radius:4px;overflow:hidden}
.row.heat>*{position:relative;z-index:2}
.row.heat::before,.row.heat::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.row.heat .amt{font-weight:800}

/* 1 — plenty of room. slow drifting glitter. */
.row.heat1{background:rgba(240,196,80,.13);box-shadow:inset 2px 0 0 #f0c450}
.row.heat1 .amt{color:#f5d071}
.row.heat1::before{
  background-image:
    radial-gradient(1.6px 1.6px at 11% 32%,#fff3c4,transparent 60%),
    radial-gradient(1.2px 1.2px at 34% 71%,#ffd970,transparent 60%),
    radial-gradient(1.7px 1.7px at 58% 24%,#fff6d0,transparent 60%),
    radial-gradient(1.2px 1.2px at 82% 66%,#ffe08a,transparent 60%);
  animation:glint 5.4s ease-in-out infinite}
.row.heat1::after{
  background-image:
    radial-gradient(1.3px 1.3px at 22% 62%,#fff1bb,transparent 60%),
    radial-gradient(1.7px 1.7px at 46% 40%,#ffe9a8,transparent 60%),
    radial-gradient(1.2px 1.2px at 70% 78%,#fff6d0,transparent 60%),
    radial-gradient(1.5px 1.5px at 93% 30%,#ffdf85,transparent 60%);
  animation:glint 6.7s ease-in-out infinite 1.9s}
@keyframes glint{0%,100%{opacity:.12}30%{opacity:.85}55%{opacity:.2}80%{opacity:.7}}

/* 2 — halfway. a warm light sweeps across every few seconds. */
.row.heat2{background:rgba(240,148,60,.15);box-shadow:inset 2px 0 0 #f0943c}
.row.heat2 .amt{color:#ffab5e}
.row.heat2::before{
  background:linear-gradient(100deg,transparent 34%,rgba(255,190,110,.3) 50%,transparent 66%);
  background-size:240% 100%;animation:sweep 4.2s linear infinite}
@keyframes sweep{from{background-position:190% 0}to{background-position:-90% 0}}

/* 3 — nearly there. a steady, quickening heartbeat. */
.row.heat3{background:rgba(232,84,72,.17);box-shadow:inset 2px 0 0 #e85448}
.row.heat3 .amt{color:#ff8b7e;animation:throbtext 1.45s ease-in-out infinite}
.row.heat3::before{
  background:radial-gradient(130% 180% at 0% 50%,rgba(232,84,72,.5),transparent 72%);
  animation:throb 1.45s ease-in-out infinite}
@keyframes throb{0%,100%{opacity:.3}50%{opacity:.95}}
@keyframes throbtext{0%,100%{color:#ff8b7e}50%{color:#ffd0c6}}

/* 4 — past the target. it's on fire. */
.row.heat4{background:rgba(104,22,10,.4);box-shadow:inset 2px 0 0 #ff5722}
.row.heat4 .amt{color:#ffd48a;animation:emberglow 1.1s ease-in-out infinite;
  text-shadow:0 0 7px rgba(255,120,30,.85)}
.row.heat4::before{
  background-image:
    radial-gradient(52% 96% at 50% 100%,rgba(255,232,150,.9),rgba(255,128,24,.8) 46%,transparent 80%),
    radial-gradient(58% 92% at 50% 100%,rgba(255,104,20,.95),transparent 74%);
  background-size:13px 17px,21px 21px;background-position:0 100%,7px 100%;
  background-repeat:repeat-x;mix-blend-mode:screen;
  animation:lick .58s ease-in-out infinite alternate}
.row.heat4::after{
  background-image:radial-gradient(46% 90% at 50% 100%,rgba(255,246,200,.95),transparent 76%);
  background-size:9px 13px;background-position:4px 100%;background-repeat:repeat-x;
  mix-blend-mode:screen;animation:lick2 .44s ease-in-out infinite alternate}
@keyframes lick{from{background-size:13px 11px,21px 14px;opacity:.72}

<script>
const APP_V="v106";   /* bump this in the same edit that bumps ?v= in the URL */

/* ── baked state ──────────────────────────────────────────────
   "Save as app" rewrites the line below with your current numbers,
   so the file you put on a shared drive IS your budget. ───────── */
const BAKED=null; /*BAKED*/
const BOOT_HTML="<!DOCTYPE html>\n"+document.documentElement.outerHTML;

const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const uid=()=>Math.random().toString(36).slice(2,9);
const ym=(y,m)=>y+"-"+String(m).padStart(2,"0");
const parseYM=s=>({y:+s.slice(0,4),m:+s.slice(5,7)});
const cmpYM=(a,b)=>a<b?-1:a>b?1:0;
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
const money0=n=>(n<0?"-":"+")+"$"+Math.abs(Math.round(n)).toLocaleString();
const ordinal=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");

function defaultState(){
 const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
 return {
  meta:{start:ym(y,m), end:ym(y+5,12), opening:0, buffer:0, title:"Household Budget"},
  rules:[
   {id:"pay", name:"Paychecks", kind:"income", cadence:"biweekly",
    anchor:new Date().toISOString().slice(0,10), start:ym(y,m), end:null, sort:10,
    schedule:[{from:ym(y,m),amount:0}]},
   {id:"cc", name:"Credit card", kind:"expense", cadence:"monthly", day:28,
    start:ym(y,m), end:null, manual:true, sort:9999,
    schedule:[{from:ym(y,m),amount:0}]}
  ],
  over:{}, skip:{}, accountNames:{}, catRules:[],
  stmts:{}, learned:{}, oneoffs:[], plans:[]
 };
}

function pickState(){
  const stored=load(), ts=o=>(o&&o.meta&&o.meta.savedAt)||0;
  /* a freshly baked file must beat stale storage on this device, and
     your later edits here must beat the older baked copy */
  if(BAKED&&ts(BAKED)>=ts(stored)) return BAKED;
  if(stored) return stored;
  return BAKED||defaultState();
}
let S = pickState();
migrate(S);
const ACCT_KEYS=["Main","A","B","C","Other"];
const ACCT_FALLBACK={Main:"Main account",A:"Account A",B:"Account B",C:"Account C",Other:"Other account"};
/* an older save may use a name as the key — show it as-is rather than storing names here */
const acctLabel=a=>(S.accountNames&&S.accountNames[a])||ACCT_FALLBACK[a]||a||"Main account";
const acctList=()=>{
  const keys=ACCT_KEYS.slice();
  const add=k=>{ if(k&&!keys.includes(k)) keys.push(k); };
  Object.keys(S.accountNames||{}).forEach(add);
  (S.rules||[]).forEach(r=>add(r.account));      // keys your own data already uses
  return keys.map(k=>[k,acctLabel(k)]);
};
function migrate(s){
  s.meta.buffer=s.meta.buffer??4000;
  /* v69 — the yearly bonus and the balancer are gone. The balancer's one surviving
     job, seeding the month the records start in, is done by meta.opening below. */
  delete s.bonus;
  s.accountNames=s.accountNames||{};
  s.catRules=s.catRules||[];
  s.meta.ccTarget=s.meta.ccTarget??5000;
  s.meta.holdCat=s.meta.holdCat||"Groceries";
  s.meta.title=s.meta.title||"Household Budget";
  /* show the whole calendar year, but remember which months predate any records */
  if(!s.meta.recordsFrom) s.meta.recordsFrom=s.meta.start;
  /* v57 — the wall. Months before recordsFrom still draw their rows, greyed, for
     reference, but they contribute nothing to the running total and hand nothing
     forward. The chain holds at meta.opening until it reaches recordsFrom, so that
     month opens at exactly the figure typed in settings.
     Set once here; the month is editable in settings afterwards.
     A balancer used to sit on the month before the wall doing this by hand — forcing
     that month to END at a chosen figure so the next one OPENED there. Its target is
     adopted here, once, and then balancers are gone from the app entirely. */
  if(!s.meta.wallSet){
    s.meta.recordsFrom="2026-08";
    const before=prevMonth(s.meta.recordsFrom);
    const tgt=s.balancers&&s.balancers[before];
    if(typeof tgt==="number") s.meta.opening=tgt;
    s.meta.wallSet=1;
  }
  const st=parseYM(s.meta.start);
  if(st.m>1) s.meta.start=ym(st.y,1);
  s.stmts=s.stmts||{};
  s.meta.myCats=Array.isArray(s.meta.myCats)?s.meta.myCats:[];
  /* v67 — savings removed at the owner's request, to be re-added later on different
     rules. Everything it owned is deleted rather than left dormant: a dormant
     savings balance would keep being summed into what you have, and dormant labels
     would keep being offered. Deleting the account role also releases the SimpleFIN
     account, which is already disconnected at the source. */
  delete s.sav; delete s.savLearned; delete s.savOne;
  delete s.meta.savBalance; delete s.meta.savBalanceAt;
  delete s.meta.mySavCats; delete s.meta.hidSavCats;
  if(s.meta.acct) Object.keys(s.meta.acct).forEach(id=>{
    if(s.meta.acct[id]==="savings") delete s.meta.acct[id];
  });
  /* And the plan resets to the credit card and its budget. The owner is rebuilding
     the recurring lines from scratch; leaving the old ones would mean pruning a
     column by hand while the new ones are being typed in beside them.
     Once only — `planReset` guards it — so adding a line back doesn't wipe it on the
     next load. Anything keyed to a rule that no longer exists goes with it, or the
     stores fill with hits and overrides pointing at nothing. */
  if(!s.meta.planReset){
    const keep=r=>r.id==="cc";
    const gone=(s.rules||[]).filter(r=>!keep(r)).map(r=>r.id);
    s.rules=(s.rules||[]).filter(keep);
    [s.hits,s.props,s.over,s.skip].forEach(store=>{
      if(!store) return;
      Object.keys(store).forEach(k=>{ if(gone.includes(String(k).split("#")[0])) delete store[k]; });
    });
    s.payee=s.payee||{};
    gone.forEach(id=>delete s.payee[id]);
    s.oneoffs=[];
    s.meta.planReset=1;
  }
  delete s.balancers;
  /* ── v70 — the cash account is back, and it is the only one. Everything it does
     from meta.txFrom on shows in the column as its own line. Four stores carry the
     decisions, and they are deliberately separate:
       s.tag    sig -> {label,transfer,ccpay}  one transaction, decided by hand
       s.merch  merchant -> label              sticks: next month arrives named
       s.tmerch merchant -> 1                  a known transfer, never auto-names
       s.assign rowKey -> sig                  a placeholder answered by a real one
     A transfer is kept OUT of s.merch on purpose. The owner reads those every time
     because the same merchant is a different intention each month, and a label that
     stuck would quietly pre-answer a question that has to be asked. */
  s.tag=s.tag||{}; s.merch=s.merch||{}; s.tmerch=s.tmerch||{};
  s.assign=s.assign||{}; s.ccpay=s.ccpay||{};
  s.meta.txFrom=s.meta.txFrom||"2026-08-01";
  /* The proposal queue and its hits are the old way round — the app guessing which
     line a transaction was, for confirmation. Transactions carry themselves now and
     the owner assigns them by hand, so the queue is emptied once and never refilled.
     Left in the file rather than torn out: nothing writes to it, and every read is a
     lookup that now misses. */
  if(!s.meta.txReset){ s.hits={}; s.props={}; s.meta.txReset=1; }
  s.payee=s.payee||{};   /* ruleId -> merchant names you've attached by hand */
  s.learned=s.learned||{};
  /* v60 — biweekly rules used to carry an anchor date ("any payday you know")
     separate from their start month. Those two fields meant almost the same thing
     sitting side by side, so there is one now: Starts. Fold the anchor into it,
     because Apply writes the anchor FROM the start and would otherwise overwrite a
     real payday with the rule's start month and quietly move every paycheck.
     The window now opens on the first payday rather than the 1st of that month.
     Everything before the wall is reference-only anyway, so nothing visible moves. */
  s.rules.forEach(r=>{

   happened — which is why the editor sat there showing January 2026 under a start
   of Aug 7, 2026.

   that is the amount in force when the rule finally begins. Dropping the rest
   matters — amountAt() takes the last step at or before the month asked for, so
   leaving a stale one behind the moved one would have it win instead. Steps on or
   after the start are real changes and are left alone. */

  r.schedule.sort((a,b)=>cmpYM(a.from,b.from));

  const before=r.schedule.filter(x=>cmpYM(x.from,sm)<0);
  if(!before.length) return;
  const keep=before[before.length-1];
  r.schedule=r.schedule.filter(x=>x===keep||cmpYM(x.from,sm)>=0);
  keep.from=sm;
  /* if a step was already dated exactly on the start month, that one is explicit
     and wins — two steps on the same month is ambiguous, and the moved one is
     only there by inference. */
  const dup=r.schedule.filter(x=>x.from===sm);
  if(dup.length>1) r.schedule=r.schedule.filter(x=>x.from!==sm||x===dup[dup.length-1]);

     An occurrence counts at its real amount as soon as a transaction is sat

  const real={};

      const sig=S.assign&&S.assign[key];
      if(sig&&real[sig]!==undefined) amt=real[sig];

         than is owed. It is wrong for a transaction that already happened, which
         was whatever it was. Overpay and the balance simply lands on zero. */
      if(!sig&&Math.abs(amt)>bal) amt=-bal;

/* ---------- live card feed ----------
   Spending runs the 4th to the 3rd and lands on the following month's bill.
   One month accumulates live; everything past it keeps its flat target.
   A closed cycle stays live a few more days so late-posting charges land. */
const CYCLE_DAY=4, GRACE_DAYS=4;
function nextMonth(k){ const {y,m}=parseYM(k); return m===12?ym(y+1,1):ym(y,m+1); }
function liveCycle(today){
  const d=today||new Date();

  const back=()=>{ m--; if(m<1){ m=12; y--; } };

  else if(day<CYCLE_DAY+GRACE_DAYS) back();                  /* grace on the cycle that just shut */

/* Something you already know you're buying. It's keyed to the month you'll SPEND it,
   because that's how you think about it — but the money leaves on the following
   month's card bill, so that's the line it inflates. */
function plannedFor(spendMonth){
  if(!Array.isArray(S.plans)) S.plans=[];

                        .reduce((a,x)=>a+(Number(x.amt)||0),0);

/* extra riding on the bill that arrives in month k */
function plannedOnBill(k){ return plannedFor(prevMonth(k)); }

function plansFor(k){ if(!Array.isArray(S.plans)) S.plans=[]; return S.plans.filter(x=>x.ym===k); }

/* 0 = not the live line, 1..3 = yellow / orange / red */
/* Reading order down a column: what comes IN first, then what goes out, then the

     what decides. The rule's own order survives as the tiebreak on a shared day,

function build(){

  const LIVE=liveSigs();

       not, there is no info row and the rule is the only thing drawing it. */

      if(!inWindow(r,k)) continue;

      if(st&&st.rows&&st.rows.length){
        const due=(st.dates&&st.dates.newBalance)||st.rows.reduce((a,r)=>a+r.amt,0);
        /* a real payment assigned to this bill replaces it, same as any other
           planned line that a transaction has stood in for */

       that CAN show up is the payment itself, and it is marked off so the month
       doesn't subtract the same money twice. */

         already taking that money out and counting both would subtract it

         stepped out and the payment is the only thing left holding that money —
         so it has to count. Getting this wrong drops the payment entirely. */

       placeholders stay on screen as reading only.

       month that was never pulled, not a month where nothing happened, and
       zeroing it would put a hole in the running total. */

    if(pre) end=onhand;
    out.push({k,onhand,rows,net,end,offTot,infoTot,settled,
      noData: pre,
      payCount:rows.filter(r=>r.ruleId==="pay").length,
      cleanCount:rows.filter(r=>r.ruleId==="cleaner").length});
    onhand=end;
  }

}


/* ============================================================
   STATEMENT READER — parse a card export, tag it, remember corrections
   ============================================================ */
const CATS=["Dining","Delivery apps","Groceries","Gas & auto","Travel","Shopping","Bills & utilities",
            "Health","Personal care","Kids","Home","Subscriptions","Pets","Fees & interest","Other"];
const CATCOLOR={"Dining":"#ffc873","Delivery apps":"#ff8fb0","Groceries":"#6ff0dd","Gas & auto":"#8fe3f8","Travel":"#c8bcff",
  "Shopping":"#ff9077","Bills & utilities":"#9ad6a0","Health":"#f2a3c7","Kids":"#ffd98a",
  "Personal care":"#ff9ecb","Home":"#a0c4ff","Subscriptions":"#d6b3ff","Pets":"#8fd9b6","Fees & interest":"#ff7a61","Other":"#a9c1c9"};

function allCats(){ return CATS.concat(S.meta.myCats||[]); }
/* The built-in list is a starting point, not a fixture. "Andrea paycheck" and
   "Jacob paycheck" shipped hardcoded and could not be removed, which is wrong —
   the vocabulary should be whatever this household actually uses. Hidden rather
   than deleted, so a keyword rule still pointing at one keeps working.

   v88 — this comment had no closing marker. It was opened somewhere in v87 and
   never shut, so everything down to the next closing marker twenty lines below
   was commented out: hueOf(), catColor() and addLabel(). Every panel that colours a category
   — Advanced, the category views, the label editor — threw ReferenceError the
   moment it opened. The sentence above breaks off mid-thought at "Hidden rather"
   and the ending is a reconstruction; the code below was never touched. */
function hueOf(name){
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))|0;
  return Math.abs(h)%360;
}
function catColor(c){ return CATCOLOR[c]||(c?`hsl(${hueOf(c)},70%,72%)`:"var(--dim)"); }

function addLabel(which){
  const list=S.meta.myCats||[];
  const built=CATS;
  const raw=prompt("Name the new label");
  if(raw===null) return null;
  const name=String(raw).replace(/\s+/g," ").trim().slice(0,24);
  if(!name){ toast("Needs a name"); return null; }
  if(built.concat(list).some(c=>c.toLowerCase()===name.toLowerCase())){
    toast("There's already a label called that"); return null; }
  list.push(name); S.meta.myCats=list;
  save(); return name;

/* money you sent the card is not spending; a refund is negative spending and must come off */
function isCardPayment(d){
  return /payment (thank|received)|autopay|auto ?pay|online payment|^payment$|thank you|pymt|payment - thank/i.test(d);

/* issuers disagree on sign. Decide using real transactions only — a single huge
   autopay row would otherwise flip the whole statement upside down. */
function normalizeSigns(rows){
  const real=rows.filter(r=>!isCardPayment(r.desc));
  const negs=real.filter(r=>r.amt<0).length;
  if(negs>real.length/2) rows.forEach(r=>r.amt=-r.amt);
  return rows;

function normMerchant(desc){

    .replace(/\d{4,}/g," ").replace(/[^a-z& ]/g," ")
    .replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");

function categorize(desc){
  const key=normMerchant(desc);

function splitLine(line,delim){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===delim&&!q){ out.push(cur); cur=""; }
    else cur+=ch;

function parseStatement(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {rows:[],error:"That file came through empty."};
  const delimited=lines.filter(l=>/[,\t]/.test(l)).length > lines.length*0.6;
  if(!delimited){
    const ft=parseFreeText(text);
    if(ft.length){
      normalizeSigns(ft);
      const rows=ft.filter(r=>!isCardPayment(r.desc))
                   .map(r=>({...r,cat:categorize(r.desc).cat}));
      return {rows,total:rows.reduce((s,r)=>s+r.amt,0),
              credits:rows.filter(r=>r.amt<0).reduce((s,r)=>s+r.amt,0),
              dates:readStatementDates(text)};
    }
  }
  const delim=(lines[0].match(/\t/g)||[]).length>(lines[0].match(/,/g)||[]).length?"\t":",";
  let head=splitLine(lines[0],delim).map(h=>h.toLowerCase());
  const find=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  let iDate=find("transaction date","post date","date"),
      iDesc=find("description","merchant","payee","name","details"),
      iAmt =find("amount","debit","charge"),
      iCat =find("category","type");
  let start=1;
  if(iDesc<0||iAmt<0){ iDate=0; iDesc=1; iAmt=2; iCat=-1; start=0; }   // headerless
  const raw=[];
  for(let i=start;i<lines.length;i++){
    const f=splitLine(lines[i],delim);
    if(f.length<2) continue;
    const desc=(f[iDesc]||"").trim();
    let amt=parseFloat(String(f[iAmt]||"").replace(/[$,()\s]/g,""))||0;
    if(/^\(.*\)$/.test(String(f[iAmt]||"").trim())) amt=-Math.abs(amt);
    if(!desc||!amt) continue;
    raw.push({date:(f[iDate]||"").trim(),desc,amt,srcCat:iCat>=0?(f[iCat]||"").trim():""});
  }
  if(!raw.length){
    const ft=parseFreeText(text);
    if(!ft.length) return {rows:[],error:"Couldn't find any transactions in that file."};
    raw.push(...ft);
  }
  normalizeSigns(raw);
  const rows=raw.filter(r=>!isCardPayment(r.desc))
    .map(r=>({...r,cat:categorize(r.desc).cat}));
  const credits=rows.filter(r=>r.amt<0).reduce((s,r)=>s+r.amt,0);
  return {rows,credits,total:rows.reduce((s,r)=>s+r.amt,0),dates:readStatementDates(text)};
}

async function inflateBytes(bytes){

    try{
      const buf=await new Response(new Blob([trimmed]).stream()
        .pipeThrough(new DecompressionStream(fmt))).arrayBuffer();
      return new Uint8Array(buf);
    }catch(err){}
  }
  return null;
}

  }

    for(let k=3;k>=5-n;k--) out.push((t>>>(k*8))&255); }

function findStreams(raw){

    const e=raw.indexOf("endstream",pos); if(e<0) break;
    let s=raw.lastIndexOf("stream",e-1);

    if(s>0){

const RE_DATE=/^\s*(?:\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s*\d{4})?)\s*$/i;

function parseVertical(lines){

    if(!RE_DATE.test(lines[i])){ i++; continue; }
    let j=i+1, two=false;
    if(j<lines.length&&RE_DATE.test(lines[j])){ j++; two=true; }   // post date
    const desc=[];
    while(j<lines.length&&desc.length<3&&!RE_AMT.test(lines[j])&&!RE_DATE.test(lines[j])){
      const t=lines[j].trim();
      if(t) desc.push(t);
      j++;
    }
    if(j<lines.length&&RE_AMT.test(lines[j])&&desc.length){
      const a=lines[j].trim();
      let amt=parseFloat(a.replace(/[^0-9.]/g,""));
      if(/^-/.test(a)||/-\s*$/.test(a)) amt=-amt;
      const d=desc.join(" ").replace(/\s+/g," ").trim();
      if(d&&isFinite(amt)&&amt!==0&&!RE_SKIP.test(d))

      i=j+1; continue;
    }
    i++;

     boxes on page 1 only have one, so this drops them cleanly */
  const paired=rows.filter(r=>r.two);

function parseInline(text){

   month the payment actually leaves the account, not the month you spent it. */
const MONTH_RE=/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:,\s*|\s+)(\d{4})/i;
const MIDX=m=>["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"]
  .indexOf(m.slice(0,3).toLowerCase())+1;
function readStatementDates(text){
  const flat=text.replace(/\s+/g," ");
  const out={};
  /* billing cycle: "Jul 04, 2026 - Aug 03, 2026" */
  const cyc=flat.match(new RegExp(MONTH_RE.source+"\\s*[-–—to]{1,3}\\s*"+MONTH_RE.source,"i"));
  if(cyc){
    out.from=ym(+cyc[3],MIDX(cyc[1]))+"-"+String(cyc[2]).padStart(2,"0");
    out.to  =ym(+cyc[6],MIDX(cyc[4]))+"-"+String(cyc[5]).padStart(2,"0");
  }
  /* due date — the label and the date sit on different lines in a PDF */
  const i=flat.search(/payment due date/i);
  if(i>=0){
    const near=flat.slice(i,i+160).replace(/payment due date/i,"");
    const d=near.match(MONTH_RE);

  const nb=flat.match(/new balance\s*=?\s*\$\s*([\d,]+\.\d{2})/i);
  if(nb) out.newBalance=parseFloat(nb[1].replace(/,/g,""));
  const mp=flat.match(/minimum payment due\s*\$\s*([\d,]+\.\d{2})/i);
  if(mp) out.minPayment=parseFloat(mp[1].replace(/,/g,""));

  if(out.due) out.month=out.due.slice(0,7);
  else if(out.to){
    const t=parseYM(out.to.slice(0,7));
