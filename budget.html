/* ── the bank side of the feed ───────────────────────
   SimpleFIN hands back every account on one token. Until now everything it
   returned was treated as card spending; with a current account connected that's
   wrong, so each account carries a role. Unset means "card", which is what every
   existing setup already assumed. */
/* An account we've never been told about is NOT the credit card. Assuming it was
   is how a current account's mortgage payments and paycheque deposits ended up
   filed as card charges. Unknown means unknown: it feeds nothing until it's been
   named. The one exception is a token with a single account on it — there's
   nothing to confuse it with. */
function acctRole(id){
  const m=S.meta.acct||{};
  if(m[id]) return m[id];
  const list=S.meta.acctList||[];
  if(list.length===1) return "card";
  return "new";
}
/* a first guess, offered but never applied on its own */
/* ---------- roles surviving an id change ----------------------------------
   What you file an account as is stored against the id the bridge gives it. Some
   institutions keep those stable and some do not: Capital One and Navy Federal
   held theirs across pulls while every Fidelity account came back with a new one
   overnight, which orphaned all five roles at once and dropped the Assets figure
   to nothing. Nobody touched anything — it happened while the app was shut.

   An id is not a name. The organisation and the account name are what a person
   would use to recognise it, and those did not change. So when an account
   arrives with an id that has never been filed, its role is carried across from
   the account that shares its name.

   Two accounts can legitimately share a name — two Traditional IRAs at the same
   broker, which is exactly what is in this household. So the rule is: carry the
   role over when the matching old accounts all agreed on what they were. If they
   disagreed, do nothing and let it be filed by hand, because guessing between
   ASSET and IGNORE on a real balance is how a total silently goes wrong. */
function acctFp(a){
  return String(a&&a.org||"").trim().toLowerCase()+"|"+String(a&&a.name||"").trim().toLowerCase();
}
function acctReseat(prev){
  const roles=S.meta.acct=S.meta.acct||{};
  const now=S.meta.acctList||[];
  const was={};
  (prev||[]).forEach(a=>{
    const r=roles[String(a.id)];
    if(!r||r==="new") return;
    (was[acctFp(a)]=was[acctFp(a)]||[]).push({id:String(a.id),role:r});
  });
  /* an id still present in the new list has not moved and must keep its own */
  const held={}; now.forEach(a=>{ held[String(a.id)]=1; });
  let moved=0;
  now.forEach(a=>{
    const id=String(a.id);
    if(roles[id]) return;
    const cands=(was[acctFp(a)]||[]).filter(c=>!held[c.id]);
    if(!cands.length) return;
    /* all of them said the same thing, so which one it was does not matter */
    if(!cands.every(c=>c.role===cands[0].role)) return;
    roles[id]=cands[0].role;
    const used=cands.shift(); delete roles[used.id];
    moved++;
  });
  return moved;
}
function acctGuess(a){
  const bal=Number(a.balance);
  const n=(a.name||"").toLowerCase();
  /* before the card test, because a HELOC and a credit line both say "credit"
     while being nothing like a credit card */
  if(/mortgage|heloc|home\s?equity|home\s?loan|auto\s?loan|car\s?loan|student\s?loan|\bloan\b|lien/.test(n)) return "loan";
  if(/credit|card|visa|mastercard|amex|venture|freedom|sapphire/.test(n)) return "card";
  /* Checked before the savings patterns below, because "Roth IRA Savings" and
     "Brokerage Cash" are investments wearing a savings word. */
  if(/401\s?\(?k|\b403b?\b|\bira\b|roth|brokerage|invest|retire|pension|vanguard|fidelity|schwab|\bhsa\b|\b529\b|equity|portfolio/.test(n)) return "asset";
  /* v70 — savings IS the cash account. There is no separate checking to confuse it
     with, so guessing it into "bank" is right rather than dangerous. It is still only
     a guess, offered and never applied on its own. */
  if(/saving|money market|\bmma\b|high.?yield|\bhysa\b|certificate|\bcd\b/.test(n)) return "bank";
  if(/check|chequ|share draft/.test(n)) return "bank";
  if(!isNaN(bal)) return bal<0?"card":"bank";
  return null;
}
function newAccts(){
  return (S.meta.acctList||[]).filter(a=>acctRole(a.id)==="new");
}
function setAcctRole(id,role){
  S.meta.acct=S.meta.acct||{}; S.meta.acct[id]=role; save();
}
/* ---------- SMS recipients ------------------------------------------------
   A carrier reviewer reads the registration and then, if anything looks thin,
   goes looking for the screen it describes. So the screen has to exist and work
   the way the paperwork says: the field starts empty, the consent box starts
   unchecked, and nothing is saved until somebody ticks it themselves. That last
   part is a rejection code of its own — 30925, opt-in must be unchecked by
   default — and it is cheap to simply be true.

   The sentence below is duplicated in the campaign registration and on the
   published terms page. Change it here and change it in both. */
const SMS_DISCLOSURE="Household Budget will send you one budget summary text per day. "
  +"Up to 1 msg/day. Msg & data rates may apply. Reply HELP for help, STOP to cancel.";
/* Where the published policy lives. Update this if the page moves. */
const SMS_TERMS_URL="https://raw.githack.com/jtull1983/Budget/main/privacy.html";

function smsList(){
  if(!Array.isArray(S.meta.sms)) S.meta.sms=[];
  return S.meta.sms;
}
/* US ten digits, or eleven starting with 1, normalised to E.164. Anything else
   is refused rather than half-accepted: a number that looks saved but cannot be
   dialled is worse than one that was turned down out loud. */
function smsNorm(v){
  const d=String(v||"").replace(/[^0-9]/g,"");
  if(d.length===10) return "+1"+d;
  if(d.length===11&&d[0]==="1") return "+"+d;
  return null;
}
function smsPretty(e164){
  const d=String(e164||"").replace(/[^0-9]/g,"").slice(-10);
  return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):e164;
}
/* The consent record is the evidence. Storing when it was given, and the exact
   wording that was on screen at the time, is what makes it possible to answer a
   carrier audit with something other than a shrug. */
function smsAdd(num){
  const e=smsNorm(num); if(!e) return null;
  const list=smsList();
  if(list.some(x=>x.num===e)) return e;
  list.push({num:e,at:new Date().toISOString(),consent:SMS_DISCLOSURE});
  save(); return e;
}
function smsDel(num){
  S.meta.sms=smsList().filter(x=>x.num!==num); save();
}
function bankRows(){ return (S.bank&&Array.isArray(S.bank.rows))?S.bank.rows:[]; }

/* ── the same transaction, twice ─────────────────────────────────
   Rows are deduped on date|amount|description. Reconnecting a card makes the
   bridge re-derive a transaction it has already sent — a new description, and
   often a new posted date too — so the old copy survives forever, because by
   that signature it is a different row.

   v102 looked for the same date and found nothing, because the dates had moved.
   The amount is the part that does not drift: same money to the cent, within
   TXSLIP days, worded differently. That is the same window txHeal uses to
   re-attach a tag whose row was rewritten under it, and for the same reason.

   Two rows worded IDENTICALLY are left alone. Those are two real transactions
   — three $250 stock buys in a month look exactly like that — and txRows()
   already folds away anything that is genuinely the same row twice.

   Nothing here deletes on its own. It gathers suspects and the Sync pane asks. */
const dayGapOf=(a,b)=>Math.abs((Date.parse(a+"T00:00:00")-Date.parse(b+"T00:00:00"))/864e5);
function txDecided(sig){
  const g=(S.tag||{})[sig];
  return !!(g&&(g.label||g.rule||g.transfer||g.ccpay))||!!assignedTo(sig);
}
function dupGroups(){
  const by={};
  bankRows().forEach(t=>{
    if(!t||!t.date) return;
    const k=(Number(t.amt)||0).toFixed(2);
    (by[k]=by[k]||[]).push({t,sig:TXSIG(t),date:String(t.date),
                            txt:normTxt(t.desc).slice(0,24)});
  });
  const out=[];
  Object.keys(by).forEach(k=>{
    const g=by[k].slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(g.length<2) return;
    const used={};
    for(let i=0;i<g.length;i++){
      if(used[i]) continue;
      for(let j=i+1;j<g.length;j++){
        if(used[j]) continue;
        /* sorted by date, so once one is out of range every later one is too */
        if(dayGapOf(g[i].date,g[j].date)>TXSLIP) break;
        if(g[i].txt===g[j].txt) continue;          /* two real rows, same wording */
        /* Keep the copy the live connection is still sending. The one carrying
           your work is the older one by definition — you named it, which means it
           has been on screen a while — and dropping the bare one would just let
           the next card check bring it back. */
        const iD=txDecided(g[i].sig), jD=txDecided(g[j].sig);
        let keep,drop;
        if(iD!==jD){ keep=iD?g[j]:g[i]; drop=iD?g[i]:g[j]; }
        else { keep=g[j]; drop=g[i]; }             /* neither or both: later date wins */
        used[i]=used[j]=1;
        out.push({date:keep.date, amt:Number(keep.t.amt)||0, keep, drop:[drop],
                  gap:dayGapOf(g[i].date,g[j].date),
                  /* one copy touched and the other not, close together, is the
                     exact fingerprint a re-send leaves */
                  sure:(iD!==jD)});
        break;
      }
    }
    /* ── the wider pass ───────────────────────────────────────────────────
       Five days is the right window for "certainly the same row". It is the
       wrong one for "worth a look": a reconnect can move a posted date further
       than that, and capping recall there is why v103 still showed nothing.
       So: same amount, same month, worded differently, and exactly one of the
       two carries your name or assignment. Both untouched is not enough — two
       $99 debits three weeks apart are just two debits — but one named and one
       bare is a shape that does not happen by accident. Reported as unsure, so
       it is still a question rather than an answer. */
    for(let i=0;i<g.length;i++){
      if(used[i]) continue;
      for(let j=i+1;j<g.length;j++){
        if(used[j]) continue;
        if(g[i].txt===g[j].txt) continue;
        if(g[i].date.slice(0,7)!==g[j].date.slice(0,7)) continue;
        const iD=txDecided(g[i].sig), jD=txDecided(g[j].sig);
        if(iD===jD) continue;
        const keep=iD?g[j]:g[i], drop=iD?g[i]:g[j];
        used[i]=used[j]=1;
        out.push({date:keep.date, amt:Number(keep.t.amt)||0, keep, drop:[drop],
                  gap:dayGapOf(g[i].date,g[j].date), wide:true, sure:false});
        break;
      }
    }
  });
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
/* ── the automatic pass ─────────────────────────────────────────────────────
   Only the certain kind: inside the five-day window, one copy carrying your
   work and one bare. The wide matches are deliberately left alone — they are
   the ones where a real repeating charge could be mistaken for a re-send, and
   nothing should delete a real transaction without being asked.

   Capped, because anything that deletes rows on a timer needs a ceiling. If a
   single pass ever wants a quarter of the account or more than twenty rows,
   something has gone wrong upstream and the right move is to stop and let the
   review pane show its working instead. */
const DUP_MAX_SHARE=0.25, DUP_MAX_ROWS=20, DUP_MIN_BASE=20;
function dupSweep(){
  if(syncOn()&&!pulledOK) return 0;          /* not on a half-loaded state */
  const sure=dupGroups().filter(x=>x.sure&&!x.wide);
  if(!sure.length) return 0;
  const total=bankRows().length;
  const want=sure.reduce((n,x)=>n+x.drop.length,0);
  /* The share test only means anything once there are enough rows for a share
     to be a share. On an account holding three transactions, folding one pair is
     33% and would trip a ceiling meant to catch a runaway, so the proportion is
     only consulted past DUP_MIN_BASE rows. The flat row cap always applies. */
  if(want>DUP_MAX_ROWS||(total>=DUP_MIN_BASE&&want/total>DUP_MAX_SHARE)){
    S.meta.dupHeld=want;                     /* the pane explains it */
    return 0;
  }
  delete S.meta.dupHeld;
  const gone=dupMerge(sure);
  if(gone) toast(gone===1?"Merged a duplicate the card re-sent"
                         :"Merged "+gone+" duplicates the card re-sent");
  return gone;
}

/* Carry the work across, then remove the stale copy. Doing it in that order
   matters: the name, the repeat rule and the assignment all hang off a
   signature, and deleting first would strand them. */
function dupMerge(groups){
  let gone=0;
  (groups||[]).forEach(x=>{
    const keepSig=x.keep.sig;
    x.drop.forEach(d=>{
      const from=(S.tag||{})[d.sig];
      if(from&&!txDecided(keepSig)){
        S.tag=S.tag||{};
        S.tag[keepSig]=Object.assign({},from);
      }
      /* an assignment points at a signature; move it rather than lose the link */
      const line=assignedTo(d.sig);
      if(line){ S.assign=S.assign||{}; S.assign[line]=keepSig; }
      if(S.hits) Object.keys(S.hits).forEach(kk=>{
        if(S.hits[kk]&&S.hits[kk].sig===d.sig) S.hits[kk].sig=keepSig; });
      if(S.tag) delete S.tag[d.sig];
    });
    const kill={}; x.drop.forEach(d=>kill[d.sig]=1);
    const before=bankRows().length;
    S.bank=S.bank||{rows:[]};
    S.bank.rows=bankRows().filter(t=>!kill[TXSIG(t)]);
    gone+=before-bankRows().length;
  });
  if(gone){ save(); render(); }
  return gone;
}
/* v67 — savings is gone. The account role, its pane, its labels and its rows were
   all removed at the owner's request; it comes back later on different rules.
   matchPool() and totalNow() are kept as the single names the rest of the file asks
   for a pool and a live total by, so re-adding an account means changing these two
   and nothing else. Note totalNow() is what the current-month rebase keys on — not
   liveBalance directly — which is the bug that shipped in v53. Keep it that way. */
function matchPool(){ return bankRows(); }
function totalNow(){
  return typeof S.meta.liveBalance==="number"?S.meta.liveBalance:null;
}

/* ── the account's own transactions ──────────────────────────────────────────
   Everything the cash account actually did, from meta.txFrom on, kept for good
   rather than trimmed to a rolling window: a past month has no live balance to
   lean on, so its transactions ARE the month, and trimming them would empty the
   column behind you as you walked forward. Deduped on the same signature the
   tags are keyed by, because the bridge sends no stable ids. */
const TXSIG=t=>String(t.date)+"|"+Number(t.amt).toFixed(2)+"|"+normTxt(t.desc).slice(0,24);
function txFromDay(){ return (S.meta&&S.meta.txFrom)||"2026-08-01"; }
function txRows(){
  const out=[], seen={};
  bankRows().forEach(t=>{
    if(!t||!t.date||String(t.date)<txFromDay()) return;
    const g=TXSIG(t); if(seen[g]) return; seen[g]=1; out.push(t);
  });
  return out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function txFor(k){ return txRows().filter(t=>String(t.date).slice(0,7)===k); }
function txTag(t){ return (S.tag&&S.tag[TXSIG(t)])||{}; }

/* ---------- re-attaching what the bank moved ------------------------------
   A transaction is identified by its date, its exact amount, and the first 24
   characters of its description. Everything you decide about it — the name you
   gave it, the budget line you sat it against, the rule it belongs to — is filed
   under that composite key.

   All three of those change underneath you. A pending charge posts a day later
   under a new date. The description gets rewritten from ACH DEBIT PENDING to the
   merchant. A fuel hold settles at a different amount. When any one shifts, the
   key no longer matches, the decision is orphaned, and the row comes back looking
   like you never touched it.

   The bridge sends no stable id — there is a comment in the pull saying so — so
   the row cannot simply be followed. This finds an orphan a new home instead, and
   is deliberately conservative about it: a wrong adoption puts your name on
   somebody else's charge, which is worse than making you name it twice.

   Two passes. The first re-attaches rows whose text still matches and only the
   date or the amount moved. The second handles a rewritten description, and only
   fires when exactly one candidate fits — one plausible answer is a match, two is
   a guess. */
const TXSLIP=5;              /* days a posting date may move */
function txHeal(){
  const tags=S.tag||{};
  const rows=txRows();
  const live={}; rows.forEach(t=>{ live[TXSIG(t)]=t; });

  /* a tag worth rescuing is one that carries a decision, not an empty shell */
  const meaty=g=>!!(g&&(g.label||g.rule||g.transfer||g.ccpay));
  const orphans=Object.keys(tags).filter(k=>!live[k]&&meaty(tags[k]));
  if(!orphans.length) return 0;

  /* rows that have no decision of their own are the only ones open to adoption */
  const free=rows.filter(t=>!meaty(tags[TXSIG(t)]));
  const parse=k=>{ const p=String(k).split("|");
    return {date:p[0],amt:p[1],txt:p.slice(2).join("|")}; };
  const dayGap=(a,b)=>Math.abs((Date.parse(a+"T00:00:00")-Date.parse(b+"T00:00:00"))/864e5);

  let moved=0;
  orphans.forEach(old=>{
    const o=parse(old);
    const near=free.filter(t=>dayGap(t.date,o.date)<=TXSLIP&&!meaty(tags[TXSIG(t)]));
    /* same words, the date or the amount moved */
    let hit=near.filter(t=>normTxt(t.desc).slice(0,24)===o.txt);
    /* the description was rewritten: only act on a single candidate */
    if(!hit.length){
      const same=near.filter(t=>Number(t.amt).toFixed(2)===o.amt);
      if(same.length===1) hit=same;
    }
    if(hit.length!==1) return;
    const t=hit[0], now=TXSIG(t);
    if(now===old||meaty(tags[now])) return;

    tags[now]=tags[old]; delete tags[old];
    /* an assignment points at the transaction by signature, and a hit records the
       one it settled against. Both have to follow the tag or the line goes back to
       showing a prediction next to a charge that already happened. */
    Object.keys(S.assign||{}).forEach(k=>{ if(S.assign[k]===old) S.assign[k]=now; });
    Object.keys(S.hits||{}).forEach(k=>{
      const h=S.hits[k];
      if(h&&h.sig===old){ h.sig=now; h.date=t.date; h.amt=t.amt; h.desc=t.desc; }
    });
    moved++;
  });
  return moved;
}
/* A transfer is read every time. The tag on this one transaction wins; failing
   that, a merchant you have already called a transfer keeps its successors out
   of the merchant-name store rather than answering for them. */
function txIsTransfer(t){
  const g=txTag(t);
  if(g.transfer!==undefined) return !!g.transfer;
  return !!(S.tmerch&&S.tmerch[normMerchant(t.desc)]);
}
/* The one payment that must not land twice. The credit card row already carries
   that money out of the month; this is the same money leaving the account. It is
   shown — everything in and out is shown — and left out of the arithmetic. */
function txIsCard(t){
  const g=txTag(t);
  if(g.ccpay!==undefined) return !!g.ccpay;
  return !!(S.ccpay&&S.ccpay[normMerchant(t.desc)]);
}
/* A tag beats a remembered merchant; a remembered merchant beats the bank's own
   wording; a transfer never reads the merchant store at all. */
/* A first guess only, and it changes nothing until it is saved. The same word
   list the card feed already uses to spot a payment, run against money leaving
   the account. Deliberately not wired into txIsCard(): a false positive there
   would quietly drop a real expense out of the month's total, and a wrong guess
   in a checkbox is one tap to fix. */
function txCardGuess(t){
  if(Number(t.amt)>=0) return false;
  return SFIN_PAYMENT.test(String(t.desc||""));
}
function txLabel(t){
  const g=txTag(t);
  if(g.label) return g.label;
  if(!txIsTransfer(t)){
    const m=normMerchant(t.desc);
    if(S.merch&&S.merch[m]) return S.merch[m];
  }
  return String(t.desc||"").trim()||"Transaction";
}
function liveSigs(){ const o={}; txRows().forEach(t=>o[TXSIG(t)]=1); return o; }
/* which placeholder, if any, this transaction was assigned to */
function assignedTo(sig){
  const a=S.assign||{};
  for(const k in a) if(a[k]===sig) return k;
  return null;
}
function txFind(sig){ return txRows().find(t=>TXSIG(t)===sig)||null; }

/* ── matching a real transaction to a line you predicted ──
   Three signals: does the name look like the line, is the amount in the right
   neighbourhood, and did it land near the day you said it would. Any one of them
   alone is a coin flip — a $45 debit could be anything — so a match needs a good
   name OR a near-exact amount, plus the date to back it up. */
function normTxt(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function nameScore(label,desc){
  const A=normTxt(label).split(" ").filter(w=>w.length>2);
  const B=normTxt(desc).split(" ").filter(w=>w.length>2);
  if(!A.length||!B.length) return 0;
  let hit=0;
  A.forEach(w=>{ if(B.some(x=>x.startsWith(w)||w.startsWith(x))) hit++; });
  return hit/A.length;
}
/* the same list matchHTML shows, so an index from one means the same row in the other */
function spareNow(){
  return (matchPool()||[]).filter(t=>String(t.date).slice(0,7)===NOW)
    .filter(t=>!Object.values(S.props||{}).some(p=>p.date===t.date&&p.amt===t.amt)
              &&!Object.values(S.hits||{}).some(h=>h&&h.date===t.date&&h.amt===t.amt))
    .slice(0,8);
}
/* Attaching by hand is a decision, not a guess, so it writes straight to S.hits
   rather than going back through the proposal queue the person just came from. */
function openAttach(tx){
  if(!tx) return;
  const m=MODEL.find(x=>x.k===NOW); if(!m) return;
  const open=m.rows.filter(r=>!r.info&&!r.off&&r.ruleId!=="cc"&&!r.hit);
  const wrap=document.getElementById("pickWrap");
  document.getElementById("pick").innerHTML=
    `<div class="pt">${tx.desc||"That transaction"}</div>
     <div class="pd">${money(tx.amt)} on ${fmtDate(tx.date)} \u00b7 which line is this?</div>
     ${open.length?`<div class="pickgrid">${open.map((r,i)=>
       `<button data-att="${i}">${r.label}<span class="sub" style="display:block;
         font-size:10px;color:var(--dimmer);font-weight:400">${money(r.amount)}</span></button>`
       ).join("")}</div>`
      :`<div class="hint">Every line this month is already matched.</div>`}
     <button class="pclose" id="pickCancel">Cancel</button>`;
  wrap.classList.add("on");
  document.getElementById("pickCancel").onclick=closePicker;
  wrap.onclick=e=>{ if(e.target===wrap) closePicker(); };
  /* Marking a line paid and deciding what it's WORTH are two questions. A paycheck
     is planned at a round number and lands a few dollars off; a bill is planned at
     the real figure. Attaching used to answer only the first, leaving the column
     showing the guess next to a transaction that says otherwise. Ask, don't assume —
     and only ask when the two actually disagree. */
  const commit=(r,useReal)=>{
    const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
    S.hits=S.hits||{};
    S.hits[r.key]={amt:tx.amt,date:tx.date,desc:tx.desc,was:r.amount,sig};
    if(useReal) S.over[r.key]=tx.amt;      /* the bank is the authority for this one */
    S.payee=S.payee||{};
    const key=normMerchant(tx.desc), list=S.payee[r.ruleId]||[];
    if(key&&!list.includes(key)){ list.push(key); S.payee[r.ruleId]=list; }
    save(); render(); closePicker(); openDrawer("match");
    toast(r.label+" marked paid \u00b7 I'll know that one next month");
  };
  const askAmt=r=>{
    document.getElementById("pick").innerHTML=
      `<div class="pt">${r.label}</div>
       <div class="pd">The line says ${money(r.amount)}. The bank says ${money(tx.amt)}.
         Which one should this month show?</div>
       <div class="pickgrid">
         <button id="attReal">${money(tx.amt)}<span class="sub" style="display:block;
           font-size:10px;color:var(--dimmer);font-weight:400">what actually landed</span></button>
         <button id="attPlan">${money(r.amount)}<span class="sub" style="display:block;
           font-size:10px;color:var(--dimmer);font-weight:400">leave the plan alone</span></button>
       </div>
       <button class="pclose" id="pickCancel">Cancel</button>`;
    document.getElementById("attReal").onclick=()=>commit(r,true);
    document.getElementById("attPlan").onclick=()=>commit(r,false);
    document.getElementById("pickCancel").onclick=closePicker;
  };
  document.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{
    const r=open[+b.dataset.att];
    if(Math.abs(tx.amt-r.amount)>0.005) askAmt(r); else commit(r,false);
  });
}

function matchScore(row,tx,k){
  if((row.amount<0)!==(tx.amt<0)) return 0;             /* money out matches money out */
  const a=Math.abs(row.amount), b=Math.abs(tx.amt);
  if(!a||!b) return 0;
  const off=Math.abs(a-b)/Math.max(a,b);
  if(off>0.6 && Math.abs(a-b)>150) return 0;            /* nowhere near */
  /* A paycheck is never going to read like "Paycheck · 7th" — it reads "DEPOSIT
     BECHTEL GLOBAL", and the amount moves every period, so neither half of the usual
     test can catch it. Once it's been attached by hand the merchant is remembered
     against that rule, and it lands on its own from then on. */
  const taught=(S.payee&&S.payee[row.ruleId]||[]).includes(normMerchant(tx.desc));
  const nm=taught?1:nameScore(row.label,tx.desc);
  const day=Math.min(28,row.day||15);
  const txDay=+String(tx.date).slice(8,10);
  const dd=Math.abs(txDay-day);
  /* ── payday ────────────────────────────────────────────────────────────
     A paycheque is recognised by WHEN it lands, not by what it says or how much
     it is. A fortnightly income line has a computed payday; the deposit turns up
     on it, sometimes a day early for a weekend, and a few days late after a
     holiday. The bank calls it whatever it likes — "Transfer from Checking",
     "DEPOSIT BECHTEL GLOBAL" — and the amount moves every period, so neither the
     name test nor the to-the-cent test below can ever carry it.
     Money in, on a fortnightly line, on its payday is signal enough on its own.
     This produces a PROPOSAL the owner confirms in "Does this look right?", not a
     decision, which is what makes a looser rule safe here.
     The window is asymmetric because payroll moves early for a weekend and late
     for a holiday. The magnitude guard keeps a small deposit that happens to land
     on payday — a dividend, a refund — from being read as the paycheque. */
  if(row.rule&&row.rule.cadence==="biweekly"&&row.amount>0&&tx.amt>0&&off<0.45){
    const drift=txDay-day;                    /* signed: negative is early */
    if(drift>=-2&&drift<=4){
      const near=1-Math.min(Math.abs(drift),5)/5;
      return 0.55 + near*0.25 + (1-Math.min(off,1))*0.15;
    }
  }
  if(dd>12 && nm<0.5) return 0;                          /* wrong end of the month */
  if(nm<0.34 && off>0.03) return 0;                      /* no name, no exact amount */
  /* A bank line rarely reads like the name you gave it — "VCA ANIMAL HOSPITAL" for
     a vet bill, "DIRECT DEP PAYROLL" for a paycheck. To the cent on the right day
     is its own kind of proof, so it carries the match on its own. */
  const exact=off<0.005?0.18:0;
  return nm*0.55 + (1-Math.min(off,1))*0.35 + (1-Math.min(dd,15)/15)*0.10 + exact;
}
/* Fills S.props — proposals, not decisions. Returns true if the list changed. */
function autoMatch(model){
  /* v70 — off. This ran the relationship the other way round: the app guessing
     which planned line a transaction belonged to, and asking to have the guess
     confirmed. Transactions carry themselves now, and the owner assigns them by
     hand in the transaction pane, so a queue of guesses beside that is a second
     opinion nobody asked for. Left standing rather than torn out: it is called
     from one place, it returns false, and nothing downstream notices. */
  return false;
  /* eslint-disable no-unreachable */
  if(!matchPool().length) return false;
  const m=model.find(x=>x.k===NOW);
  if(!m) return false;
  S.hits=S.hits||{}; S.props=S.props||{};
  const taken={}, changed=[];
  /* anything already settled, or already waiting to be confirmed, keeps its row */
  Object.keys(S.hits).forEach(key=>{ const h=S.hits[key]; if(h&&h.sig) taken[h.sig]=1; });
  Object.keys(S.props).forEach(key=>{ const h=S.props[key]; if(h&&h.sig) taken[h.sig]=1; });
  m.rows.forEach(row=>{
    if(row.info||row.off||row.ruleId==="cc") return;      /* the card bill isn't a bank line */
    if(S.hits[row.key]||S.props[row.key]) return;         /* settled, refused, or already asked */
    let best=null, bestS=0;
    matchPool().forEach(tx=>{
      const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
      if(taken[sig]) return;
      if(String(tx.date).slice(0,7)!==NOW) return;
      const sc=matchScore(row,tx,NOW);
      if(sc>bestS){ bestS=sc; best={tx,sig}; }
    });
    if(best&&bestS>=0.5){
      S.props[row.key]={amt:best.tx.amt,date:best.tx.date,desc:best.tx.desc,
                        was:row.amount,sig:best.sig,score:Math.round(bestS*100)};
      taken[best.sig]=1; changed.push(row.key);
    }
  });
  /* drop anything belonging to a month that has rolled by */
  [S.hits,S.props].forEach(store=>Object.keys(store).forEach(key=>{
    const mm=key.split("#")[1];
    if(mm&&/^\d{4}-\d{2}$/.test(mm)&&cmpYM(mm,NOW)<0){ delete store[key]; changed.push(key); }
  }));
  if(changed.length) save();
  return !!changed.length;
}
function unmatch(key){
  S.hits=S.hits||{};
  S.hits[key]={off:1};                 /* remembered, so the matcher won't redo it */
  save(); render(); toast("Back to the predicted amount");
}

const GUESSNAME={card:"a card",bank:"a bank account",asset:"an investment account",loan:"a loan"};

/* ── the review step ─────────────────────────────────
   A match changes what a month is worth, so nothing is applied on the strength of
   a guess. Everything the matcher finds lands in S.props and waits to be looked at.
   Accepting writes it into S.hits; rejecting writes {off:1}, which is remembered so
   the same wrong pairing isn't proposed again tomorrow. */
function propCount(){ return Object.keys(S.props||{}).length; }
function acceptProp(key){
  const p=(S.props||{})[key]; if(!p) return;
  S.hits=S.hits||{}; S.hits[key]=p; delete S.props[key];
  save(); render(); if(propCount()) openDrawer("match"); else { closeDrawer(); toast("All caught up"); }
}
function rejectProp(key){
  const p=(S.props||{})[key]; if(!p) return;
  S.hits=S.hits||{}; S.hits[key]={off:1};
  delete S.props[key];
  save(); render(); if(propCount()) openDrawer("match"); else { closeDrawer(); toast("Left as predicted"); }
}
function acceptAll(){
  S.hits=S.hits||{};
  Object.keys(S.props||{}).forEach(k=>{ S.hits[k]=S.props[k]; });
  S.props={}; save(); render(); closeDrawer(); toast("Applied");
}
function rejectAll(){
  S.hits=S.hits||{};
  Object.keys(S.props||{}).forEach(k=>{ S.hits[k]={off:1}; });
  S.props={}; save(); render(); closeDrawer(); toast("Left as predicted");
}
function matchHTML(){
  const keys=Object.keys(S.props||{});
  /* This used to return early when there was nothing to confirm, which hid the two

  const m=MODEL.find(x=>x.k===NOW)||{rows:[]};
  const labelOf=k=>{ const r=m.rows.find(x=>x.key===k); return r?r.label:k; };
  const rows=keys.map(k=>{

  const m0=MODEL.find(x=>x.k===NOW);
  const late=m0?m0.rows.filter(r=>r.late&&!r.hit):[];
  const lateSum=late.reduce((a,r)=>a+r.amount,0);

  const spare=[];
  return `${keys.length?`<div class="flag"><div class="ft">Straight from your bank</div><div class="fb">

    <div class="crow" style="margin:10px 0 14px">

      <button class="mini" id="propNone">No to all</button></div>`:""}
    ${rows}
    ${!keys.length&&!late.length?`<div class="hint">Every line due so far this month has

    ${late.length?`<div class="flag ${lateSum>0?"bad":""}" style="margin-top:18px">
      <div class="ft">${late.length} line${late.length>1?"s":""} due before today,

      <div class="fb">${late.map(r=>r.label+" "+money(r.amount)).join(" \u00b7 ")}.
        This month opens at your real balance and counts everything that hasn't landed,

    ${spare.length?`<div class="sh" style="margin-top:18px">Didn't look like anything</div>

        t.desc||"—"} · ${fmtDate(t.date)}</span>
        <span>${money(t.amt)}</span></div>`).join("")}`:""}`;
}

/* ── everything that moved through the account ───────
   The card has had a full browser since the beginning; the bank side only ever
   showed up as matches and leftovers. This is the plain list: what went out, what
   came in, and which line each one was filed against. */
function matchedTo(tx){
  const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
  const m=MODEL.find(x=>x.k===NOW)||{rows:[]};
  const lab=key=>{ const r=m.rows.find(x=>x.key===key); return r?r.label:null; };
  let hitKey=null, propKey=null;
  Object.keys(S.hits||{}).forEach(k=>{ const h=S.hits[k]; if(h&&h.sig===sig) hitKey=k; });
  Object.keys(S.props||{}).forEach(k=>{ const h=S.props[k]; if(h&&h.sig===sig) propKey=k; });
  if(hitKey) return {state:"done", label:lab(hitKey)||"a line"};
  if(propKey) return {state:"asking", label:lab(propKey)||"a line"};
  return {state:"none"};
}
function bankHTML(){

            :m.state==="asking"?"confirm?":"no line"}</span></div>`;

  });

}

/* ── one transaction, answered ───────────────────────────────────────────────
   Four questions and nothing answers itself: what is it, is it a transfer, does
   it happen again, and is it the payment on the card. The name sticks to the
   merchant so next month's arrives already named — except on a transfer, which
   is read every time, because the same merchant carries a different intention
   each month and a remembered name would quietly pre-answer that.
   Nothing in here turns into a recurring rule unless it is told to. */
let txCtx=null;
function openTxPane(r,k){

  hideTip();                       /* belt and braces — see the note on FINE */

/* every line in that month a transaction could be sitting against: the things

   and minus the transactions themselves. */
/* Lines a real transaction can be told to stand in for.
   The card bill used to be excluded here, which meant the one transaction that
   most obviously answers a planned line — the payment on the card — was the one
   line you could not point at. It is an info row, so it takes its own branch
   rather than loosening the info filter for everything else. */
function openLines(k){
  const M=MODEL.find(x=>x.k===k); if(!M) return [];
  return M.rows.filter(r=>!r.real&&!r.group&&!r.budget&&(r.ruleId==="cc"||!r.info));

/* Step a real payday forward or back in fortnights until it lands in the month
   the owner asked the line to start in. Biweekly's start IS its anchor, so moving
   the start by hand would otherwise throw away the rhythm the bank showed us. */
function anchorIn(dateStr,targetYM){
  const d=new Date(dateStr+"T12:00:00");
  const at=()=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  let guard=0;
  while(at()<targetYM&&guard++<600) d.setDate(d.getDate()+14);
  while(at()>targetYM&&guard++<600) d.setDate(d.getDate()-14);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
        +"-"+String(d.getDate()).padStart(2,"0");
}
function ruleFromTx(t,cadence,endYM,name,startYM,payoff){
  const k=String(t.date).slice(0,7), day=+String(t.date).slice(8,10)||1;
  const st=(startYM&&/^\d{4}-\d{2}$/.test(startYM))?startYM:k;
  const amt=Number(t.amt)||0, mo=parseYM(st).m;
  const nums=(S.rules||[]).filter(x=>(x.sort||0)<9000).map(x=>x.sort||0);
  const r={id:uid(), name:name||"New line", kind:amt>=0?"income":"expense",
    cadence, day, account:"Main", offbook:false,
    sort:(nums.length?Math.max.apply(null,nums):0)+10,
    start:cadence==="biweekly"?anchorIn(String(t.date),st):st,
    end:endYM||null, payoff:payoff||null, schedule:[{from:st,amount:amt}]};
  if(cadence==="biweekly") r.anchor=r.start;
  if(cadence==="annual") r.months=[mo];
  if(cadence==="quarterly"){ const b=((mo-1)%3)+1; r.months=[b,b+3,b+6,b+9]; }
  S.rules.push(r);
  /* The month it was born in already holds the real thing, so that month's
     occurrence goes straight to it — otherwise the column shows the transaction
     beside a prediction of the very same transaction. Only when the line actually
     starts that month: pushed to a later one, there is no occurrence to hand over
     and the transaction stands alone, which is right. */
  if(cmpYM(st,k)<=0){
    const occ=occDates(r,k), i=occ.indexOf(day);
    if(i>=0){ S.assign=S.assign||{}; S.assign[r.id+"#"+k+"#"+i]=TXSIG(t); }
  }
  return r;
}
function clearAssign(sig){
  S.assign=S.assign||{};

/* Every decision the pane can make, in one place and with no DOM in it, so it
   can be run against synthetic data in Node. The handler below only reads the
   fields and hands them over. */
function applyTx(t,a){
  const sig=TXSIG(t), k=a.k, mer=normMerchant(t.desc);
  const name=String(a.name||"").trim();
  S.tag=S.tag||{}; S.merch=S.merch||{}; S.tmerch=S.tmerch||{};
  S.ccpay=S.ccpay||{}; S.assign=S.assign||{};
  const tag=S.tag[sig]||{};
  tag.transfer=!!a.transfer; tag.ccpay=!!a.card;
  if(name) tag.label=name; else delete tag.label;
  /* A transfer's name is deliberately kept out of the merchant store rather than
     written there and then ignored — so turning the switch off later leaves
     nothing behind still quietly answering for it. */
  if(a.transfer){ S.tmerch[mer]=1; delete S.merch[mer]; }
  else { delete S.tmerch[mer]; if(name) S.merch[mer]=name; }
  if(a.card) S.ccpay[mer]=1; else delete S.ccpay[mer];

  /* Recurring first: making a rule hands itself this month's occurrence, and a
     hand-picked line has to be able to beat that. */
  clearAssign(sig);
  let rule=tag.rule?(S.rules||[]).find(x=>x.id===tag.rule):null;
  let born=null;               /* set only when this call is what made the rule */
  const cad=a.cad||"";
  if(!cad){
    if(rule){ S.rules=S.rules.filter(x=>x.id!==rule.id); delete tag.rule; rule=null; }
  } else if(rule){
    rule.cadence=cad;
    /* the two are alternatives, not both — whichever the switch was showing wins,
       and the other is cleared so a stale one can't quietly end the line early */
    rule.end=a.endM||null; rule.payoff=a.payoff||null;
    if(name) rule.name=name;
    const st=(a.startM&&/^\d{4}-\d{2}$/.test(a.startM))?a.startM:String(t.date).slice(0,7);
    if(cad==="biweekly"){ rule.start=anchorIn(String(t.date),st); rule.anchor=rule.start; }
    else rule.start=st;
    syncFirstStep(rule);
  } else {
    rule=ruleFromTx(t,cad,a.endM,name||txLabel(t),a.startM,a.payoff);
    tag.rule=rule.id;
    born=rule;
  }
  if(a.pick){
    clearAssign(sig);
    S.assign[a.pick]=sig;
    /* It takes the planned line's name — that is the whole point of assigning it.
       Two things were wrong here. The field arrived pre-filled with whatever the
       bank called it, so `name` was never empty and this never ran; and a row's
       label carries its date ("Cleaning · 12th"), which is not a name. Take the
       rule's or the one-off's own name, and treat a name the owner never touched
       as no name at all. */
    const row=openLines(k).find(r=>r.key===a.pick);
    const mine=name&&name!==String(t.desc||"").trim();
    if(row&&!mine){
      const nm=row.rule?row.rule.name:(row.oneoff?row.oneoff.name:row.label);
      if(nm){ tag.label=nm; if(!a.transfer) S.merch[mer]=nm; }
    }
    /* Both at once: sit this against a line you'd typed AND make it repeat. The
       new rule handed itself this month a moment ago and the pick has just taken
       that back, which would leave its own placeholder standing beside the
       transaction it was made from — the same thing twice. One transaction can
       only answer one line, so the rule's own occurrence is skipped for this
       month instead. Every month after it is untouched. */
    if(born){
      const day=+String(t.date).slice(8,10)||1;
      const i=Math.max(0,occDates(born,k).indexOf(day));
      S.skip=S.skip||{}; S.skip[born.id+"#"+k+"#"+i]=1;
    }
    /* v106 — teach the pairing, the way the picker's commit() always has.
       Written both ways: unticking removes the merchant again, or the box
       would be a one-way door with no undo short of Start over. */
    if(row&&row.ruleId&&row.ruleId!=="cc"&&!a.transfer&&mer){
      S.payee=S.payee||{};
      const list=(S.payee[row.ruleId]||[]).filter(x=>x!==mer);
      if(a.teach) list.push(mer);
      if(list.length) S.payee[row.ruleId]=list; else delete S.payee[row.ruleId];
    }
  }
  S.tag[sig]=tag;
  return {tag,rule};
}
function wireTx(){

/* ---------- loans, and accounts that don't connect -----------------------
   A loan contributes one number worth having: the principal you've paid into
   it. That's the original amount minus what you still owe, and both of those
   are facts — no house valuation, no guessing, nothing that goes stale in a
   way you can't see. */
function handAll(){ return (S.meta.hand||[]); }
/* Step a hand-entered loan balance forward from the day it was typed. Only runs
   when a rate and a payment were given; without them the typed figure stands and
   the pane says how old it is. Interest first, then the payment — same order the
   servicer does it. */
function amortFwd(bal,rate,pay,months,extra){
  const r=(Number(rate)||0)/100/12;
  let b=Number(bal)||0;
  const p=(Number(pay)||0)+(Number(extra)||0);
  if(!r||!p) return b;
  for(let i=0;i<months&&b>0;i++){
    /* Carried at full precision and only rounded for display, which is what the
       servicer does — rounding the balance every month drifts a cent inside three
       months and a few dollars over the life of the loan. Checked against a real
       Truist schedule: it matches to the penny for as far as the schedule runs. */
    const nxt=b+b*r-p;
    if(nxt>=b) return b;                 /* payment doesn't cover interest — stop */
    b=nxt;
  }
  return Math.max(0,b);
}
/* Payments land on a day of the month, not every 30 days. Counting calendar
   months from whenever the balance happened to be typed gets it wrong by one
   whenever the typing and the payment fall either side of the 1st — which is
   most of the time, because you check the balance right after it posts. */
function paymentsSince(atISO,payDay){
  if(!atISO) return 0;
  const a=new Date(atISO+"T12:00:00"); if(isNaN(a)) return 0;
  const day=Math.min(28,Math.max(1,Number(payDay)||1));
  const now=new Date();
  let d=new Date(a.getFullYear(),a.getMonth(),day,12);
  if(d<=a) d=new Date(a.getFullYear(),a.getMonth()+1,day,12);
  let n=0;
  while(d<=now&&n<600){ n++; d=new Date(d.getFullYear(),d.getMonth()+1,day,12); }
  return n;
}
function monthsSince(iso){
  if(!iso) return 0;
  const a=new Date(iso+"T12:00:00"), b=new Date();
  if(isNaN(a)) return 0;
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate()) m--;
  return Math.max(0,m);
}
function handLoanBal(e){
  if(!e.rate||!e.pay) return Number(e.bal)||0;
  return amortFwd(e.bal,e.rate,e.pay,paymentsSince(e.at,e.payDay),e.extra);
}
/* The date of the most recent payment that has landed since `at`. Null when
   none has, which is the signal to leave the stored balance alone. */
function lastPayOn(atISO,payDay){
  const n=paymentsSince(atISO,payDay);
  if(!n) return null;
  const a=new Date(atISO+"T12:00:00");
  const day=Math.min(28,Math.max(1,Number(payDay)||1));
  let d=new Date(a.getFullYear(),a.getMonth(),day,12);
  if(d<=a) d=new Date(a.getFullYear(),a.getMonth()+1,day,12);
  return ymdLocal(new Date(d.getFullYear(),d.getMonth()+n-1,day,12));
}
/* Write the new balance in, once per payment date, instead of projecting an
   ever-longer way from one fixed anchor. Same arithmetic either way, but the
   stored figure is then never more than a month old, the pane can say plainly
   when it last moved, and a wrong number is one month of drift rather than
   several years of it.

   The balance is kept at full precision on purpose. Rounding to cents on every
   commit is a fresh rounding error 288 times over, and the servicer doesn't do
   it — it carries the fraction and only rounds what it prints. The edit field
   rounds for display so you never see the tail. */
function rollLoans(){
  let moved=0;
  handAll().forEach(e=>{
    if(e.kind!=="loan"||!e.rate||!e.pay) return;
    const n=paymentsSince(e.at,e.payDay);
    if(!n) return;
    const on=lastPayOn(e.at,e.payDay);
    if(!on) return;
    const nb=amortFwd(e.bal,e.rate,e.pay,n,e.extra);
    /* a short trail, so a figure that looks wrong can be traced back rather
       than argued with */
    e.log=(e.log||[]).concat([{d:on,b:Math.round(nb*100)/100,n:n}]).slice(-12);
    e.bal=nb; e.at=on; e.auto=on;
    moved++;
  });
  /* straight to storage rather than through save() — a background step nobody
     wants sitting on the undo stack */
  if(moved){ S.meta.savedAt=Date.now(); localSave(); schedulePush(); }
  return moved;
}
/* how long since you last put a real figure in, rather than the app carrying
   its own — escrow moves, payments change, and a projection can't see either */
function loanDrift(e){
  if(!e.checked) return null;
  return paymentsSince(e.checked,e.payDay);
}
/* how far the typed figure has been carried, for the pane to own up to */
function handLoanRun(e){
  return (e.rate&&e.pay)?paymentsSince(e.at,e.payDay):0;
}
/* Everything that feeds the Assets figure, connected or typed, in one shape.
   A loan's balance is taken as an absolute value: some institutions send a debt
   back negative and some send it positive, and which one yours does is not worth
   finding out the hard way. */
function assetLines(){
  const out=[];
  (S.meta.acctList||[]).forEach(a=>{
    const id=String(a.id), role=acctRole(id);
    if(role==="asset")
      out.push({id:id,name:a.name||"Account",org:a.org||"",kind:"asset",
                live:true,bal:Number(a.balance)||0});
    else if(role==="loan"){
      const L=(S.meta.loan||{})[id]||{};
      out.push({id:id,name:a.name||"Loan",org:a.org||"",kind:"loan",live:true,
                bal:Math.abs(Number(a.balance)||0),orig:Number(L.orig)||0});
    }
  });
  handAll().forEach(e=>{
    if(e.kind==="loan")
      out.push({id:e.id,name:e.name||"Loan",org:"",kind:"loan",live:false,at:e.at,
                bal:handLoanBal(e),orig:Number(e.orig)||0,
                proj:!!(e.rate&&e.pay),run:handLoanRun(e),extra:Number(e.extra)||0,
                auto:e.auto||"",checked:e.checked||"",drift:loanDrift(e)});
    else
      out.push({id:e.id,name:e.name||"Account",org:"",kind:"asset",live:false,
                at:e.at,bal:Number(e.bal)||0});
  });
  return out;
}
/* principal paid — never negative, and nothing at all until you've said what the
   loan started at, because orig-minus-balance with orig at zero is a large
   confident wrong answer */
function linePaid(l){
  if(l.kind!=="loan"||!l.orig) return null;
  return Math.max(0,l.orig-l.bal);
}
function lineWorth(l){
  return l.kind==="loan"?(linePaid(l)||0):l.bal;
}
function loansCount(){ return S.meta.assetsLoan!==false; }

/* ---------- assets -------------------------------------------------------
   A number you are meant to glance at, not watch. 401k and brokerage balances
   move every day the market is open and none of that daily movement is a
   decision you made, so the reading is taken once a week and then held. Watching
   it tick is the failure mode, not the feature.

   It is deliberately NOT part of the column arithmetic. An asset account feeds
   this figure and nothing else — no transactions, no rows, no effect on the
   month's bottom line. */
function assetAccts(){
  return (S.meta.acctList||[]).filter(a=>{
    const r=acctRole(String(a.id)); return r==="asset"||r==="loan";
  });
}
/* the date of the nth given weekday in a month, and of the last one. 0=Sun. */
function nthDow(y,m,dow,n){
  const first=new Date(y,m-1,1).getDay();
  return 1+((dow-first+7)%7)+(n-1)*7;
}
function lastDow(y,m,dow){
  const len=new Date(y,m,0).getDate();
  return len-((new Date(y,m-1,len).getDay()-dow+7)%7);
}
/* Is this Monday one the US market is shut? Every closure that can land on a
   Monday is computable from the calendar, so there is no table here to go stale
   in 2029: four are defined AS a Monday, and the other four are fixed dates that
   are observed on the Monday after when they fall on a Sunday. Good Friday and
   Thanksgiving can never be a Monday and are left out on purpose. */
function marketHolidayMon(y,m,d){
  const sun=(mo,da)=>new Date(y,mo-1,da).getDay()===0;
  if(m===1&&d===1) return "New Year's Day";
  if(m===1&&d===2&&sun(1,1)) return "New Year's Day";
  if(m===1&&d===nthDow(y,1,1,3)) return "Martin Luther King Jr. Day";
  if(m===2&&d===nthDow(y,2,1,3)) return "Presidents' Day";
  if(m===5&&d===lastDow(y,5,1)) return "Memorial Day";
  if(m===6&&d===19) return "Juneteenth";
  if(m===6&&d===20&&sun(6,19)) return "Juneteenth";
  if(m===7&&d===4) return "Independence Day";
  if(m===7&&d===5&&sun(7,4)) return "Independence Day";
  if(m===9&&d===nthDow(y,9,1,1)) return "Labor Day";
  if(m===12&&d===25) return "Christmas Day";
  if(m===12&&d===26&&sun(12,25)) return "Christmas Day";
  return null;
}
/* The reading day for whatever week `d` falls in: that week's Monday, or the
   Tuesday after it when the market was shut. The point of moving it is that a
   closed market means the balances have not changed — reading them on the
   holiday would burn the week's reading on Friday's numbers. */
function weekRead(d){
  const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  m.setDate(m.getDate()-((m.getDay()+6)%7));        /* back to Monday */
  if(marketHolidayMon(m.getFullYear(),m.getMonth()+1,m.getDate())) m.setDate(m.getDate()+1);
  return m;
}
/* the most recent reading day that has actually arrived */
function assetDue(d){
  const now=d||new Date();
  let r=weekRead(now);
  if(ymdLocal(r)>ymdLocal(now)){                    /* this week's hasn't come yet */
    const back=new Date(now); back.setDate(back.getDate()-7);
    r=weekRead(back);
  }
  return ymdLocal(r);
}
/* and the next one, which is what the hover promises */
function assetNext(d){
  const now=d||new Date();
  let r=weekRead(now);
  if(ymdLocal(r)<=ymdLocal(now)){
    const fwd=new Date(now); fwd.setDate(fwd.getDate()+7);
    r=weekRead(fwd);
  }
  return r;
}
/* Take the week's reading, once. Guarded on the age of the balances themselves:
   the reading day arriving is not the same as fresh numbers arriving, and
   stamping Friday's figures as Monday's would freeze a stale total for a whole
   week. If the card hasn't been checked yet, last week's reading stands — which
   is the honest answer, because it hasn't updated. */
function assetSnap(){
  const due=assetDue();
  const cur=S.meta.assets;
  if(cur&&cur.day===due) return cur;
  const lines=assetLines();
  if(!lines.length) return cur||null;
  /* The freshness gate only applies to accounts the bridge fetches. A typed
     balance is as fresh as the day it was typed and doesn't wait on a pull —
     otherwise someone with no SimpleFIN link would never get a reading at all. */
  if(lines.some(l=>l.live)){
    const at=Number(S.meta.acctListAt)||0;
    if(!at||ymdLocal(new Date(at))<due) return cur||null;
  }
  const per=lines.map(l=>({id:l.id,name:l.name,org:l.org||"",kind:l.kind,live:!!l.live,
                           balance:l.bal,orig:l.orig||0,paid:linePaid(l),
                           proj:!!l.proj,run:l.run||0,extra:l.extra||0,at:l.at||"",
                           auto:l.auto||"",checked:l.checked||"",drift:l.drift}));
  const inc=loansCount();
  S.meta.assets={day:due,at:Date.now(),per:per,incLoan:inc,
                 total:per.reduce((s,x)=>s+(x.kind==="loan"
                   ?(inc?(x.paid||0):0):x.balance),0)};
  /* written straight rather than through save(), which would put a weekly
     background reading on the undo stack for no one to ever want back */
  S.meta.savedAt=Date.now(); localSave(); schedulePush();
  return S.meta.assets;
}
/* Flipping whether loans count re-totals the reading in place rather than
   waiting for next Monday — the balances haven't changed, only what you asked
   to be shown. */
/* Correcting a figure must show immediately. Waiting until Monday to reflect a
   number you just fixed reads as the app ignoring you. The reading day is left
   alone — this is the same week's reading, taken again off better numbers. */
function reReadAssets(){
  const lines=assetLines();
  if(!lines.length) return;
  const day=(S.meta.assets&&S.meta.assets.day)||assetDue();
  const inc=loansCount();
  const per=lines.map(l=>({id:l.id,name:l.name,org:l.org||"",kind:l.kind,live:!!l.live,
                           balance:l.bal,orig:l.orig||0,paid:linePaid(l),
                           proj:!!l.proj,run:l.run||0,extra:l.extra||0,at:l.at||"",
                           auto:l.auto||"",checked:l.checked||"",drift:l.drift}));
  S.meta.assets={day:day,at:Date.now(),per:per,incLoan:inc,
                 total:per.reduce((s,x)=>s+(x.kind==="loan"
                   ?(inc?(x.paid||0):0):x.balance),0)};
}
function retotalAssets(){
  const a=S.meta.assets; if(!a||!a.per) return;
  const inc=loansCount();
  a.incLoan=inc;
  a.total=a.per.reduce((s,x)=>s+(x.kind==="loan"?(inc?(x.paid||0):0):x.balance),0);
}
function paintAssets(){
  const el=document.getElementById("btnAssets");
  if(!el) return;
  if(!assetLines().length){ el.hidden=true; return; }
  const snap=assetSnap();
  el.hidden=false;
  el.innerHTML=`<span class="al">Assets</span><span class="av">${
    snap?money(snap.total):"\u2014"}</span>`;
}
function assetTip(){
  const n=assetNext(), tue=n.getDay()===2;
  let why="";
  if(tue){
    const m=new Date(n); m.setDate(m.getDate()-1);
    const h=marketHolidayMon(m.getFullYear(),m.getMonth()+1,m.getDate());
    if(h) why=" \u2014 the market is shut Monday for "+h;
  }
  const snap=S.meta.assets;
  let h=`<div class="tt">Assets</div>
    <div class="td">updates next ${tue?"Tuesday":"Monday"}, ${fmtDate(ymdLocal(n))}${why}</div>`;
  if(snap&&snap.day)
    h+=`<div class="tr"><span>This reading</span><b>${fmtDate(snap.day)}</b></div>
        <div class="tr"><span>Accounts</span><b>${snap.per.length}</b></div>`;
  h+=`<div class="note">Click for each account on its own.</div>`;
  return h;
}
/* The "started at" figure for a loan the bridge fetches has nowhere else to be
   typed — a connected account has a balance but no history. This used to sit in
   the Assets pane; from v88 it sits under Sync with everything else. Hand-entered
   loans are not here: handHTML() already edits those, and two forms writing the
   same record is how they end up disagreeing. */
function liveLoanHTML(){
  const live=(S.meta.acctList||[]).filter(a=>acctRole(String(a.id))==="loan");
  if(!live.length) return "";
  let h=`<div class="sh" style="margin-top:14px">Loans off the account</div>
    <div class="hint">The bridge sends what's owed. Say what it started at and the
      difference is the principal you've paid in.</div>`;
  live.forEach(a=>{
    const id=String(a.id), L=(S.meta.loan||{})[id]||{};
    h+=`<div class="handbox" data-lid="${id}">
      <div class="handhead"><b>${esc(a.name||"Loan")}</b>
        <span class="gn">off the account \u00b7 ${money(Math.abs(Number(a.balance)||0))} owed</span></div>
      <div class="fg"><div class="f"><label>Started at</label>
        <input class="lOrig" inputmode="decimal" value="${L.orig||""}" placeholder="455000"></div></div>
      <div class="crow"><button class="mini lSave">Save</button></div></div>`;
  });
  return h;
}
function wireSMS(){
  const num=document.getElementById("smsNum");
  const box=document.getElementById("smsOK");
  const add=document.getElementById("smsAdd");
  if(add) add.onclick=()=>{
    /* Both conditions, and the box is never ticked for them. Refusing out loud
       beats saving something that will never receive anything. */
    if(!box||!box.checked) return toast("Tick the box first — that's the bit that counts");
    const e=smsNorm(num&&num.value);
    if(!e) return toast("That doesn't look like a US mobile number");
    smsAdd(e); render(); openDrawer("sync");
    toast("Added — texts start once the carrier review clears");
  };
  document.querySelectorAll("[data-sms] .smsDel").forEach(b=>{
    b.onclick=()=>{
      const n=b.closest("[data-sms]").dataset.sms;
      if(!confirm("Stop sending the nightly text to "+smsPretty(n)+"?")) return;
      smsDel(n); render(); openDrawer("sync"); toast("Stopped");
    };
  });
}
function wireLiveLoan(){
  const num=v=>{ const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; };
  document.querySelectorAll("[data-lid]").forEach(box=>{
    const b=box.querySelector(".lSave"); if(!b) return;
    b.onclick=()=>{
      S.meta.loan=S.meta.loan||{};
      S.meta.loan[box.dataset.lid]={orig:num(box.querySelector(".lOrig").value)};
      reReadAssets(); save(); render(); openDrawer("sync"); toast("Saved");
    };
  });
}
function wireAssets(){
  /* The two buttons that lived here — "I need to change something" and the
     counted-in-the-total toggle — were removed in v88. Loans are always counted;
     the flag is healed below for anyone whose saved state still has it off. */

  /* v94 — a second belt for the same bug fixed in wireAcct. The Assets figure is
     a snapshot, and one taken before the account list was last refreshed is
     describing a set of accounts that may no longer be the ones on the token.
     Opening the pane is the moment somebody is actually looking at the number,
     so it is the moment to rebuild it rather than show them a stale one. Guarded
     on the two timestamps so it fires once and cannot loop. */
  const snap=S.meta.assets;
  if(snap&&S.meta.acctListAt&&(!snap.at||snap.at<S.meta.acctListAt)){
    reReadAssets(); save(); render(); openDrawer("assets"); return;
  }
  if(S.meta.assetsLoan===false){
    S.meta.assetsLoan=true;
    retotalAssets(); save(); render(); openDrawer("assets");
  }
}
function assetsHTML(){
  const snap=S.meta.assets, live=assetLines();
  if(!snap||!snap.per||!snap.per.length){
    return `<div class="hint">No reading yet.${live.length
      ?" The accounts are tagged \u2014 the first number lands on the next reading day, "
        +fmtDate(ymdLocal(assetNext()))+"."
      :" Mark an account as an Asset under Sync, then check the card once."}</div>`;
  }
  const all=snap.per.slice();
  /* v88 — a loan is an ordinary row now. It used to sit in its own card below the
     assets with all three figures shown and two buttons under it. What it started
     at and what is still owed are edited under Sync, where every other account
     setting already lives, so the pane no longer carries an editor of its own. */
  const worth=r=>r.kind==="loan"
    ?((r.paid===null||r.paid===undefined)?-1:r.paid)
    :r.balance;
  const rows=all.slice().sort((a,b)=>worth(b)-worth(a));
  const n=assetNext(), tue=n.getDay()===2;
  let h=`<div class="assetsum"><span class="al">Assets</span>
      <span class="av">${money(snap.total)}</span></div>
    <div class="sh">Read ${fmtDate(snap.day)} \u00b7 next ${tue?"Tuesday":"Monday"} ${fmtDate(ymdLocal(n))}</div>`;
  if(rows.length)
    h+=`<div class="card">`+rows.map(r=>{
      if(r.kind!=="loan")
        return `<div class="assetrow"><span class="an">${esc(r.name)}${
          r.org||!r.live?`<span class="ao">${esc(r.org||"")}${
            r.org&&!r.live?" \u00b7 ":""}${!r.live?"typed in":""}</span>`:""}</span>
          <span class="ab">${money(r.balance)}</span></div>`;
      /* no original amount means no answer, not a large confident wrong one */
      if(r.paid===null||r.paid===undefined)
        return `<div class="assetrow"><span class="an">${esc(r.name)}
          <span class="ao">needs what it started at \u2014 set it under Sync</span></span>
          <span class="ab dim">\u2014</span></div>`;
      /* The drift warning stays. Escrow changes, payment changes and
         principal-only payments are all invisible to the projection, and this is
         the only place that says so. */
      return `<div class="assetrow"><span class="an">${esc(r.name)}
          <span class="ao">principal accumulated so far</span></span>
          <span class="ab">${money(r.paid)}</span></div>`
        + (r.drift!==null&&r.drift!==undefined&&r.drift>=6
            ? `<div class="loandet"><span class="warn">${r.drift} payments since you last
               checked it against the servicer \u2014 worth a look, escrow and payment
               changes are invisible to this.</span></div>`
            : "");
    }).join("")+`</div>`;
  /* Anything tagged since the reading is shown but not counted, because the
     total on the header is the reading and the two must not disagree. */
  const late=live.filter(a=>!all.some(r=>r.id===String(a.id)));
  if(late.length)
    h+=`<div class="hint">${late.length===1?"One account was":late.length+" accounts were"}
      tagged after this reading \u2014 ${late.map(a=>esc(a.name)).join(", ")}.
      ${late.length===1?"It joins":"They join"} the total on ${fmtDate(ymdLocal(n))}.</div>`;
  h+=`<div class="hint">These feed this number and nothing else. No transactions,
      no rows in the month, no effect on the budget.</div>`;
  return h;
}

   Sits at the bottom of Sync because it belongs with the other plumbing, and

function wireHand(){
  const num=v=>{ const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; };
  document.querySelectorAll(".handbox").forEach(box=>{
    const id=box.dataset.id;
    const grab=c=>box.querySelector("."+c);
    const sv=grab("hSave"); if(sv) sv.onclick=()=>{
      const e=handAll().find(x=>x.id===id); if(!e) return;
      e.name=(grab("hName").value||"").trim();
      const wasB=Number(e.bal)||0, newB=num(grab("hBal").value);
      if(Math.round(newB*100)!==Math.round(wasB*100)){
        e.bal=newB; e.checked=ymdLocal(new Date()); e.auto=""; e.log=[];
      }
      if(e.kind==="loan"){
        e.orig=num(grab("hOrig").value);
        e.rate=num(grab("hRate").value);
        e.pay=num(grab("hPay").value);
        e.extra=num(grab("hExtra").value);
        e.payDay=Math.min(28,Math.max(1,num(grab("hDay").value)||1));
      }
      /* restamp: the figure is only as fresh as the moment it was entered, and
         the projection counts months from here */
      e.at=ymdLocal(new Date());
      reReadAssets(); save(); render(); openDrawer("sync"); toast("Saved");
    };
    const dl=grab("hDel"); if(dl) dl.onclick=()=>{
      S.meta.hand=handAll().filter(x=>x.id!==id);
      save(); render(); openDrawer("sync"); toast("Removed");
    };
  });
  const add=kind=>{
    S.meta.hand=handAll().concat([{id:"h"+Date.now().toString(36),kind:kind,
      name:"",bal:0,orig:0,rate:0,pay:0,extra:0,payDay:1,at:ymdLocal(new Date())}]);
    save(); openDrawer("sync");
  };
  const a=document.getElementById("hAddA"); if(a) a.onclick=()=>add("asset");
  const l=document.getElementById("hAddL"); if(l) l.onclick=()=>add("loan");
}

/* ---------- drawer ---------- */
const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
function openDrawer(w){
  const titles={rec:"Recurring items",ins:"Check-up",feed:"Feed me info",
                sync:"Sync across devices",budget:"Budget adjustment",adv:"Advanced",
                match:"Not seen on the account",bank:"Account activity",assets:"Assets",

    w==="budget"?budgetHTML():w==="adv"?advHTML():w==="match"?matchHTML():w==="bank"?bankHTML():
    w==="line"?lineHTML():w==="tx"?txHTML():w==="add"?addHTML():
    w==="assets"?assetsHTML():
    w==="sync"?syncHTML():w==="card"?(
      nav.cat?catHTML():nav.month?monthHTML():cardHTML()):insHTML();
  if(w==="rec") wireRec();
  else if(w==="budget") wireBudget(); else if(w==="adv") wireAdv();
  else if(w==="match") wireMatch();
  else if(w==="feed") wireFeed(); else if(w==="sync") wireSync();
  else if(w==="card") wireCard();
  else if(w==="tx") wireTx();
  else if(w==="add") wireAdd();
  else if(w==="line") wireLine();
  else if(w==="assets") wireAssets();
  else wireIns();

/* anything in here with a click handler of its own can be reached and fired from
   the keyboard. `el.onclick` is truthy only where the code assigned one, which is
   how every clickable row in these panels is wired. */
function tabifyDrawer(){
  const db=document.getElementById("dbody"); if(!db) return;
  db.querySelectorAll("*").forEach(el=>{
    if(!el.onclick) return;
    if(el.matches("button,input,select,textarea,label,a")) return;
    el.tabIndex=0; el.setAttribute("role","button");
  });
}
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("on"); }

function wireRec(){
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.r,r=S.rules.find(x=>x.id===id);
    card.querySelector(".chead").onclick=()=>card.classList.toggle("open");
    const g=f=>card.querySelector(`[data-f="${f}"]`);
    g("indef").onchange=e=>{const ee=g("end");ee.disabled=e.target.checked;if(e.target.checked)ee.value="";};
    /* Which field sits beside "Every" is decided when the card is drawn: a day of the
       month for monthly, an exact date for biweekly. Cadence was only read on Apply,
       so switching a new rule to biweekly left "Day of month" on screen and there was
       nowhere to put the date — Apply then found no anchor field and saved nothing.
       Redraw on change, carrying the two fields most likely to be half-typed. */
    g("cadence").onchange=()=>{
      r.name=g("name").value.trim()||r.name;
      r.kind=g("kind").value;
      r.cadence=g("cadence").value;
      save(); openDrawer("rec");
      const c=document.querySelector(`[data-r="${id}"]`); if(c) c.classList.add("open");
    };
    card.querySelector("[data-more]").onclick=ev=>{
      ev.preventDefault(); card.querySelector(".more").classList.toggle("open"); };
    card.querySelector("[data-addstep]").onclick=()=>{
      /* a change dated at the very end of the plan is no use to anyone. Put it a
         month past the last one there is, which is where the next change goes. */
      const last=r.schedule[r.schedule.length-1];
      r.schedule.push({from:nextMonth(last?last.from:(S.meta.recordsFrom||S.meta.start)),
                       amount:last?last.amount:0});
      save(); openDrawer("rec"); document.querySelector(`[data-r="${id}"]`).classList.add("open");
    };
    card.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
      r.schedule.splice(+b.dataset.rm,1); save(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open");
    });
    card.querySelector("[data-dup]").onclick=()=>{
      /* a fresh id, and a deep copy of the schedule — sharing the array meant editing
         one person's amounts moved the other's too */
      const copy=JSON.parse(JSON.stringify(r));
      copy.id=uid(); copy.name=r.name+" copy"; copy.sort=r.sort+1;
      S.rules.push(copy); S.rules.sort((a,b)=>a.sort-b.sort);
      save(); render(); openDrawer("rec");
      toast("Copied — rename it and set its own date and amount");
    };
    card.querySelector("[data-del]").onclick=()=>{
      if(!confirm(`Delete "${r.name}" from every month?`)) return;
      S.rules=S.rules.filter(x=>x.id!==id); save(); render(); openDrawer("rec"); toast("Deleted");
    };
    card.querySelector("[data-apply]").onclick=()=>{
      r.name=g("name").value.trim()||r.name;
      r.kind=g("kind").value;
      r.cadence=g("cadence").value;
      if(g("day")) r.day=+g("day").value||1;
      /* Biweekly used to carry a separate "any payday you know" beside the cadence,
         which sat next to a Starts date meaning almost the same thing. There is one
         date now: Starts. It is normalised to a full date on the way in, because
         occDatesRaw() feeds the anchor to `new Date()` and "2026-01T12:00:00" is not
         valid ISO 8601. V8 parses it leniently anyway; JavaScriptCore historically
         does not, and an Invalid Date there yields no occurrences at all — a bug
         that would appear only on the phone. Normalising costs nothing either way. */
      if(r.cadence==="biweekly") r.anchor=dateVal(r.start,"first");
      if(g("months")) r.months=g("months").value.split(",").map(n=>+n.trim()).filter(n=>n>=1&&n<=12);
      r.start=g("start").value.trim()||r.start;
      r.end=g("indef").checked?null:(g("end").value.trim()||null);
      r.manual=g("manual").checked;
      r.account=g("account").value;
      r.offbook=g("offbook").checked;
      r.cap=parseFloat(g("cap").value)||null;
      r.payoff=parseFloat(g("payoff").value)||null;
      card.querySelectorAll('[data-s="from"]').forEach(i=>{r.schedule[+i.dataset.i].from=i.value.trim();});
      card.querySelectorAll('[data-s="amount"]').forEach(i=>{
        const v=signed(i.value,r.kind==="income"?1:-1); r.schedule[+i.dataset.i].amount=v===null?0:v;});
      r.schedule.sort((a,b)=>cmpYM(a.from,b.from));
      syncFirstStep(r);          /* the opening amount follows the start date */
      save(); render(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open"); toast("Updated");
    };
  });
  document.getElementById("addRule").onclick=()=>{
    const n=prompt("Name it"); if(!n) return;
    const mx=Math.max(...S.rules.filter(x=>x.sort<9000).map(x=>x.sort));
    /* a brand new rule starts where the records do, not where the plan's first
       column sits — those differ now that there's a wall */
    const st0=S.meta.recordsFrom||S.meta.start;
    S.rules.push({id:uid(),name:n,kind:"expense",cadence:"monthly",day:1,start:st0,end:null,
                  sort:mx+10,schedule:[{from:st0,amount:0}]});
    S.rules.sort((a,b)=>a.sort-b.sort);
    save(); render(); openDrawer("rec");
    const nc=document.querySelector(`[data-r="${S.rules[S.rules.length-1].id}"]`);
    if(nc) nc.classList.add("open");        /* open it so there is something to type into */
    toast("Added — fill it in, then Apply");
  };
  const bind=(el,fn)=>{el.onchange=()=>{fn(el.value);save();render();};};
  bind(document.getElementById("mTitle"),v=>{ S.meta.title=v.trim()||"Household Budget"; });
  document.querySelectorAll("[data-acct]").forEach(i=>{
    i.onchange=()=>{ const k=i.dataset.acct, v=i.value.trim();
      if(v) S.accountNames[k]=v; else delete S.accountNames[k];
      save(); render(); openDrawer("rec"); };
  });
  bind(document.getElementById("mOpen"),v=>S.meta.opening=parseFloat(v)||0);
  bind(document.getElementById("mRF"),v=>{if(/^\d{4}-\d{2}$/.test(v))S.meta.recordsFrom=v;});
  bind(document.getElementById("mBuf"),v=>S.meta.buffer=parseFloat(v)||0);
  bind(document.getElementById("mCC"), v=>S.meta.ccTarget=parseFloat(v)||5000);
  bind(document.getElementById("mEnd"),v=>{if(/^\d{4}-\d{2}$/.test(v))S.meta.end=v;});
}

let feedBatch=null;
async function readOne(f){
  const isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
  if(!isPdf) return await f.text();
  const txt=await extractPdfText(await f.arrayBuffer());
  if(!txt||txt.length<40) throw new Error("scanned image — no text to read");
  return txt;
}
/* drop in as many statements as you like; each one files itself by its due date */
async function ingestFiles(files){
  const list=[...files];
  if(!list.length){ pill('<b class="warn">no files came through</b>'); return; }
  feedBatch=[]; pill(`Reading ${list.length} statement${list.length>1?"s":""}…`,true);
  for(const f of list){
    const row={name:f.name};
    try{
      const res=parseStatement(await readOne(f));
      if(res.error||!res.rows.length) throw new Error(res.error||"no charges found");
      let m=res.dates&&res.dates.month, guessed=false;
      if(!m){ m=feedMonth||NOW; guessed=true; }        /* CSVs often carry no due date */
      if(!monthList().includes(m)) throw new Error("falls outside the plan ("+m+")");
      row.guessed=guessed;
      row.month=m; row.count=res.rows.length;
      row.total=res.rows.reduce((a,r)=>a+r.amt,0);
      row.due=(res.dates&&res.dates.newBalance)||row.total;
      row.replaced=!!(S.stmts[m]&&S.stmts[m].rows&&S.stmts[m].rows.length);
      S.stmts[m]=res;                       /* filed straight away */
      row.ok=true;
    }catch(e){ row.ok=false; row.why=e.message; }
    feedBatch.push(row);
  }
  feedBatch.sort((a,b)=>(a.month||"").localeCompare(b.month||""));
  const good=feedBatch.filter(r=>r.ok);
  if(good.length){ feedMonth=good[good.length-1].month; save(); render(); }
  openDrawer("feed");
  pill(`Filed <b class="ok">${good.length} of ${feedBatch.length}</b>`);
}

  const auto=res.dates&&res.dates.month;
  if(auto&&monthList().includes(auto)) feedMonth=auto;
