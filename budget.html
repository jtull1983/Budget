<style>
:root{
  --bg:#0a0f13; --panel:#16232a; --panel2:#1d2f37; --panel3:#243c46;
  --line:#33474f; --line2:#48626c;
  --txt:#f7fdfe; --dim:#cfe2e7; --dimmer:#a9c1c9;
  --teal:#6ff0dd; --cyan:#8fe3f8; --amber:#ffc873; --red:#ff9077; --violet:#c8bcff;
  --col:190px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button,input,select,a,.row,.ytab,.btn,.mini{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
/* iOS zooms any field under 16px on focus — so on touch, don't go under 16px */
@media(pointer:coarse){
  input,select,textarea{font-size:16px !important}
  .f input,.f select,.step input,.step select,.amtin{font-size:16px !important}
  .amtin{width:88px}
}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-track{background:#0b1216}
::-webkit-scrollbar{height:13px;width:13px}
::-webkit-scrollbar-thumb{background:#6fe0cf;border-radius:7px;border:3px solid #0b1216}
::-webkit-scrollbar-thumb:hover{background:#9df3e6}
*{scrollbar-color:#6fe0cf #0b1216;scrollbar-width:auto}

.top{position:sticky;top:0;z-index:60;background:linear-gradient(#0d1418,#0a0f13);
  border-bottom:1px solid var(--line);padding:12px 16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:11px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.brand h1{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 12px;font-size:12px;letter-spacing:.16em}
.menubtn .car{font-style:normal;font-size:10px;transition:.18s;color:var(--dimmer)}
.menubtn.open .car{transform:rotate(180deg);color:var(--teal)}
.menubtn.open{color:var(--teal);border-color:var(--teal);background:#11262a}
.menupanel{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;
  padding-top:4px;border-top:1px solid var(--line)}
.menupanel.open{display:grid}
.menupanel .btn{width:100%;text-align:center;padding:11px 8px;font-size:11.5px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:linear-gradient(#0a0f13,#070b0e);border-top:1px solid var(--line2);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 26px rgba(0,0,0,.55)}
.bottombar .stats{overflow-x:auto;flex-wrap:nowrap;gap:22px;-webkit-overflow-scrolling:touch}
.bottombar .stat{flex:none}
.statuspill{position:fixed;left:50%;transform:translateX(-50%) translateY(-24px);
  top:calc(10px + env(safe-area-inset-top,0px));z-index:210;
  background:#12242a;border:1px solid var(--line2);border-radius:20px;
  padding:7px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);opacity:0;pointer-events:none;transition:.28s}
.statuspill.show{opacity:1;transform:translateX(-50%)}
.statuspill b{font-weight:700}
.swipehint{display:none;justify-content:center;gap:10px;align-items:center;
  padding:8px 0 96px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.swipehint button{border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
  border-radius:4px;padding:7px 15px;font-size:15px;line-height:1}
.swipehint button:disabled{opacity:.3}
@media(max-width:1100px){ .swipehint{display:flex} }
@media(min-width:1101px){ .scroller{padding-bottom:92px} }
@media(max-width:760px){
  .top{padding:12px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .brand h1{font-size:12px}
  .stats{gap:14px}
  .stats .v{font-size:17px}
  .row .lbl{font-size:13.5px}
  .row .amt{font-size:14px}
  .mfoot .v{font-size:21px}
}
.statuspill .ok{color:var(--teal)} .statuspill .busy{color:var(--cyan)}
.statuspill .err{color:var(--red)} .statuspill .warn{color:var(--amber)}
.years{display:flex;gap:5px;align-items:stretch}
.ytab{border:1px solid var(--line2);background:var(--panel);color:var(--dim);
  padding:8px 15px;border-radius:4px;font-size:13.5px;font-weight:700;letter-spacing:.1em;transition:.14s}
.ytab:hover{color:var(--txt);border-color:#47757a}
.ytab.on{background:#15353a;color:var(--teal);border-color:var(--teal);font-weight:600}

.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);font-weight:600}
.stat .v{font-size:15px;font-weight:600}
.v.teal{color:var(--teal)} .v.amber{color:var(--amber)} .v.red{color:var(--red)} .v.cyan{color:var(--cyan)}

.scroller{overflow:hidden;padding:0 0 6px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rail{display:flex;align-items:stretch;width:100%}
.mcol{position:relative;flex:1 1 0;min-width:0;border-right:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column}
.mcol.past{background:#0d151a}
.mcol.now{background:#241f0c;box-shadow:inset 0 0 0 1px var(--amber)}
.mcol:last-child{border-right:none}

/* fixed-height header so every month lines up exactly */
.mhead{position:sticky;top:0;z-index:20;height:74px;padding:10px 11px;
  background:linear-gradient(#1a272d,#141e23);border-bottom:1px solid var(--line2);
  display:flex;flex-direction:column;justify-content:space-between}
.mcol.now .mhead{background:linear-gradient(#3a2f0e,#282108);border-bottom-color:#7a6320}
.mname{height:19px;line-height:19px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.mcol.past .mname{color:var(--dim)}
.tag{height:17px;line-height:15px;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:0 6px;
  border-radius:2px;text-transform:uppercase;flex:none;display:inline-flex;align-items:center}
.tag.three{background:#3a2c14;color:var(--amber);border:1px solid #6b5325}
.tag.now{background:#4a3b10;color:#ffd98a;border:1px solid #977a24}
.onhand{display:flex;justify-content:space-between;align-items:baseline;height:22px}
.onhand .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.onhand .v{font-size:17px;font-weight:700;color:var(--cyan)}
.mcol.now .onhand .v{color:#ffd98a}
.mcol.now .row:hover{background:#33290f}

.rows{flex:1;padding:4px 0 2px}
.row{display:flex;align-items:center;gap:6px;padding:5px 11px;min-height:27px;position:relative}
.row:hover{background:#1b2a31}
.row .lbl{flex:1;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.inc .lbl{color:#e2f2f4}
.row .amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:text;
  padding:1px 3px;border-radius:2px;border:1px solid transparent}
.row .amt:hover{border-color:var(--line2);background:#0e171c}
.row.inc .amt{color:var(--teal)}
.row.exp .amt{color:#ffb8a4}
.row .amt.man{color:var(--amber)}
.row .amt.ovr{border-bottom:1px dotted #6d8d96}
.row .kill{position:absolute;right:1px;top:50%;transform:translateY(-50%);opacity:0;color:var(--dimmer);font-size:13px;line-height:1;padding:0 2px;border-radius:2px;background:var(--panel2)}
.row:hover .kill{opacity:1}
.row .kill:hover{color:var(--red)}
.row .dot{width:4px;height:4px;border-radius:50%;flex:none;background:#3e545e}
.row.oneoff .dot{background:var(--violet)}
.row.manual .dot{background:var(--amber)}
.row.cc{border-top:1px solid var(--line);margin-top:3px;padding-top:5px}
.amtin{width:84px;font-weight:700;background:#0c1418;border:1px solid var(--teal);border-radius:2px;
  padding:1px 3px;font-size:11.5px;text-align:right;outline:none;font-variant-numeric:tabular-nums}

.addrow{padding:5px 7px 8px}
.mcol.blank{opacity:.55}
.nodata{padding:26px 12px;text-align:center;color:var(--dimmer);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;line-height:1.7}
.nodata .nd2{font-size:9.5px;letter-spacing:.06em;opacity:.75;text-transform:none}
.addbtn{width:100%;border:1px dashed #2e424b;color:var(--dimmer);border-radius:4px;padding:8px;
  font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.addbtn:hover{border-color:#4a6f79;color:var(--teal)}

.mfoot{position:sticky;bottom:0;z-index:15;padding:10px 11px;border-top:1px solid var(--line2);
  background:linear-gradient(#16232a,#101a1f)}
.mfoot .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.mfoot .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.mfoot .v.ok{color:var(--teal)} .mfoot .v.low{color:var(--amber)} .mfoot .v.neg{color:var(--red)}
.mfoot .delta{font-size:9.5px;color:var(--dimmer);font-variant-numeric:tabular-nums}

#tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .1s;
  background:#111c21;border:1px solid var(--line2);border-radius:6px;padding:10px 12px;
  min-width:216px;max-width:290px;max-height:78vh;overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.8)}
@media(max-width:760px){
  #tip{max-width:none;min-width:0;padding:12px 14px;border-color:var(--teal);
       box-shadow:0 -6px 40px rgba(0,0,0,.9)}
  #tip .tr{font-size:12px;padding:3px 0}
  #tip .tt{font-size:12px}
}
#tip.show{opacity:1}
#tip .tt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);margin-bottom:2px}
#tip .td{font-size:10px;color:var(--dimmer);margin-bottom:8px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-size:11px;padding:2px 0;color:var(--dim)}
#tip .tr b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
#tip .bar{height:4px;background:#26343b;border-radius:2px;margin:7px 0 3px;overflow:hidden}
#tip .bar i{display:block;height:100%;background:var(--teal)}
#tip .bar i.over{background:var(--red)}
#tip .note{font-size:10px;color:var(--amber);margin-top:7px;line-height:1.5}
#tip .hr{height:1px;background:var(--line);margin:7px 0}

.drawer{position:fixed;top:0;right:0;bottom:0;padding-top:env(safe-area-inset-top);width:520px;max-width:94vw;z-index:120;
  background:#0c1418;border-left:1px solid var(--line2);transform:translateX(102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgba(0,0,0,.65)}
.drawer.open{transform:none}
.dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dhead h2{margin:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;flex:1}
.dbody{flex:1;overflow-y:auto;padding:14px 18px 60px}
.card{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;background:var(--panel)}
.chead{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer}
.chead:hover{background:var(--panel2)}
.chead .nm{flex:1;font-size:12px;color:var(--txt)}
.chead .am{font-size:11.5px;font-variant-numeric:tabular-nums}
.chead .cad{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);
  border:1px solid var(--line2);padding:2px 5px;border-radius:2px}
.chead .car{color:var(--dimmer);font-size:10px;transition:.15s}
.card.open .chead .car{transform:rotate(90deg);color:var(--teal)}
.cbody{display:none;padding:4px 11px 12px;border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.fg{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.f{flex:1;min-width:96px}
.f label{display:block;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);margin-bottom:3px}
.f input,.f select{width:100%;background:#0c1418;border:1px solid var(--line2);border-radius:3px;
  padding:5px 7px;font-size:11.5px;outline:none}
.f input:focus,.f select:focus{border-color:var(--teal)}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:8px;cursor:pointer}
.chk input{accent-color:var(--teal)}
.steps{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.steps .sh{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);margin-bottom:5px}
.step{display:flex;gap:7px;align-items:center;margin-bottom:5px}
.step input{background:#0c1418;border:1px solid var(--line2);border-radius:3px;padding:4px 6px;font-size:11px;outline:none}
.step .x{color:var(--dimmer);font-size:13px}.step .x:hover{color:var(--red)}
.mini{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border:1px dashed var(--line2);border-radius:3px;padding:4px 8px}
.mini:hover{color:var(--teal);border-color:#4a6f79}
.crow{display:flex;gap:8px;margin-top:11px;align-items:center}
.del{color:var(--dimmer);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
.del:hover{color:var(--red)}
.hint{font-size:10.5px;color:var(--dim);line-height:1.6;margin:2px 0 14px}

.flag{border:1px solid var(--line2);border-left:2px solid var(--amber);border-radius:3px;
  padding:10px 12px;margin-bottom:9px;background:var(--panel)}
.flag.bad{border-left-color:var(--red)}
.flag.good{border-left-color:var(--teal)}
.flag .ft{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);margin-bottom:4px}
.flag .fb{font-size:11px;color:var(--dim);line-height:1.6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* off-book: shown for context, not deducted */
.row.info .lbl,.row.info .amt{color:var(--dimmer);font-style:italic}
.row.info .dot{background:var(--dimmer)}
.mfoot .infon{font-size:10px;font-weight:600;color:var(--dimmer);letter-spacing:.06em;margin-top:2px}
.row.off .lbl{color:var(--violet);opacity:.92}
.row.off .amt{color:var(--violet);opacity:.92;font-style:italic}
.row.off .dot{background:var(--violet)}
.tag.clean{background:#2f2447;color:var(--violet);border:1px solid #574a86}
.mfoot .obk{font-size:10px;font-weight:600;color:var(--violet);letter-spacing:.06em;margin-top:2px}


/* pop + slide-left when jumping years */
@keyframes shiftIn{
  0%{opacity:0;transform:translateX(46px) scale(1.05)}
  55%{opacity:1;transform:translateX(-6px) scale(1.02)}
  100%{opacity:1;transform:none}
}
/* rows spill down into place for a neighbouring year */
@keyframes spillIn{
  0%{opacity:0;transform:translateY(-13px)}
  70%{opacity:1;transform:translateY(2px)}
  100%{opacity:1;transform:none}
}
@keyframes popCol{
  0%{transform:none}40%{transform:translateY(-7px) scale(1.03)}100%{transform:none}
}
@keyframes tabPop{
  0%{transform:none}18%{transform:translateY(-6px) scale(1.13)}
  55%{transform:translateY(1px) scale(.99)}100%{transform:none}
}
.ytab.pop{animation:tabPop .46s cubic-bezier(.34,1.5,.5,1) both}
.ytab.arrow{padding:6px 8px;color:var(--dim);font-size:13px;line-height:1}
@keyframes nowPulse{
  0%{box-shadow:inset 0 0 0 1px var(--amber), 0 0 0 0 rgba(255,200,115,.55)}
  50%{box-shadow:inset 0 0 0 2px #ffe1a3, 0 0 26px 5px rgba(255,200,115,.34)}
  100%{box-shadow:inset 0 0 0 1px var(--amber), 0 0 0 0 rgba(255,200,115,0)}
}

<script>
/* ── baked state ──────────────────────────────────────────────
   "Save as app" rewrites the line below with your current numbers,
   so the file you put on a shared drive IS your budget. ───────── */
const BAKED=null; /*BAKED*/
const BOOT_HTML="<!DOCTYPE html>\n"+document.documentElement.outerHTML;

const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const uid=()=>Math.random().toString(36).slice(2,9);
const ym=(y,m)=>y+"-"+String(m).padStart(2,"0");
const parseYM=s=>({y:+s.slice(0,4),m:+s.slice(5,7)});
const cmpYM=(a,b)=>a<b?-1:a>b?1:0;
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
const money0=n=>(n<0?"-":"+")+"$"+Math.abs(Math.round(n)).toLocaleString();
const ordinal=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");

function defaultState(){
 const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
 return {
  meta:{start:ym(y,m), end:ym(y+5,12), opening:0, buffer:0, title:"Household Budget"},
  rules:[
   {id:"pay", name:"Paychecks", kind:"income", cadence:"biweekly",
    anchor:new Date().toISOString().slice(0,10), start:ym(y,m), end:null, sort:10,
    schedule:[{from:ym(y,m),amount:0}]},
   {id:"cc", name:"Credit card", kind:"expense", cadence:"monthly", day:28,
    start:ym(y,m), end:null, manual:true, sort:9999,
    schedule:[{from:ym(y,m),amount:0}]}
  ],
  over:{}, skip:{}, accountNames:{},
  bonus:{name:"Yearly bonus", years:{}},
  balancers:{}, stmts:{}, learned:{}, oneoffs:[]
 };
}

function pickState(){
  const stored=load(), ts=o=>(o&&o.meta&&o.meta.savedAt)||0;
  /* a freshly baked file must beat stale storage on this device, and
     your later edits here must beat the older baked copy */
  if(BAKED&&ts(BAKED)>=ts(stored)) return BAKED;
  if(stored) return stored;
  return BAKED||defaultState();
}
let S = pickState();
migrate(S);
const ACCT_KEYS=["Main","A","B","C","Other"];
const ACCT_FALLBACK={Main:"Main account",A:"Account A",B:"Account B",C:"Account C",Other:"Other account"};
/* an older save may use a name as the key — show it as-is rather than storing names here */
const acctLabel=a=>(S.accountNames&&S.accountNames[a])||ACCT_FALLBACK[a]||a||"Main account";
const acctList=()=>{
  const keys=ACCT_KEYS.slice();
  const add=k=>{ if(k&&!keys.includes(k)) keys.push(k); };
  Object.keys(S.accountNames||{}).forEach(add);
  (S.rules||[]).forEach(r=>add(r.account));      // keys your own data already uses
  return keys.map(k=>[k,acctLabel(k)]);
};
function migrate(s){
  s.meta.buffer=s.meta.buffer??4000;
  s.bonus=s.bonus||{name:"Mami's Big Ass Yearly Bonus",years:{}};
  s.balancers=s.balancers||{};
  s.accountNames=s.accountNames||{};
  s.meta.title=s.meta.title||"Household Budget";
  /* show the whole calendar year, but remember which months predate any records */
  if(!s.meta.recordsFrom) s.meta.recordsFrom=s.meta.start;
  const st=parseYM(s.meta.start);
  if(st.m>1) s.meta.start=ym(st.y,1);
  s.stmts=s.stmts||{};
  s.learned=s.learned||{};
  s.rules.forEach((r,i)=>{
    r.schedule=r.schedule||[{from:r.start,amount:0}];
    r.sort=r.sort??(i*10); r.kind=r.kind||"expense";
    r.account=r.account||"Main"; r.offbook=!!r.offbook;
  });
  /* rolling five-year forecast: always run five years past the current one */
  const want=ym(new Date().getFullYear()+5,12);
  if(cmpYM(s.meta.end,want)<0) s.meta.end=want;
}
function localSave(){ try{ localStorage.setItem("budget_state_v8",JSON.stringify(S)); }catch(e){} }
function save(){
  S.meta.savedAt=Date.now();
  localSave(); stampSaved();
  if(typeof schedulePush==="function") schedulePush();
}
function stampSaved(){}
function load(){ try{
  const r=localStorage.getItem("budget_state_v8")||localStorage.getItem("tull_budget_v7");
  return r?JSON.parse(r):null;
}catch(e){ return null; } }

/* ---------- engine ---------- */
function monthList(){
  const a=parseYM(S.meta.start), b=parseYM(S.meta.end), out=[];
  let y=a.y,m=a.m;
  while(y<b.y||(y===b.y&&m<=b.m)){ out.push(ym(y,m)); m++; if(m>12){m=1;y++;} }
  return out;
}
function amountAt(rule,k){ let v=0; for(const s of rule.schedule) if(cmpYM(s.from,k)<=0) v=s.amount; return v; }
function inWindow(rule,k){
  if(rule.start&&cmpYM(k,rule.start)<0) return false;
  if(rule.end&&cmpYM(k,rule.end)>0) return false;
  return true;
}
function occDates(rule,k){
  const {y,m}=parseYM(k), last=new Date(y,m,0).getDate();
  if(rule.cadence==="biweekly"){
    const out=[]; const d=new Date(rule.anchor+"T12:00:00"); if(isNaN(d)) return [];
    const first=new Date(y,m-1,1,12);
    while(d>=first) d.setDate(d.getDate()-14);
    while(d<first)  d.setDate(d.getDate()+14);
    while(d.getFullYear()===y&&d.getMonth()+1===m){ out.push(d.getDate()); d.setDate(d.getDate()+14); }
    return out;
  }
  if(rule.cadence==="quarterly"||rule.cadence==="annual"){
    const mo=rule.months||[1,4,7,10];
    return mo.includes(m)?[Math.min(rule.day||1,last)]:[];
  }
  if(rule.cadence==="semimonthly") return [Math.min(rule.day||1,last),last];
  return [Math.min(rule.day||1,last)];
}
let _pcache={},_pstamp=0;
function payoffMap(rule){
  const tag=rule.id+"|"+_pstamp; if(_pcache[tag]) return _pcache[tag];
  const map={}; let bal=rule.payoff;
  for(const mk of monthList()){
    if(!inWindow(rule,mk)) continue;
    const dates=occDates(rule,mk);
    for(let i=0;i<dates.length;i++){
      const key=rule.id+"#"+mk+"#"+i;
      if(S.skip[key]) continue;
      if(bal<=0){ map[key]={left:0,applied:false,amount:0}; continue; }
      let amt=key in S.over?S.over[key]:amountAt(rule,mk);
      if(Math.abs(amt)>bal) amt=-bal;
      bal+=amt; if(bal<0) bal=0;
      map[key]={left:bal,applied:true,amount:amt};
    }
  }
  _pcache[tag]=map; return map;
}
function payoffLeft(rule,k){
  if(!rule.payoff) return null;
  const map=payoffMap(rule); let last=rule.payoff;
  for(const key in map) if(key.split("#")[1]===k) last=map[key].left;
  return last;
}
function payoffDone(rule){
  const map=payoffMap(rule);
  for(const key in map) if(map[key].applied&&map[key].left<=0) return key.split("#")[1];
  return null;
}
function build(){
  _pstamp++; _pcache={};
  const out=[]; let onhand=S.meta.opening;
  for(const k of monthList()){
    const rows=[];
    for(const r of S.rules){
      if(!inWindow(r,k)) continue;
      const dates=occDates(r,k);
      dates.forEach((day,i)=>{
        const key=r.id+"#"+k+"#"+i;
        if(S.skip[key]) return;
        const ovr=key in S.over;
        let amt=ovr?S.over[key]:amountAt(r,k);
        if(r.payoff){ const pe=payoffMap(r)[key]; if(!pe||!pe.applied) return; amt=pe.amount; }
        let label=r.name;
        if(r.cadence==="biweekly")
          label = r.kind==="income"
            ? (dates.length>1?["Paycheck","Paycheck 2","Paycheck 3"][i]:"Paycheck")+" · "+ordinal(day)
            : r.name+" · "+ordinal(day);
        else if(r.manual) label=r.name+" · "+ordinal(day);
        rows.push({key,ruleId:r.id,rule:r,label,day,amount:amt,ovr,manual:!!r.manual,
                   off:!!r.offbook,account:r.account||"Main",
                   sort:r.sort,kind:amt>=0?"inc":"exp"});
      });
    }
    /* a statement can predate the budget — show it for reference, never in the maths */
    if(S.meta.recordsFrom && cmpYM(k,S.meta.recordsFrom)<0){
      const st=S.stmts&&S.stmts[k];
      if(st&&st.rows&&st.rows.length){
        const due=(st.dates&&st.dates.newBalance)||st.rows.reduce((a,r)=>a+r.amt,0);
        rows.push({key:"info#"+k, ruleId:"cc", info:true, off:true, manual:true,
                   label:"Credit card · "+ordinal(28), day:28, sort:9999,
                   amount:-up10(due), kind:"exp", account:"Main"});
      }
    }
    const by=S.bonus&&S.bonus.years[parseYM(k).y];
    if(by&&by.amount&&by.month===parseYM(k).m)
      rows.push({key:"bonus#"+k,bonus:true,label:S.bonus.name,day:by.day||15,
                 amount:Math.abs(by.amount),sort:15,kind:"inc",off:false,account:"Main"});
    for(const o of S.oneoffs) if(o.ym===k)
      rows.push({key:"one#"+o.id,oneoff:o,label:o.name,day:o.day||99,amount:o.amount,
                 sort:500,kind:o.amount>=0?"inc":"exp",odd:o.odd,off:false,account:"Main"});
    rows.sort((a,b)=> a.sort-b.sort || a.day-b.day);
    let net=rows.filter(r=>!r.off&&!r.info).reduce((s,r)=>s+r.amount,0);
    const tgt=S.balancers?S.balancers[k]:undefined;
    if(tgt!==undefined){
      const amt=tgt-(onhand+net);
      rows.push({key:"bal#"+k,balancer:true,target:tgt,label:"Balancer",day:98,sort:600,
                 amount:amt,kind:amt>=0?"inc":"exp",off:false,account:"Main"});
      rows.sort((a,b)=> a.sort-b.sort || a.day-b.day);
      net+=amt;
    }
    const offTot=rows.filter(r=>r.off&&!r.info).reduce((s,r)=>s+r.amount,0);
    const infoTot=rows.filter(r=>r.info).reduce((s,r)=>s+r.amount,0);
    const end=onhand+net;
    out.push({k,onhand,rows,net,end,offTot,infoTot,
      noData: S.meta.recordsFrom ? cmpYM(k,S.meta.recordsFrom)<0 : false,
      payCount:rows.filter(r=>r.ruleId==="pay").length,
      cleanCount:rows.filter(r=>r.ruleId==="cleaner").length});
    onhand=end;
  }
  return out;
}


/* ============================================================
   STATEMENT READER — parse a card export, tag it, remember corrections
   ============================================================ */
const CATS=["Dining","Delivery apps","Groceries","Gas & auto","Travel","Shopping","Bills & utilities",
            "Health","Personal care","Kids","Home","Subscriptions","Pets","Fees & interest","Other"];
const CATCOLOR={"Dining":"#ffc873","Delivery apps":"#ff8fb0","Groceries":"#6ff0dd","Gas & auto":"#8fe3f8","Travel":"#c8bcff",
  "Shopping":"#ff9077","Bills & utilities":"#9ad6a0","Health":"#f2a3c7","Kids":"#ffd98a",
  "Personal care":"#ff9ecb","Home":"#a0c4ff","Subscriptions":"#d6b3ff","Pets":"#8fd9b6","Fees & interest":"#ff7a61","Other":"#a9c1c9"};

/* keyword -> category. Rough on purpose; corrections below make it yours. */
const RULES=[
 /* third-party delivery apps first: the merchant string usually also names a restaurant */
 [/doordash|\bdd ?\*|grubhub|seamless|uber ?eats|ubereats|postmates|caviar|gopuff|drizly|waitr|slice ?app|chownow/i,"Delivery apps"],
 [/starbucks|dunkin|coffee|cafe|chipotle|mcdonald|panera|pizza|taco|grill|restaurant|\bbar\b|brewery|sushi|bakery|deli|diner|kitchen|bistro|tavern|\bpub\b|taproom|steakhouse|creamery|juice|smoothie|wingstop|\btst\*|\bsq ?\*|\bsp \b|chopt|qdoba|auntie anne|cheesecake|seasons 52|kpot|mezeh|thai express|pisco|paris baguette|yogitopi|musubi|cheese steak|fooderie|eatsprout|burger king|market@work|vending|handmade ice|tacombi|chick[- ]?fil|shake shack|five guys|popeyes|wendy|subway sand|jersey mike|sweetgreen|\bcava\b/i,"Dining"],
 [/safeway|giant|whole foods|trader joe|wegmans|aldi|kroger|harris teeter|publix|costco|sam.s club|bj.s wholesale|grocer|supermarket|food lion|lidl|instacart|\bgiant \d|balducci|grosvenor market|meridian market|streets market/i,"Groceries"],
 [/shell|exxon|chevron|\bbp\b|sunoco|wawa|citgo|marathon|speedway|\bgas\b|fuel|parking|toll|e[- ]?zpass|autozone|jiffy lube|midas|firestone|discount tire|car wash|exxon|\bezpass|sheehy|usaa|geico|progressive|state farm|dmv|\buber\b|lyft/i,"Gas & auto"],
 [/airline|delta|united air|american air|southwest|jetblue|alaska air|hotel|lodge|resort|inn\b|marriott|hilton|hyatt|airbnb|vrbo|expedia|booking\.com|priceline|amtrak|rental car|hertz|avis|enterprise rent/i,"Travel"],
 [/amazon|amzn|\btarget\b|walmart|best buy|home goods|tj ?maxx|marshalls|nordstrom|\bmacy.?s\b|kohl|old navy|\bgap\b|nike|adidas|etsy|ebay|bloomingdale|primark|fabletics|wayfair|ikea|lululemon|\brei\b|dick.s sporting/i,"Shopping"],
 [/pepco|verizon|comcast|xfinity|t-?mobile|at&?t|electric|water|\bgas\b (company|bill)|washington gas|internet|wssc|utility|phone/i,"Bills & utilities"],
 [/cvs|walgreens|rite aid|pharmacy|dental|dentist|doctor|medical|clinic|hospital|optical|vision|labcorp|quest diag|urgent care|therapy|health/i,"Health"],
 [/salon|nail bar|barber|\bspa\b|hair\b|waxing|lash|brow bar|massage|musely/i,"Personal care"],
 [/daycare|preschool|\bschool\b|tuition|childcare|toys|carter|children|pediatric|kindercare|goddard/i,"Kids"],
 [/home depot|lowe.s|ace hardware|hardware|plumb|hvac|electrician|landscap|lawn|roof|paint|furniture|cleaning serv|handyman|contractor/i,"Home"],
 [/netflix|spotify|hulu|disney\+|apple\.com\/bill|amazon prime|apple music|icloud|youtube|prime video|hbo|\bmax\b|patreon|substack|adobe|microsoft 365|google storage|chatgpt|openai|anthropic|claude|dropbox|gym|planet fitness|equinox|orangetheory|peloton/i,"Subscriptions"],
 [/\bvet\b|veterinar|chewy|petco|petsmart|pet supplies|boarding|groom/i,"Pets"],
 [/interest charge|late fee|annual fee|finance charge|foreign transaction|cash advance|overdraft/i,"Fees & interest"]
];
/* money you sent the card is not spending; a refund is negative spending and must come off */
function isCardPayment(d){
  return /payment (thank|received)|autopay|auto ?pay|online payment|^payment$|thank you|pymt|payment - thank/i.test(d);
}
/* issuers disagree on sign. Decide using real transactions only — a single huge
   autopay row would otherwise flip the whole statement upside down. */
function normalizeSigns(rows){
  const real=rows.filter(r=>!isCardPayment(r.desc));
  const negs=real.filter(r=>r.amt<0).length;
  if(negs>real.length/2) rows.forEach(r=>r.amt=-r.amt);
  return rows;
}
function normMerchant(desc){
  return String(desc).toLowerCase()
    .replace(/\d{4,}/g," ").replace(/[^a-z& ]/g," ")
    .replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
}
function categorize(desc){
  const key=normMerchant(desc);
  if(S.learned[key]) return {cat:S.learned[key],learned:true};
  for(const [re,c] of RULES) if(re.test(desc)) return {cat:c,learned:false};
  return {cat:"Other",learned:false};
}
/* split a CSV line, respecting quotes */
function splitLine(line,delim){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===delim&&!q){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out.map(v=>v.trim().replace(/^"|"$/g,""));
}
function parseStatement(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {rows:[],error:"That file came through empty."};
  const delimited=lines.filter(l=>/[,\t]/.test(l)).length > lines.length*0.6;
  if(!delimited){
    const ft=parseFreeText(text);
    if(ft.length){
      normalizeSigns(ft);
      const rows=ft.filter(r=>!isCardPayment(r.desc))
                   .map(r=>({...r,cat:categorize(r.desc).cat}));
      return {rows,total:rows.reduce((s,r)=>s+r.amt,0),
              credits:rows.filter(r=>r.amt<0).reduce((s,r)=>s+r.amt,0),
              dates:readStatementDates(text)};
    }
  }
  const delim=(lines[0].match(/\t/g)||[]).length>(lines[0].match(/,/g)||[]).length?"\t":",";
  let head=splitLine(lines[0],delim).map(h=>h.toLowerCase());
  const find=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  let iDate=find("transaction date","post date","date"),
      iDesc=find("description","merchant","payee","name","details"),
      iAmt =find("amount","debit","charge"),
      iCat =find("category","type");
  let start=1;
  if(iDesc<0||iAmt<0){ iDate=0; iDesc=1; iAmt=2; iCat=-1; start=0; }   // headerless
  const raw=[];
  for(let i=start;i<lines.length;i++){
    const f=splitLine(lines[i],delim);
    if(f.length<2) continue;
    const desc=(f[iDesc]||"").trim();
    let amt=parseFloat(String(f[iAmt]||"").replace(/[$,()\s]/g,""))||0;
    if(/^\(.*\)$/.test(String(f[iAmt]||"").trim())) amt=-Math.abs(amt);
    if(!desc||!amt) continue;
    raw.push({date:(f[iDate]||"").trim(),desc,amt,srcCat:iCat>=0?(f[iCat]||"").trim():""});
  }
  if(!raw.length){
    const ft=parseFreeText(text);
    if(!ft.length) return {rows:[],error:"Couldn't find any transactions in that file."};
    raw.push(...ft);
  }
  normalizeSigns(raw);
  const rows=raw.filter(r=>!isCardPayment(r.desc))
    .map(r=>({...r,cat:categorize(r.desc).cat}));
  const credits=rows.filter(r=>r.amt<0).reduce((s,r)=>s+r.amt,0);
  return {rows,credits,total:rows.reduce((s,r)=>s+r.amt,0),dates:readStatementDates(text)};
}

/* ---- PDF: pull the text out natively, no libraries ---- */
async function inflateBytes(bytes){
  let e=bytes.length;
  while(e>0&&(bytes[e-1]===10||bytes[e-1]===13||bytes[e-1]===32)) e--;  // trailing EOL breaks it
  const trimmed=bytes.slice(0,e);
  for(const fmt of ["deflate","deflate-raw"]){
    try{
      const buf=await new Response(new Blob([trimmed]).stream()
        .pipeThrough(new DecompressionStream(fmt))).arrayBuffer();
      return new Uint8Array(buf);
    }catch(err){}
  }
  return null;
}
function latin1(u8){ let s="",C=8192;
  for(let i=0;i<u8.length;i+=C) s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));
  return s; }
function decodeTextOps(cs){
  let out="",m;
  const unesc=t=>t.replace(/\\([nrtbf()\\])/g,(a,c)=>({n:"\n",r:"",t:"\t",b:"",f:"","(":"(",")":")","\\":"\\"}[c]))
                  .replace(/\\([0-7]{1,3})/g,(a,o)=>String.fromCharCode(parseInt(o,8)));
  const re=/\[((?:[^\[\]\\]|\\.)*)\]\s*TJ|\(((?:[^()\\]|\\.)*)\)\s*Tj|(T\*|Td|TD)/g;
  while((m=re.exec(cs))){
    if(m[1]!==undefined){
      let s="",mm,r=/\((?:[^()\\]|\\.)*\)|(-?\d+(?:\.\d+)?)/g;
      while((mm=r.exec(m[1]))){
        if(mm[0][0]==="(") s+=unesc(mm[0].slice(1,-1));
        else if(parseFloat(mm[1])<-180) s+=" ";      // wide kern = a real space
      }
      out+=s;
    } else if(m[2]!==undefined) out+=unesc(m[2]);

  }

}
function ascii85(u8){
  const out=[]; let t=0,n=0,i=0;
  if(u8[0]===0x3c&&u8[1]===0x7e) i=2;                 // leading <~
  for(;i<u8.length;i++){
    const c=u8[i];
    if(c===0x7e) break;                                // ~> ends it
    if(c<=32||c===0) continue;                         // whitespace
    if(c===0x7a&&n===0){ out.push(0,0,0,0); continue; }// z = four zero bytes
    if(c<0x21||c>0x75) continue;
    t=t*85+(c-33); n++;
    if(n===5){ for(let k=3;k>=0;k--) out.push((t>>>(k*8))&255); t=0; n=0; }
  }
  if(n>0){ for(let k=n;k<5;k++) t=t*85+84;
    for(let k=3;k>=5-n;k--) out.push((t>>>(k*8))&255); }
  return new Uint8Array(out);
}
function asciiHex(u8){
  const out=[]; let hi=-1;
  for(let i=0;i<u8.length;i++){
    const c=String.fromCharCode(u8[i]);
    if(c===">") break;
    if(!/[0-9a-fA-F]/.test(c)) continue;
    if(hi<0) hi=parseInt(c,16); else { out.push(hi*16+parseInt(c,16)); hi=-1; }
  }
  if(hi>=0) out.push(hi*16);
  return new Uint8Array(out);
}
/* pair every endstream with the stream token that really opens it —
   the word "stream" also shows up inside text, so require a dictionary before it */
function findStreams(raw){
  const out=[]; let pos=0;
  while(true){
    const e=raw.indexOf("endstream",pos); if(e<0) break;
    let s=raw.lastIndexOf("stream",e-1);
    while(s>0&&raw.slice(s-3,s)==="end") s=raw.lastIndexOf("stream",s-1);
    if(s>0){
      let p=s-1; while(p>0&&/[\r\n\s]/.test(raw[p])) p--;
      if(raw.slice(p-1,p+1)===">>"){
        let st=s+6; if(raw[st]==="\r") st++; if(raw[st]==="\n") st++;
        out.push({start:st,end:e,head:raw.slice(Math.max(0,s-600),s)});
      }
    }
    pos=e+9;
  }
  return out;
}
async function extractPdfText(arrayBuf){
  const u8=new Uint8Array(arrayBuf), raw=latin1(u8);
  let text="";
  for(const {start,end,head} of findStreams(raw)){
    let chunk=u8.slice(start,end);
    const fm=head.match(/\/Filter\s*(\[[^\]]*\]|\/\w+)/);
    const filters=fm?(fm[1].match(/\/\w+/g)||[]):[];
    let ok=true;
    for(const f of filters){                        // filters apply in order
      if(f==="/ASCII85Decode") chunk=ascii85(chunk);
      else if(f==="/ASCIIHexDecode") chunk=asciiHex(chunk);
      else if(f==="/FlateDecode"){
        const inf=await inflateBytes(chunk);
        if(!inf){ ok=false; break; }
        chunk=inf;
      } else if(f==="/DCTDecode"||f==="/JPXDecode"||f==="/CCITTFaxDecode"){ ok=false; break; }
    }
    if(!ok) continue;
    const cs=latin1(chunk);
    if(/Tj|TJ/.test(cs)) text+=decodeTextOps(cs)+"\n";
  }
  return text.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}

/* ---- free text (a PDF or a paste) rather than neat columns ---- */
const RE_DATE=/^\s*(?:\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s*\d{4})?)\s*$/i;
const RE_AMT=/^\s*-?\s*\$?\s*-?[\d,]+\.\d{2}\s*-?\s*$/;
const RE_SKIP=/^(total|subtotal|balance|previous|new balance|minimum|credit line|available|trans date|post date|description|amount|payments|transactions|fees|interest)/i;

/* PDFs put each cell on its own line: date / post date / description / amount */
function parseVertical(lines){
  const rows=[]; let i=0;
  while(i<lines.length){
    if(!RE_DATE.test(lines[i])){ i++; continue; }
    let j=i+1, two=false;
    if(j<lines.length&&RE_DATE.test(lines[j])){ j++; two=true; }   // post date
    const desc=[];
    while(j<lines.length&&desc.length<3&&!RE_AMT.test(lines[j])&&!RE_DATE.test(lines[j])){
      const t=lines[j].trim();
      if(t) desc.push(t);
      j++;
    }
    if(j<lines.length&&RE_AMT.test(lines[j])&&desc.length){
      const a=lines[j].trim();
      let amt=parseFloat(a.replace(/[^0-9.]/g,""));
      if(/^-/.test(a)||/-\s*$/.test(a)) amt=-amt;
      const d=desc.join(" ").replace(/\s+/g," ").trim();
      if(d&&isFinite(amt)&&amt!==0&&!RE_SKIP.test(d))
        rows.push({date:lines[i].trim(),desc:d,amt,srcCat:"",two});
      i=j+1; continue;
    }
    i++;
  }
  /* real transaction rows carry a trans date AND a post date; the summary
     boxes on page 1 only have one, so this drops them cleanly */
  const paired=rows.filter(r=>r.two);
  return paired.length>=5 ? paired : rows;
}
/* …and a plain statement keeps the whole row on one line */
function parseInline(text){
  const rows=[];
  const line=/^\s*(\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?)\s+(?:\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?\s+)?(.{3,}?)\s+\$?(-?[\d,]+\.\d{2})(-?)\s*$/;
  for(let l of text.split(/\r?\n/)){
    l=l.trim(); if(!l) continue;
    const m=l.match(line); if(!m) continue;
    let amt=parseFloat(m[3].replace(/,/g,""));
    if(m[4]==="-") amt=-amt;
    const desc=m[2].trim();
    if(!desc||!isFinite(amt)||amt===0||RE_SKIP.test(desc)) continue;
    rows.push({date:m[1],desc,amt,srcCat:""});
  }
  return rows;
}
function parseFreeText(text){
  const lines=text.split(/\r?\n/);
  const v=parseVertical(lines), h=parseInline(text);
  return v.length>=h.length ? v : h;      // whichever shape actually fit
}
/* A statement's charges are paid the following month — file it under the
   month the payment actually leaves the account, not the month you spent it. */
const MONTH_RE=/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:,\s*|\s+)(\d{4})/i;
const MIDX=m=>["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"]
  .indexOf(m.slice(0,3).toLowerCase())+1;
function readStatementDates(text){
  const flat=text.replace(/\s+/g," ");
  const out={};
  /* billing cycle: "Jul 04, 2026 - Aug 03, 2026" */
  const cyc=flat.match(new RegExp(MONTH_RE.source+"\\s*[-–—to]{1,3}\\s*"+MONTH_RE.source,"i"));
  if(cyc){
    out.from=ym(+cyc[3],MIDX(cyc[1]))+"-"+String(cyc[2]).padStart(2,"0");
    out.to  =ym(+cyc[6],MIDX(cyc[4]))+"-"+String(cyc[5]).padStart(2,"0");
  }
  /* due date — the label and the date sit on different lines in a PDF */
  const i=flat.search(/payment due date/i);
  if(i>=0){
    const near=flat.slice(i,i+160).replace(/payment due date/i,"");
    const d=near.match(MONTH_RE);
    if(d) out.due=ym(+d[3],MIDX(d[1]))+"-"+String(d[2]).padStart(2,"0");
  }
  /* the amount AutoPay debits — not the same as the month's spending when a
     balance carried over or an extra payment was made */
  const nb=flat.match(/new balance\s*=?\s*\$\s*([\d,]+\.\d{2})/i);
  if(nb) out.newBalance=parseFloat(nb[1].replace(/,/g,""));
  const mp=flat.match(/minimum payment due\s*\$\s*([\d,]+\.\d{2})/i);
  if(mp) out.minPayment=parseFloat(mp[1].replace(/,/g,""));
  /* the month to file it under: when it's paid, else the month after the cycle ends */
  if(out.due) out.month=out.due.slice(0,7);
  else if(out.to){
    const t=parseYM(out.to.slice(0,7));
    out.month = t.m===12 ? ym(t.y+1,1) : ym(t.y,t.m+1);
  }
  return out;
}
const prettyDate=d=>d?MN[parseYM(d).m-1]+" "+(+d.slice(8,10)):"";

function stmtBreakdown(k){
  const st=S.stmts[k]; if(!st||!st.rows||!st.rows.length) return null;
  const by={};
  st.rows.forEach(r=>{ by[r.cat]=(by[r.cat]||0)+r.amt; });
  const list=Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]);
  const charges=st.rows.filter(r=>r.amt>0);
  const credits=st.rows.filter(r=>r.amt<0).reduce((s,r)=>s+r.amt,0);
  return {list, total:st.rows.reduce((s,r)=>s+r.amt,0),
          charged:charges.reduce((s,r)=>s+r.amt,0), credits,
          count:charges.length, refunds:st.rows.length-charges.length};
}

function yearsAvail(){ return [...new Set(monthList().map(k=>parseYM(k).y))]; }

/* the further out you look, the greener it gets — you're saving */
function lerpHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const A=p(a),B=p(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function greenShift(){
  const ys=yearsAvail(), i=Math.max(0,ys.indexOf(YEAR)), t=ys.length>1?i/(ys.length-1):0;
  const r=document.documentElement.style;
  r.setProperty("--bg",     lerpHex("#0a0f13","#0b2116",t));
  r.setProperty("--panel",  lerpHex("#16232a","#173322",t));
  r.setProperty("--panel2", lerpHex("#1d2f37","#1e422c",t));
  r.setProperty("--line",   lerpHex("#33474f","#2f5a3f",t));
  r.setProperty("--line2",  lerpHex("#48626c","#437a56",t));
  return t;
}

let winStart=0, autoFollow=false, firstPaint=true;
function pickAnim(prev,next){
  if(prev===null||prev===next) return "anim-spill";
  return Math.abs(next-prev)>=2 ? "anim-shift" : "anim-spill";
}
let viewIndex=0;
function perView(){
  const w=innerWidth;
  if(w<=760) return 2;          /* phone: this month and next */
  if(w<=1100) return 3;         /* tablet */
  return 12;                     /* desktop: the whole year */
}
function yearBounds(){
  const first=MODEL.findIndex(m=>parseYM(m.k).y===YEAR);
  if(first<0) return [0,Math.max(0,MODEL.length-perView())];
  let last=first;
  while(last+1<MODEL.length&&parseYM(MODEL[last+1].k).y===YEAR) last++;
  return [first, Math.max(first,last-perView()+1)];
}
function clampView(){
  const [lo,hi]=yearBounds();
  viewIndex=Math.min(Math.max(lo,viewIndex),hi);
}
function shiftView(n){
  const before=viewIndex;
  viewIndex+=n; clampView();
  if(viewIndex!==before) render("anim-spill");
}

        <div class="onhand"><span class="k">On hand</span><span class="v">${money(M.onhand)}</span></div>
      </div>

/* sign lock: money out stays money out unless you lead with + */
function signed(raw,anchor){
  const s=String(raw).trim();
  const v=Math.abs(parseFloat(s.replace(/[^0-9.]/g,"")));
  if(isNaN(v)) return null;
  if(s[0]==="+") return v;
  if(s[0]==="-") return -v;
  return anchor>=0?v:-v;
}
function editAmt(span,r,k){
  if(r.info){ feedMonth=k; openDrawer("feed"); return; }
  if(r.bonus){ openDrawer("bonus"); return; }
  if(r.balancer){
    const v=prompt("What should the next month start with?",r.target);
    if(v!==null){ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
      if(!isNaN(n)){ S.balancers[k]=n; save(); render(); toast("Balancer set"); } }
    return;
  }
  const anchor = r.oneoff ? (r.oneoff.amount||-1)
               : (r.rule.kind==="income"?1:-1);
  const inp=document.createElement("input"); inp.className="amtin";
  inp.value=Math.abs(r.amount); span.replaceWith(inp); inp.focus(); inp.select();
  const done=ok=>{
    if(ok){
      const v=signed(inp.value,anchor);
      if(v!==null){
        if(r.oneoff) r.oneoff.amount=v;
        else if(v===amountAt(r.rule,k)) delete S.over[r.key];
        else S.over[r.key]=v;
        save();
      }
    }
    render();
  };
  inp.onblur=()=>done(true);
  inp.onkeydown=e=>{ if(e.key==="Enter"){inp.onblur=null;done(true);} if(e.key==="Escape"){inp.onblur=null;done(false);} };
}
function removeRow(r){
  if(r.info){ toast("Reference only — remove it in Feed me info"); return; }
  if(r.balancer){ delete S.balancers[r.key.split("#")[1]]; save(); render(); toast("Balancer removed"); return; }
  if(r.bonus){openDrawer("bonus");return;} if(r.oneoff) S.oneoffs=S.oneoffs.filter(o=>o.id!==r.oneoff.id); else S.skip[r.key]=1; save(); render(); }
function addOneoff(k){
  const n=prompt("What is it?  (e.g. Vet bill)"); if(!n) return;
  const a=prompt("How much?  Money out by default — lead with + if it's money coming in.","500"); if(a===null) return;
  const v=signed(a,-1); if(v===null) return;
  const d=prompt("Day of month (optional)","15");
  S.oneoffs.push({id:uid(),ym:k,name:n,amount:v,day:d?+d:99});
  save(); render(); toast("Added");
}

/* ---------- tooltip ---------- */
const tip=document.getElementById("tip");
let tipOwner=null, tipShownAt=0;
function showTip(e,r,k){
  const {y}=parseYM(k);
  const name=r.balancer?"Balancer":r.bonus?S.bonus.name:r.oneoff?r.oneoff.name:r.rule.name;
  let ytd=0,ytdCount=0,yearTotal=0,planTotal=0,planCount=0,monthTotal=0,remaining=0;
  for(const M of MODEL){
    const inYear=parseYM(M.k).y===y;
    for(const row of M.rows){
      const same=r.balancer?!!row.balancer:r.bonus?!!row.bonus:r.oneoff?(row.oneoff&&row.oneoff.name===name):(row.ruleId===r.ruleId);
      if(!same) continue;
      planTotal+=row.amount; planCount++;
      if(inYear){ yearTotal+=row.amount; if(cmpYM(M.k,k)<=0){ytd+=row.amount;ytdCount++;} else remaining+=row.amount; }
      if(M.k===k) monthTotal+=row.amount;
    }
  }
  const rule=(r.oneoff||r.bonus||r.balancer)?null:r.rule;
  let h=`<div class="tt">${name}</div><div class="td">${MFULL[parseYM(k).m-1]} ${y}${r.day<99?" · "+ordinal(r.day):""}${rule?" · "+rule.cadence:r.balancer?" · plug":r.bonus?" · yearly bonus":" · one-off"}</div>`;
  h+=`<div class="tr"><span>This line</span><b>${money(r.amount)}</b></div>`;
  if(monthTotal!==r.amount) h+=`<div class="tr"><span>All of these this month</span><b>${money(monthTotal)}</b></div>`;
  h+=`<div class="hr"></div>
      <div class="tr"><span>Paid so far in ${y}</span><b>${money(ytd)}</b></div>
      <div class="tr"><span>Payments so far</span><b>${ytdCount}</b></div>`;
  if(remaining) h+=`<div class="tr"><span>Still to come in ${y}</span><b>${money(remaining)}</b></div>`;
  h+=`<div class="tr"><span>${y} total</span><b>${money(yearTotal)}</b></div>`;
  if(planCount>ytdCount) h+=`<div class="tr"><span>Whole plan (${planCount})</span><b>${money(planTotal)}</b></div>`;
  if(rule&&rule.cap){
    const paid=Math.abs(ytd),pct=Math.min(100,paid/rule.cap*100),over=Math.abs(yearTotal)>rule.cap;
    h+=`<div class="hr"></div><div class="tr"><span>Toward ${y} limit</span><b>${money(paid)} / ${money(rule.cap)}</b></div>
        <div class="bar"><i class="${over?"over":""}" style="width:${pct}%"></i></div>
        <div class="tr"><span>Room left this year</span><b>${money(Math.max(0,rule.cap-Math.abs(yearTotal)))}</b></div>`;
    if(over) h+=`<div class="note">This year totals ${money(Math.abs(yearTotal))} — ${money(Math.abs(yearTotal)-rule.cap)} past the limit.</div>`;
  }
  if(rule&&rule.payoff){
    const left=payoffLeft(rule,k),paid=rule.payoff-left;
    h+=`<div class="hr"></div><div class="tr"><span>Balance left</span><b>${money(left)}</b></div>`;
    h+=`<div class="hr"></div><div class="tr"><span>Paid down</span><b>${money(paid)} / ${money(rule.payoff)}</b></div>
        <div class="bar"><i style="width:${paid/rule.payoff*100}%"></i></div>
        <div class="tr"><span>Balance after this</span><b>${money(left)}</b></div>`;
    const fin=payoffDone(rule);
    if(fin) h+=`<div class="tr"><span>Paid off</span><b>${MN[parseYM(fin).m-1]} ${parseYM(fin).y}</b></div>`;
  }
  if(rule&&rule.id==="cleaner"){
    const M=MODEL.find(x=>x.k===k);
    h+=`<div class="hr"></div><div class="tr"><span>Visits this month</span><b>${M.cleanCount}${M.cleanCount>2?" (3-visit)":""}</b></div>
        <div class="tr"><span>Month total</span><b>${money(monthTotal)}</b></div>`;
  }
  if(r.info) h+=`<div class="note">This statement predates the budget, so it's here for reference only — it isn't subtracted from any balance. Your opening cash already accounts for it.</div>`;
  else if(r.off) h+=`<div class="note">Paid from ${acctLabel(r.account)} — not your main one. It shows here so you can see the whole household picture, but it is <b>not</b> subtracted from the month's ending balance.</div>`;
  else if(rule&&rule.account&&rule.account!=="Main") h+=`<div class="note">Tracked against ${acctLabel(rule.account)}. Still counted in the total.</div>`;
  if(r.bonus) h+=`<div class="note">Click the amount to edit the bonus year by year.</div>`;
  if(r.balancer) h+=`<div class="note">This one solves backwards: it's whatever it takes to make the next month open at <b>${money(r.target)}</b>. Change anything else in this month and it re-solves on its own. Click it to move the target, or × to drop it.</div>`;
  if(rule&&rule.manual){
    const bd=stmtBreakdown(k);
    if(bd){
      h+=`<div class="hr"></div><div class="tr"><span>Charges</span><b>${money(bd.charged)} · ${bd.count}</b></div>`;
      if(bd.credits) h+=`<div class="tr"><span>Refunds &amp; credits</span><b>${money(bd.credits)}</b></div>`;
      h+=`<div class="tr"><span>Amount due</span><b>${money(bd.total)}</b></div>`;
      bd.list.slice(0,8).forEach(([c,v])=>{
        h+=`<div class="tr"><span style="color:${CATCOLOR[c]||"var(--dim)"}">${c}</span><b>${money(v)}</b></div>
            <div class="bar"><i style="width:${(v/bd.total*100).toFixed(1)}%;background:${CATCOLOR[c]||"var(--teal)"}"></i></div>`;
      });
      if(bd.list.length>8) h+=`<div class="tr"><span>+${bd.list.length-8} more categories</span><b></b></div>`;
    }
  }
  if(r.manual&&!stmtBreakdown(k)) h+=`<div class="note">Manual entry — click the number to set the real bill. Feed me the statement and this turns into a spending breakdown.</div>`;
  if(r.odd) h+=`<div class="note">This one sits off the quarterly water cycle. See Check-up.</div>`;
  tipOwner=e.currentTarget||null; tipShownAt=Date.now();
  tip.innerHTML=h; tip.classList.add("show"); moveTip(e);
}
function moveTip(e){
  const pad=8, vw=innerWidth, vh=innerHeight;
  const narrow = vw<760;

  if(narrow){
    /* no room beside anything — span the width and sit above the row */
    tip.style.left=pad+"px";
    tip.style.right=pad+"px";
    tip.style.width="auto";
    const r=tipOwner?tipOwner.getBoundingClientRect():{top:e.clientY,bottom:e.clientY};
    const h=tip.offsetHeight;
    let top=r.top-h-10;
    if(top<pad) top=r.bottom+10;                 // no room above? drop below
    if(top+h>vh-pad) top=Math.max(pad,vh-h-pad); // still overflowing? pin inside
    tip.style.top=top+"px";
    return;
  }

  tip.style.right="auto"; tip.style.width="";
  const w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+16, y=e.clientY+16;
  if(x+w>vw-pad) x=e.clientX-w-16;               // flip to the other side
  if(x<pad) x=pad;
  if(y+h>vh-pad) y=Math.max(pad,vh-h-pad);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ tip.classList.remove("show"); tipOwner=null; }
/* on a touch screen the card sticks after a tap, so any tap clears it */
document.addEventListener("click",e=>{
  if(Date.now()-tipShownAt<450) return;          // don't kill the tap that opened it
  const row=e.target.closest(".row");
  if(!row||row===tipOwner) hideTip();
},true);
document.addEventListener("touchstart",e=>{
  if(Date.now()-tipShownAt<450) return;
  if(!e.target.closest(".row")) hideTip();
},{passive:true,capture:true});
document.getElementById("scroller").addEventListener("scroll",hideTip,{passive:true});

function wireRec(){
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.r,r=S.rules.find(x=>x.id===id);
    card.querySelector(".chead").onclick=()=>card.classList.toggle("open");
    const g=f=>card.querySelector(`[data-f="${f}"]`);
    g("indef").onchange=e=>{const ee=g("end");ee.disabled=e.target.checked;if(e.target.checked)ee.value="";};
    card.querySelector("[data-addstep]").onclick=()=>{
      r.schedule.push({from:S.meta.end,amount:amountAt(r,S.meta.end)});
      save(); openDrawer("rec"); document.querySelector(`[data-r="${id}"]`).classList.add("open");
    };
    card.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
      r.schedule.splice(+b.dataset.rm,1); save(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open");
    });
    card.querySelector("[data-del]").onclick=()=>{
      if(!confirm(`Delete "${r.name}" from every month?`)) return;
      S.rules=S.rules.filter(x=>x.id!==id); save(); render(); openDrawer("rec"); toast("Deleted");
    };
    card.querySelector("[data-apply]").onclick=()=>{
      r.name=g("name").value.trim()||r.name;
      r.kind=g("kind").value;
      r.cadence=g("cadence").value;
      if(g("day")) r.day=+g("day").value||1;
      if(g("anchor")) r.anchor=g("anchor").value.trim();
      if(g("months")) r.months=g("months").value.split(",").map(n=>+n.trim()).filter(n=>n>=1&&n<=12);
      r.start=g("start").value.trim()||r.start;
      r.end=g("indef").checked?null:(g("end").value.trim()||null);
      r.manual=g("manual").checked;
      r.account=g("account").value;
      r.offbook=g("offbook").checked;
      r.cap=parseFloat(g("cap").value)||null;
      r.payoff=parseFloat(g("payoff").value)||null;
      card.querySelectorAll('[data-s="from"]').forEach(i=>{r.schedule[+i.dataset.i].from=i.value.trim();});
      card.querySelectorAll('[data-s="amount"]').forEach(i=>{
        const v=signed(i.value,r.kind==="income"?1:-1); r.schedule[+i.dataset.i].amount=v===null?0:v;});
      r.schedule.sort((a,b)=>cmpYM(a.from,b.from));
      save(); render(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open"); toast("Updated");
    };
  });
  document.getElementById("addRule").onclick=()=>{
    const n=prompt("Name it"); if(!n) return;
    const mx=Math.max(...S.rules.filter(x=>x.sort<9000).map(x=>x.sort));
    S.rules.push({id:uid(),name:n,kind:"expense",cadence:"monthly",day:1,start:S.meta.start,end:null,
                  sort:mx+10,schedule:[{from:S.meta.start,amount:-100}]});
    S.rules.sort((a,b)=>a.sort-b.sort);
    save(); render(); openDrawer("rec"); toast("Added — set the amount");
  };
  const bind=(el,fn)=>{el.onchange=()=>{fn(el.value);save();render();};};
  bind(document.getElementById("mTitle"),v=>{ S.meta.title=v.trim()||"Household Budget"; });
  document.querySelectorAll("[data-acct]").forEach(i=>{
    i.onchange=()=>{ const k=i.dataset.acct, v=i.value.trim();
      if(v) S.accountNames[k]=v; else delete S.accountNames[k];
      save(); render(); openDrawer("rec"); };
  });
  bind(document.getElementById("mOpen"),v=>S.meta.opening=parseFloat(v)||0);
  bind(document.getElementById("mBuf"),v=>S.meta.buffer=parseFloat(v)||0);
  bind(document.getElementById("mEnd"),v=>{if(/^\d{4}-\d{2}$/.test(v))S.meta.end=v;});
}

let feedBatch=null;
async function readOne(f){
  const isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
  if(!isPdf) return await f.text();
  const txt=await extractPdfText(await f.arrayBuffer());
  if(!txt||txt.length<40) throw new Error("scanned image — no text to read");
  return txt;
}
/* drop in as many statements as you like; each one files itself by its due date */
async function ingestFiles(files){
  const list=[...files]; if(!list.length) return;
  feedBatch=[]; pill(`Reading ${list.length} statement${list.length>1?"s":""}…`,true);
  for(const f of list){
    const row={name:f.name};
    try{
      const res=parseStatement(await readOne(f));
      if(res.error||!res.rows.length) throw new Error(res.error||"no charges found");
      const m=res.dates&&res.dates.month;
      if(!m) throw new Error("couldn't find the dates");
      if(!monthList().includes(m)) throw new Error("falls outside the plan ("+m+")");
      row.month=m; row.count=res.rows.length;
      row.total=res.rows.reduce((a,r)=>a+r.amt,0);
      row.due=(res.dates&&res.dates.newBalance)||row.total;
      row.replaced=!!(S.stmts[m]&&S.stmts[m].rows&&S.stmts[m].rows.length);
      S.stmts[m]=res;                       /* filed straight away */
      row.ok=true;
    }catch(e){ row.ok=false; row.why=e.message; }
    feedBatch.push(row);
  }
  feedBatch.sort((a,b)=>(a.month||"").localeCompare(b.month||""));
  const good=feedBatch.filter(r=>r.ok);
  if(good.length){ feedMonth=good[good.length-1].month; save(); render(); }
  openDrawer("feed");
  pill(`Filed <b class="ok">${good.length} of ${feedBatch.length}</b>`);
}
function ingest(text){                       /* pasted text, single */
  const res=parseStatement(text);
  if(res.error||!res.rows.length){ toast(res.error?"Couldn't read that":"No charges found"); return; }
  feedDraft=res;
  const auto=res.dates&&res.dates.month;
  if(auto&&monthList().includes(auto)) feedMonth=auto;
  openDrawer("feed");
  toast(res.rows.length+" charges read"+(auto?" · filed under "+MN[parseYM(auto).m-1]:""));
}
function wireFeed(){
  const applyAll=document.getElementById("fApplyAll");
  if(applyAll) applyAll.onclick=()=>{
    let n=0;
    feedBatch.filter(r=>r.ok).forEach(r=>{
      if(S.meta.recordsFrom&&cmpYM(r.month,S.meta.recordsFrom)<0) return;   /* pre-budget stays reference only */
      S.over["cc#"+r.month+"#0"]=-up10(r.due); n++;
    });
    save(); render(); openDrawer("feed"); toast(n+" bills set");
  };
  const sel=document.getElementById("fMonth");
  feedMonth=sel.value;
  sel.onchange=()=>{ feedMonth=sel.value; feedDraft=null; openDrawer("feed"); };
  document.getElementById("fPick").onclick=()=>document.getElementById("stmtIn").click();
  document.getElementById("fPaste").onclick=()=>{
    const t=prompt("Paste the statement rows (CSV or tab-separated)");
    if(t) ingest(t);
  };
  const fs=document.getElementById("fSave");
  if(fs){
    fs.onclick=()=>{ S.stmts[feedMonth]=feedDraft||S.stmts[feedMonth]; feedDraft=null;
      save(); render(); openDrawer("feed"); toast("Saved to "+feedMonth); };
    document.getElementById("fUseTotal").onclick=()=>{
      const st=feedDraft||S.stmts[feedMonth];
      const tot=st.rows.reduce((s,r)=>s+r.amt,0);
      S.stmts[feedMonth]=st; feedDraft=null;
      const bill=(st.dates&&st.dates.newBalance)||tot;
      S.over["cc#"+feedMonth+"#0"]=-up10(bill);
      save(); render(); openDrawer("feed"); toast("Bill set to "+money(up10(bill)));
    };
    document.getElementById("fClear").onclick=()=>{
      delete S.stmts[feedMonth]; feedDraft=null; save(); render(); openDrawer("feed"); toast("Removed");
    };
    document.querySelectorAll("[data-tx]").forEach(sl=>sl.onchange=()=>{
      const st=feedDraft||S.stmts[feedMonth], r=st.rows[+sl.dataset.tx];
      r.cat=sl.value;
      S.learned[normMerchant(r.desc)]=sl.value;   // remember it
      /* apply the same call to every matching merchant already loaded */
      Object.values(S.stmts).forEach(x=>x&&x.rows&&x.rows.forEach(o=>{
        if(normMerchant(o.desc)===normMerchant(r.desc)) o.cat=sl.value; }));
      if(feedDraft) feedDraft.rows.forEach(o=>{
        if(normMerchant(o.desc)===normMerchant(r.desc)) o.cat=sl.value; });
      save(); openDrawer("feed");
    });
  }
  const fg=document.getElementById("fForget");
  if(fg) fg.onclick=()=>{ if(confirm("Forget every merchant tag you've corrected?")){ S.learned={}; save(); openDrawer("feed"); } };
}


/* ============================================================
   SYNC — a private GitHub Gist holds the JSON so every device
   sees the same numbers. The token lives in its own storage key,
   never inside S, so "Save as app" can never bake it into a file.
   ============================================================ */
const SYNCKEY="budget_sync_v1", GFILE="budget.json";
let sync={token:"",gistId:"",lastPulled:0}, gistFileName=null;
try{
  /* older builds used a different key — carry those credentials over */
  const raw=localStorage.getItem(SYNCKEY)||localStorage.getItem("tull_sync_v1")||"{}";
  Object.assign(sync,JSON.parse(raw));
  if(!localStorage.getItem(SYNCKEY)&&sync.token) localStorage.setItem(SYNCKEY,JSON.stringify(sync));
}catch(e){}
function saveSync(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(sync)); }catch(e){} }
const syncOn=()=>!!(sync.token&&sync.gistId);

let pillTimer=null;
function pill(html,sticky){
  const el=document.getElementById("statusPill"); if(!el) return;
  el.innerHTML=html; el.classList.add("show");
  clearTimeout(pillTimer);
  if(!sticky) pillTimer=setTimeout(()=>el.classList.remove("show"),2600);
}
function setSync(kind,msg){
  if(!msg) return;
  const cls={ok:"ok",busy:"busy",err:"err",warn:"warn"}[kind]||"";
  pill(`Sync · <b class="${cls}">${msg}</b>`, kind==="busy");
}
const isFileURL=()=>location.protocol==="file:";
/* a sandboxed frame reports a null origin — same practical result as file:// */
const isSandboxed=()=>{ try{ return window.origin==="null"||location.origin==="null"||window!==window.top; }catch(e){ return true; } };
const netBlocked=()=>isFileURL()||isSandboxed();
function whereAmI(){
  if(isFileURL()) return {ok:false,what:"a local file on your device",why:"file:// pages aren't allowed to call other sites"};
  if(isSandboxed()) return {ok:false,what:"a preview window inside another app",why:"previews run sandboxed, so outside connections are blocked"};
  return {ok:true,what:location.origin,why:""};
}
function gh(path,opts){
  if(netBlocked()) return Promise.reject(new Error("FILEURL"));
  return fetch("https://api.github.com"+path,Object.assign({},opts,{
    headers:Object.assign({Authorization:"Bearer "+sync.token,
      Accept:"application/vnd.github+json","Content-Type":"application/json"},(opts&&opts.headers)||{})}));
}
function netMsg(e){
  if(e&&e.message==="FILEURL") return "needs a web address, not a local file";
  if(e instanceof TypeError||/load failed|failed to fetch|network/i.test(e&&e.message||""))
    return "couldn't reach GitHub — check the connection";
  return (e&&e.message)||"something went wrong";
}
async function ghRead(){
  const r=await gh("/gists/"+sync.gistId,{method:"GET"});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":r.status===404?"Gist not found":"GitHub error "+r.status);
  const j=await r.json(), files=j.files||{};
  const key=files[GFILE]?GFILE:Object.keys(files).find(k=>/\.json$/i.test(k));
  const f=key&&files[key];
  if(!f) throw new Error("That gist has no .json file");
  gistFileName=key;
  let c=f.content;
  if(f.truncated&&f.raw_url) c=await (await fetch(f.raw_url)).text();
  return JSON.parse(c);
}
async function ghWrite(state){
  const r=await gh("/gists/"+sync.gistId,{method:"PATCH",
    body:JSON.stringify({files:{[gistFileName||GFILE]:{content:JSON.stringify(state,null,2)}}})});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":"GitHub error "+r.status);
  return r.json();
}
async function ghCreate(state){
  const r=await gh("/gists",{method:"POST",body:JSON.stringify({
    description:"Household Budget", public:false,
    files:{[GFILE]:{content:JSON.stringify(state,null,2)}}})});
  if(!r.ok) throw new Error(r.status===401?"Token rejected — needs gist permission":"GitHub error "+r.status);
  return r.json();
}
const ts=o=>(o&&o.meta&&o.meta.savedAt)||0;

async function syncPull(quiet){
  if(!syncOn()) return;
  setSync("busy","checking…");
  try{
    const remote=await ghRead();
    if(ts(remote)>ts(S)){
      S=remote; migrate(S); localSave(); render();
      centerNow(false);                      /* the month list just changed shape */
      sync.lastPulled=ts(remote); saveSync();
      setSync("ok","pulled newer copy");
      if(!quiet) toast("Loaded the newer copy");
    } else {
      sync.lastPulled=ts(remote); saveSync();
      setSync("ok", ts(S)>ts(remote) ? "local is newer" : "up to date");
    }
  }catch(e){ setSync("err",netMsg(e)); }
}
async function syncPush(force){
  if(!syncOn()) return;
  setSync("busy","saving…");
  try{
    let remote=null;
    try{ remote=await ghRead(); }catch(e){}
    /* guard: someone else saved after the copy this device started from */
    if(!force&&remote&&ts(remote)>sync.lastPulled&&ts(remote)>ts(S)){
      setSync("warn","conflict — theirs is newer");
      toast("Someone saved a newer copy");
      return false;
    }
    await ghWrite(S);
    sync.lastPulled=ts(S)||Date.now(); saveSync();
    setSync("ok","saved "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}));
    return true;
  }catch(e){ setSync("err",netMsg(e)); return false; }
}
let pushTimer=null;
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushTimer);
  setSync("busy","pending…");
  pushTimer=setTimeout(()=>syncPush(false),4000);   // settle before hitting the network
}

/* ============================================================
   CARD YEAR REVIEW
   A statement paid in month M covers the month before it, so a
   calendar year of spending runs Feb..Jan of the following year.
   ============================================================ */
function prevMonth(k){ const {y,m}=parseYM(k); return m===1?ym(y-1,12):ym(y,m-1); }
function spendYearOf(k){ return parseYM(prevMonth(k)).y; }

function cardYear(y){
  const keys=Object.keys(S.stmts)
    .filter(k=>S.stmts[k]&&S.stmts[k].rows&&S.stmts[k].rows.length&&spendYearOf(k)===y)
    .sort();
  const closer=ym(y+1,1);                       /* the statement holding December */
  const complete=keys.includes(closer);
  const by={}, months=[], merchants={};
  let charged=0, credits=0;
  keys.forEach(k=>{
    const st=S.stmts[k]; let mTot=0;
    st.rows.forEach(r=>{
      by[r.cat]=(by[r.cat]||0)+r.amt; mTot+=r.amt;
      if(r.amt>0){ charged+=r.amt; const m=normMerchant(r.desc); merchants[m]=(merchants[m]||0)+r.amt; }
      else credits+=r.amt;
    });
    months.push({filed:k, spend:prevMonth(k), total:mTot});
  });
  const total=charged+credits;
  return {y,keys,complete,closer,total,charged,credits,months,
    cats:Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]),
    top:Object.entries(merchants).sort((a,b)=>b[1]-a[1]).slice(0,8),
    avg: months.length?total/months.length:0};
}
function cardBtnState(){
  const y=YEAR, d=cardYear(y);
  if(d.keys.length<2) return {label:"Awaiting card info", mode:"waiting", d};
  if(d.complete)      return {label:y+" card review",     mode:"review",  d};
  return {label:"Card spending so far", mode:"partial", d};
}

    <div class="fb">${d.complete

  h+=`<div class="fg" style="margin:4px 0 14px">
    <div class="stat"><div class="k">Charged</div><div class="v teal">${money(d.charged)}</div></div>
    <div class="stat"><div class="k">Refunds</div><div class="v">${money(d.credits)}</div></div>
    <div class="stat"><div class="k">Net</div><div class="v amber">${money(d.total)}</div></div>
    <div class="stat"><div class="k">Per month</div><div class="v cyan">${money(d.avg)}</div></div>
  </div>`;

  h+=`<div class="card open"><div class="chead"><span class="nm">Where it went</span></div><div class="cbody">`;
  d.cats.forEach(([c,v])=>{
    h+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--dim)">
      <span style="color:${CATCOLOR[c]||"var(--dim)"};font-weight:600">${c}</span>
      <b style="color:var(--txt)">${money(v)} · ${pct(v).toFixed(0)}%</b></div>
      <div class="bar" style="height:5px;background:#26343b;border-radius:3px;margin-bottom:7px;overflow:hidden">
      <i style="display:block;height:100%;width:${pct(v).toFixed(1)}%;background:${CATCOLOR[c]||"var(--teal)"}"></i></div>`;
  });
  h+=`</div></div>`;

  const mx=Math.max(...d.months.map(m=>Math.abs(m.total)),1);
  h+=`<div class="card open"><div class="chead"><span class="nm">Month by month</span>
      <span class="cad">by spending month</span></div><div class="cbody">`;
  d.months.forEach(m=>{

  h+=`<div class="card open"><div class="chead"><span class="nm">Biggest merchants</span></div><div class="cbody">`;
  d.top.forEach(([m,v])=>{
    h+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--dim)">
      <span style="text-transform:capitalize">${m}</span><b style="color:var(--txt)">${money(v)}</b></div>`;
  });
  h+=`</div></div>`;

  /* what the plan assumed, against what actually happened */
  let planned=0, matched=0;
  d.keys.forEach(k=>{
    const M=MODEL.find(x=>x.k===k);
    if(M){ const row=M.rows.find(r=>r.ruleId==="cc"); if(row){ planned+=Math.abs(row.amount); matched++; } }
  });
  if(matched){
    const diff=d.total-planned;
    h+=`<div class="flag ${Math.abs(diff)>planned*0.1?"bad":"good"}"><div class="ft">Plan vs reality</div>
      <div class="fb">Your budget carried <b>${money(planned)}</b> across those ${matched} months.
      The statements say <b>${money(d.total)}</b> — ${diff>0?`<b>${money(diff)}</b> more than planned`
      :diff<0?`<b>${money(-diff)}</b> less than planned`:"exactly as planned"}.
      ${Math.abs(diff)>planned*0.1?`That gap compounds: at this rate it's about ${money(diff/matched*12)} a year off.`:""}</div></div>`;
  }
  return h;
}
const prettySpend=k=>MFULL[parseYM(k).m-1]+" "+parseYM(k).y;

function insights(){
  const out=[];
  const neg=MODEL.filter(m=>m.end<0);
  if(neg.length) out.push({tone:"bad",t:"Months that go below zero",
    b:neg.map(m=>MN[parseYM(m.k).m-1]+" "+parseYM(m.k).y+" ends at "+money(m.end)).join(" · ")});
  const low=MODEL.filter(m=>m.end>=0&&m.end<S.meta.buffer);
  if(low.length) out.push({tone:"warn",t:"Months under "+money(S.meta.buffer),
    b:low.map(m=>MN[parseYM(m.k).m-1]+" "+String(parseYM(m.k).y).slice(2)+" ("+money(m.end)+")").join(", ")});

  const odd=S.oneoffs.filter(o=>o.odd);
  if(odd.length) out.push({tone:"warn",t:"Two different water amounts — which is the real bill?",
    b:`On the Dec / Mar / Jun / Sep cycle your sheet shows <b>$180</b> (Jun-26, Mar-27, Jun-27), so I've used those exact figures on the cycle months and $370 on the ones that were blank. But there are also <b>$370</b> charges in Apr-26, Jan-27 and Apr-27 — each sitting exactly one month after a cycle month. If those are the same quarterly bill just paid late, delete these three lines with the × and set Water to a single amount. If it's a separate charge, tell me and I'll give it its own line.`});

  const three=MODEL.filter(m=>m.payCount>2);
  if(three.length) out.push({tone:"good",t:"Three-paycheck months",
    b:three.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      ". Your natural catch-up months — the extra check is the one worth aiming at a goal before it gets absorbed."});

  const bl=Object.keys(S.balancers||{});
  if(bl.length) out.push({tone:"warn",t:"Balancer in play",
    b:bl.map(k=>{const M=MODEL.find(x=>x.k===k),row=M&&M.rows.find(r=>r.balancer);
      return `${MFULL[parseYM(k).m-1]} ${parseYM(k).y}: ${row?money(row.amount):"—"} to land the next month at ${money(S.balancers[k])}`;}).join(" · ")+
      `. A balancer is a plug, not a real transaction — it's there to force a month to open at a number you know is true. Worth replacing with the actual line item once you know what it was.`});
  const ob=S.rules.filter(r=>r.offbook);
  if(ob.length) out.push({tone:"good",t:"Shown but not counted",
    b:ob.map(r=>`${r.name} (${acctLabel(r.account)})`).join(" · ")+
      `. These sit in the grid in purple so you can see the full picture, but they never touch the ending balance. Across the plan that's ${money(Math.abs(MODEL.reduce((s,m)=>s+m.offTot,0)))} of spending you're seeing but not carrying.`});
  const c3=MODEL.filter(m=>m.cleanCount>2);
  const clRule=S.rules.find(r=>r.id==="cleaner");
  if(c3.length&&clRule) out.push({tone:"good",t:"Three-visit months for "+clRule.name,
    b:c3.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      `. Those months carry an extra visit, so they cost more than a normal month.`});

  S.rules.filter(r=>r.cap).forEach(r=>{
    [...new Set(MODEL.map(m=>parseYM(m.k).y))].forEach(y=>{
      let t=0; MODEL.filter(m=>parseYM(m.k).y===y).forEach(m=>m.rows.filter(x=>x.ruleId===r.id).forEach(x=>t+=x.amount));
      if(Math.abs(t)>r.cap) out.push({tone:"warn",t:`${r.name} runs past its ${y} limit`,
        b:`${money(Math.abs(t))} planned against ${money(r.cap)} — ${money(Math.abs(t)-r.cap)} over.`});
      else if(t!==0&&Math.abs(t)<r.cap) out.push({tone:"good",t:`${r.name} · ${y}`,
        b:`${money(Math.abs(t))} of ${money(r.cap)} contributed. ${money(r.cap-Math.abs(t))} of room left.`});
    });
  });

  S.rules.filter(r=>r.payoff).forEach(r=>{
    const fin=payoffDone(r);
    out.push({tone:"good",t:`${r.name} payoff`,
      b:fin?`Clears in ${MFULL[parseYM(fin).m-1]} ${parseYM(fin).y}.`
           :`${money(payoffLeft(r,S.meta.end))} still outstanding when the plan ends. Add a year to see the payoff date.`});
  });

  const cc=MODEL.filter(m=>m.rows.some(r=>r.ruleId==="cc"));
  const ccTot=cc.reduce((s,m)=>s+m.rows.filter(r=>r.ruleId==="cc").reduce((a,b)=>a+b.amount,0),0);
  out.push({tone:"warn",t:"The credit card is the whole story",
    b:`${money(Math.abs(ccTot))} across ${cc.length} months — far and away your biggest outflow. Every $250 a month you shave off adds about ${money(250*cc.length)} to the plan. Nothing else on this board moves the needle as hard.`});
  return out;
}

}

/* iOS in-app browsers swallow <a download>, so offer the share sheet first —
   that gives you "Save to Files" and it actually lands somewhere you can find. */
async function deliver(text,name,mime){
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      toast("Shared "+name);
      return true;
    }
  }catch(err){
    if(err&&err.name==="AbortError"){ toast("Cancelled"); return true; }
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Saved "+name);
    return true;
  }catch(err){}
  toast("This browser blocked the download");
  alert("This browser wouldn't save the file.\n\nIf you're inside an app's built-in browser, tap the ⋯ menu and choose \"Open in Safari\", then try again.");
  return false;
}

(function(){
  const sc=document.getElementById("scroller");
  let x0=null,y0=null,moved=false;
  sc.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  sc.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4) moved=true;
  },{passive:true});
  sc.addEventListener("touchend",e=>{
    if(x0===null||!moved){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45) shiftView(dx<0?1:-1);   /* drag left = go forward */
    x0=null;
  },{passive:true});
})();
