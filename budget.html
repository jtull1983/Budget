                onBill===liveCycle().bill?"already on the live card":MN[parseYM(onBill).m-1]+" bill"}</span></span>
              <span class="amt">${money(-Math.abs(pl.amt))}</span>
              <span class="kill" title="Drop this plan">×</span>`;
            c.querySelector(".kill").onclick=ev=>{ ev.stopPropagation();
              S.plans=S.plans.filter(z=>z.id!==pl.id); save(); render(); toast("Plan dropped"); };
            box.appendChild(c);
          });
        }
        return;
      }
      if(r.group){
        const el=document.createElement("div");
        el.className="row grp "+r.kind+(r.off?" off":"");
        el.innerHTML=`<span class="dot"></span>
          <span class="lbl">${r.label} <span class="gn">×${r.count}</span></span>
          <span class="amt">${money(r.amount)}</span>
          <span class="tri${r.open?" up":""}">▾</span>`;
        el.onclick=()=>{ expanded.has(r.key)?expanded.delete(r.key):expanded.add(r.key); render(); };
        el.onmouseenter=e=>showTip(e,{...r.rows[0],label:r.label+" · "+r.count+" this month"},M.k);
        el.onmousemove=ev=>{ if(innerWidth>=760) moveTip(ev); };
        el.onmouseleave=()=>{ if(innerWidth>=760) hideTip(); };
        box.appendChild(el); return;
      }
      const el=document.createElement("div");
      el.className="row "+r.kind+(r.oneoff?" oneoff":"")+(r.manual?" manual":"")
                 +(r.ruleId==="cc"?" cc":"")+(r.off?" off":"")+(r.info?" info":"");
      if(r.ruleId==="cc"&&!r.info){
        const hv=heatLevel(M.k); if(hv) el.classList.add("heat","heat"+hv);
        el.dataset.ccMonth=M.k;      /* the label opens the pane; the amount still edits */
        if(M.k===liveCycle().bill) el.classList.add("livecc");
      }
      if(anim==="anim-spill") el.style.animationDelay=(0.06+ri*0.022)+"s";
      el.innerHTML=`<span class="dot"></span><span class="lbl">${r.label}</span>
        <span class="amt${r.manual?" man":""}${r.ovr?" ovr":""}">${money(r.amount)}</span>
        <button class="kill">×</button><span class="swx">✕</span>`;
      if(r.child) el.classList.add("child");
      wireSwipe(el,r);   /* before every other handler — see the note there */
      /* struck through, with what it actually was, and a tap to put the guess back */
      if(!r.hit&&r.late){
        el.classList.add("late");
        const chip=document.createElement("span");
        chip.className="late";
        chip.textContent="not seen";
        chip.title="Due on the "+ordinal(r.day)+" but nothing on the account matched it."
                  +" If it did land, attach it in \u201cDoes this look right?\u201d so it"
                  +" stops being counted twice.";
        chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); openDrawer("match"); };
        el.insertBefore(chip,el.querySelector(".amt"));
      }
      if(r.hit){
        el.classList.add("hit");
        const chip=document.createElement("span");
        chip.className="paid";
        /* it used to read "was -$2,650" when the number moved, which pushed "Mortgage"
           down to "M…". The real amount is already sitting in the row. */
        chip.textContent="paid";
        chip.title="Matched to \""+(r.hit.desc||"a transaction")+"\" on "+fmtDate(r.hit.date)
                  +". Tap to go back to the predicted amount.";
        chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); unmatch(r.key); };
        el.insertBefore(chip,el.querySelector(".amt"));
      }
      /* the flash rides on its own element — the heat ramp owns both pseudo-elements */
      if(el.classList.contains("livecc")){
        const fl=document.createElement("i"); fl.className="rowflash"; el.appendChild(fl);
        /* a typed number on the live row stops the feed updating it, which looks
           exactly like the feed being wrong. Say so, and make it one tap to undo. */
        if(r.ovr){
          const chip=document.createElement("span");
          chip.className="frz"; chip.textContent="typed";
          chip.title="This row is holding a number you typed. Tap to follow the card feed again.";
          chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation();
            delete S.over[r.key]; save(); render();
            const lt=liveTotal();
            toast(lt===null?"Back on the live feed":"Back on the live feed · "+money(-lt)); };
          el.insertBefore(chip,el.querySelector(".amt"));
        }
      }
      el.querySelector(".amt").onclick=e=>editAmt(e.target,r,M.k);
      el.querySelector(".kill").onclick=()=>removeRow(r);
      if(el.dataset.ccMonth){
        const lb=el.querySelector(".lbl");
        const amtEl=el.querySelector(".amt");
        /* The number used to be the only way in and the label the only way to the
           pane. Now the whole row opens the pane and the number comes out on a long
           press, or a double click with a mouse. A double *tap* was asked for and
           left out on purpose: it forces every single tap to sit for ~250ms waiting
           to see whether a second one is coming, and opening the pane feels broken. */
        const openPane=ev=>{ ev.preventDefault(); ev.stopPropagation(); hideTip();
          nav={month:prevMonth(el.dataset.ccMonth),cat:null};
          cardView="cat"; openDrawer("card"); };
        /* Wiring only the label and the number left the middle of the row dead, which
           is most of it — the gap between "Credit card" and the amount is the easiest
           place on the line to hit with a thumb, and it did nothing. */
        el.onclick=ev=>{ if(ev.target.closest(".kill,.paid,.frz,.late")) return; openPane(ev); };
        amtEl.onclick=openPane;
        let lpT=null,lpX=0,lpY=0,lpFired=false;
        const cancelLP=()=>{ clearTimeout(lpT); lpT=null; };
        el.addEventListener("pointerdown",ev=>{
          if(ev.pointerType==="mouse") return;              /* mouse gets dblclick instead */
          if(ev.target.closest(".kill,.paid,.frz")) return;  /* those have their own jobs */
          lpFired=false; lpX=ev.clientX; lpY=ev.clientY; cancelLP();
          lpT=setTimeout(()=>{ lpFired=true;
            if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
            editAmt(amtEl,r,M.k); },500);
        });
        /* a swipe across the grid must not count as a press */
        el.addEventListener("pointermove",ev=>{
          if(Math.abs(ev.clientX-lpX)>10||Math.abs(ev.clientY-lpY)>10) cancelLP(); });
        ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,cancelLP));
        /* and the lift at the end of a long press must not then open the pane */
        el.addEventListener("click",ev=>{
          if(lpFired){ ev.preventDefault(); ev.stopPropagation(); lpFired=false; } },true);
        el.ondblclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); editAmt(amtEl,r,M.k); };
        if(lb){ lb.style.cursor="pointer";
          /* plain click is right here — the reason it failed on iOS was the
             hover handler above eating the first tap, and cc rows no longer
             have one. pointerup opened the drawer but the click that followed
             reached the scrim and shut it again. */
          lb.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); hideTip();
            /* the column is the month the bill arrives; the drawer wants the
               month the money was spent, which is the cycle before it. Handing
               the raw column key over showed the NEXT statement — so the August
               row opened the live cycle. */
            nav={month:prevMonth(el.dataset.ccMonth),cat:null};
            cardView="cat"; openDrawer("card"); }; }
      }
      if(r.oneoff) el.querySelector(".lbl").ondblclick=()=>{
        const n=prompt("Rename line",r.oneoff.name); if(n){r.oneoff.name=n;save();render();}
      };
      /* Tap opens the same card the desktop shows on hover, parked in a pane where
         it can be read and scrolled rather than floating over the column. Only rows
         that don't already own their tap: a group toggles, the card opens spending,
         and an open swipe is a close instruction, not a request to drill in. */
      if(!el.onclick&&!r.info) el.onclick=ev=>{
        if(ev.target.closest(".amt,.kill,.swx,.tri,.frz,.paid,.late")) return;
        if(el.classList.contains("swopen")) return;
        openLinePane(r,M.k);
      };
      if(!el.dataset.ccMonth) el.onmouseenter=e=>showTip(e,r,M.k);
      el.onmousemove=ev=>{ if(innerWidth>=760) moveTip(ev); };
      el.onmouseleave=()=>{ if(innerWidth>=760) hideTip(); };
      box.appendChild(el);
    });
    col.querySelector(".addbtn").onclick=()=>budOpen?addBudgetLine(M.k):addOneoff(M.k);
    rail.appendChild(col);
  });

  const hint=null;
  if(hint){
    const [lo,hi]=yearBounds();
    hint.querySelector("[data-nav='-1']").disabled = viewIndex<=lo;
    hint.querySelector("[data-nav='1']").disabled  = viewIndex>=hi;
    const sp=hint.querySelector("span");
    if(sp) sp.textContent = viewIndex>=hi ? "tap a year to go further" : "swipe to move a month";
  }

  const appT=(S.meta&&S.meta.title)||"Household Budget";
  const thEl=document.getElementById("appTitle");
  if(thEl&&thEl.dataset.t!==appT){
    thEl.dataset.t=appT;
    thEl.innerHTML=`<span class="tt">${appT}</span><span class="vtag">${APP_V}</span>`;
    document.title=appT+" "+APP_V;
  }

  fitGrid(); localSave(); stampSaved();
  const cb=document.getElementById("btnCard");
  if(cb){ const st=cardBtnState(); cb.textContent=st.label;
          cb.classList.toggle("warn",st.mode==="waiting"); }
  const n=insights().filter(i=>i.tone!=="good").length;
  const ic=document.getElementById("insCount");
  if(ic) ic.textContent=n?("· "+n):"";
  const pc=propCount(), mb=document.getElementById("btnMatch");
  /* This drawer is also the only way to attach something by hand, so gating it on
     proposals alone meant a paycheck that never matched had no route in at all —
     and kept being counted on top of money already in the account. */
  const mNow=MODEL.find(x=>x.k===NOW);
  const lateN=mNow?mNow.rows.filter(r=>r.late&&!r.hit).length:0;
  const spareN=spareNow().length;
  if(mb){
    mb.hidden=!(pc||lateN||spareN);
    mb.firstChild.nodeValue=pc?"Confirm ":"Check the account ";
    document.getElementById("matchCount").textContent=
      pc?("· "+pc):lateN?("· "+lateN):"";
  }
  const bb=document.getElementById("btnBank");
  if(bb) bb.hidden=!bankRows().length;
  const sb=document.getElementById("btnSav");
  if(sb) sb.hidden=savBalance()===null;
  wireNowBal();
  if(firstPaint){ firstPaint=false; centerNow(true); setTimeout(centerWide,30); }
}

/* What's actually in the account today — the number every end-of-month figure is
   walking away from. Until the bank is connected that's the opening balance of the
   month we're in; after that it'll be the real one. */
/* the balance line opens the account, when there is one to open */
function wireNowBal(){
  document.querySelectorAll(".mfoot .nowbal.live").forEach(el=>{
    el.onclick=ev=>{ ev.stopPropagation(); openDrawer("bank"); };
  });
  document.querySelectorAll(".mfoot .savbal.live").forEach(el=>{
    el.onclick=ev=>{ ev.stopPropagation(); openDrawer("sav"); };
  });
}
function nowBalance(){
  const t=totalNow();
  if(t!==null) return t;
  const m=MODEL.find(x=>x.k===NOW);
  return m?m.onhand:(Number(S.meta.opening)||0);
}
/* put the month we're actually in in the middle of the screen */
function centerNow(pulse){
  const i=MODEL.findIndex(m=>m.k===NOW);
  if(i>=0){ viewIndex=i; clampView(); render(null); }
  const col=document.querySelector(".mcol.now");
  if(col&&pulse){ col.classList.remove("pulse"); void col.offsetWidth; col.classList.add("pulse"); }
  if(pulse) pulseLiveCard();
}
/* same two beats as the current month, two seconds behind it (the delay is in the CSS) */
function pulseLiveCard(){
  document.querySelectorAll(".row.livecc").forEach(el=>{
    el.classList.remove("livepulse"); void el.offsetWidth; el.classList.add("livepulse");
  });
}

/* What this cell would show if nobody had typed in it. `amountAt` alone isn't
   that number on the card row: the live cycle comes from the feed, and later
   months carry their planned purchases. Comparing against the wrong baseline is
   what let a tap-and-tap-away freeze the live total. */
function naturalAmt(r,k){
  if(r.ruleId==="cc"&&k===liveCycle().bill){
    const lt=liveTotal();
    if(lt!==null) return -Math.round(lt*100)/100;
  }
  let a=amountAt(r.rule,k);
  if(r.ruleId==="cc"){ const ex=plannedOnBill(k); if(ex) a-=ex; }
  return a;
}
/* sign lock: money out stays money out unless you lead with + */
function signed(raw,anchor){
  const s=String(raw).trim();
  const v=Math.abs(parseFloat(s.replace(/[^0-9.]/g,"")));
  if(isNaN(v)) return null;
  if(s[0]==="+") return v;
  if(s[0]==="-") return -v;
  return anchor>=0?v:-v;
}
function editAmt(span,r,k){
  if(r.info){ feedMonth=k; openDrawer("feed"); return; }
  if(r.bonus){ openDrawer("bonus"); return; }
  if(r.balancer){
    const v=prompt("What should the next month start with?",r.target);
    if(v!==null){ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
      if(!isNaN(n)){ S.balancers[k]=n; save(); render(); toast("Balancer set"); } }
    return;
  }
  const anchor = r.oneoff ? (r.oneoff.amount||-1)
               : (r.rule.kind==="income"?1:-1);
  const inp=document.createElement("input"); inp.className="amtin";
  inp.value=Math.abs(r.amount); span.replaceWith(inp); inp.focus(); inp.select();
  const started=inp.value;
  const done=ok=>{
    /* opened it and touched nothing? that's a look, not an edit. Without this,
       tapping the live card row and tapping away pinned it at whatever the feed
       happened to say at that second, and it never moved again. */
    if(ok&&inp.value===started){ render(); return; }
    if(ok){
      const v=signed(inp.value,anchor);
      if(v!==null){
        if(r.oneoff) r.oneoff.amount=v;
        else if(v===naturalAmt(r,k)) delete S.over[r.key];   /* same as the feed = release it */
        else S.over[r.key]=v;
        save();
      }
    }
    render();
  };
  inp.onblur=()=>done(true);
  inp.onkeydown=e=>{ if(e.key==="Enter"){inp.onblur=null;done(true);} if(e.key==="Escape"){inp.onblur=null;done(false);} };
}
/* ── swipe a row left to delete ──────────────────────
   The grid also swipes sideways to change month, so a sideways drag on a row has
   to claim the gesture outright: once it is moving, touchmove and touchend stop
   at the row and never reach the scroller, which then sees no movement and stays
   on the month it was on. A drag that is more vertical than horizontal is handed
   straight back so the list still scrolls normally.

   This is also the only way to delete a line on a phone now. The × has always
   been opacity:0 until :hover, and hover no longer exists on touch.

   Wired before el.onclick and before the credit card gestures on purpose. When
   the row itself is the click target, listeners run in registration order, so
   being first is what lets the open-state guard below swallow the tap. */
var SW_W=58, swOpenEl=null;
function swClose(el){
  if(!el) return;
  el.classList.remove("swopen","swiping");
  el.style.transition="transform .18s ease"; el.style.transform="";
  if(swOpenEl===el) swOpenEl=null;
}
function wireSwipe(el,r){
  if(r.info||r.bonus) return;         /* reference rows have nothing to remove */
  let x0=0,y0=0,live=false,open=false,decided=false;
  const put=(px,anim)=>{ el.style.transition=anim?"transform .18s ease":"none";
                         el.style.transform=px?"translateX("+px+"px)":""; };
  el.addEventListener("touchstart",ev=>{
    if(ev.touches.length!==1) return;
    x0=ev.touches[0].clientX; y0=ev.touches[0].clientY;
    live=false; decided=false; open=el.classList.contains("swopen");
    if(swOpenEl&&swOpenEl!==el) swClose(swOpenEl);
  },{passive:true});
  el.addEventListener("touchmove",ev=>{
    const dx=ev.touches[0].clientX-x0, dy=ev.touches[0].clientY-y0;
    if(!decided){
      if(Math.abs(dx)<10&&Math.abs(dy)<10) return;   /* too small to mean anything yet */
      decided=true;
      live=Math.abs(dx)>Math.abs(dy)*1.3&&(dx<0||open);
      if(!live) return;                              /* vertical, or a right-drag on a shut row */
    }
    if(!live) return;
    ev.stopPropagation();                            /* the month grid must not see this */
    if(ev.cancelable) ev.preventDefault();
    el.classList.add("swiping");                     /* lifts the heat row's own clip */
    put(Math.max(-SW_W,Math.min(0,(open?-SW_W:0)+dx)),false);
  },{passive:false});
  const settle=ev=>{
    if(!live) return;
    ev.stopPropagation();
    const dx=(ev.changedTouches&&ev.changedTouches[0]?ev.changedTouches[0].clientX:x0)-x0;
    open=((open?-SW_W:0)+dx) < -SW_W/2;              /* past halfway, it stays out */
    put(open?-SW_W:0,true);
    el.classList.remove("swiping");
    el.classList.toggle("swopen",open);
    if(open) swOpenEl=el; else if(swOpenEl===el) swOpenEl=null;
    live=false;
  };
  el.addEventListener("touchend",settle,{passive:false});
  el.addEventListener("touchcancel",settle,{passive:false});
  el.addEventListener("click",ev=>{
    if(ev.target.closest(".swx")){
      ev.preventDefault(); ev.stopImmediatePropagation();
      swClose(el); removeRow(r); return;
    }
    /* while it is open the row is a close button, not a link into a drawer */
    if(el.classList.contains("swopen")){
      ev.preventDefault(); ev.stopImmediatePropagation(); swClose(el);
    }
  },true);
}
function removeRow(r){
  if(r.info){ toast("Reference only — remove it in Feed me info"); return; }
  if(r.balancer){ delete S.balancers[r.key.split("#")[1]]; save(); render(); toast("Balancer removed"); return; }
  if(r.bonus){openDrawer("bonus");return;} if(r.oneoff) S.oneoffs=S.oneoffs.filter(o=>o.id!==r.oneoff.id); else S.skip[r.key]=1; save(); render(); }
/* A budget line is a purchase you'll put on the card in THIS month. It raises this
   month's budget straight away and lands on next month's bill, because that's when
   the money actually leaves. The live cycle is the exception — real charges are
   already arriving there, so the bill is left alone and only the budget moves. */
function addBudgetLine(k){
  const n=prompt("What are you buying on the card in "+prettySpend(k)+"?  (e.g. New mattress)");
  if(!n) return;
  const a=prompt("Roughly how much?","1000"); if(a===null) return;
  const v=Math.abs(signed(a,-1)); if(!v||isNaN(v)) return;
  S.plans=S.plans||[];
  S.plans.push({id:uid(),ym:k,name:n,amt:v});
  save(); render();
  toast(nextMonth(k)===liveCycle().bill
    ? n+" added to the "+prettySpend(k)+" budget — the live card already sees the real charges"
    : n+" added to the "+prettySpend(k)+" budget — lands on the "+prettySpend(nextMonth(k))+" bill");
}
/* a plain line in this month — cash, another account, anything that isn't the card */
function addOneoff(k){
  const n=prompt("New line in "+prettySpend(k)+" — what is it?  (e.g. Vet bill)"); if(!n) return;
  const a=prompt("How much?  Money out by default — lead with + if it's money coming in.","500"); if(a===null) return;
  const v=signed(a,-1); if(v===null) return;
  const d=prompt("Day of month (optional)","15");
  S.oneoffs.push({id:uid(),ym:k,name:n,amount:v,day:d?+d:99});
  save(); render(); toast("Added to "+prettySpend(k));
}

function drawStats(){
  /* walled-off months all carry the same frozen figure — they are not the tightest
     month in any meaningful sense. Fall back if a whole year sits behind the wall,
     otherwise Math.min of nothing is Infinity and the lookup below throws. */
  let yr=MODEL.filter(m=>parseYM(m.k).y===YEAR&&!m.noData);
  if(!yr.length) yr=MODEL.filter(m=>parseYM(m.k).y===YEAR);
  const ends=yr.map(m=>m.end), low=Math.min(...ends), lowM=yr[ends.indexOf(low)].k;
  const cur=MODEL.find(m=>m.k===NOW)||MODEL[0];
  const three=yr.filter(m=>m.payCount>2).length;
  const st=(k,v,c)=>`<div class="stat"><div class="k">${k}</div><div class="v ${c||""}">${v}</div></div>`;
  document.getElementById("stats").innerHTML=
    st("This month ends",money(cur.end),cur.end<S.meta.buffer?"amber":"teal")+
    st("Tightest in "+YEAR,money(low)+" · "+MN[parseYM(lowM).m-1],low<0?"red":low<S.meta.buffer?"amber":"teal")+
    st("Ends "+YEAR+" with",money(yr[yr.length-1].end),"cyan")+
    st("3-check months",three,"cyan");
}

/* ---------- tooltip ---------- */
const tip=document.getElementById("tip");
let tipOwner=null, tipShownAt=0, tipTimer=null;
function showTip(e,r,k){
  clearTimeout(tipTimer);
  const ev={clientX:e.clientX,clientY:e.clientY,currentTarget:e.currentTarget};
  tipTimer=setTimeout(()=>reallyShowTip(ev,r,k),360);   /* let the pointer settle first */
}
function reallyShowTip(e,r,k){
  const {y}=parseYM(k);
  const name=r.balancer?"Balancer":r.bonus?S.bonus.name:r.oneoff?r.oneoff.name
             :(r.rule?r.rule.name:(String(r.label||"").split(" · ")[0]||"—"));
  let ytd=0,ytdCount=0,yearTotal=0,planTotal=0,planCount=0,monthTotal=0,remaining=0;
  for(const M of MODEL){
    const inYear=parseYM(M.k).y===y;
    for(const row of M.rows){
      const same=r.balancer?!!row.balancer:r.bonus?!!row.bonus:r.oneoff?(row.oneoff&&row.oneoff.name===name):(row.ruleId===r.ruleId);
      if(!same) continue;
      planTotal+=row.amount; planCount++;
      if(inYear){ yearTotal+=row.amount; if(cmpYM(M.k,k)<=0){ytd+=row.amount;ytdCount++;} else remaining+=row.amount; }
      if(M.k===k) monthTotal+=row.amount;
    }
  }
  const rule=(r.oneoff||r.bonus||r.balancer)?null:r.rule;
  let h=`<div class="tt">${name}</div><div class="td">${MFULL[parseYM(k).m-1]} ${y}${r.day<99?" · "+ordinal(r.day):""}${rule?" · "+rule.cadence:r.balancer?" · plug":r.bonus?" · yearly bonus":" · one-off"}</div>`;
  h+=`<div class="tr"><span>This line</span><b>${money(r.amount)}</b></div>`;
  if(monthTotal!==r.amount) h+=`<div class="tr"><span>All of these this month</span><b>${money(monthTotal)}</b></div>`;
  h+=`<div class="hr"></div>
      <div class="tr"><span>Paid so far in ${y}</span><b>${money(ytd)}</b></div>
      <div class="tr"><span>Payments so far</span><b>${ytdCount}</b></div>`;
  if(remaining) h+=`<div class="tr"><span>Still to come in ${y}</span><b>${money(remaining)}</b></div>`;
  h+=`<div class="tr"><span>${y} total</span><b>${money(yearTotal)}</b></div>`;
  if(planCount>ytdCount) h+=`<div class="tr"><span>Whole plan (${planCount})</span><b>${money(planTotal)}</b></div>`;
  if(rule&&rule.cap){
    const paid=Math.abs(ytd),pct=Math.min(100,paid/rule.cap*100),over=Math.abs(yearTotal)>rule.cap;
    h+=`<div class="hr"></div><div class="tr"><span>Toward ${y} limit</span><b>${money(paid)} / ${money(rule.cap)}</b></div>
        <div class="bar"><i class="${over?"over":""}" style="width:${pct}%"></i></div>
        <div class="tr"><span>Room left this year</span><b>${money(Math.max(0,rule.cap-Math.abs(yearTotal)))}</b></div>`;

  }
  if(r.budgetPlan){
    const p=r.budgetPlan;

      <div class="tr"><span>Target</span><b>${money(p.target)}</b></div>

      <div class="tr"><span>${p.hold} held at</span><b>${money(p.keep)}</b></div>

    tip.innerHTML=hh; tip.classList.add("show");

  }
  if(r.ruleId==="cc"&&k===liveCycle().bill&&liveStmt()){

  if(r.bonus) h+=`<div class="note">Click the amount to edit the bonus year by year.</div>`;
  if(r.balancer) h+=`<div class="note">This one solves backwards: it's whatever it takes to make the next month open at <b>${money(r.target)}</b>. Change anything else in this month and it re-solves on its own. Click it to move the target, or × to drop it.</div>`;

/* One place decides where a tip's HTML lands. With tipSink set, the same content
   renders into a panel instead of the floating card — which is how tapping a row
   opens it as a side pane. There is only one builder, so the pane and the hover
   card can never drift apart. */
let tipSink=null;
function emitTip(html,e){
  if(tipSink){ tipSink.innerHTML=html; return; }
  tip.innerHTML=html; tip.classList.add("show");
  tipOwner=(e&&e.currentTarget)||null; tipShownAt=Date.now(); moveTip(e);
}
let lineCtx=null;
function openLinePane(r,k){ lineCtx={r,k}; openDrawer("line"); }
function lineHTML(){
  if(!lineCtx) return `<div class="hint">Nothing selected.</div>`;
  const box=document.createElement("div");
  tipSink=box;
  try{ reallyShowTip({currentTarget:null},lineCtx.r,lineCtx.k); }
  finally{ tipSink=null; }
  return `<div id="linepane">${box.innerHTML}</div>`;
}
function lineTitle(){
  const r=lineCtx&&lineCtx.r; if(!r) return "Line";
  return r.balancer?"Balancer":r.bonus?S.bonus.name:r.oneoff?r.oneoff.name
       :(r.rule?r.rule.name:String(r.label||"Line").split(" \u00b7 ")[0]);
}
function moveTip(e){
  const pad=8, vw=innerWidth, vh=innerHeight;
  const narrow = vw<760;

  if(narrow){
    /* no room beside anything — span the width and sit above the row */
    tip.style.left=pad+"px";
    tip.style.right=pad+"px";
    tip.style.width="auto";
    const r=tipOwner?tipOwner.getBoundingClientRect():{top:e.clientY,bottom:e.clientY};
    const h=tip.offsetHeight;
    let top=r.top-h-10;
    if(top<pad) top=r.bottom+10;                 // no room above? drop below
    if(top+h>vh-pad) top=Math.max(pad,vh-h-pad); // still overflowing? pin inside
    tip.style.top=top+"px";
    return;
  }

  tip.style.right="auto"; tip.style.width="";
  const w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+16, y=e.clientY+16;
  if(x+w>vw-pad) x=e.clientX-w-16;               // flip to the other side
  if(x<pad) x=pad;
  if(y+h>vh-pad) y=Math.max(pad,vh-h-pad);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ clearTimeout(tipTimer); tip.classList.remove("show"); tipOwner=null; }
/* on a touch screen the card sticks after a tap, so any tap clears it */
document.addEventListener("click",e=>{

  const row=e.target.closest(".row");

},true);
document.addEventListener("touchstart",e=>{

},{passive:true,capture:true});

/* ── budget adjustment ───────────────────────────────
   The CC budget as a set of category amounts rather than one number. The total
   IS `ccTarget` — change anything here and the target, the heat ramp and Buddy's
   messages all move with it. The percentage slider works off a baseline captured
   when the panel opens, so dragging it back and forth doesn't compound. */
const BUDGET_SPLIT=[["Groceries",.26],["Dining",.16],["Shopping",.16],["Gas & auto",.10],
                    ["Home",.09],["Health",.07],["Kids",.06],["Personal care",.05],
                    ["Travel",.05]];
function seedCatBudget(){
  const tgt=Math.abs(Number(S.meta.ccTarget)||5000), out={};
  const p=(typeof trimPlan==="function")?trimPlan():null;
  if(p&&p.rows&&p.rows.length){
    /* if there's statement history, start from what actually gets spent */
    const tot=p.rows.reduce((a,r)=>a+Math.abs(r.target||0),0)||1;
    p.rows.forEach(r=>{ out[r.cat]=Math.max(0,Math.round(Math.abs(r.target)/tot*tgt/50)*50); });
  }else{
    BUDGET_SPLIT.forEach(([c,f])=>{ out[c]=Math.round(tgt*f/50)*50; });
  }
  return out;
}
function catBudget(){
  const b=S.meta.catBudget;
  if(!b||typeof b!=="object"||!Object.keys(b).length) S.meta.catBudget=seedCatBudget();
  return S.meta.catBudget;
}
function budgetTotal(){ const b=catBudget();
  return Object.keys(b).reduce((a,k)=>a+(Math.abs(+b[k])||0),0); }
function budgetSync(){ S.meta.ccTarget=budgetTotal(); save(); render(); paintBudget(); }

let bgBase=null;                       /* the amounts as they were when the panel opened */
function budgetHTML(){
  const b=catBudget();
  bgBase=Object.assign({},b);
  const cats=Object.keys(b);
  return `<div class="flag"><div class="ft">What the card is allowed</div><div class="fb">

function paintBudget(){
  const b=catBudget();
  const t=document.getElementById("bgTotal"); if(t) t.textContent=money(budgetTotal());
  document.querySelectorAll("#bgRows .bgrow").forEach(row=>{

/* scale every category so the whole thing lands on `want`, to the nearest $50,
   with the rounding leftover pushed onto the biggest line */
function budgetScaleTo(want){
  const base=bgBase||catBudget();
  const from=Object.keys(base).reduce((a,k)=>a+(Math.abs(+base[k])||0),0);
  if(!from) return;
  const f=want/from, b=catBudget();
  let sum=0, biggest=null, bigv=-1;
  Object.keys(base).forEach(k=>{
    const v=Math.max(0,Math.round(Math.abs(base[k])*f/50)*50);
    b[k]=v; sum+=v;
    if(v>bigv){ bigv=v; biggest=k; }
  });
  if(biggest&&sum!==want) b[biggest]=Math.max(0,b[biggest]+(want-sum));
  budgetSync();
}
function wireBudget(){
  const pct=document.getElementById("bgPct"), lab=document.getElementById("bgPctLab");
  const apply=()=>{
    const p=+pct.value;
    lab.textContent=(p>0?"+":"")+p+"%";
    const base=bgBase||catBudget(), b=catBudget();
    Object.keys(base).forEach(k=>{
      b[k]=Math.max(0,Math.round(Math.abs(base[k])*(1+p/100)/50)*50);
    });
    budgetSync();
  };
  pct.oninput=apply; pct.onchange=apply;

  const set=document.getElementById("bgSet");
  set.onchange=()=>{
    const want=Math.abs(parseFloat(String(set.value).replace(/[^0-9.]/g,""))||0);
    if(!want) return;
    const base=bgBase||catBudget();
    const from=Object.keys(base).reduce((a,k)=>a+(Math.abs(+base[k])||0),0)||1;
    budgetScaleTo(want);
    /* park the slider on the nearest 5% so the two controls agree */
    const p=Math.round(((want/from)-1)*100/5)*5;
    pct.value=Math.max(-50,Math.min(100,p));
    lab.textContent=(pct.value>0?"+":"")+pct.value+"%";
    set.value=""; toast("CC budget set to "+money(budgetTotal()));
  };

  document.querySelectorAll("#bgRows .bgrow [data-step]").forEach(btn=>{
    btn.onclick=()=>{
      const c=btn.closest(".bgrow").dataset.c, b=catBudget();
      b[c]=Math.max(0,(Math.abs(+b[c])||0)+(+btn.dataset.step));
      bgBase=Object.assign({},b);          /* a hand nudge becomes the new baseline */
      pct.value=0; lab.textContent="0%";
      budgetSync();
    };
  });

  document.getElementById("bgEven").onclick=()=>{
    const b=catBudget(), keys=Object.keys(b), tot=budgetTotal();
    const each=Math.max(0,Math.round(tot/keys.length/50)*50);
    keys.forEach(k=>b[k]=each);
    bgBase=Object.assign({},b); pct.value=0; lab.textContent="0%";
    budgetSync(); toast("Split evenly");
  };
  document.getElementById("bgReset").onclick=()=>{
    S.meta.catBudget=seedCatBudget();
    bgBase=Object.assign({},catBudget()); pct.value=0; lab.textContent="0%";
    budgetSync();
    toast("Back to the shape of your spending");
  };
}

/* ── the bank side of the feed ───────────────────────
   SimpleFIN hands back every account on one token. Until now everything it
   returned was treated as card spending; with a current account connected that's
   wrong, so each account carries a role. Unset means "card", which is what every
   existing setup already assumed. */
/* An account we've never been told about is NOT the credit card. Assuming it was
   is how a current account's mortgage payments and paycheque deposits ended up
   filed as card charges. Unknown means unknown: it feeds nothing until it's been
   named. The one exception is a token with a single account on it — there's
   nothing to confuse it with. */
function acctRole(id){
  const m=S.meta.acct||{};
  if(m[id]) return m[id];
  const list=S.meta.acctList||[];
  if(list.length===1) return "card";
  return "new";
}
/* a first guess, offered but never applied on its own */
function acctGuess(a){
  const bal=Number(a.balance);
  const n=(a.name||"").toLowerCase();
  if(/credit|card|visa|mastercard|amex|venture|freedom|sapphire/.test(n)) return "card";
  /* savings is tested before bank on purpose. It used to fall through to "bank",
     which summed it into the spending balance and dropped every transfer into the
     matcher — the two things that made savings impossible to read. */
  if(/saving|money market|\bmma\b|high.?yield|\bhysa\b|certificate|\bcd\b/.test(n)) return "savings";
  if(/check|chequ|share draft/.test(n)) return "bank";
  if(!isNaN(bal)) return bal<0?"card":"bank";
  return null;
}
function newAccts(){
  return (S.meta.acctList||[]).filter(a=>acctRole(a.id)==="new");
}
function setAcctRole(id,role){
  S.meta.acct=S.meta.acct||{}; S.meta.acct[id]=role; save();
}
function bankRows(){ return (S.bank&&Array.isArray(S.bank.rows))?S.bank.rows:[]; }
/* Savings is a normal account that happens to be a savings account: money goes in,
   money comes out, bills get paid from it, and all of that matches and strikes through
   like anything else. The one thing it stays out of is the credit card statement.
   An earlier version walled it off from matching too, which was a mistake — it meant
   a mortgage paid from savings could never be marked paid. */
function savRows(){ return (S.sav&&Array.isArray(S.sav.rows))?S.sav.rows:[]; }
function matchPool(){ return bankRows().concat(savRows()); }
function totalNow(){
  const b=typeof S.meta.liveBalance==="number"?S.meta.liveBalance:null;
  const v=savBalance();
  if(b===null&&v===null) return null;
  return (b||0)+(v||0);
}
function savBalance(){ return typeof S.meta.savBalance==="number"?S.meta.savBalance:null; }

/* ── matching a real transaction to a line you predicted ──
   Three signals: does the name look like the line, is the amount in the right
   neighbourhood, and did it land near the day you said it would. Any one of them
   alone is a coin flip — a $45 debit could be anything — so a match needs a good
   name OR a near-exact amount, plus the date to back it up. */
function normTxt(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function nameScore(label,desc){
  const A=normTxt(label).split(" ").filter(w=>w.length>2);
  const B=normTxt(desc).split(" ").filter(w=>w.length>2);
  if(!A.length||!B.length) return 0;
  let hit=0;
  A.forEach(w=>{ if(B.some(x=>x.startsWith(w)||w.startsWith(x))) hit++; });
  return hit/A.length;
}
/* the same list matchHTML shows, so an index from one means the same row in the other */
function spareNow(){
  return (matchPool()||[]).filter(t=>String(t.date).slice(0,7)===NOW)
    .filter(t=>!Object.values(S.props||{}).some(p=>p.date===t.date&&p.amt===t.amt)
              &&!Object.values(S.hits||{}).some(h=>h&&h.date===t.date&&h.amt===t.amt))
    .slice(0,8);
}
/* Attaching by hand is a decision, not a guess, so it writes straight to S.hits
   rather than going back through the proposal queue the person just came from. */
function openAttach(tx){
  if(!tx) return;
  const m=MODEL.find(x=>x.k===NOW); if(!m) return;
  const open=m.rows.filter(r=>!r.info&&!r.off&&r.ruleId!=="cc"&&!r.hit);
  const wrap=document.getElementById("pickWrap");
  document.getElementById("pick").innerHTML=
    `<div class="pt">${tx.desc||"That transaction"}</div>
     <div class="pd">${money(tx.amt)} on ${fmtDate(tx.date)} \u00b7 which line is this?</div>
     ${open.length?`<div class="pickgrid">${open.map((r,i)=>
       `<button data-att="${i}">${r.label}<span class="sub" style="display:block;
         font-size:10px;color:var(--dimmer);font-weight:400">${money(r.amount)}</span></button>`
       ).join("")}</div>`
      :`<div class="hint">Every line this month is already matched.</div>`}
     <button class="pclose" id="pickCancel">Cancel</button>`;
  wrap.classList.add("on");
  document.getElementById("pickCancel").onclick=closePicker;
  wrap.onclick=e=>{ if(e.target===wrap) closePicker(); };
  /* Marking a line paid and deciding what it's WORTH are two questions. A paycheck
     is planned at a round number and lands a few dollars off; a bill is planned at
     the real figure. Attaching used to answer only the first, leaving the column
     showing the guess next to a transaction that says otherwise. Ask, don't assume —
     and only ask when the two actually disagree. */
  const commit=(r,useReal)=>{
    const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
    S.hits=S.hits||{};
    S.hits[r.key]={amt:tx.amt,date:tx.date,desc:tx.desc,was:r.amount,sig};
    if(useReal) S.over[r.key]=tx.amt;      /* the bank is the authority for this one */
    S.payee=S.payee||{};
    const key=isTransfer(tx.desc)?"":normMerchant(tx.desc), list=S.payee[r.ruleId]||[];
    if(key&&!list.includes(key)){ list.push(key); S.payee[r.ruleId]=list; }
    save(); render(); closePicker(); openDrawer("match");
    toast(r.label+" marked paid \u00b7 I'll know that one next month");
  };
  const askAmt=r=>{
    document.getElementById("pick").innerHTML=
      `<div class="pt">${r.label}</div>
       <div class="pd">The line says ${money(r.amount)}. The bank says ${money(tx.amt)}.
         Which one should this month show?</div>
       <div class="pickgrid">
         <button id="attReal">${money(tx.amt)}<span class="sub" style="display:block;
           font-size:10px;color:var(--dimmer);font-weight:400">what actually landed</span></button>
         <button id="attPlan">${money(r.amount)}<span class="sub" style="display:block;
           font-size:10px;color:var(--dimmer);font-weight:400">leave the plan alone</span></button>
       </div>
       <button class="pclose" id="pickCancel">Cancel</button>`;
    document.getElementById("attReal").onclick=()=>commit(r,true);
    document.getElementById("attPlan").onclick=()=>commit(r,false);
    document.getElementById("pickCancel").onclick=closePicker;
  };
  document.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{
    const r=open[+b.dataset.att];
    if(Math.abs(tx.amt-r.amount)>0.005) askAmt(r); else commit(r,false);
  });
}

function matchScore(row,tx,k){
  if((row.amount<0)!==(tx.amt<0)) return 0;             /* money out matches money out */
  const a=Math.abs(row.amount), b=Math.abs(tx.amt);
  if(!a||!b) return 0;
  const off=Math.abs(a-b)/Math.max(a,b);
  if(off>0.6 && Math.abs(a-b)>150) return 0;            /* nowhere near */
  /* A paycheck is never going to read like "Paycheck · 7th" — it reads "DEPOSIT
     BECHTEL GLOBAL", and the amount moves every period, so neither half of the usual
     test can catch it. Once it's been attached by hand the merchant is remembered
     against that rule, and it lands on its own from then on. */
  const taught=(S.payee&&S.payee[row.ruleId]||[]).includes(normMerchant(tx.desc));
  const nm=taught?1:nameScore(row.label,tx.desc);
  const day=Math.min(28,row.day||15);
  const txDay=+String(tx.date).slice(8,10);
  const dd=Math.abs(txDay-day);
  /* ── payday ────────────────────────────────────────────────────────────
     A paycheque is recognised by WHEN it lands, not by what it says or how much
     it is. A fortnightly income line has a computed payday; the deposit turns up
     on it, sometimes a day early for a weekend, and a few days late after a
     holiday. The bank calls it whatever it likes — "Transfer from Checking",
     "DEPOSIT BECHTEL GLOBAL" — and the amount moves every period, so neither the
     name test nor the to-the-cent test below can ever carry it.
     Money in, on a fortnightly line, on its payday is signal enough on its own.
     This produces a PROPOSAL the owner confirms in "Does this look right?", not a
     decision, which is what makes a looser rule safe here.
     The window is asymmetric because payroll moves early for a weekend and late
     for a holiday. The magnitude guard keeps a small deposit that happens to land
     on payday — a dividend, a refund — from being read as the paycheque. */
  if(row.rule&&row.rule.cadence==="biweekly"&&row.amount>0&&tx.amt>0&&off<0.45){
    const drift=txDay-day;                    /* signed: negative is early */
    if(drift>=-2&&drift<=4){
      const near=1-Math.min(Math.abs(drift),5)/5;
      return 0.55 + near*0.25 + (1-Math.min(off,1))*0.15;
    }
  }
  if(dd>12 && nm<0.5) return 0;                          /* wrong end of the month */
  if(nm<0.34 && off>0.03) return 0;                      /* no name, no exact amount */
  /* A bank line rarely reads like the name you gave it — "VCA ANIMAL HOSPITAL" for
     a vet bill, "DIRECT DEP PAYROLL" for a paycheck. To the cent on the right day
     is its own kind of proof, so it carries the match on its own. */
  const exact=off<0.005?0.18:0;
  return nm*0.55 + (1-Math.min(off,1))*0.35 + (1-Math.min(dd,15)/15)*0.10 + exact;
}
/* Fills S.props — proposals, not decisions. Returns true if the list changed. */
function autoMatch(model){
  if(!matchPool().length) return false;
  const m=model.find(x=>x.k===NOW);
  if(!m) return false;
  S.hits=S.hits||{}; S.props=S.props||{};
  const taken={}, changed=[];
  /* anything already settled, or already waiting to be confirmed, keeps its row */
  Object.keys(S.hits).forEach(key=>{ const h=S.hits[key]; if(h&&h.sig) taken[h.sig]=1; });
  Object.keys(S.props).forEach(key=>{ const h=S.props[key]; if(h&&h.sig) taken[h.sig]=1; });
  m.rows.forEach(row=>{
    if(row.info||row.off||row.ruleId==="cc") return;      /* the card bill isn't a bank line */
    if(S.hits[row.key]||S.props[row.key]) return;         /* settled, refused, or already asked */
    let best=null, bestS=0;
    matchPool().forEach(tx=>{
      const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
      if(taken[sig]) return;
      if(String(tx.date).slice(0,7)!==NOW) return;
      const sc=matchScore(row,tx,NOW);
      if(sc>bestS){ bestS=sc; best={tx,sig}; }
    });
    if(best&&bestS>=0.5){
      S.props[row.key]={amt:best.tx.amt,date:best.tx.date,desc:best.tx.desc,
                        was:row.amount,sig:best.sig,score:Math.round(bestS*100)};
      taken[best.sig]=1; changed.push(row.key);
    }
  });
  /* drop anything belonging to a month that has rolled by */
  [S.hits,S.props].forEach(store=>Object.keys(store).forEach(key=>{
    const mm=key.split("#")[1];
    if(mm&&/^\d{4}-\d{2}$/.test(mm)&&cmpYM(mm,NOW)<0){ delete store[key]; changed.push(key); }
  }));
  if(changed.length) save();
  return !!changed.length;
}
function unmatch(key){
  S.hits=S.hits||{};
  S.hits[key]={off:1};                 /* remembered, so the matcher won't redo it */
  save(); render(); toast("Back to the predicted amount");
}

function wireAcct(){
  document.querySelectorAll(".acctrow .role").forEach(b=>{
    b.onclick=()=>{
      const row=b.closest(".acctrow");
      setAcctRole(row.dataset.id,b.dataset.role);
      row.querySelectorAll(".role").forEach(x=>x.classList.toggle("on",x===b));
      if(b.dataset.role!=="bank"){                 /* stop using a balance we no longer trust */
        const anyBank=(S.meta.acctList||[]).some(a=>acctRole(a.id)==="bank");
        if(!anyBank){ delete S.meta.liveBalance; S.bank=null; S.hits={}; }
      }
      /* same for savings — a stale balance sitting under the total is worse than none */
      if(b.dataset.role!=="savings"){
        const anySav=(S.meta.acctList||[]).some(a=>acctRole(a.id)==="savings");
        if(!anySav){ delete S.meta.savBalance; delete S.meta.savBalanceAt; S.sav=null; }
      }
      save(); render();
      toast(b.dataset.role==="bank"?"Reading balance and transactions from that one"
           :b.dataset.role==="savings"?"Counted and matched, with its own labels"
           :b.dataset.role==="card"?"Feeding the credit-card row":"Left alone");
      /* re-file straight away so nothing sits in the wrong place */
      if(!newAccts().length&&sfinLeft()>0) setTimeout(()=>sfinPull(false),300);
    };
  });
}


/* ── the review step ─────────────────────────────────
   A match changes what a month is worth, so nothing is applied on the strength of
   a guess. Everything the matcher finds lands in S.props and waits to be looked at.
   Accepting writes it into S.hits; rejecting writes {off:1}, which is remembered so
   the same wrong pairing isn't proposed again tomorrow. */
function propCount(){ return Object.keys(S.props||{}).length; }
function acceptProp(key){
  const p=(S.props||{})[key]; if(!p) return;
  S.hits=S.hits||{}; S.hits[key]=p; delete S.props[key];
  save(); render(); if(propCount()) openDrawer("match"); else { closeDrawer(); toast("All caught up"); }
}
function rejectProp(key){
  const p=(S.props||{})[key]; if(!p) return;
  S.hits=S.hits||{}; S.hits[key]={off:1};
  delete S.props[key];
  save(); render(); if(propCount()) openDrawer("match"); else { closeDrawer(); toast("Left as predicted"); }
}
function acceptAll(){
  S.hits=S.hits||{};
  Object.keys(S.props||{}).forEach(k=>{ S.hits[k]=S.props[k]; });
  S.props={}; save(); render(); closeDrawer(); toast("Applied");
}
function rejectAll(){
  S.hits=S.hits||{};
  Object.keys(S.props||{}).forEach(k=>{ S.hits[k]={off:1}; });
  S.props={}; save(); render(); closeDrawer(); toast("Left as predicted");
}
function matchHTML(){
  const keys=Object.keys(S.props||{});
  /* This used to return early when there was nothing to confirm, which hid the two
     things below it — the lines that never landed, and the transactions you can
     attach by hand. Those matter most precisely when nothing matched itself. */
  const m=MODEL.find(x=>x.k===NOW)||{rows:[]};
  const labelOf=k=>{ const r=m.rows.find(x=>x.key===k); return r?r.label:k; };
  const rows=keys.map(k=>{
    const p=S.props[k], moved=Math.abs((p.was||0)-p.amt)>=0.5;
    return `<div class="prop" data-k="${k}">
      <div class="ph"><b>${labelOf(k)}</b>
        <span class="pa ${moved?"moved":""}">${money(p.amt)}</span></div>
      <div class="pd">${p.desc||"a transaction"} · ${fmtDate(p.date)}
        ${moved?`<span class="gn">you had ${money(p.was)}</span>`:`<span class="gn">exactly what you predicted</span>`}</div>
      <div class="crow"><button class="mini yes" data-do="yes">That's it</button>
        <button class="mini" data-do="no">Not this</button></div>
    </div>`;
  }).join("");
  const m0=MODEL.find(x=>x.k===NOW);
  const late=m0?m0.rows.filter(r=>r.late&&!r.hit):[];
  const lateSum=late.reduce((a,r)=>a+r.amount,0);
  const spare=(matchPool()||[]).filter(t=>String(t.date).slice(0,7)===NOW)
    .filter(t=>!Object.values(S.props||{}).some(p=>p.date===t.date&&p.amt===t.amt)
              &&!Object.values(S.hits||{}).some(h=>h&&h.date===t.date&&h.amt===t.amt))
    .slice(0,8);
  return `${keys.length?`<div class="flag"><div class="ft">Straight from your bank</div><div class="fb">
      Your bank shows ${keys.length} transaction${keys.length===1?"":"s"} that look like
      ${keys.length===1?"a line":"lines"} you'd already put in. Say the word and I'll mark
      ${keys.length===1?"it":"them"} as done and use the real amount${keys.length===1?"":"s"}.
      Nothing changes until you do.</div></div>
    <div class="crow" style="margin:10px 0 14px">
      <button class="mini" id="propAll">Yes to all</button>
      <button class="mini" id="propNone">No to all</button></div>`:""}
    ${rows}
    ${!keys.length&&!late.length&&!spare.length?`<div class="hint">Nothing waiting, and
      every line this month is accounted for.</div>`:""}
    ${late.length?`<div class="flag ${lateSum>0?"bad":""}" style="margin-top:18px">
      <div class="ft">${late.length} line${late.length>1?"s":""} due before today,
        not seen on the account</div>
      <div class="fb">${late.map(r=>r.label+" "+money(r.amount)).join(" \u00b7 ")}.
        This month opens at your real balance and counts everything that hasn't landed,
        so anything here that <i>has</i> already gone through is being counted twice \u2014
        the bottom line is off by ${money(lateSum)} until it's attached below.</div></div>`:""}
    ${spare.length?`<div class="sh" style="margin-top:18px">Didn't look like anything</div>
      <div class="hint" style="margin-bottom:6px">Also on the account this month, matched to
        nothing. Tap one to say which line it is \u2014 I'll recognise it next month.</div>
      ${spare.map((t,i)=>`<div class="dline attach" data-attach="${i}"><span>${
        t.desc||"—"} · ${fmtDate(t.date)}</span>
        <span>${money(t.amt)}</span></div>`).join("")}`:""}`;
}
function wireMatch(){
  document.querySelectorAll("[data-attach]").forEach(b=>{
    b.onclick=()=>openAttach(spareNow()[+b.dataset.attach]);
  });

  if(a) a.onclick=acceptAll;
  if(n) n.onclick=rejectAll;
  document.querySelectorAll(".prop [data-do]").forEach(b=>{
    b.onclick=()=>{ const k=b.closest(".prop").dataset.k;
                    b.dataset.do==="yes"?acceptProp(k):rejectProp(k); };
  });
}


/* ── everything that moved through the account ───────
   The card has had a full browser since the beginning; the bank side only ever
   showed up as matches and leftovers. This is the plain list: what went out, what
   came in, and which line each one was filed against. */
function matchedTo(tx){
  const sig=tx.date+"|"+tx.amt+"|"+normTxt(tx.desc).slice(0,24);
  const m=MODEL.find(x=>x.k===NOW)||{rows:[]};
  const lab=key=>{ const r=m.rows.find(x=>x.key===key); return r?r.label:null; };
  let hitKey=null, propKey=null;
  Object.keys(S.hits||{}).forEach(k=>{ const h=S.hits[k]; if(h&&h.sig===sig) hitKey=k; });
  Object.keys(S.props||{}).forEach(k=>{ const h=S.props[k]; if(h&&h.sig===sig) propKey=k; });
  if(hitKey) return {state:"done", label:lab(hitKey)||"a line"};
  if(propKey) return {state:"asking", label:lab(propKey)||"a line"};
  return {state:"none"};
}
function bankHTML(){
  const rows=bankRows().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!rows.length) return `<div class="hint">Nothing here yet. Mark an account as
    <b>Bank</b> in the Sync drawer and check it once, and everything that moves through
    it lands here.</div>`;
  const inn=rows.filter(r=>r.amt>0).reduce((a,r)=>a+r.amt,0);
  const out=rows.filter(r=>r.amt<0).reduce((a,r)=>a+r.amt,0);
  const byDay={};
  rows.forEach(r=>{ (byDay[r.date]=byDay[r.date]||[]).push(r); });
  const days=Object.keys(byDay).sort().reverse();
  let h=`<div class="flag"><div class="ft">The account itself</div><div class="fb">
      <b>${money(S.meta.liveBalance||0)}</b> in there now.
      ${money(inn)} in and ${money(out)} out across the last two months
      ${S.meta.liveBalanceAt?`· checked ${new Date(S.meta.liveBalanceAt).toLocaleString()}`:""}
      <div class="gn" style="margin-top:5px">Anything tagged with a line is already inside
      that balance, so the month doesn't count it twice.</div></div></div>`;
  days.forEach(d=>{
    const list=byDay[d], sub=list.reduce((a,r)=>a+r.amt,0);
    h+=`<div class="card open"><div class="chead">
      <span class="nm">${new Date(d+"T12:00:00")
        .toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span>
      <span class="ct">${money(sub)} · ${list.length}</span></div>
      ${list.map(t=>{
        const m=matchedTo(t);
        return `<div class="txr"><span class="td">${t.desc||"—"}</span>
          <span class="tv ${t.amt>=0?"inc":""}">${money(t.amt)}</span>
          <span class="tg ${m.state}">${m.state==="done"?m.label
            :m.state==="asking"?"confirm?":"no line"}</span></div>`;
      }).join("")}</div>`;
  });
  return h;
}

/* ── savings ─────────────────────────────────────────
   Deliberately a plain ledger and nothing more. Money moving between here and the
   current account is not spending and not income — it changes which pocket holds
   it, which is why none of this reaches the matcher or the card. */
function savHTML(){
  const bal=savBalance();
  if(bal===null) return `<div class="hint">Nothing here yet. Mark an account as
    <b>Savings</b> in the Sync drawer and check it once.</div>`;
  savView=savRows().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const inn=savView.filter(r=>r.amt>0).reduce((a,r)=>a+r.amt,0);
  const out=savView.filter(r=>r.amt<0).reduce((a,r)=>a+r.amt,0);
  const m=MODEL.find(x=>x.k===NOW);
  let h=`<div class="flag"><div class="ft">The savings account</div><div class="fb">
      <b>${money(bal)}</b> in there now.
      ${money(inn)} in and ${money(out)} out across the last two months
      ${S.meta.savBalanceAt?`\u00b7 checked ${new Date(S.meta.savBalanceAt).toLocaleString()}`:""}
      <div class="gn" style="margin-top:5px">Counted in what you have, matched against your
      lines like any other account, and kept out of the credit card entirely. Money moving
      between here and your current account is neither spending nor income \u2014 it's the same
      money in a different pocket, so the bottom line doesn't move.</div>
      </div></div>`;
  if(!savView.length) return h+`<div class="hint">No transactions in the last two months.</div>`;

  /* totals first, but only the labels that actually turned up — a grid of empty
     rows on an account with six transactions a month reads as a broken screen */
  const tot={};
  savView.forEach(r=>{ const c=savCategorize(r.desc,r); tot[c]=(tot[c]||0)+r.amt; });
  const cats=Object.keys(tot).sort((a,b)=>Math.abs(tot[b])-Math.abs(tot[a]));
  h+=`<div class="card open"><div class="chead"><span class="nm">What it was</span>
      <span class="cad">last two months</span></div><div class="cbody">`;
  cats.forEach(c=>{
    h+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0">
      <span style="color:${SAVCOLOR[c]||"var(--dim)"};font-weight:600">${c}</span>
      <b style="color:var(--txt)">${money(tot[c])}</b></div>`;
  });
  h+=`</div></div>`;

  const byDay={};
  savView.forEach((r,i)=>{ (byDay[r.date]=byDay[r.date]||[]).push(i); });
  Object.keys(byDay).sort().reverse().forEach(d=>{
    const list=byDay[d], sub=list.reduce((a,i)=>a+savView[i].amt,0);
    h+=`<div class="card open"><div class="chead">
      <span class="nm">${new Date(d+"T12:00:00")
        .toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span>
      <span class="ct">${money(sub)} \u00b7 ${list.length}</span></div>
      ${list.map(i=>{ const t=savView[i], c=savCategorize(t.desc,t);
        return `<div class="txr"><span class="td">${t.desc||"\u2014"}</span>
          <span class="tv ${t.amt>=0?"inc":""}">${money(t.amt)}</span>
          <span class="tg none pick" data-savmove="${i}"
            style="color:${SAVCOLOR[c]||"var(--dim)"}">${c}</span></div>`;
      }).join("")}</div>`;
  });
  return h;
}
let savView=[];
function wireSav(){
  document.querySelectorAll("[data-savmove]").forEach(b=>{
    b.onclick=e=>{ e.preventDefault(); openSavPicker(+b.dataset.savmove); };
  });
}
/* same picker chrome as the card, deliberately fed a different list */
function openSavPicker(i){
  const row=savView[i]; if(!row) return;
  const cur=savCategorize(row.desc,row), key=normMerchant(row.desc);
  const same=savView.filter(o=>normMerchant(o.desc)===key);

    `<div class="pt">${row.desc}</div>
     <div class="pd">${money(row.amt)} \u00b7 currently <b style="color:${savColor(cur)}">${cur}</b>${
       same.length>1?` \u00b7 ${same.length} like this will move together`:""}</div>
     <div class="pickgrid">${allSavCats().map(c=>
       `<button data-savpick="${c}" class="${c===cur?"cur":""}" style="color:${

  wrap.classList.add("on");

  const sadd=document.querySelector("[data-savadd]");
  if(sadd) sadd.onclick=()=>{ const n=addLabel("sav"); if(n){ S.savLearned[key]=n; save();
    closePicker(); openDrawer("sav"); toast("Moved to "+n); } };
  document.querySelectorAll("[data-savdrop]").forEach(x=>x.onclick=ev=>{
    ev.preventDefault(); ev.stopPropagation();

  });
  document.querySelectorAll("[data-savpick]").forEach(b=>b.onclick=()=>{
    S.savLearned=S.savLearned||{};
    /* A transfer gets this one row and nothing more. Writing the rule would relabel
       every other transfer in the list, including the ones that are a different
       thing entirely. */
    if(isTransfer(row.desc)){

    save(); closePicker(); openDrawer("sav");

          :(same.length>1?same.length+" moved to "+b.dataset.savpick:"Moved to "+b.dataset.savpick));
  });
}

function openDrawer(w){
  const titles={rec:"Recurring items",ins:"Check-up",bonus:S.bonus.name,feed:"Feed me info",
                sync:"Sync across devices",budget:"Budget adjustment",adv:"Advanced",
                match:"Does this look right?",bank:"Account activity",sav:"Savings activity",

      nav.cat?catHTML():nav.month?monthHTML():cardHTML()):insHTML();

  else wireIns();
  drawer.classList.add("open"); scrim.classList.add("on");
  tabifyDrawer();
  /* park focus at the top of the panel so the first Tab lands on the first control
     rather than dropping the user into whichever text field happens to be first */
  const db=document.getElementById("dbody");
  if(db) db.focus({preventScroll:true});
}
/* anything in here with a click handler of its own can be reached and fired from
   the keyboard. `el.onclick` is truthy only where the code assigned one, which is
   how every clickable row in these panels is wired. */
function tabifyDrawer(){
  const db=document.getElementById("dbody"); if(!db) return;
  db.querySelectorAll("*").forEach(el=>{
    if(!el.onclick) return;
    if(el.matches("button,input,select,textarea,label,a")) return;
    el.tabIndex=0; el.setAttribute("role","button");
  });
}
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("on"); }

function wireRec(){
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.r,r=S.rules.find(x=>x.id===id);
    card.querySelector(".chead").onclick=()=>card.classList.toggle("open");
    const g=f=>card.querySelector(`[data-f="${f}"]`);
    g("indef").onchange=e=>{const ee=g("end");ee.disabled=e.target.checked;if(e.target.checked)ee.value="";};
    /* Which field sits beside "Every" is decided when the card is drawn: a day of the
       month for monthly, an exact date for biweekly. Cadence was only read on Apply,
       so switching a new rule to biweekly left "Day of month" on screen and there was
       nowhere to put the date — Apply then found no anchor field and saved nothing.
       Redraw on change, carrying the two fields most likely to be half-typed. */
    g("cadence").onchange=()=>{
      r.name=g("name").value.trim()||r.name;
      r.kind=g("kind").value;
      r.cadence=g("cadence").value;
      save(); openDrawer("rec");
      const c=document.querySelector(`[data-r="${id}"]`); if(c) c.classList.add("open");
    };
    card.querySelector("[data-more]").onclick=ev=>{
      ev.preventDefault(); card.querySelector(".more").classList.toggle("open"); };
    card.querySelector("[data-addstep]").onclick=()=>{
      /* a change dated at the very end of the plan is no use to anyone. Put it a
         month past the last one there is, which is where the next change goes. */
      const last=r.schedule[r.schedule.length-1];
      r.schedule.push({from:nextMonth(last?last.from:(S.meta.recordsFrom||S.meta.start)),
                       amount:last?last.amount:0});
      save(); openDrawer("rec"); document.querySelector(`[data-r="${id}"]`).classList.add("open");
    };
    card.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
      r.schedule.splice(+b.dataset.rm,1); save(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open");
    });
    card.querySelector("[data-dup]").onclick=()=>{
      /* a fresh id, and a deep copy of the schedule — sharing the array meant editing
         one person's amounts moved the other's too */
      const copy=JSON.parse(JSON.stringify(r));
      copy.id=uid(); copy.name=r.name+" copy"; copy.sort=r.sort+1;
      S.rules.push(copy); S.rules.sort((a,b)=>a.sort-b.sort);
      save(); render(); openDrawer("rec");
      toast("Copied — rename it and set its own date and amount");
    };
    card.querySelector("[data-del]").onclick=()=>{
      if(!confirm(`Delete "${r.name}" from every month?`)) return;
      S.rules=S.rules.filter(x=>x.id!==id); save(); render(); openDrawer("rec"); toast("Deleted");
    };
    card.querySelector("[data-apply]").onclick=()=>{
      r.name=g("name").value.trim()||r.name;
      r.kind=g("kind").value;
      r.cadence=g("cadence").value;
      if(g("day")) r.day=+g("day").value||1;
      /* Biweekly used to carry a separate "any payday you know" beside the cadence,
         which sat next to a Starts date meaning almost the same thing. There is one
         date now: Starts. It is normalised to a full date on the way in, because
         occDatesRaw() feeds the anchor to `new Date()` and "2026-01T12:00:00" is not
         valid ISO 8601. V8 parses it leniently anyway; JavaScriptCore historically
         does not, and an Invalid Date there yields no occurrences at all — a bug
         that would appear only on the phone. Normalising costs nothing either way. */
      if(r.cadence==="biweekly") r.anchor=dateVal(r.start,"first");
      if(g("months")) r.months=g("months").value.split(",").map(n=>+n.trim()).filter(n=>n>=1&&n<=12);
      r.start=g("start").value.trim()||r.start;
      r.end=g("indef").checked?null:(g("end").value.trim()||null);
      r.manual=g("manual").checked;
      r.account=g("account").value;
      r.offbook=g("offbook").checked;
      r.cap=parseFloat(g("cap").value)||null;
      r.payoff=parseFloat(g("payoff").value)||null;
      card.querySelectorAll('[data-s="from"]').forEach(i=>{r.schedule[+i.dataset.i].from=i.value.trim();});
      card.querySelectorAll('[data-s="amount"]').forEach(i=>{
        const v=signed(i.value,r.kind==="income"?1:-1); r.schedule[+i.dataset.i].amount=v===null?0:v;});
      r.schedule.sort((a,b)=>cmpYM(a.from,b.from));
      syncFirstStep(r);          /* the opening amount follows the start date */
      save(); render(); openDrawer("rec");
      document.querySelector(`[data-r="${id}"]`).classList.add("open"); toast("Updated");
    };
  });
  document.getElementById("addRule").onclick=()=>{
    const n=prompt("Name it"); if(!n) return;
    const mx=Math.max(...S.rules.filter(x=>x.sort<9000).map(x=>x.sort));
    /* a brand new rule starts where the records do, not where the plan's first
       column sits — those differ now that there's a wall */
    const st0=S.meta.recordsFrom||S.meta.start;
    S.rules.push({id:uid(),name:n,kind:"expense",cadence:"monthly",day:1,start:st0,end:null,
                  sort:mx+10,schedule:[{from:st0,amount:0}]});
    S.rules.sort((a,b)=>a.sort-b.sort);
    save(); render(); openDrawer("rec");
    const nc=document.querySelector(`[data-r="${S.rules[S.rules.length-1].id}"]`);
    if(nc) nc.classList.add("open");        /* open it so there is something to type into */
    toast("Added — fill it in, then Apply");
  };
  const bind=(el,fn)=>{el.onchange=()=>{fn(el.value);save();render();};};
  bind(document.getElementById("mTitle"),v=>{ S.meta.title=v.trim()||"Household Budget"; });
  document.querySelectorAll("[data-acct]").forEach(i=>{
    i.onchange=()=>{ const k=i.dataset.acct, v=i.value.trim();
      if(v) S.accountNames[k]=v; else delete S.accountNames[k];
      save(); render(); openDrawer("rec"); };
  });
  bind(document.getElementById("mOpen"),v=>S.meta.opening=parseFloat(v)||0);
  bind(document.getElementById("mRF"),v=>{if(/^\d{4}-\d{2}$/.test(v))S.meta.recordsFrom=v;});
  bind(document.getElementById("mBuf"),v=>S.meta.buffer=parseFloat(v)||0);
  bind(document.getElementById("mCC"), v=>S.meta.ccTarget=parseFloat(v)||5000);
  bind(document.getElementById("mEnd"),v=>{if(/^\d{4}-\d{2}$/.test(v))S.meta.end=v;});
}

async function readOne(f){

      if(res.error||!res.rows.length) throw new Error(res.error||"no charges found");

      row.guessed=guessed;

      row.due=(res.dates&&res.dates.newBalance)||row.total;

      row.ok=true;

/* ============================================================
   SYNC — a private GitHub Gist holds the JSON so every device
   sees the same numbers. The token lives in its own storage key,
   never inside S, so "Save as app" can never bake it into a file.
   ============================================================ */
const SYNCKEY="budget_sync_v1", GFILE="budget.json";
let sync={token:"",gistId:"",lastPulled:0}, gistFileName=null;
try{
  /* older builds used a different key — carry those credentials over */
  const raw=localStorage.getItem(SYNCKEY)||localStorage.getItem("tull_sync_v1")||"{}";
  Object.assign(sync,JSON.parse(raw));
  if(!localStorage.getItem(SYNCKEY)&&sync.token) localStorage.setItem(SYNCKEY,JSON.stringify(sync));
}catch(e){}
/* a local copy of the last healthy thing GitHub handed us — belt to the
   gist's braces, so recovery doesn't depend on revision history. */
const BAKKEY="budget_backup_v1";
function keepBackup(o){
  try{ if(bulk(o).rows>0||bulk(o).rules>3)
    localStorage.setItem(BAKKEY,JSON.stringify({at:Date.now(),state:o})); }catch(e){}
}
function readBackup(){ try{ return JSON.parse(localStorage.getItem(BAKKEY)); }catch(e){ return null; } }
function saveSync(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(sync)); }catch(e){} }
const syncOn=()=>!!(sync.token&&sync.gistId);

let pillTimer=null;
function pill(html,sticky){

  el.innerHTML=html; el.classList.add("show");

function setSync(kind,msg){

}
const isFileURL=()=>location.protocol==="file:";
/* a sandboxed frame reports a null origin — same practical result as file:// */
const isSandboxed=()=>{ try{ return window.origin==="null"||location.origin==="null"||window!==window.top; }catch(e){ return true; } };
const netBlocked=()=>isFileURL()||isSandboxed();
function whereAmI(){
  if(isFileURL()) return {ok:false,what:"a local file on your device",why:"file:// pages aren't allowed to call other sites"};
  if(isSandboxed()) return {ok:false,what:"a preview window inside another app",why:"previews run sandboxed, so outside connections are blocked"};
  return {ok:true,what:location.origin,why:""};
}
function gh(path,opts){
  if(netBlocked()) return Promise.reject(new Error("FILEURL"));
  return fetch("https://api.github.com"+path,Object.assign({},opts,{
    headers:Object.assign({Authorization:"Bearer "+sync.token,
      Accept:"application/vnd.github+json","Content-Type":"application/json"},(opts&&opts.headers)||{})}));
}
function netMsg(e){
  if(e&&e.message==="FILEURL") return "needs a web address, not a local file";
  if(e instanceof TypeError||/load failed|failed to fetch|network/i.test(e&&e.message||""))
    return "couldn't reach GitHub — check the connection";
  return (e&&e.message)||"something went wrong";
}
async function ghRead(){
  const r=await gh("/gists/"+sync.gistId,{method:"GET"});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":r.status===404?"Gist not found":"GitHub error "+r.status);
  const j=await r.json(), files=j.files||{};
  const key=files[GFILE]?GFILE:Object.keys(files).find(k=>/\.json$/i.test(k));
  const f=key&&files[key];
  if(!f) throw new Error("That gist has no .json file");
  gistFileName=key;
  let c=f.content;
  if(f.truncated&&f.raw_url) c=await (await fetch(f.raw_url)).text();
  return JSON.parse(c);
}
async function ghWrite(state){
  const r=await gh("/gists/"+sync.gistId,{method:"PATCH",
    body:JSON.stringify({files:{[gistFileName||GFILE]:{content:JSON.stringify(state,null,2)}}})});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":"GitHub error "+r.status);
  return r.json();
}
async function ghCreate(state){

  return r.json();
}
const ts=o=>(o&&o.meta&&o.meta.savedAt)||0;
/* how much substance a copy actually carries */
function bulk(o){
  const st=(o&&o.stmts)||{}; let rows=0;
  for(const k in st) rows+=((st[k]&&st[k].rows)||[]).length;
  return {rules:((o&&o.rules)||[]).length, stmts:Object.keys(st).length, rows};
}
/* Would sending `mine` destroy most of what's already on GitHub? The timestamp
   guard below can't catch this on its own: save() stamps savedAt to now before
   pushing, so a device holding almost nothing still looks like the newest copy. */
function wouldGut(mine,theirs){
  const a=bulk(mine), b=bulk(theirs);
  if(b.rows>40 && a.rows<b.rows*0.5)    return b.rows+" statement rows down to "+a.rows;
  if(b.stmts>2  && a.stmts<b.stmts*0.5) return b.stmts+" statements down to "+a.stmts;
  if(b.rules>3  && a.rules<b.rules*0.5) return b.rules+" budget lines down to "+a.rules;
  return null;
}
/* nothing automatic may write until this device has actually heard from GitHub */

async function syncPull(quiet){

      setSync("ok","pulled newer copy");
      if(!quiet) toast("Loaded the newer copy");
    } else {
      sync.lastPulled=ts(remote); saveSync(); pulledOK=true; keepBackup(remote);
      setSync("ok", ts(S)>ts(remote) ? "local is newer" : "up to date");
    }

}
async function syncPush(force){

    try{ remote=await ghRead(); }catch(e){}

      }

/* ---------- SimpleFIN client ----------
   The access URL is the credential. Its own key, never in the state object,
   so exporting a copy with data baked in can't carry it. */
const SFKEY="budget_sfin_v1";
let sfin=(()=>{ try{ return JSON.parse(localStorage.getItem(SFKEY))||{}; }catch(e){ return {}; } })();
function saveSfin(){ try{ localStorage.setItem(SFKEY,JSON.stringify(sfin)); }catch(e){} }
function sfinOn(){ return !!sfin.accessUrl; }
/* fetch() refuses a URL with user:pass@ in it, so split them out by hand */
function sfinParts(){
  const u=new URL(sfin.accessUrl);
  const auth="Basic "+btoa(decodeURIComponent(u.username)+":"+decodeURIComponent(u.password));
  u.username=""; u.password="";
  return {base:u.toString().replace(/\/$/,""), auth};
}
async function sfinClaim(setupToken){
  const claim=atob(String(setupToken).trim());
  const r=await fetch(claim,{method:"POST"});
  if(!r.ok) throw new Error("claim failed ("+r.status+") — setup tokens work once only");
  const url=(await r.text()).trim();
  if(!/^https:\/\//.test(url)) throw new Error("that didn't come back as a URL");
  sfin.accessUrl=url; sfin.lastErr=""; saveSfin();
  return url;
}
/* The bridge allows 24 calls a day and disables tokens for sustained overage.
   The counter lives in synced state on purpose: three devices each keeping their
   own tally would quietly spend 72. Local day boundary, which is what we care about. */
const SFIN_CAP=24;
function sfinDay(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sfinLeft(){
  const q=S.meta.sfinQuota;
  if(!q||q.day!==sfinDay()) return SFIN_CAP;
  return Math.max(0,SFIN_CAP-(q.used||0));
}
/* claim one before spending it, so a failed call still counts against the bridge */
function sfinSpend(){
  const d=sfinDay(), q=S.meta.sfinQuota;
  S.meta.sfinQuota=(q&&q.day===d)?{day:d,used:(q.used||0)+1}:{day:d,used:1};
  localSave();
}
/* a payment isn't spending — it just moves the balance */
let sfinRaw=null;
const SFIN_PAYMENT=/\b(payment|autopay|thank you|pymt|e-?payment)\b/i;
async function sfinPull(quiet){
  if(!sfinOn()) return;
  if(syncOn()&&!pulledOK&&quiet) return;   /* automatic runs wait for a verified pull */
  if(sfinLeft()<=0){
    setSync("warn","card checks used up for today");
    if(!quiet) toast("That's all "+SFIN_CAP+" card checks for today");
    return;
  }
  sfinSpend();
  const c=liveCycle();
  const SFIN_OVERLAP_DAYS=5;
  const fromD=new Date(c.start+"T00:00:00");
  fromD.setDate(fromD.getDate()-SFIN_OVERLAP_DAYS);
  const from=Math.floor(fromD.getTime()/1000);
  setSync("busy","card feed…");
  try{
    const {base,auth}=sfinParts();
    const r=await fetch(base+"/accounts?start-date="+from,{headers:{Authorization:auth}});
    if(!r.ok) throw new Error("card feed said "+r.status);
    const j=await r.json();
    sfinRaw=j;                                   /* memory only — never saved, never exported */
    const errs=[].concat(j.errors||[],j.errlist||[]).filter(Boolean);
    const endMs=new Date(c.end+"T23:59:59").getTime();
    const startMs=new Date(c.start+"T00:00:00").getTime();
    const rows=[], seen={};
    /* remember what's on the token so the roles can be set without another call */
    S.meta.acctList=(j.accounts||[]).map(a=>({id:String(a.id||a.name),
      name:a.name||"Account", org:(a.org&&(a.org.name||a.org.domain))||"",
      balance:Number(a.balance)}));
    const bankRowsNew=[]; let bankBal=null;
    const savRowsNew=[]; let savBal=null;
    (j.accounts||[]).forEach(a=>{
      const role=acctRole(String(a.id||a.name));
      if(role==="off"||role==="new") return;      /* nothing until it's been named */
      if(role==="savings"){
        /* Its own balance, its own rows, and it returns before it can reach either
           bankBal or the statement builder below. That early return IS the feature. */
        if(!isNaN(Number(a.balance))) savBal=(savBal||0)+Number(a.balance);
        (a.transactions||[]).forEach(t=>{
          const when=Number(t.posted||t.transacted_at||0)*1000;
          if(!when) return;
          savRowsNew.push({date:new Date(when).toISOString().slice(0,10),
                           amt:Number(t.amount||0),
                           desc:String(t.description||t.payee||"").trim()});
        });
        return;
      }
      if(role==="bank"){
        /* the account the bills actually leave from */
        if(!isNaN(Number(a.balance))) bankBal=(bankBal||0)+Number(a.balance);
        (a.transactions||[]).forEach(t=>{
          const when=Number(t.posted||t.transacted_at||0)*1000;
          if(!when) return;
          bankRowsNew.push({date:new Date(when).toISOString().slice(0,10),
                            amt:Number(t.amount||0),
                            desc:String(t.description||t.payee||"").trim()});
        });
        return;
      }
      (a.transactions||[]).forEach(t=>{
        /* POSTED date decides which statement a charge lands on — that's how
           Capital One cuts the bill, so it's how we have to cut it too. The
           purchase date is only a fallback for rows that arrive without one. */
        const when=Number(t.posted||t.transacted_at||0)*1000;
        if(!when||when<startMs||when>endMs) return;
        const desc=String(t.description||t.payee||"").trim();
        if(SFIN_PAYMENT.test(desc)) return;

        if(!amt) return;

        const sig=when+"|"+amt.toFixed(2)+"|"+desc.toLowerCase();

      /* keep two months of history — enough to match this month and see last */
      const keep=prevMonth(NOW);
      S.bank={at:Date.now(), rows:bankRowsNew.filter(x=>cmpYM(x.date.slice(0,7),keep)>=0)};
    }
    if(savBal!==null){

      const keepS=prevMonth(NOW);
      S.sav={at:Date.now(), rows:savRowsNew.filter(x=>cmpYM(x.date.slice(0,7),keepS)>=0)};
    }

    const held=S.stmts[c.bill];
    if(held&&!held.live){ setSync("ok","statement already filed"); return; }
    /* any month that has rolled out of the live window stops updating */
    Object.keys(S.stmts).forEach(k=>{ if(k!==c.bill&&S.stmts[k]&&S.stmts[k].live) delete S.stmts[k].live; });
    S.stmts[c.bill]={rows, live:true, source:"feed", cycle:{start:c.start,end:c.end},
                     pulledAt:Date.now()};
    const fresh=newAccts();
    sfin.lastPull=Date.now(); sfin.lastErr=errs.length?String(errs[0]):""; saveSfin();
    save(); render();
    setSync(errs.length?"warn":"ok", errs.length?String(errs[0]).slice(0,40):"card feed updated");
    if(!quiet) toast(rows.length+" charges · "+money(-rows.reduce((a,x)=>a+x.amt,0)));
    /* a new account on the token needs naming before it can do anything */
    if(fresh.length){
      setSync("warn",fresh.length+" account"+(fresh.length===1?"":"s")+" to sort out");

      setTimeout(()=>openDrawer("sync"),400);
      return;

    /* asked for by hand? show what the bank turned up straight away */
    if(propCount()){
      if(!quiet) setTimeout(()=>openDrawer("match"),400);
      else toast(propCount()+" to confirm from your bank");
    }
  }catch(e){
    sfin.lastErr=e.message; saveSfin();
    setSync("err",e.message.slice(0,40));
    if(!quiet) toast(e.message);
  }
}

function monthLen(d){ return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
/* which of the four moods fits where the live cycle currently sits */
function nudgeBucket(d){
  /* the day the cycle turns over gets its own announcement, and it fires whether
     or not there's a target or a feed yet — there's nothing to measure on day one */
  if(d.getDate()===CYCLE_DAY) return "cycle";
  const tgt=effTarget(liveCycle(d).spend), lt=liveTotal();
  if(!tgt||lt===null) return null;
  const pct=Math.abs(lt)/tgt, day=d.getDate(), left=monthLen(d)-day;
  if(pct>=1) return "blown";
  if(day<=12&&pct>=0.45) return "early";
  if(left<=8&&pct>=0.85) return "close";
  return "good";
}
/* The number, every time. A queued message carries whatever was true when it was
   queued — ntfy delivers fixed text — so the silent one, which is deliberately
   two days stale, says as much rather than stating an old figure as fact. */
function buddyTail(b){
  const lt=liveTotal();
  if(lt===null) return "";
  const spent=money(Math.abs(lt));
  const tgt=effTarget(liveCycle().spend);
  const of=tgt?" of "+money(tgt):"";
  return b==="silent"
    ? " last number I had was "+spent+of+" on this cycle."
    : " we're at "+spent+of+" on the card this cycle.";
}
/* Random with a memory. Straight Math.random() repeats a line every few days and
   it reads like a bug even when it isn't. The last dozen picks are off the table. */
function pickFresh(arr,key){
  if(!S.meta.buddySeen||typeof S.meta.buddySeen!=="object") S.meta.buddySeen={};
  const seen=S.meta.buddySeen[key]||[];
  let pool=arr.filter(t=>!seen.includes(t));
  if(!pool.length) pool=arr;                       /* used them all — start over */
  const out=pool[Math.floor(Math.random()*pool.length)];
  S.meta.buddySeen[key]=[out].concat(seen).slice(0,Math.min(12,arr.length-1));
  return out;
}
function buddyLine(b){

   NOT — both copies arrived. So nothing here trusts replace. Every requeue is an
   explicit DELETE first, and a message is only published once the cancel came
   back clean. Worst case we lose a nudge; we never send two. */

  for(const [n,want] of slots){
    const day=addDays(d,n), id=seqFor(day), have=q[id];
    if(have&&have.sig===want&&!have.unsure) continue;   /* already says exactly this */
    if(have&&have.stuck) continue;                      /* a cancel already failed here */
    await fill(id,want,at8pm(day));
  }

  /* THE SAFETY NET. 8pm has been and gone — did today actually get one? A record
     that was published for tonight has fired by now. Anything else means the day
     was about to pass in silence, so send it immediately. */
  if(d.getHours()>=NUDGE_HOUR&&S.meta.buddyDay!==today){
    const rec=q[todayId];
    if(rec&&!rec.unsure){ S.meta.buddyDay=today; }
    else{
      const b=moodOf(sig);
      try{
        await ntfySend(buddyLine(b),TAGS[b]);
        S.meta.buddyDay=today; touched=true;
        q[todayId]={sig,sentNow:1};
      }catch(e){ failed=String(e.message||e); }
    }
  }

  Object.keys(q).forEach(id=>{ if(id<seqFor(d)){ delete q[id]; touched=true; } });

  ntfy.lastErr=failed;
  if(!failed&&touched) ntfy.lastSent=Date.now();
  saveNtfy();
  S.meta.buddyRan=today;
  if(touched){ S.meta.lastNudge=today; save(); }
}
/* the Send-one-now button: straight out, no delay, no sequence id, no bookkeeping */
function nudgeCheck(force,now){
  if(!ntfyOn()||netBlocked()) return Promise.resolve();
  const d=now||new Date();
  const b=nudgeBucket(d)||"good";
  return ntfySend(buddyLine(b),TAGS[b]).then(()=>{
    ntfy.lastErr=""; ntfy.lastSent=Date.now(); ntfy.lastMood=b; saveNtfy();
  }).catch(e=>{ ntfy.lastErr=String(e.message||e); saveNtfy(); });
}
