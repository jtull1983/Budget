/* ============================================================
   SYNC — a private GitHub Gist holds the JSON so every device
   sees the same numbers. The token lives in its own storage key,
   never inside S, so "Save as app" can never bake it into a file.
   ============================================================ */
const SYNCKEY="budget_sync_v1", GFILE="budget.json";
let sync={token:"",gistId:"",lastPulled:0}, gistFileName=null;
try{
  /* older builds used a different key — carry those credentials over */
  const raw=localStorage.getItem(SYNCKEY)||localStorage.getItem("tull_sync_v1")||"{}";
  Object.assign(sync,JSON.parse(raw));
  if(!localStorage.getItem(SYNCKEY)&&sync.token) localStorage.setItem(SYNCKEY,JSON.stringify(sync));
}catch(e){}
/* a local copy of the last healthy thing GitHub handed us — belt to the
   gist's braces, so recovery doesn't depend on revision history. */
const BAKKEY="budget_backup_v1";
function keepBackup(o){
  try{ if(bulk(o).rows>0||bulk(o).rules>3)
    localStorage.setItem(BAKKEY,JSON.stringify({at:Date.now(),state:o})); }catch(e){}
}
function readBackup(){ try{ return JSON.parse(localStorage.getItem(BAKKEY)); }catch(e){ return null; } }
function saveSync(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(sync)); }catch(e){} }
const syncOn=()=>!!(sync.token&&sync.gistId);

let pillTimer=null;
function pill(html,sticky){
  const el=document.getElementById("statusPill"); if(!el) return;
  el.innerHTML=html; el.classList.add("show");
  clearTimeout(pillTimer);
  if(!sticky) pillTimer=setTimeout(()=>el.classList.remove("show"),2600);
}
function setSync(kind,msg){
  if(!msg) return;
  const cls={ok:"ok",busy:"busy",err:"err",warn:"warn"}[kind]||"";
  pill(`Sync · <b class="${cls}">${msg}</b>`, kind==="busy");
}
const isFileURL=()=>location.protocol==="file:";
/* a sandboxed frame reports a null origin — same practical result as file:// */
const isSandboxed=()=>{ try{ return window.origin==="null"||location.origin==="null"||window!==window.top; }catch(e){ return true; } };
const netBlocked=()=>isFileURL()||isSandboxed();
function whereAmI(){
  if(isFileURL()) return {ok:false,what:"a local file on your device",why:"file:// pages aren't allowed to call other sites"};
  if(isSandboxed()) return {ok:false,what:"a preview window inside another app",why:"previews run sandboxed, so outside connections are blocked"};
  return {ok:true,what:location.origin,why:""};
}
function gh(path,opts){
  if(netBlocked()) return Promise.reject(new Error("FILEURL"));
  return fetch("https://api.github.com"+path,Object.assign({},opts,{
    headers:Object.assign({Authorization:"Bearer "+sync.token,
      Accept:"application/vnd.github+json","Content-Type":"application/json"},(opts&&opts.headers)||{})}));
}
function netMsg(e){
  if(e&&e.message==="FILEURL") return "needs a web address, not a local file";
  if(e instanceof TypeError||/load failed|failed to fetch|network/i.test(e&&e.message||""))
    return "couldn't reach GitHub — check the connection";
  return (e&&e.message)||"something went wrong";
}
async function ghRead(){
  const r=await gh("/gists/"+sync.gistId,{method:"GET"});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":r.status===404?"Gist not found":"GitHub error "+r.status);
  const j=await r.json(), files=j.files||{};
  const key=files[GFILE]?GFILE:Object.keys(files).find(k=>/\.json$/i.test(k));
  const f=key&&files[key];
  if(!f) throw new Error("That gist has no .json file");
  gistFileName=key;
  let c=f.content;
  if(f.truncated&&f.raw_url) c=await (await fetch(f.raw_url)).text();
  return JSON.parse(c);
}
async function ghWrite(state){
  const r=await gh("/gists/"+sync.gistId,{method:"PATCH",
    body:JSON.stringify({files:{[gistFileName||GFILE]:{content:JSON.stringify(state,null,2)}}})});
  if(!r.ok) throw new Error(r.status===401?"Token rejected":"GitHub error "+r.status);
  return r.json();
}
async function ghCreate(state){
  const r=await gh("/gists",{method:"POST",body:JSON.stringify({
    description:"Household Budget", public:false,
    files:{[GFILE]:{content:JSON.stringify(state,null,2)}}})});
  if(!r.ok) throw new Error(r.status===401?"Token rejected — needs gist permission":"GitHub error "+r.status);
  return r.json();
}
const ts=o=>(o&&o.meta&&o.meta.savedAt)||0;
/* how much substance a copy actually carries */
function bulk(o){
  const st=(o&&o.stmts)||{}; let rows=0;
  for(const k in st) rows+=((st[k]&&st[k].rows)||[]).length;
  return {rules:((o&&o.rules)||[]).length, stmts:Object.keys(st).length, rows};
}
/* Would sending `mine` destroy most of what's already on GitHub? The timestamp
   guard below can't catch this on its own: save() stamps savedAt to now before
   pushing, so a device holding almost nothing still looks like the newest copy. */
function wouldGut(mine,theirs){
  const a=bulk(mine), b=bulk(theirs);
  if(b.rows>40 && a.rows<b.rows*0.5)    return b.rows+" statement rows down to "+a.rows;
  if(b.stmts>2  && a.stmts<b.stmts*0.5) return b.stmts+" statements down to "+a.stmts;
  if(b.rules>3  && a.rules<b.rules*0.5) return b.rules+" budget lines down to "+a.rules;
  return null;
}
/* nothing automatic may write until this device has actually heard from GitHub */
let pulledOK=false;
/* The stamp this device has already tried to heal from. Without it a push the
   gut-guard refuses would be retried on every three-minute pull, toasting each
   time; with it, one attempt per edit. */
let healedAt=0;
/* Is there work on this device that GitHub has never seen? savedAt only moves on
   a real save(), so a local stamp ahead of the remote one is not a clock quirk —
   it is an edit that never got pushed. */
function needsHeal(local,remote,tried){
  if(!local||local<=remote) return false;
  return tried!==local;
}

async function syncPull(quiet){
  if(!syncOn()) return;
  setSync("busy","checking…");
  try{
    const remote=await ghRead();
    if(ts(remote)>ts(S)){
      S=remote; migrate(S); localSave(); render();
      centerNow(false);                      /* the month list just changed shape */
      sync.lastPulled=ts(remote); saveSync(); pulledOK=true; keepBackup(remote);
      setSync("ok","pulled newer copy");
      if(!quiet) toast("Loaded the newer copy");
    } else {
      sync.lastPulled=ts(remote); saveSync(); pulledOK=true; keepBackup(remote);
      /* "local is newer" was reported as an OK state and then nothing acted on it.
         That is exactly the shape of the bug it was describing: an edit made on
         the phone, stranded in that phone's localStorage, invisible everywhere
         else, and quietly overwritten the moment another device saved. A pull
         that lands here has FOUND the stranded edit, so it sends it. */
      if(needsHeal(ts(S),ts(remote),healedAt)){
        healedAt=ts(S);
        setSync("busy","local is newer \u2014 sending\u2026");
        const sent=await syncPush(false);
        if(sent&&!quiet) toast("Sent this device\u2019s newer copy");
      } else setSync("ok", ts(S)>ts(remote) ? "local is newer" : "up to date");
    }
  }catch(e){ setSync("err",netMsg(e)); }
}
async function syncPush(force){
  if(!syncOn()) return;
  setSync("busy","saving…");
  try{
    let remote=null;
    try{ remote=await ghRead(); }catch(e){}
    if(!force&&remote){
      /* someone else saved after the copy this device started from */
      if(ts(remote)>sync.lastPulled){
        setSync("warn","conflict — theirs is newer");
        toast("Someone saved a newer copy");
        return false;
      }
      /* or this device is nearly empty and about to say so, loudly, forever */
      const gut=wouldGut(S,remote);
      if(gut){
        /* This fires on the automatic push, which has no way to ask. It is the right
           call by default — a device holding almost nothing stamps itself newest and
           would otherwise overwrite everything. But a deliberate cut looks identical
           from here, so the message has to name the way through instead of just
           saying no. "Push now" passes force and skips this. */
        setSync("warn","refused \u00b7 Push now to override");
        toast("Push refused: that would cut "+gut+
              ". If you meant it, Menu \u2192 Sync \u2192 Push now.");
        return false;
      }
    }
    await ghWrite(S);
    sync.lastPulled=ts(S)||Date.now(); saveSync();
    setSync("ok","saved "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}));
    return true;
  }catch(e){ setSync("err",netMsg(e)); return false; }
}
let pushTimer=null;
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushTimer);
  setSync("busy","pending…");
  pushTimer=setTimeout(()=>{ pushTimer=null; syncPush(false); },2500);   // settle before hitting the network
}
/* The 2.5s settle is there so that dragging a slider doesn't fire twenty writes.
   It also means a change made and then immediately swiped away from never leaves
   the device: iOS suspends the page and the timer dies with it. So anything that
   takes the page away cashes the timer in first. */
function flushPush(){
  if(!pushTimer) return;
  clearTimeout(pushTimer); pushTimer=null;
  syncPush(false);
}


/* ---------- SimpleFIN client ----------
   The access URL is the credential. Its own key, never in the state object,
   so exporting a copy with data baked in can't carry it. */
const SFKEY="budget_sfin_v1";
let sfin=(()=>{ try{ return JSON.parse(localStorage.getItem(SFKEY))||{}; }catch(e){ return {}; } })();
function saveSfin(){ try{ localStorage.setItem(SFKEY,JSON.stringify(sfin)); }catch(e){} }
function sfinOn(){ return !!sfin.accessUrl; }
/* fetch() refuses a URL with user:pass@ in it, so split them out by hand */
function sfinParts(){
  const u=new URL(sfin.accessUrl);
  const auth="Basic "+btoa(decodeURIComponent(u.username)+":"+decodeURIComponent(u.password));
  u.username=""; u.password="";
  return {base:u.toString().replace(/\/$/,""), auth};
}
async function sfinClaim(setupToken){
  const claim=atob(String(setupToken).trim());
  const r=await fetch(claim,{method:"POST"});
  if(!r.ok) throw new Error("claim failed ("+r.status+") — setup tokens work once only");
  const url=(await r.text()).trim();
  if(!/^https:\/\//.test(url)) throw new Error("that didn't come back as a URL");
  sfin.accessUrl=url; sfin.lastErr=""; saveSfin();
  return url;
}
/* The bridge allows 24 calls a day and disables tokens for sustained overage.
   The counter lives in synced state on purpose: three devices each keeping their
   own tally would quietly spend 72. Local day boundary, which is what we care about. */
const SFIN_CAP=24;
function sfinDay(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sfinLeft(){
  const q=S.meta.sfinQuota;
  if(!q||q.day!==sfinDay()) return SFIN_CAP;
  return Math.max(0,SFIN_CAP-(q.used||0));
}
/* claim one before spending it, so a failed call still counts against the bridge */
function sfinSpend(){
  const d=sfinDay(), q=S.meta.sfinQuota;
  S.meta.sfinQuota=(q&&q.day===d)?{day:d,used:(q.used||0)+1}:{day:d,used:1};
  localSave();
}
/* a payment isn't spending — it just moves the balance */
let sfinRaw=null;
const SFIN_PAYMENT=/\b(payment|autopay|thank you|pymt|e-?payment)\b/i;
async function sfinPull(quiet){
  if(!sfinOn()) return;
  if(syncOn()&&!pulledOK&&quiet) return;   /* automatic runs wait for a verified pull */
  if(sfinLeft()<=0){
    setSync("warn","card checks used up for today");
    if(!quiet) toast("That's all "+SFIN_CAP+" card checks for today");
    return;
  }
  sfinSpend();
  const c=liveCycle();
  const SFIN_OVERLAP_DAYS=5;
  const fromD=new Date(c.start+"T00:00:00");
  fromD.setDate(fromD.getDate()-SFIN_OVERLAP_DAYS);
  /* One call feeds two streams with different appetites. The card only needs the
     open cycle. The account needs everything back to the records start on a first
     pull, and a generous overlap after that — rows accumulate and dedupe, so a
     window wider than the gap since the last pull costs nothing but bytes and a
     narrow one silently loses days. Whichever reaches further back wins. */
  const backD=new Date(); backD.setDate(backD.getDate()-90);
  const floorD=new Date(txFromDay()+"T00:00:00");
  const acctD=backD<floorD?floorD:backD;
  const from=Math.floor(Math.min(fromD.getTime(),acctD.getTime())/1000);
  setSync("busy","card feed…");
  try{
    const {base,auth}=sfinParts();
    const r=await fetch(base+"/accounts?start-date="+from,{headers:{Authorization:auth}});
    if(!r.ok) throw new Error("card feed said "+r.status);
    const j=await r.json();
    sfinRaw=j;                                   /* memory only — never saved, never exported */
    const errs=[].concat(j.errors||[],j.errlist||[]).filter(Boolean);
    const endMs=new Date(c.end+"T23:59:59").getTime();
    const startMs=new Date(c.start+"T00:00:00").getTime();
    const rows=[], seen={};
    /* remember what's on the token so the roles can be set without another call */
    const acctWas=(S.meta.acctList||[]).slice();
    S.meta.acctList=(j.accounts||[]).map(a=>({id:String(a.id||a.name),
      name:a.name||"Account", org:(a.org&&(a.org.name||a.org.domain))||"",
      balance:Number(a.balance)}));
    /* when these balances were actually fetched — the weekly reading refuses to
       stamp last week's numbers as this week's */
    S.meta.acctListAt=Date.now();
    /* before anything reads a role: carry them across any ids that changed */
    if(acctReseat(acctWas)) reReadAssets();
    const bankRowsNew=[]; let bankBal=null;
    (j.accounts||[]).forEach(a=>{
      const role=acctRole(String(a.id||a.name));
      if(role==="off"||role==="new") return;      /* nothing until it's been named */
      /* An asset account's balance was already captured into acctList above, and
         that is its entire contribution. Its transactions are somebody else's
         rebalancing, not your spending, and must never reach a statement. */
      if(role==="asset"||role==="loan") return;
      if(role==="bank"){
        /* the account the bills actually leave from */
        if(!isNaN(Number(a.balance))) bankBal=(bankBal||0)+Number(a.balance);
        (a.transactions||[]).forEach(t=>{
          const when=Number(t.posted||t.transacted_at||0)*1000;
          if(!when) return;
          bankRowsNew.push({date:new Date(when).toISOString().slice(0,10),
                            amt:Number(t.amount||0),
                            desc:String(t.description||t.payee||"").trim()});
        });
        return;
      }
      (a.transactions||[]).forEach(t=>{
        /* POSTED date decides which statement a charge lands on — that's how
           Capital One cuts the bill, so it's how we have to cut it too. The
           purchase date is only a fallback for rows that arrive without one. */
        const when=Number(t.posted||t.transacted_at||0)*1000;
        if(!when||when<startMs||when>endMs) return;
        const desc=String(t.description||t.payee||"").trim();
        if(SFIN_PAYMENT.test(desc)) return;
        const amt=-Number(t.amount||0);              /* purchases arrive negative */
        if(!amt) return;
        /* no stable ids from the bridge — match on what the row actually is */
        const sig=when+"|"+amt.toFixed(2)+"|"+desc.toLowerCase();
        if(seen[sig]) return; seen[sig]=1;
        rows.push({desc, amt, date:new Date(when).toISOString().slice(0,10),
                   cat:categorize(desc).cat});
      });
    });
    if(bankBal!==null){
      S.meta.liveBalance=bankBal; S.meta.liveBalanceAt=Date.now();
      /* v70 — merge, don't replace. Every pull only sees its own window, and the
         column behind it is built out of these rows, so overwriting would delete
         the past every time you checked the balance. Anything before the records
         start is dropped; everything after it is kept for good, deduped on the
         signature the tags are keyed by so a re-pull can't double a row. */
      const merged=[], seen={};
      bankRows().concat(bankRowsNew).forEach(t=>{
        if(!t||!t.date||String(t.date)<txFromDay()) return;
        const g=TXSIG(t); if(seen[g]) return; seen[g]=1; merged.push(t);
      });
      merged.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      S.bank={at:Date.now(), rows:merged};
      /* The pull is the moment rows get revised, so it is the moment to put the
         decisions back on them — and the moment a reconnect's re-sent copies
         actually arrive, so it is also the moment to fold them away. Order
         matters: txHeal first, so a tag whose row was rewritten is back on a
         live row before the sweep decides which copy carries your work. */
      txHeal();
      dupSweep();
    }
    /* a filed statement is the real thing — never overwrite one */
    const held=S.stmts[c.bill];
    if(held&&!held.live){ setSync("ok","statement already filed"); return; }
    /* any month that has rolled out of the live window stops updating */
    Object.keys(S.stmts).forEach(k=>{ if(k!==c.bill&&S.stmts[k]&&S.stmts[k].live) delete S.stmts[k].live; });
    S.stmts[c.bill]={rows, live:true, source:"feed", cycle:{start:c.start,end:c.end},
                     pulledAt:Date.now()};
    const fresh=newAccts();
    sfin.lastPull=Date.now(); sfin.lastErr=errs.length?String(errs[0]):""; saveSfin();
    save(); render();
    setSync(errs.length?"warn":"ok", errs.length?String(errs[0]).slice(0,40):"card feed updated");
    if(!quiet) toast(rows.length+" charges · "+money(-rows.reduce((a,x)=>a+x.amt,0)));
    /* a new account on the token needs naming before it can do anything */
    if(fresh.length){
      setSync("warn",fresh.length+" account"+(fresh.length===1?"":"s")+" to sort out");
      toast(fresh.length===1?"A new account showed up — tell me what it is"
                            :fresh.length+" new accounts showed up — tell me what they are");
      setTimeout(()=>openDrawer("sync"),400);
      return;
    }
    /* asked for by hand? show what the bank turned up straight away */
    if(propCount()){
      if(!quiet) setTimeout(()=>openDrawer("match"),400);
      else toast(propCount()+" to confirm from your bank");
    }
  }catch(e){
    sfin.lastErr=e.message; saveSfin();
    setSync("err",e.message.slice(0,40));
    if(!quiet) toast(e.message);
  }
}
/* Does the bank tell us WHICH card a charge came from? This shows every field
   it actually sends, so we can look instead of guess. */

/* ---------- Buddy the Budget ----------
   ntfy.sh takes a plain POST and pushes it to every phone subscribed to a topic.
   No account and no API key — which means the topic name IS the password, so it
   lives in its own storage key and never rides along in an export. */

function saveNtfy(){ try{ localStorage.setItem(NTKEY,JSON.stringify(ntfy)); }catch(e){} }
function ntfyOn(){ return !!ntfy.topic; }
function rollTopic(){
  const a="abcdefghijkmnpqrstuvwxyz23456789"; let o="";
  for(let i=0;i<10;i++) o+=a[Math.floor(Math.random()*a.length)];
  return "buddybudget-"+o;
}

function monthLen(d){ return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
/* Where we are inside the BILLING cycle, which is not the calendar month. The
   cycle runs the 4th to the 3rd, so on the 18th you are 15 days into 31 — a bit
   under half — with sixteen still to pay for. The old thresholds read the
   calendar instead: `day` was 18 and `left` was 13, which fell through every
   window and called a card at 75% "good". That is the bug. */
function cyclePos(d){
  const c=liveCycle(d);
  const noon=x=>new Date(x+"T12:00:00").getTime();
  const s=noon(c.start), e=noon(c.end);
  const now=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime();
  const len=Math.max(1,Math.round((e-s)/86400000)+1);
  const day=Math.min(len,Math.max(1,Math.round((now-s)/86400000)+1));
  return {len,day,left:len-day,through:day/len};
}
/* Which mood fits. Everything below the first two lines is a question about
   PACE, not about a total: $3,742 of $5,000 is a fine number on the 30th and an
   alarming one on the 18th, and the only thing that tells them apart is how much
   of the cycle is left to pay for. `pace` is 1.0 when spending is dead on track
   to land exactly on target; 1.5 means you're heading for half again over. */
function nudgeBucket(d){
  /* the day the cycle turns over gets its own announcement, and it fires whether
     or not there's a target or a feed yet — there's nothing to measure on day one */
  if(d.getDate()===CYCLE_DAY) return "cycle";
  const tgt=effTarget(liveCycle(d).spend), lt=liveTotal();
  if(!tgt||lt===null) return null;
  const pct=Math.abs(lt)/tgt;
  const {day,left,through}=cyclePos(d);
  const pace=through>0?pct/through:0;
  if(pct>=1) return "blown";
  /* A ratio built on almost nothing shouts at nothing: 3% of the target on day two
     is a pace of 1.9 and means only that somebody bought groceries. So pace only
     gets a voice once a fifth of the budget has actually gone.
     This replaces a `day<=3` guard that could never fire — liveCycle() holds the
     PREVIOUS cycle open for GRACE_DAYS, so the earliest day of a new cycle this
     function is ever handed is day 5. The guard read correctly and was dead. */
  const loud=pct>=0.20;
  if(loud&&pace>=1.35) return "hot";        /* on course to blow straight past it */
  if(pct>=0.80&&left<=8) return "close";    /* nearly there, nearly out of month */
  if(loud&&pace>=1.12) return "early";      /* running warm, not yet on fire */
  if(pct>=0.85) return "close";
  return "good";
}
/* The number, every time. A queued message carries whatever was true when it was
   queued — ntfy delivers fixed text — so the silent one, which is deliberately
   two days stale, says as much rather than stating an old figure as fact. */
function buddyTail(b){
  const lt=liveTotal();
  if(lt===null) return "";
  const spent=money(Math.abs(lt));
  const tgt=effTarget(liveCycle().spend);
  const of=tgt?" of "+money(tgt):"";
  if(b==="silent") return " last number I had was "+spent+of+" on this cycle.";
  let out=" we're at "+spent+of+" on the card this cycle.";
  /* The pace, out loud. A total on its own sounds fine and isn't — what makes it
     a problem is the days still to come, so the loud moods carry where this lands
     if nothing changes. Held back until a tenth of the cycle has gone, because
     before that the projection is arithmetic on nearly nothing. */
  if(tgt&&(b==="hot"||b==="early"||b==="close"||b==="blown")){
    const p=cyclePos(new Date());
    if(p.through>=0.1&&p.left>0){
      const proj=Math.abs(lt)/p.through;
      out+=" "+p.left+(p.left===1?" day":" days")+" left"
          +(proj>tgt*1.05?" \u2014 keep this pace and that's "+money(proj)+" by the 3rd.":".");
    }
  }
  return out;
}
/* Bump when the BANKS change shape. The seen-list holds positions now, and a
   position means nothing against a different array — line 40 of the old `hot`
   is line 40 of something else entirely. Rather than try to migrate it, a new
   stamp throws the whole memory away once and starts clean. */
const BANK_V="b3";
function buddyMem(){
  const m=S.meta;
  if(m.buddySeenV!==BANK_V){ m.buddySeen={}; m.buddySeenV=BANK_V; }
  if(!m.buddySeen||typeof m.buddySeen!=="object") m.buddySeen={};
  return m.buddySeen;
}
/* Random with a memory. Straight Math.random() repeats a line every few days and
   it reads like a bug even when it isn't.
   Stores INDICES, not the lines themselves. The banks are ~100 entries of ~90
   characters each and this list rides along inside the gist on every sync — a
   memory deep enough to be worth having would have been kilobytes of duplicated
   jokes. Depth scales with the bank: a third of it, floor of twelve, so the big
   moods go a month without repeating and the small ones still rotate. */
function pickFresh(arr,key){
  if(!arr||!arr.length) return "";
  const mem=buddyMem();
  const seen=Array.isArray(mem[key])?mem[key]:[];
  const all=arr.map((_,i)=>i);
  let pool=all.filter(i=>seen.indexOf(i)<0);
  if(!pool.length) pool=all;                       /* used them all — start over */
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const keep=Math.min(arr.length-1,Math.max(12,Math.round(arr.length/3)));
  mem[key]=[pick].concat(seen.filter(i=>i!==pick)).slice(0,keep);
  return arr[pick];
}
/* The same idea over a list of short stable keys rather than positions, for
   things whose candidate list changes night to night. */
function pickFreshKey(keys,key){
  if(!keys||!keys.length) return null;
  const mem=buddyMem();
  const seen=Array.isArray(mem[key])?mem[key]:[];
  let pool=keys.filter(k=>seen.indexOf(k)<0);
  if(!pool.length) pool=keys.slice();
  const pick=pool[Math.floor(Math.random()*pool.length)];
  mem[key]=[pick].concat(seen.filter(k=>k!==pick)).slice(0,4);
  return pick;
}
/* ---------- Buddy's memory ------------------------------------------------
   The line banks are jokes and the jokes are random. These are not. A fact is
   one sentence computed from real rows — this cycle's live statement and the
   closed ones behind it — and it is what makes a message sound like it has been
   paying attention rather than shouting a total.

   They are kept apart from the banks on purpose. A wrong number inside an insult
   reads as a bug in the app; the insult can be random precisely because the fact
   next to it is not. Every one of these returns null rather than guessing, so a
   thin month simply gets no fact instead of a made-up one. */

/* the cycle billed in month k, as dates. Same shape liveCycle() produces. */
function cycleSpan(bill){
  const e=parseYM(bill);
  return {start:prevMonth(bill)+"-04",
          end:String(e.y)+"-"+String(e.m).padStart(2,"0")+"-03"};
}
/* Date arithmetic on a YYYY-MM-DD string without going near toISOString(),
   which converts to UTC and can hand back yesterday. Named apart from the existing
   addDays(), which speaks in Date objects. */
function shiftDay(ds,n){
  const t=new Date(ds+"T12:00:00");
  t.setDate(t.getDate()+n);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")
        +"-"+String(t.getDate()).padStart(2,"0");
}
/* what a closed statement had run up by day `day` of its own cycle */
function spentByDay(bill,day){
  const st=S.stmts&&S.stmts[bill];
  if(!st||!st.rows||!st.rows.length) return null;
  const cut=shiftDay(cycleSpan(bill).start,day-1);
  return st.rows.filter(r=>r.date<=cut).reduce((a,r)=>a+r.amt,0);
}

/* The one that does the most work: you, this far in, against you, this far in,
   last time. Both sides are measured at the same day of their own cycle, so a
   31-day cycle and a 30-day one still compare honestly. */
function factSameDay(){
  const cyc=liveCycle(), lt=liveTotal();
  if(lt===null) return null;
  const {day}=cyclePos(new Date());
  const then=spentByDay(prevMonth(cyc.bill),day);
  if(then===null) return null;
  const now=Math.abs(lt), th=Math.abs(then);
  if(th<50) return null;                       /* nothing worth comparing to */
  const diff=now-th;
  if(Math.abs(diff)<th*0.08)
    return "same day last cycle y'all were at "+money(th)+". dead even.";
  return diff>0
    ? "same day last cycle y'all were at "+money(th)+" \u2014 you're "+money(diff)+" past that."
    : "same day last cycle y'all were at "+money(th)+" \u2014 you're "+money(-diff)+" under that.";
}
function factLastFinish(){
  const st=S.stmts&&S.stmts[prevMonth(liveCycle().bill)];
  if(!st||!st.rows||!st.rows.length) return null;
  const tot=Math.abs(st.rows.reduce((a,r)=>a+r.amt,0));
  if(tot<50) return null;
  return "last cycle closed at "+money(tot)+", if that helps.";
}
/* How it started against how it's going. The split is the midpoint of the cycle
   so far rather than a fixed day, which keeps both halves the same length and
   stops the answer from swinging on the calendar. */
function factStartVsNow(){
  const st=liveStmt(); if(!st||!st.rows.length) return null;
  const p=cyclePos(new Date());
  const half=Math.floor(p.day/2);
  if(half<4||p.day-half<4) return null;         /* too short to mean anything */
  const cut=shiftDay(cycleSpan(liveCycle().bill).start,half-1);
  const early=st.rows.filter(r=>r.date<=cut).reduce((a,r)=>a+r.amt,0);
  const late=st.rows.reduce((a,r)=>a+r.amt,0)-early;
  const rE=Math.abs(early)/half, rL=Math.abs(late)/(p.day-half);
  if(rE<5&&rL<5) return null;
  if(rL>rE*1.5)
    return "y'all opened this cycle at "+money(rE)+" a day. you're at "+money(rL)+" a day now.";
  if(rE>rL*1.5)
    return "y'all opened at "+money(rE)+" a day and cooled to "+money(rL)+". that's a real turnaround.";
  return null;
}
function factBiggest(){
  const st=liveStmt(); if(!st||!st.rows.length) return null;
  let big=null;
  st.rows.forEach(r=>{ if(r.amt>0&&(!big||r.amt>big.amt)) big=r; });
  if(!big||big.amt<40) return null;
  const who=String(big.desc||"").trim().slice(0,26);
  return "biggest single hit this cycle: "+money(big.amt)+(who?" at "+who:"")+".";
}
/* Days in a row with nothing on the card, counted back from yesterday — today is
   excluded because the feed lags and an unposted charge would read as a clean day. */
function factQuiet(){
  const st=liveStmt(); if(!st) return null;
  const days={}; st.rows.forEach(r=>{ if(r.amt>0) days[r.date]=1; });
  const start=cycleSpan(liveCycle().bill).start;
  const today=ymdLocal(new Date());
  let n=0;
  for(let i=1;i<=10;i++){
    const d=shiftDay(today,-i);
    if(d<start||days[d]) break;
    n++;
  }
  if(n<3) return null;
  return n+" days straight with nothing on the card. I noticed. \u{1F44F}";
}
function factTopCat(){
  const b=stmtBreakdown(liveCycle().bill);
  if(!b||!b.list.length) return null;
  const cat=b.list[0][0], amt=b.list[0][1];
  const tot=Math.abs(b.charged);
  if(!tot||amt<40) return null;
  const share=amt/tot;
  /* A leader has to actually LEAD. A flat 25% across four categories is what an
     even split looks like, not a category eating the cycle, and a bare 0.25 floor
     announced it as news. So it must clear both a floor and its own even share. */
  if(share<0.25||share<(1/b.list.length)*1.35) return null;
  return (cat||"one category")+" is "+Math.round(share*100)+"% of this cycle on its own, "+money(amt)+".";
}
/* The date the current rate runs into the target. Only worth saying while it's
   still ahead of you and still inside the cycle — past the line it's history,
   and beyond the cycle it isn't going to happen. */
function factCrossDate(){
  const lt=liveTotal(); if(lt===null) return null;
  const tgt=effTarget(liveCycle().spend); if(!tgt) return null;
  const p=cyclePos(new Date());
  const now=Math.abs(lt);
  if(now>=tgt||p.day<5||p.left<=0) return null;
  const rate=now/p.day; if(rate<=0) return null;
  const to=Math.ceil((tgt-now)/rate);
  if(to>p.left) return null;                    /* doesn't land inside the cycle */
  const when=shiftDay(cycleSpan(liveCycle().bill).start,p.day+to-1);
  return "at this rate y'all cross the line on "+prettyDate(when)
        +", with "+(p.left-to)+" days still to pay for.";
}

/* Which facts suit which mood. Praise for a quiet week does not belong in a
   message about being over the limit, and a projection of when you'll cross the
   line is meaningless in a month where you're comfortably under it. */
const FACTS=[{id:"same",fn:factSameDay},{id:"last",fn:factLastFinish},
             {id:"start",fn:factStartVsNow},{id:"big",fn:factBiggest},
             {id:"quiet",fn:factQuiet},{id:"cat",fn:factTopCat},
             {id:"cross",fn:factCrossDate}];
const FACT_FIT={good:["same","last","quiet","cat","big"],
                early:["same","last","start","cross","cat","big"],
                hot:["same","last","start","cross","cat","big"],
                close:["same","last","cross","cat","big"],
                blown:["same","last","start","cat","big"]};
function buddyFact(b){
  const fit=FACT_FIT[b]; if(!fit) return "";
  const got=[];
  FACTS.forEach(f=>{
    if(fit.indexOf(f.id)<0) return;
    let v=null;
    /* a fact is a nicety; one that throws must never cost you the message */
    try{ v=f.fn(); }catch(e){ v=null; }
    if(v) got.push({id:f.id,text:v});
  });
  if(!got.length) return "";
  /* Dedupe on the id, never the sentence. The text carries live dollar figures
     that move every night, so string memory would think every fact was new and
     hand you the same comparison a week running. */
  const id=pickFreshKey(got.map(g=>g.id),"fact:"+b);
  const hit=got.filter(g=>g.id===id)[0]||got[0];
  return hit.text;
}

/* Spice is on unless something explicitly turns it off. The only caller that
   turns it off is the SMS half of the Worker, and that is deliberate: the two
   channels are not equally free. */
const spiceOn=()=>S.meta.spice!==false;

/* greeting, joke, number, memory. The fact goes last because it's the part worth
   reading twice, and it's allowed to be missing — a first cycle with nothing
   behind it just gets the first three.

   `spicy` picks which banks are on the table. The freshness memory is keyed per
   bank set ("blown" vs "blown+") because the two have different lengths, and
   pickFresh stores INDICES — one key across both would have the memory pointing
   at whichever line happened to land in that slot. */
function buddyLine(b,spicy){
  const hot=spicy===undefined?spiceOn():!!spicy;
  const f=buddyFact(b);
  const hi=hot?BUDDY_HI_X:BUDDY_HI;
  const base=BUDDY[b]||BUDDY.nodata;
  /* Not concat. Pooling ~600 clean lines with the unhinged ones means the
     unhinged ones turn up about a quarter of the time, which is not what
     "filthy" means. When spice is on the clean bank is off the table entirely,
     and it stays whole and untouched for the channel that needs it. */
  const bank=hot&&BUDDY_X[b]&&BUDDY_X[b].length?BUDDY_X[b]:base;
  return pickFresh(hi,hot?"hi+":"hi")+" "+pickFresh(bank,hot?b+"+":b)
        +buddyTail(b)+(f?" "+f:"");
}
const NUDGE_HOUR=20;                       /* everything lands at 8pm local */
const ymdLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
                  +"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const at8pm=d=>Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate(),NUDGE_HOUR,0,0)/1000);
const seqFor=d=>"buddy"+ymdLocal(d).replace(/-/g,"");

/* ntfy documents that posting to <topic>/<sequence-id> replaces an undelivered
   message already sitting under that id. Tested live against ntfy.sh and it did
   NOT — both copies arrived. So nothing here trusts replace. Every requeue is an
   explicit DELETE first, and a message is only published once the cancel came
   back clean. Worst case we lose a nudge; we never send two. */
const ntfyURL=seq=>"https://ntfy.sh/"+encodeURIComponent(ntfy.topic)
                  +(seq?"/"+encodeURIComponent(seq):"");
async function ntfySend(msg,tag,seq,atEpoch,title){
  const h={"X-Title":title||"Buddy the Budget","X-Tags":tag||"moneybag"};
  if(atEpoch) h["X-Delay"]=String(atEpoch);
  const r=await fetch(ntfyURL(seq),{method:"POST",body:msg,headers:h});
  if(!r.ok) throw new Error("ntfy said "+r.status);
}
/* 404 means there was nothing under that id, which is the state we wanted anyway */
async function ntfyCancel(seq){
  const r=await fetch(ntfyURL(seq),{method:"DELETE"});
  if(!r.ok&&r.status!==404) throw new Error("ntfy said "+r.status);
  return true;
}
/* what is actually sitting on the server, undelivered. sched=1 is the only way to
   see it — a plain poll hides anything that hasn't been delivered yet. */
async function ntfyPending(){
  const r=await fetch("https://ntfy.sh/"+encodeURIComponent(ntfy.topic)
                      +"/json?poll=1&sched=1&since=all");
  if(!r.ok) throw new Error("ntfy said "+r.status);
  /* everything the topic will admit to. No filtering on `time` — a scheduled
     message may be stamped with its delivery time or its publish time depending
     on the server, and guessing wrong makes a real queue look empty. The check
     tells the two apart with a one-off title instead. */
  return (await r.text()).split("\n").filter(Boolean).map(l=>{
    try{ return JSON.parse(l); }catch(e){ return null; }
  }).filter(m=>m&&m.event==="message");
}
/* The comeback prefix. It rides tonight's queued message now rather than being
   fired off the moment the app opens, so it lands at 8pm like everything else. */
const BACK="(back at last) ";
const TAGS={good:"tada",early:"eyes",hot:"rotating_light",blown:"fire",
            close:"crossed_fingers",cycle:"calendar",silent:"see_no_evil",
            nodata:"grey_question"};

/* What the message would SAY, boiled down. Re-queue only when this changes —
   otherwise the random wording would look like new info every single hour. */
/* Bump this whenever the WORDING changes shape. Without it, messages already
   sitting at ntfy keep the old format until the number happens to move — a build
   that adds something to every message would take a day to actually show up. */
const NUDGE_FMT="pace-2";
function nudgeSig(d){
  const b=nudgeBucket(d); if(!b) return null;
  const lt=liveTotal();
  /* to the dollar. If what the app knows differs at all from what's queued for
     tonight, tonight's message gets replaced. */
  return b+"|"+(lt===null?"-":Math.round(Math.abs(lt)))+"|"+NUDGE_FMT;
}
/* every other day, 5th through the 30th. the last-sent date lives in state so it
   syncs — otherwise the phone and the Mac would each fire their own copy. */
/* Keeps three slots filled: tonight, tomorrow night, and the night after —
   that last one being the "nobody has opened this" message, which only ever
   arrives if you genuinely don't come back. Each open rewrites the ones that
   haven't fired yet, so what's pending is always as fresh as your last visit. */
/* Two timers reach this within seconds of open: the bare setTimeout at 7s and
   autoSyncTick, which gets here after its pulls. They used to overlap, both read
   a stale S.meta.buddyRan, and both send. fullSync has had a `syncing` latch for
   this exact reason; nudging is the same latch for the same reason. */
let nudging=false;
async function nudgeSchedule(now){
  if(nudging) return;
  nudging=true;
  try{ return await nudgeRun(now); }
  finally{ nudging=false; }
}
async function nudgeRun(now){
  if(!ntfyOn()||netBlocked()) return;
  if(syncOn()&&!pulledOK) return;
  const d=now||new Date(), today=ymdLocal(d);
  if(!S.meta.buddyQ||typeof S.meta.buddyQ!=="object") S.meta.buddyQ={};
  const q=S.meta.buddyQ;
  /* v26 and earlier stored a bare signature string here */
  Object.keys(q).forEach(id=>{ if(typeof q[id]==="string") q[id]={sig:q[id]}; });
  let touched=false, failed="";

  /* Gone long enough that the silent message already went out? Say hello — but
     at 8pm, like everything else. v99 sent this the instant the app opened, which
     is how a nudge that is supposed to land at 8pm arrived at 9:35 in the morning.
     Before 8pm it now rides tonight's slot. After 8pm there is no slot left to
     ride, so it still goes straight out. */
  const ran=S.meta.buddyRan;
  const gap=ran?Math.round((new Date(today)-new Date(ran))/86400000):0;
  let backNow=false;
  if(ran&&gap>=2&&S.meta.buddyBack!==today){
    /* Marked and saved BEFORE the send, never after — the same rule the Worker
       keeps in KV. A crash here costs one hello; the other order sends two. */
    S.meta.buddyBack=today; save(); touched=true;
    if(d.getHours()>=NUDGE_HOUR){
      const b=nudgeBucket(d)||"good";
      try{ await ntfySend(BACK+buddyLine(b),TAGS[b]); S.meta.buddyDay=today; }
      catch(e){ failed=String(e.message||e); }
    }else backNow=true;
  }

  /* One message a day, at 8pm, no exceptions. If there's nothing to report the
     mood is "nodata" — showing up empty-handed beats not showing up. */
  const sig=nudgeSig(d)||("nodata|"+NUDGE_FMT);
  const todayId=seqFor(d), nowSecs=Math.floor(d.getTime()/1000);
  const moodOf=w=>w==="silent"?"silent":w.split("|")[0];

  /* fill a slot: clear whatever's there, then put the current picture in it */
  const fill=async(id,want,when,pre)=>{
    const have=q[id];
    if(have){
      try{ await ntfyCancel(id); }
      catch(e){ have.stuck=1; touched=true; failed=String(e.message||e); return false; }
    }
    q[id]={sig:want,unsure:1}; touched=true;
    try{
      /* under a minute of runway is below ntfy's minimum delay — send it now
         rather than lose the day to a rejected timestamp */
      const late=when-nowSecs<60;
      await ntfySend((pre||"")+buddyLine(moodOf(want)),TAGS[moodOf(want)],id,late?0:when);
      delete q[id].unsure;
      if(late){ q[id].sentNow=1; S.meta.buddyDay=today; }
      return true;
    }catch(e){ failed=String(e.message||e); return false; }
  };

  const slots=[];
  if(d.getHours()<NUDGE_HOUR) slots.push([0,sig,backNow?BACK:""]);  /* tonight, if 8pm hasn't passed */
  slots.push([1,sig,""]);                            /* tomorrow, same picture */
  slots.push([2,"silent",""]);                       /* and if we never hear from you */
  for(const [n,want,pre] of slots){
    const day=addDays(d,n), id=seqFor(day), have=q[id];
    /* a prefix is new information even when the signature has not moved, so a
       comeback always rewrites tonight rather than leaving the plain copy up */
    if(have&&have.sig===want&&!have.unsure&&!pre) continue;
    if(have&&have.stuck) continue;                      /* a cancel already failed here */
    await fill(id,want,at8pm(day),pre);
  }

  /* THE SAFETY NET. 8pm has been and gone — did today actually get one? A record
     that was published for tonight has fired by now. Anything else means the day
     was about to pass in silence, so send it immediately. */
  if(d.getHours()>=NUDGE_HOUR&&S.meta.buddyDay!==today){
    const rec=q[todayId];
    if(rec&&!rec.unsure){ S.meta.buddyDay=today; }
    else{
      const b=moodOf(sig);
      try{
        await ntfySend(buddyLine(b),TAGS[b]);
        S.meta.buddyDay=today; touched=true;
        q[todayId]={sig,sentNow:1};
      }catch(e){ failed=String(e.message||e); }
    }
  }

  Object.keys(q).forEach(id=>{ if(id<seqFor(d)){ delete q[id]; touched=true; } });

  ntfy.lastErr=failed;
  if(!failed&&touched) ntfy.lastSent=Date.now();
  saveNtfy();
  S.meta.buddyRan=today;
  if(touched){ S.meta.lastNudge=today; save(); }
}

function wireDups(){

  };
  document.querySelectorAll("[data-dup]").forEach(b=>{
    b.onclick=()=>{

      const n=dupMerge([x]);
      toast(n===1?"Merged \u00b7 1 row removed":"Removed "+n+" rows");
    };
  });

      return;
    const n=dupMerge(g);
    toast("Removed "+n+" rows");
  };
}
function wireSync(){
  wireDups();
  const tok=document.getElementById("sTok"), gid=document.getElementById("sGist");
  document.getElementById("sConnect").onclick=async()=>{
    const t=tok.value.trim();
    if(t&&!/^•+$/.test(t)) sync.token=t;
    if(!sync.token){ toast("Paste a token first"); return; }
    sync.gistId=gid.value.trim();
    saveSync();
    if(!sync.gistId){
      setSync("busy","creating…");
      try{
        const g=await ghCreate(S);
        sync.gistId=g.id; sync.lastPulled=ts(S); saveSync();
        setSync("ok","gist created");
        toast("Created gist "+g.id.slice(0,8));
      }catch(e){ setSync("err",netMsg(e)); toast(netMsg(e)); }
    } else {
      await syncPull(true);
    }
    openDrawer("sync");
  };
  document.getElementById("sPull").onclick=()=>syncPull().then(()=>openDrawer("sync"));
  document.getElementById("sPush").onclick=()=>syncPush(true).then(()=>openDrawer("sync"));
  const off=document.getElementById("sOff");
  if(off) off.onclick=()=>{ if(confirm("Disconnect this device? The gist stays where it is.")){
    sync={token:"",gistId:"",lastPulled:0}; saveSync(); setSync("ok",""); openDrawer("sync"); toast("Disconnected"); } };
  const sfc=document.getElementById("sfConnect");
  if(sfc) sfc.onclick=async()=>{
    const v=document.getElementById("sfTok").value.trim();
    if(!v){ toast("Paste the setup token first"); return; }
    setSync("busy","connecting card…");
    try{ await sfinClaim(v); await sfinPull(); toast("Card connected"); }
    catch(e){ setSync("err",e.message.slice(0,40)); toast(e.message); }
    openDrawer("sync");
  };
  const ntr=document.getElementById("ntRoll"), nts=document.getElementById("ntSave");
  if(ntr) ntr.onclick=()=>{ document.getElementById("ntTopic").value=rollTopic(); };
  if(nts) nts.onclick=()=>{
    const v=document.getElementById("ntTopic").value.trim();
    if(v.length<8){ toast("Make it longer than that"); return; }
    ntfy.topic=v; saveNtfy(); openDrawer("sync"); toast("Buddy is listening");
  };
  const ntc=document.getElementById("ntCopy");
  if(ntc) ntc.onclick=async()=>{
    try{ await navigator.clipboard.writeText(ntfy.topic); toast("Topic copied"); }
    catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("ntShow"));
      getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected — copy it"); }
  };
  const ntt=document.getElementById("ntTest"), nto=document.getElementById("ntOff");
  if(ntt) ntt.onclick=()=>nudgeCheck(true).then(()=>{ openDrawer("sync");
    toast(ntfy.lastErr?"Didn't send":"Sent"); });
  /* Publish, look, publish again, look, cancel, look. Everything is scheduled a
     quarter of an hour out and cancelled at the end, so nothing reaches a phone
     unless a step genuinely failed — in which case the message says so. */
  const nsc=document.getElementById("ntSched");
  if(nsc) nsc.onclick=async()=>{
    const box=document.getElementById("ntDiag");
    const line=(k,v,ok)=>`<div class="dline"><span>${k}</span><span class="${
      ok===true?"yes":ok===false?"no":"maybe"}">${v}</span></div>`;
    const say=t=>box.innerHTML=`<div class="flag"><div class="ft">Checking</div>
      <div class="fb">${t}</div></div>`;
    say("talking to ntfy…");
    /* a title nothing else can wear, so anything matching is from this run and
       no timestamp guessing is needed */
    const seq="buddydiag", at=Math.floor(Date.now()/1000)+900;
    const T="Buddy diagnostics "+Math.random().toString(36).slice(2,6);
    let seen=0;
    const read=async()=>{ const all=await ntfyPending(); seen=all.length;
                          return all.filter(m=>m.title===T).length; };
    /* ntfy writes to its message cache in batches, so a message published a
       moment ago is not in a poll yet. Reading straight back said "can't see it"
       about a queue that was really there. Give it a few seconds before judging. */
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const settle=async(want,tries)=>{
      let n=await read();
      for(let i=0;i<(tries||5)&&!want(n);i++){ await sleep(1500); n=await read(); }
      return n;
    };
    let h="";
    try{
      await ntfyCancel(seq);
      await ntfySend("If this reaches a phone, cancelling failed.","wrench",seq,at,T);
      say("waiting for ntfy to show it…");
      const a=await settle(n=>n>=1,5);
      const blind=a===0;      /* the topic won't show us its queue */
      h+=line("Scheduled one",
              a===1?"the server has it":blind?"can't see it":"server shows "+a,
              a===1?true:blind?null:false);
      await ntfySend("Second one, same id.","wrench",seq,at,T);
      say("sent a second under the same id…");
      /* look for a duplicate rather than for the first copy: if one never turns
         up, replace did its job */
      const b=await settle(n=>n>=2,4);
      h+=line("Sent a second under that id",
              blind?"can't tell":b===1?"replaced the first":"server now holds "+b,
              blind?null:b===1);
      await ntfyCancel(seq);
      say("cancelling…");
      const c=await settle(n=>n===0,4);
      h+=line("Cancelled it",
              blind?"delete sent":c===0?"gone":"still holding "+c,
              blind?null:c===0);
      h+=`<div class="dnote">${blind
        ? `The topic answered with ${seen} message${seen===1?"":"s"}, so the
           connection is fine — it just never showed the two this check queued,
           even after waiting. Nothing here is broken by that: the app cancels
           before every requeue, so a replace that doesn't work still can't
           produce two messages.`
        : `Either way the app cancels before it requeues, so a broken replace
           can't make two messages. The topic is holding ${seen} message${
           seen===1?"":"s"} in total.`}</div>`;
      box.innerHTML=`<div class="flag ${blind?"":"good"}"><div class="ft">ntfy queue check</div>
        <div class="fb">${h}</div></div>`;
    }catch(e){
      box.innerHTML=`<div class="flag bad"><div class="ft">ntfy queue check</div>
        <div class="fb">${h}${line("Stopped",String(e.message||e),false)}</div></div>`;
      try{ await ntfyCancel(seq); }catch(_){}
    }
  };
  if(nto) nto.onclick=()=>{ ntfy={}; saveNtfy(); openDrawer("sync"); toast("Buddy off"); };
  const sfk=document.getElementById("sfPeek");
  if(sfk) sfk.onclick=()=>{
    const box=document.getElementById("sfPeekBox");
    box.style.display=box.style.display==="none"?"":"none";
    document.getElementById("sfPeekBody").innerHTML=sfinPeekHTML();
  };
  wireAcct();
  wireHand();          /* v87 — these buttons rendered dead from v84 until now */
  wireLiveLoan();      /* v88 — moved out of the Assets pane */
  wireSMS();           /* v95 */
  /* Folds are toggled in place rather than by re-rendering the panel: a redraw
     would throw away a half-typed token. */
  document.querySelectorAll("#dbody .acch").forEach(hd=>{
    hd.onclick=()=>{
      const box=hd.parentNode, id=box.dataset.acc;
      syncOpen[id]=!syncOpen[id];
      box.classList.toggle("on",!!syncOpen[id]);
      const x=hd.querySelector(".accx");
      if(x) x.textContent=syncOpen[id]?"\u2212":"+";
    };
  });
  const sfp=document.getElementById("sfPull");
  if(sfp) sfp.onclick=()=>sfinPull().then(()=>openDrawer("sync"));
  const sfo=document.getElementById("sfOff");
  if(sfo) sfo.onclick=()=>{ if(confirm("Disconnect the card feed? Charges already pulled stay put.")){
    sfin={}; saveSfin(); openDrawer("sync"); toast("Card disconnected"); } };
}


/* ============================================================
   CARD YEAR REVIEW
   A statement paid in month M covers the month before it, so a
   calendar year of spending runs Feb..Jan of the following year.
   ============================================================ */
function prevMonth(k){ const {y,m}=parseYM(k); return m===1?ym(y-1,12):ym(y,m-1); }
function spendYearOf(k){ return parseYM(prevMonth(k)).y; }

function cardYear(y){
  const keys=Object.keys(S.stmts)
    .filter(k=>S.stmts[k]&&S.stmts[k].rows&&S.stmts[k].rows.length&&spendYearOf(k)===y)
    .sort();
  const closer=ym(y+1,1);                       /* the statement holding December */
  const complete=keys.includes(closer);
  const by={}, months=[], merchants={};
  let charged=0, credits=0;
  keys.forEach(k=>{
    const st=S.stmts[k]; let mTot=0;
    st.rows.forEach(r=>{
      by[r.cat]=(by[r.cat]||0)+r.amt; mTot+=r.amt;
      if(r.amt>0){ charged+=r.amt; const m=normMerchant(r.desc); merchants[m]=(merchants[m]||0)+r.amt; }
      else credits+=r.amt;
    });
    months.push({filed:k, spend:prevMonth(k), total:mTot});
  });
  const total=charged+credits;
  return {y,keys,complete,closer,total,charged,credits,months,
    cats:Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]),
    top:Object.entries(merchants).sort((a,b)=>b[1]-a[1]).slice(0,8),
    avg: months.length?total/months.length:0};
}
function cardTx(y,cat,spendMonth){
  const out=[];
  Object.keys(S.stmts).filter(k=>spendYearOf(k)===y).sort().forEach(k=>{
    const st=S.stmts[k]; if(!st||!st.rows) return;
    if(spendMonth&&prevMonth(k)!==spendMonth) return;
    st.rows.forEach((r,i)=>{ if(!cat||r.cat===cat) out.push({...r,filed:k,spend:prevMonth(k),idx:i}); });
  });
  return out.sort((a,b)=>b.amt-a.amt);
}
/* every category present, biggest first — nothing dropped */
function catsOf(tx){
  const by={}; tx.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.amt);
  return Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]);
}
/* what every category has to come down to so the card lands on target,
   with one category (groceries by default) left alone */
function trimPlan(){
  const keys=Object.keys(S.stmts||{}).filter(k=>S.stmts[k]&&S.stmts[k].rows&&S.stmts[k].rows.length&&!S.stmts[k].live);
  if(keys.length<2) return null;
  const by={}; let tot=0;
  keys.forEach(k=>S.stmts[k].rows.forEach(r=>{ by[r.cat]=(by[r.cat]||0)+r.amt; tot+=r.amt; }));
  const n=keys.length, avgTot=tot/n, hold=S.meta.holdCat||"Groceries";
  const avg={}; Object.entries(by).forEach(([c,v])=>avg[c]=v/n);
  const keep=avg[hold]||0, rest=avgTot-keep, room=(S.meta.ccTarget||5000)-keep;
  const f=rest>0?Math.max(0,room/rest):0;
  const rows=Object.entries(avg).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{
    const t=c===hold?v:v*f;
    return {cat:c,now:v,target:t,cut:v-t,held:c===hold};
  });
  return {n,avgTot,hold,keep,room,f,rows,target:S.meta.ccTarget||5000,
          over:avgTot-(S.meta.ccTarget||5000)};
}
function cardBtnState(){
  const y=YEAR, d=cardYear(y);
  if(d.keys.length<2) return {label:"Spending so far", mode:"waiting", d};
  if(d.complete)      return {label:y+" card review",     mode:"review",  d};
  return {label:"Spending so far", mode:"partial", d};
}

  h+=`</div></div>`;

  const mx=Math.max(...d.months.map(m=>Math.abs(m.total)),1);

/* every charge in the month, newest first, grouped by the day it landed */
/* Only the card feed hands over ISO dates. A parsed statement keeps whatever the
   PDF or CSV said — "07/05", "7/5/26", "Jul 05" — and often no year at all, which
   is why feeding it straight to `new Date()` printed "Invalid Date" down the whole
   month. Normalise here rather than at import, so statements already in the gist
   are fixed too. */
const MON3=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function isoDay(raw,spendMonth){
  if(!raw) return null;
  const s=String(raw).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0];
  let mm=0,dd=0,yy=null;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if(m){ mm=+m[1]; dd=+m[2]; if(m[3]) yy=+m[3]; }
  else{
    m=s.match(/^([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?$/);
    if(m){ mm=MON3.indexOf(m[1].toLowerCase())+1; dd=+m[2]; if(m[3]) yy=+m[3]; }
  }
  if(!mm||!dd||mm>12||dd>31) return null;
  if(yy!==null&&yy<100) yy+=2000;
  if(yy===null){
    /* no year on the row. A cycle straddles two months, so try the obvious
       candidates and keep whichever lands nearest the month being shown. */
    if(!spendMonth) return null;
    const {y}=parseYM(spendMonth), mid=new Date(spendMonth+"-15T12:00:00").getTime();
    let best=null, bestGap=Infinity;
    [y-1,y,y+1].forEach(cy=>{
      const gap=Math.abs(new Date(cy,mm-1,dd,12).getTime()-mid);
      if(gap<bestGap){ bestGap=gap; best=cy; }
    });
    yy=best;
  }
  return yy+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
}
function timelineHTML(tx){
  if(!tx.length) return `<div class="hint">Nothing on the card this month yet.</div>`;
  const byDay={}, label={};
  tx.forEach(r=>{
    const iso=isoDay(r.date,r.spend);
    /* anything unreadable keeps its own row under the text the statement gave,
       and sorts to the bottom rather than pretending to be a date */
    const d=iso||" "+(String(r.date||"").trim()||"?");
    label[d]=iso?new Date(iso+"T12:00:00")
                  .toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})
               :(String(r.date||"").trim()||"No date");
    (byDay[d]=byDay[d]||[]).push(r);
  });
  let h="";
  Object.keys(byDay).sort().reverse().forEach(d=>{
    const rows=byDay[d], sub=rows.reduce((a,r)=>a+r.amt,0);
    h+=`<div class="card open"><div class="chead">
      <span class="nm">${label[d]}</span>
      <span class="am">${money(sub)} · ${rows.length}</span></div><div class="cbody">`;
    rows.sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)).forEach(r=>{
      h+=`<button class="txrow" data-move="${r.filed}|${r.idx}">
        <span class="d">${r.desc}</span>
        <span class="a" style="color:${r.amt<0?"var(--teal)":"var(--txt)"}">${money(r.amt)}</span>
        <span class="c" style="color:${CATCOLOR[r.cat]||"var(--dim)"}">${r.cat}</span></button>`;
    });
    h+=`</div></div>`;
  });
  return h;
}
/* "Aug 7" for a charge. isoDay() already does the hard part — working out which
   month a statement's bare day belongs to. Anything it can't read keeps the raw
   text the statement gave rather than showing a guess. */
function shortDay(d,spend){
  const iso=isoDay(d,spend);
  if(!iso) return (String(d||"").trim()||"\u2014").slice(0,6);
  return new Date(iso+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
/* Which column the category list is sorted on, and which way. Lives outside the
   builder so it survives the redraw that a tap causes — the drawer is rebuilt
   from scratch on every openDrawer(), so anything held inside catHTML would reset
   itself the moment it was used. Biggest first to start with, which is how the
   list has always opened. */
let catSort={by:"amt",dir:-1};
/* True only on the redraw that lands you inside a category. Every other redraw of
   the same pane is a sort tap, and replaying the hint each time you sorted would
   be noise pointing at a control you had visibly just used. Cleared by the wiring
   pass once the flash has been handed to the markup. */
let catFlash=false;
/* Sorting on a date means sorting on the ISO date, not the "Aug 10" the statement
   printed — isoDay() already works out which month a bare day belongs to. Anything
   it can't read keeps its raw text behind a leading space, which sorts below every
   real date rather than pretending to be one. */
function catKey(r,by){
  if(by==="date") return isoDay(r.date,r.spend)||" "+String(r.date||"").trim();
  return Number(r.amt)||0;
}
function catCmp(a,b){
  const ka=catKey(a,catSort.by), kb=catKey(b,catSort.by);
  const n = (typeof ka==="number") ? ka-kb : String(ka).localeCompare(String(kb));
  if(n) return n*catSort.dir;
  /* The tiebreak does NOT take the direction with it. Folding it into the same
     multiply meant that sorting dates newest-first also turned the tiebreak round,
     so a day holding two charges listed the smaller one first — right list, wrong
     order inside a day, and the sort of thing you'd stare at for a while. */
  return (Number(b.amt)||0)-(Number(a.amt)||0);
}
function catHTML(){

  const byM={}; tx.forEach(r=>(byM[r.spend]=byM[r.spend]||[]).push(r));
  Object.keys(byM).sort().reverse().forEach(m=>{

    /* within the month. The months themselves stay newest-first — this sorts the
       charges inside one, which is the list you are actually reading. */
    rows.slice().sort(catCmp).forEach(r=>{
      const fl=catFlash?" flash":"";
      const on=k=>catSort.by===k?" sorton":"";
      const arrow=k=>catSort.by===k?(catSort.dir<0?"\u2193":"\u2191"):"";
      h+=`<button class="txrow" data-move="${r.filed}|${r.idx}">
        <span class="dt sortby${on("date")}${fl}" data-sort="date">${

        <span class="d">${r.desc}</span>
        <span class="a sortby${on("amt")}${fl}" data-sort="amt"
          style="color:${r.amt<0?"var(--teal)":"var(--txt)"}">${money(r.amt)}${arrow("amt")}</span>
        <span class="c" style="color:${CATCOLOR[r.cat]||"var(--dim)"}">${r.cat}</span></button>`;
    });
    h+=`</div></div>`;
  });
  return h;
}
function openPicker(filed,idx){

function wireCard(){
  /* the fork is the whole panel when it's up — nothing below exists yet */
  const cvc=document.getElementById("cvCat"), cvt=document.getElementById("cvTime");
  if(cvc) cvc.onclick=()=>{ cardView="cat"; openDrawer("card"); };
  if(cvt) cvt.onclick=()=>{ cardView="time"; openDrawer("card"); };
  /* tap a month heading to fold that list away */
  const cards=()=>[...document.querySelectorAll("#dbody .card")];
  document.querySelectorAll("#dbody .card .chead").forEach(hd=>{
    hd.onclick=()=>hd.parentElement.classList.toggle("open");
    /* double-tap folds every month at once, or opens them all again */
    hd.ondblclick=e=>{
      e.preventDefault();
      nav={month:null,cat:null}; openDrawer("card");
      toast("Back to the overview");
    };
  });
  document.querySelectorAll("[data-move]").forEach(b=>{
    const [k,i]=b.dataset.move.split("|");
    b.onclick=e=>{

         one of them was a sort, and must not also open the picker behind it */
      if(e.target.closest("[data-sort]")) return;
      e.preventDefault(); openPicker(k,+i);
    };
  });
  document.querySelectorAll("[data-sort]").forEach(x=>x.onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    const by=x.dataset.sort;
    /* same column again turns it round; a new column starts the way that column is
       usually wanted — newest first, biggest first */
    catSort = (catSort.by===by) ? {by,dir:-catSort.dir} : {by,dir:-1};
    catFlash=false;
    openDrawer("card");
  });
  document.querySelectorAll("[data-crumb]").forEach(b=>b.onclick=()=>{
    if(b.dataset.crumb==="root"){ nav={month:null,cat:null}; } else { nav.cat=null; }
    openDrawer("card");
  });
  document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{
    nav={month:b.dataset.month,cat:null}; openDrawer("card");
  });
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    nav.cat=b.dataset.cat; catFlash=true; openDrawer("card");
  });
  /* The markup for this pass already has its flash classes, so the flag has done
     its job. Clearing it here means the next redraw — a sort, a re-file — is
     quiet, without needing to know which of them caused it. */
  catFlash=false;

}

function insights(){
  const out=[];
  const neg=MODEL.filter(m=>!m.noData&&m.end<0);
  if(neg.length) out.push({tone:"bad",t:"Months that go below zero",
    b:neg.map(m=>MN[parseYM(m.k).m-1]+" "+parseYM(m.k).y+" ends at "+money(m.end)).join(" · ")});
  const low=MODEL.filter(m=>!m.noData&&m.end>=0&&m.end<S.meta.buffer);
  if(low.length) out.push({tone:"warn",t:"Months under "+money(S.meta.buffer),
    b:low.map(m=>MN[parseYM(m.k).m-1]+" "+String(parseYM(m.k).y).slice(2)+" ("+money(m.end)+")").join(", ")});

  const odd=S.oneoffs.filter(o=>o.odd);
  if(odd.length) out.push({tone:"warn",t:"Two different water amounts — which is the real bill?",
    b:`On the Dec / Mar / Jun / Sep cycle your sheet shows <b>$180</b> (Jun-26, Mar-27, Jun-27), so I've used those exact figures on the cycle months and $370 on the ones that were blank. But there are also <b>$370</b> charges in Apr-26, Jan-27 and Apr-27 — each sitting exactly one month after a cycle month. If those are the same quarterly bill just paid late, delete these three lines with the × and set Water to a single amount. If it's a separate charge, tell me and I'll give it its own line.`});

  const three=MODEL.filter(m=>m.payCount>2);
  if(three.length) out.push({tone:"good",t:"Three-paycheck months",
    b:three.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      ". Your natural catch-up months — the extra check is the one worth aiming at a goal before it gets absorbed."});

  const ob=S.rules.filter(r=>r.offbook);
  if(ob.length) out.push({tone:"good",t:"Shown but not counted",
    b:ob.map(r=>`${r.name} (${acctLabel(r.account)})`).join(" · ")+
      `. These sit in the grid in purple so you can see the full picture, but they never touch the ending balance. Across the plan that's ${money(Math.abs(MODEL.reduce((s,m)=>s+m.offTot,0)))} of spending you're seeing but not carrying.`});
  const c3=MODEL.filter(m=>m.cleanCount>2);
  const clRule=S.rules.find(r=>r.id==="cleaner");
  if(c3.length&&clRule) out.push({tone:"good",t:"Three-visit months for "+clRule.name,
    b:c3.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      `. Those months carry an extra visit, so they cost more than a normal month.`});

  S.rules.filter(r=>r.cap).forEach(r=>{
    [...new Set(MODEL.map(m=>parseYM(m.k).y))].forEach(y=>{
      let t=0; MODEL.filter(m=>parseYM(m.k).y===y).forEach(m=>m.rows.filter(x=>x.ruleId===r.id).forEach(x=>t+=x.amount));
      if(Math.abs(t)>r.cap) out.push({tone:"warn",t:`${r.name} runs past its ${y} limit`,
        b:`${money(Math.abs(t))} planned against ${money(r.cap)} — ${money(Math.abs(t)-r.cap)} over.`});
      else if(t!==0&&Math.abs(t)<r.cap) out.push({tone:"good",t:`${r.name} · ${y}`,
        b:`${money(Math.abs(t))} of ${money(r.cap)} contributed. ${money(r.cap-Math.abs(t))} of room left.`});
    });
  });

  S.rules.filter(r=>r.payoff).forEach(r=>{
    const fin=payoffDone(r);
    out.push({tone:"good",t:`${r.name} payoff`,
      b:fin?`Clears in ${MFULL[parseYM(fin).m-1]} ${parseYM(fin).y}.`
           :`${money(payoffLeft(r,S.meta.end))} still outstanding when the plan ends. Add a year to see the payoff date.`});
  });

  const cc=MODEL.filter(m=>m.rows.some(r=>r.ruleId==="cc"));
  const ccTot=cc.reduce((s,m)=>s+m.rows.filter(r=>r.ruleId==="cc").reduce((a,b)=>a+b.amount,0),0);
  out.push({tone:"warn",t:"The credit card is the whole story",
    b:`${money(Math.abs(ccTot))} across ${cc.length} months — far and away your biggest outflow. Every $250 a month you shave off adds about ${money(250*cc.length)} to the plan. Nothing else on this board moves the needle as hard.`});
  return out;
}

async function deliver(text,name,mime){
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      toast("Shared "+name);
      return true;
    }
  }catch(err){
    if(err&&err.name==="AbortError"){ toast("Cancelled"); return true; }
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Saved "+name);
    return true;
  }catch(err){}
  toast("This browser blocked the download");
  alert("This browser wouldn't save the file.\n\nIf you're inside an app's built-in browser, tap the ⋯ menu and choose \"Open in Safari\", then try again.");
  return false;
}
const up10=n=>Math.ceil(Math.abs(n)/10)*10;
const stamp=()=>{ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return p(d.getMonth()+1)+"."+p(d.getDate())+"."+d.getFullYear(); };
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._z);t._z=setTimeout(()=>t.classList.remove("on"),1900);}
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{S=JSON.parse(rd.result);migrate(S);save();render();toast("Loaded");}catch(x){toast("That file didn't parse");}};
  rd.readAsText(f);
};
/* one step back, innermost thing first */
function stepBack(){
  const pick=document.getElementById("pickWrap");
  if(pick&&pick.classList.contains("on")){ closePicker(); return true; }
  if(drawer.classList.contains("open")){
    /* card drawer drills year > month > category; unwind it a level at a time */
    if(nav.cat){ nav.cat=null; openDrawer("card"); return true; }
    if(nav.month){ nav.month=null; openDrawer("card"); return true; }
    closeDrawer(); return true;
  }
  const mp=document.getElementById("menuPanel");
  if(mp.classList.contains("open")){ closeMenu(); return true; }
  return false;
}
function menuOpen(){ return document.getElementById("menuPanel").classList.contains("open"); }
/* everything the keyboard can land on, in the order it appears. disabled and
   off-screen controls are dropped — .focus() is a no-op on those and Tab would
   sit there forever looking broken. */
const KBSEL="button,input,select,textarea,label.btn,[tabindex]";
function kbIn(root){
  return [...root.querySelectorAll(KBSEL)].filter(el=>{
    if(el.disabled||el.hidden) return false;
    if(el.tagName==="INPUT"&&/^(file|hidden)$/.test(el.type)) return false;
    if(el.tabIndex<0) return false;
    return el.offsetParent!==null;
  });
}
/* the flashing box. only ever one, and only ever in the menu. */
function kbMark(el){
  document.querySelectorAll(".kbfocus").forEach(x=>x.classList.remove("kbfocus"));
  if(el){ el.classList.add("kbfocus"); el.focus(); }
}
function openMenu(){ document.getElementById("menuPanel").classList.add("open");
                     document.getElementById("btnMenu").classList.add("open");
                     /* Tab starts here, and it says so */
                     kbMark(kbIn(document.getElementById("menuPanel"))[0]); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open");
  kbMark(null);
  if(document.activeElement&&document.activeElement.closest&&
     document.activeElement.closest("#menuPanel")) document.activeElement.blur();
                      document.getElementById("btnMenu").classList.remove("open"); }
/* typing in a field? keys belong to the field, not the app */
function typing(t){ return t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable); }

document.addEventListener("keydown",e=>{
  if(locked) return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey&&e.key.toLowerCase()==="l"){ e.preventDefault(); lock("Locked from the keyboard"); return; }

  /* Tab is handled before the typing check — in a text field it moves on anyway,
     and letting the browser have it would walk focus out of the app entirely */
  if(e.key==="Tab"){
    const dOpen=drawer.classList.contains("open");
    const list = dOpen ? kbIn(drawer)
               : menuOpen() ? kbIn(document.getElementById("menuPanel"))
               : [...document.querySelectorAll(".ytab:not(.arrow)")];
    if(!list.length) return;
    e.preventDefault();
    const at=list.indexOf(document.activeElement);
    let next;
    if(at<0) next = (dOpen||menuOpen()) ? 0
                  : Math.max(0,list.findIndex(b=>b.classList.contains("on")));
    else next=(at+(e.shiftKey?-1:1)+list.length)%list.length;
    if(menuOpen()&&!dOpen) kbMark(list[next]); else list[next].focus();
    return;
  }
  /* Enter on something we made tabbable by hand */
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute
     &&e.target.getAttribute("role")==="button"){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key==="Enter"&&e.target&&e.target.tagName==="LABEL"&&e.target.classList.contains("btn")){
    e.preventDefault(); e.target.click(); return;
  }
  /* Esc in a field gives the field up first, then the app takes the next one */
  if(e.key==="Escape"&&typing(e.target)){ e.target.blur(); e.preventDefault(); return; }
  if(typing(e.target)) return;

  if(e.key==="Escape"||e.key==="Backspace"){ if(stepBack()) e.preventDefault(); return; }

  if(e.key==="ArrowDown"){ if(!menuOpen()&&!drawer.classList.contains("open")){ e.preventDefault(); openMenu(); } return; }
  if(e.key==="ArrowUp"){ if(menuOpen()){ e.preventDefault(); closeMenu(); } return; }

  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    if(drawer.classList.contains("open")) return;
    const d=e.key==="ArrowRight"?1:-1;
    /* wide + expanded: slide the rail. everywhere else: page the window of months */
    if(innerWidth>1100&&!fitMode) nudgeCols(d); else shiftView(d);
    e.preventDefault();
  }
});

/* a trackpad two-finger swipe arrives as wheel events with deltaX. they come in a
   stream, so latch one move per gesture and wait for the stream to go quiet. */
let swipeLatch=false, swipeQuiet=null;
addEventListener("wheel",e=>{
  if(locked||drawer.classList.contains("open")||menuOpen()) return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<8) return;
  clearTimeout(swipeQuiet);
  swipeQuiet=setTimeout(()=>{ swipeLatch=false; },140);
  if(swipeLatch) return;
  swipeLatch=true;
  const d=e.deltaX>0?1:-1;
  if(innerWidth>1100&&!fitMode) nudgeCols(d); else shiftView(d);
},{passive:true});

function nudgeCols(dir){

/* swipe the grid a month at a time */

(function(){
  const sc=document.getElementById("scroller");
  let x0=null,y0=null,moved=false;
  let pulling=false, canPull=false, pulled=0;
  sc.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
    pulling=false; pulled=0;
    canPull=!syncing&&!netBlocked()&&(syncOn()||sfinOn())&&atTop(e.target);
  },{passive:true});
  /* not passive: a real pull has to stop the page moving underneath it */
  sc.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4) moved=true;
    if(!moved&&canPull&&dy>10&&dy>Math.abs(dx)*1.4){
      pulling=true;
      pulled=Math.min(dy*0.55,110);            /* rubber band, so it can't be flung */
      pullShow(pulled,pulled>=PULL_TRIGGER?"<b>Release to sync</b>":"Pull to sync");
      if(e.cancelable) e.preventDefault();
    }
  },{passive:false});
  sc.addEventListener("touchend",e=>{
    if(pulling){
      const go=pulled>=PULL_TRIGGER;
      if(go){
        pullShow(PULL_TRIGGER,"<b>Syncing…</b>");
        fullSync(true).then(()=>setTimeout(pullHide,350));
      } else pullHide();
      pulling=false; x0=null; return;
    }
    if(x0===null||!moved){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45) shiftView(dx<0?1:-1);   /* drag left = go forward */
    x0=null;
  },{passive:true});
})();

/* ── pull down to sync ───────────────────────────────
   Everything worth refreshing in one go: the gist, then the card, then Buddy —
   in that order, because Buddy's message should quote the numbers that just
   landed. The card check spends one of the 24 daily calls; nothing else does. */
let syncing=false;
async function fullSync(manual){
  if(syncing||netBlocked()) return;
  syncing=true;
  try{
    if(syncOn()) await syncPull(!manual);
    if(sfinOn()) await sfinPull(!manual);
    await nudgeSchedule();
  }catch(e){ }
  finally{ syncing=false; }
}

const pullBar=document.getElementById("pullBar"), pullTxt=document.getElementById("pullTxt");
const PULL_TRIGGER=62;
function pullShow(d,txt){
  pullBar.classList.remove("snap");
  /* it emerges from under the header, not over the title */
  const sc=document.getElementById("scroller");
  if(sc) pullBar.style.top=Math.max(0,Math.round(sc.getBoundingClientRect().top))+"px";
  pullBar.style.transform="translate(-50%,"+Math.min(d-44,22)+"px)";
  pullBar.style.opacity=Math.min(1,d/38);
  pullTxt.innerHTML=txt;
}
function pullHide(){
  pullBar.classList.add("snap");
  pullBar.style.transform="translate(-50%,-44px)";
  pullBar.style.opacity=0;
}
/* the gesture only belongs to us if nothing underneath the finger is scrolled */
function atTop(el){
  while(el&&el!==document.body&&el.nodeType===1){
    const oy=getComputedStyle(el).overflowY;
    if((oy==="auto"||oy==="scroll")&&el.scrollHeight>el.clientHeight+2) return el.scrollTop<=0;
    el=el.parentElement;
  }
  return (window.scrollY||document.documentElement.scrollTop||0)<=0;
}

/* rotating the phone changes how many months fit */
let rzTimer=null, lastPer=perView();
addEventListener("resize",()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{ fitGrid(); if(perView()!==lastPer){ lastPer=perView(); render(null); } centerWide(); },160);
