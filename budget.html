function greenShift(){
  const ys=yearsAvail(), i=Math.max(0,ys.indexOf(YEAR)), t=ys.length>1?i/(ys.length-1):0;
  const r=document.documentElement.style;
  r.setProperty("--bg",     lerpHex("#0a0f13","#0b2116",t));
  r.setProperty("--panel",  lerpHex("#16232a","#173322",t));
  r.setProperty("--panel2", lerpHex("#1d2f37","#1e422c",t));
  r.setProperty("--line",   lerpHex("#33474f","#2f5a3f",t));
  r.setProperty("--line2",  lerpHex("#48626c","#437a56",t));
  return t;
}

let winStart=0, autoFollow=false, firstPaint=true;
function pickAnim(prev,next){
  if(prev===null||prev===next) return "anim-spill";
  return Math.abs(next-prev)>=2 ? "anim-shift" : "anim-spill";
}
let viewIndex=0;
const expanded=new Set();
/* which columns have already been dropped to their foot in the current view, and
   the token that says what "the current view" is */
const ccSeen=new Set(); let lastViewTok="";
let fitMode=(()=>{ try{ return localStorage.getItem("budget_fit_v2")==="1"; }catch(e){ return false; } })();
/* wide screens: slide the current month to the middle */
function centerWide(){
  const sc=document.getElementById("scroller");
  if(!sc||fitMode||innerWidth<=1100) return;
  const col=sc.querySelector(".mcol.now")||sc.querySelector(".mcol");
  if(!col) return;
  const want=col.offsetLeft-(sc.clientWidth-col.offsetWidth)/2;
  const max=sc.scrollWidth-sc.clientWidth;
  sc.scrollLeft=Math.max(0,Math.min(want,max));   /* clamps near either end */
}
function perView(){
  const w=innerWidth;
  if(w<=760) return 2;          /* phone: this month and next */
  if(w<=1100) return 3;         /* tablet */
  return 12;                     /* desktop: the whole year */
}
function yearBounds(){
  const first=MODEL.findIndex(m=>parseYM(m.k).y===YEAR);
  if(first<0) return [0,Math.max(0,MODEL.length-perView())];
  let last=first;
  while(last+1<MODEL.length&&parseYM(MODEL[last+1].k).y===YEAR) last++;
  return [first, Math.max(first,last-perView()+1)];
}
function clampView(){
  const [lo,hi]=yearBounds();
  viewIndex=Math.min(Math.max(lo,viewIndex),hi);
}
function shiftView(n){
  const before=viewIndex;
  viewIndex+=n; clampView();
  if(viewIndex!==before) render("anim-spill");
}

function fitGrid(){
  const sc=document.getElementById("scroller"); if(!sc) return;
  const bar=document.querySelector(".bottombar"), hint=document.getElementById("swipeHint");
  const top=sc.getBoundingClientRect().top;
  const wide=(window.innerWidth||0)>1100;
  const below=(bar?bar.offsetHeight:0)+(hint&&hint.offsetHeight?hint.offsetHeight:0)+(wide?20:0);
  const h=Math.max(320,(window.innerHeight||800)-top-below-6);
  document.documentElement.style.setProperty("--gridh",h+"px");
  if(wide&&!fitMode){
    const cw=Math.floor((sc.clientWidth||1200)/6);
    sc.style.setProperty("--colw",cw+"px");
  } else sc.style.removeProperty("--colw");
  placeMenu();
}
/* Put the Menu button's midline on a column divider.

   Measured off the real columns rather than computed from --colw, because the
   grid has three layouts (phone, desktop scrolling, desktop fit-the-year) and
   only the DOM knows which one is on screen. The pad grows to push Menu right;
   everything stays in normal flow, so nothing can end up underneath anything.

   It walks the dividers left to right and takes the first one where the button
   clears Undo on the left and the assets corner on the right. If no divider
   fits — a narrow phone, a long Menu label — the pad collapses to nothing and
   the row falls back to how it was, which is untidy but never broken. */
function placeMenu(){
  const row=document.querySelector(".toprow2");
  const pad=document.getElementById("menuPad");
  const mb=document.getElementById("btnMenu");
  if(!row||!pad||!mb) return;
  const cols=Array.prototype.slice.call(document.querySelectorAll(".mcol"))
    .filter(c=>c.offsetParent);
  if(!cols.length){ pad.style.width="0px"; return; }
  const GAP=10;
  const R=row.getBoundingClientRect();
  /* whatever sits to the left of the pad, whichever of them is showing */
  let before=R.left;
  ["btnUndo","btnLeft"].forEach(id=>{
    const e=document.getElementById(id);
    if(e&&e.offsetParent) before=Math.max(before,e.getBoundingClientRect().right);
  });
  /* and the block in the far corner it must not reach */
  let after=R.right;
  ["btnAssets","btnFit"].forEach(id=>{
    const e=document.getElementById(id);
    if(e&&!e.hidden&&e.offsetParent) after=Math.min(after,e.getBoundingClientRect().left);
  });
  const half=mb.offsetWidth/2;
  for(let i=0;i<cols.length;i++){
    const x=cols[i].getBoundingClientRect().right;   /* the divider after this column */
    if(x+half>after-GAP) break;                      /* and every later one is worse */
    if(x-half>=before+GAP){
      pad.style.width=Math.max(0,(x-half)-(before+GAP))+"px";
      return;
    }
  }
  pad.style.width="0px";
}
/* Several hits from one rule fold into one line — but only when the month is
   actually crowded. Folding two paycheques behind a ▾ hides the thing you opened
   the app to look at, and every tap to unfold is one the month didn't need. Past
   the threshold the column stops being readable and the fold earns itself.

   v72.1 — the uncrowded case now returns the rows untouched. The grouping pass
   below gathers every row of a rule at the position of the rule's FIRST one, and
   that ran unconditionally: build() handed render a column in date order and this
   quietly put it back into rule order on the way out, so three of Andrea's
   paychecks stacked above two of Jake's exactly as before. Clustering is the
   whole point when folding; it is pure damage when not.

   Crowded, the clusters stand and each takes the date of its earliest occurrence,
   so the folded column still reads forward. */
/* ---------- collapsible sections ------------------------------------------
   Two of them per column: income at the top, expenses under it. The card row and
   its budget are never in a section \u2014 keeping those on screen is the whole point
   of scrolling the column to them, and folding them away would undo it. Off-book
   rows (a card payment out of savings) stay loose too: there are rarely more than
   one or two and they are the rows most likely to need reading.

   Shut, not open, is what's remembered: a section defaults to showing its rows,
   so the Set holds the exceptions. Runtime only \u2014 which sections you folded is
   not something the other phone should inherit. */
const segShut=new Set();
function segOf(r){ const b=rowBand(r); return b===0?"inc":b===1?"exp":null; }
function segKey(k,g){ return k+"|seg:"+g; }
function rowDone(r){
  /* a folded group is done only when every occupant of it is */
  if(r.group) return r.rows.length>0&&r.rows.every(x=>!!(x.real||x.hit));
  return !!(r.real||r.hit);
}
function segHead(k,g,list){
  const own=list.filter(r=>!r.child);          /* a group already carries its children */
  const shut=segShut.has(segKey(k,g));
  const tot=own.reduce((a,r)=>a+r.amount,0);
  const cnt=own.reduce((a,r)=>a+(r.count||1),0);
  const done=own.length>0&&own.every(rowDone);
  const el=document.createElement("div");
  el.className="row seg "+g+(done?" done":"");
  /* left corner, in the column the row dots run down \u2014 v90 had it on the right
     with the amounts, which is where every other triangle in the app lives, but
     that is not where it was asked for. */
  el.innerHTML=`<span class="tri${shut?"":" up"}">\u25be</span>
    <span class="lbl">${g==="inc"?"Paychecks":"Line items"}
      <span class="gn">\u00d7${cnt}</span></span>
    <span class="amt">${money(tot)}</span>`;
  el.title=(shut?"Show":"Hide")+" "+(g==="inc"?"income":"expenses")+" for this month";
  el.onclick=()=>{ const key=segKey(k,g);
    segShut.has(key)?segShut.delete(key):segShut.add(key); render(); };
  return el;
}
function foldRows(rows,crowded,k){
  if(!crowded) return rows.slice();
  const groups=[], seen={}, out=[];
  rows.forEach(r=>{
    const gid=r.ruleId&&!r.info?r.ruleId:null;
    if(gid&&seen[gid]!==undefined){ groups[seen[gid]].push(r); return; }
    if(gid) seen[gid]=groups.length;
    groups.push([r]);
  });
  groups.forEach(g=>{
    if(g.length<2){ out.push(g[0]); return; }
    const key=k+"|"+g[0].ruleId;
    const open=expanded.has(key);
    out.push({group:true,key,rows:g,label:g[0].rule?g[0].rule.name:g[0].label,
      amount:g.reduce((a,x)=>a+x.amount,0),count:g.length,open,
      kind:g[0].kind,off:g[0].off,manual:g[0].manual,ruleId:g[0].ruleId,
      day:Math.min.apply(null,g.map(x=>x.day||99))});
    if(open) g.forEach(x=>out.push({...x,child:true}));
  });
  return out;
}
function render(anim,popTab){
  MODEL=build();
  /* the matcher needs the month's rows to compare against. It only ever proposes,
     so the numbers don't move here and there's nothing to rebuild. */
  autoMatch(MODEL);
  const ys=yearsAvail();
  clampView();
  if(!YEAR||!ys.includes(YEAR)) YEAR = ys.includes(parseYM(NOW).y)?parseYM(NOW).y:ys[0];

  const yEl=document.getElementById("years");
  const WIN=3, maxStart=Math.max(0,ys.length-WIN);
  const sel=ys.indexOf(YEAR);
  if(autoFollow){
    if(sel<winStart) winStart=sel;
    else if(sel>=winStart+WIN-1) winStart=sel-WIN+2;
  }
  winStart=Math.min(Math.max(0,winStart),maxStart);
  autoFollow=false;
  const vis=ys.slice(winStart,winStart+WIN);
  yEl.innerHTML =
      (winStart>0?`<button class="ytab arrow" id="yprev" title="Earlier years">‹</button>`:"")
    + vis.map(y=>`<button class="ytab ${y===YEAR?"on":""}" data-y="${y}">${y}</button>`).join("")
    + (winStart<maxStart?`<button class="ytab arrow" id="ynext" title="Later years">›</button>`:"");
  document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{
    const next=+b.dataset.y;
    autoFollow=true; YEAR=next;          /* wide screens key off YEAR, not the index */
    /* jump to that year — to today if it's this year, else to January */
    const target = next===parseYM(NOW).y ? MODEL.findIndex(m=>m.k===NOW)
                                         : MODEL.findIndex(m=>parseYM(m.k).y===next);
    viewIndex = target<0?0:target;
    clampView();
    render("anim-spill",true);
    if(next===parseYM(NOW).y) setTimeout(()=>centerNow(true),20);
    setTimeout(centerWide,40);
  });
  const pv=document.getElementById("yprev"), nx=document.getElementById("ynext");
  if(pv) pv.onclick=()=>{ winStart=Math.max(0,winStart-1); render(null,false); };
  if(nx) nx.onclick=()=>{ winStart=Math.min(maxStart,winStart+1); render(null,false); };
  if(popTab){ const t=yEl.querySelector(".ytab.on"); if(t){ t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop"); } }

  greenShift();
  const sc=document.getElementById("scroller");
  sc.classList.toggle("fit",fitMode);
  document.body.classList.toggle("fitOn",fitMode);
  const fb=document.getElementById("btnFit");
  if(fb) fb.textContent=fitMode?"Expanded view":"See full year";
  const rail=document.getElementById("rail");
  rail.className="rail"+(anim?" "+anim:"");
  swOpenEl=null;                 /* the row it pointed at is about to stop existing */
  /* Every render rebuilds the rail from scratch, which used to drop each column
     back to the top \u2014 so an edit anywhere scrolled the card row back out of
     sight. Where each column was sitting is carried across the rebuild. */
  const keepScroll={};
  rail.querySelectorAll(".mcol").forEach(c=>{
    const b=c.querySelector(".rows");
    if(c.dataset.k&&b) keepScroll[c.dataset.k]=b.scrollTop;
  });
  /* The first time a column is painted in this view it is scrolled to its foot
     instead, which is where the statement and its budget sit. Leaving the year
     and coming back counts as a new view, so it re-exposes rather than restoring
     wherever it was left. */
  const viewTok=YEAR+"|"+viewIndex+"|"+(fitMode?1:0)+"|"+perView();
  if(viewTok!==lastViewTok){ lastViewTok=viewTok; ccSeen.clear(); }
  rail.innerHTML="";

  const wide=perView()>=12;
  const shown = wide ? MODEL.filter(m=>parseYM(m.k).y===YEAR)
                     : MODEL.slice(viewIndex,viewIndex+perView());
  shown.forEach((M,ci)=>{
    const {y,m}=parseYM(M.k);
    const past=cmpYM(M.k,NOW)<0, now=M.k===NOW;
    const col=document.createElement("div");
    col.dataset.k=M.k;
    col.className="mcol"+(past?" past":"")+(now?" now":"")
                +(M.noData?(M.rows.length?" refonly":" blank"):"");
    if(anim) col.style.animationDelay=(ci*0.035)+"s";
    const tags=(M.payCount>2?'<span class="tag three">3 checks</span>':"")
             + (M.cleanCount>2?'<span class="tag clean">3 cleans</span>':"")
             + (now?'<span class="tag now">now</span>':"");
    const cls=M.end<0?"neg":M.end<S.meta.buffer?"low":"ok";
    /* open the Budget row and the button below changes what it adds */
    const budOpen=expanded.has(M.k+"|budget");
    col.innerHTML=`
      <div class="mhead">
        <div class="mname">${MFULL[m-1].slice(0,perView()>3?3:9)} ${perView()<=3?"’"+String(y).slice(2):""} ${tags}</div>
        <div class="onhand"><span class="k">On hand</span><span class="v">${M.noData?"\u2014":money(M.onhand)}</span></div>
      </div>
      <div class="rows"></div>
      <div class="addrow"><button class="addbtn">${budOpen?"+ add a budget line":"+ add a new line"}</button></div>
      <div class="mfoot">
        <div class="k">Left at end</div>
        <div class="v ${M.noData?"":cls}">${M.noData?"\u2014":money(M.end)}</div>
        ${M.noData?"":`<div class="nowbal${
            typeof S.meta.liveBalance==="number"?" live":""}">${money(nowBalance())} in there now${
            typeof S.meta.liveBalance==="number"?" \u00b7 from your bank":""}</div>`}
        ${M.noData?`<div class="infon">not counted for running total</div>`:""}
      </div>`;
    const box=col.querySelector(".rows");
    if(M.noData&&!M.rows.length){
      const nd=document.createElement("div");
      nd.className="nodata";
      nd.innerHTML=`<div>No records</div><div class="nd2">before the budget started</div>`;
      box.appendChild(nd);
    }
    /* Several hits from one rule fold into one line — but only when the month is
       actually crowded. Folding two paycheques behind a ▾ hides the thing you opened
       the app to look at, and every tap to unfold is one the month didn't need.
       Past the threshold the column stops being readable and the fold earns itself. */
    const FOLD_AT=16;
    const crowded=M.rows.length>FOLD_AT;
    const shown=foldRows(M.rows,crowded,M.k);
    let plan=trimPlan();
    /* with no statement history there's no category breakdown yet — but a planned
       purchase still needs somewhere to show itself */
    if(!plan&&plannedFor(M.k)) plan={target:S.meta.ccTarget||0,rows:[],bare:true};
    if(plan) shown.push({budget:true,plan});
    /* counted before anything is drawn, because the heading has to know its own
       total and whether every row under it has landed */
    const segRows={inc:[],exp:[]}, segMade={};
    shown.forEach(r=>{ const g=segOf(r); if(g) segRows[g].push(r); });
    /* One row under a heading is a heading that costs more than it saves. */
    const segOn=g=>segRows[g].filter(r=>!r.child).length>=2;
    shown.forEach((r,ri)=>{
      const sg=segOf(r);
      if(sg&&segOn(sg)){
        if(!segMade[sg]){ segMade[sg]=1; box.appendChild(segHead(M.k,sg,segRows[sg])); }
        if(segShut.has(segKey(M.k,sg))) return;
      }
      if(r.budget){
        const p=r.plan, key=M.k+"|budget", open=expanded.has(key);
        const el=document.createElement("div");
        el.className="row grp bud exp";
        /* what you plan to SPEND this month. the bill it inflates is next month's,
           and that is where the credit-card row picks it up. */
        const px=plannedFor(M.k);
        el.innerHTML=`<span class="dot"></span>
          <span class="lbl">CC budget <span class="gn">${px?"target + planned":"target"}</span></span>
          <span class="amt">${money(-(p.target+px))}</span>
          <span class="tri${open?" up":""}">▾</span>`;
        el.onclick=()=>{ expanded.has(key)?expanded.delete(key):expanded.add(key); render(); };
        el.onmouseenter=e=>showTip(e,{budgetPlan:p,label:"CC budget",amount:-p.target,day:99},M.k);
        el.onmousemove=ev=>{ if(innerWidth>=760) moveTip(ev); };
        el.onmouseleave=()=>{ if(innerWidth>=760) hideTip(); };
        box.appendChild(el);
        if(open){
          p.rows.forEach(x=>{
            const c=document.createElement("div");
            c.className="row child bud exp";
            c.innerHTML=`<span class="dot"></span>
              <span class="lbl" style="color:${CATCOLOR[x.cat]||"var(--dim)"}">${x.cat}${x.held?" <span class='gn'>held</span>":""}</span>
              <span class="amt">${money(-x.target)}</span>`;
            box.appendChild(c);
          });
          plansFor(M.k).forEach(pl=>{
            const c=document.createElement("div");
            c.className="row child bud exp planned";
            const onBill=nextMonth(pl.ym);
            c.innerHTML=`<span class="dot"></span>
              <span class="lbl">${pl.name} <span class="gn">${
                onBill===liveCycle().bill?"already on the live card":MN[parseYM(onBill).m-1]+" bill"}</span></span>
              <span class="amt">${money(-Math.abs(pl.amt))}</span>
              <span class="kill" title="Drop this plan">×</span>`;
            c.querySelector(".kill").onclick=ev=>{ ev.stopPropagation();
              S.plans=S.plans.filter(z=>z.id!==pl.id); save(); render(); toast("Plan dropped"); };
            box.appendChild(c);
          });
        }
        return;
      }
      if(r.group){
        const el=document.createElement("div");
        el.className="row grp "+r.kind+(r.off?" off":"");
        el.innerHTML=`<span class="dot"></span>
          <span class="lbl">${r.label} <span class="gn">×${r.count}</span></span>
          <span class="amt">${money(r.amount)}</span>
          <span class="tri${r.open?" up":""}">▾</span>`;
        el.onclick=()=>{ expanded.has(r.key)?expanded.delete(r.key):expanded.add(r.key); render(); };
        el.onmouseenter=e=>showTip(e,{...r.rows[0],label:r.label+" · "+r.count+" this month"},M.k);
        el.onmousemove=ev=>{ if(innerWidth>=760) moveTip(ev); };
        el.onmouseleave=()=>{ if(innerWidth>=760) hideTip(); };
        box.appendChild(el); return;
      }
      const el=document.createElement("div");
      el.className="row "+r.kind+(r.oneoff?" oneoff":"")+(r.manual?" manual":"")
                 +(r.ruleId==="cc"?" cc":"")+(r.off?" off":"")+(r.info?" info":"")
                 +(r.real?" tx":"")+(r.ccpay?" ccpay":"")+(r.stale?" stale":"");
      if(r.ruleId==="cc"&&!r.info){
        const hv=heatLevel(M.k); if(hv) el.classList.add("heat","heat"+hv);
        el.dataset.ccMonth=M.k;      /* the label opens the pane; the amount still edits */
        if(M.k===liveCycle().bill) el.classList.add("livecc");
      }
      if(anim==="anim-spill") el.style.animationDelay=(0.06+ri*0.022)+"s";
      el.innerHTML=`<span class="dot"></span><span class="lbl">${r.label}</span>
        <span class="amt${r.manual?" man":""}${r.ovr?" ovr":""}">${money(r.amount)}</span>
        <button class="kill">×</button><span class="swx">✕</span>`;
      if(r.child) el.classList.add("child");
      wireSwipe(el,r);   /* before every other handler — see the note there */
      /* One chip per transaction, and only while there is something to answer.
         An unnamed row says so, a transfer says it still needs a line to sit
         against, and the card payment says why it isn't in the total. Once all
         three are settled the row goes quiet, which is the point. */
      if(r.real){
        const g=txTag(r.tx);
        const known=!!(g.label||(!r.transfer&&S.merch&&S.merch[normMerchant(r.tx.desc)]));
        const txt=r.ccpay?"card payment"
                 :(r.transfer&&!r.assignedKey)?"assign"
                 :(!known?"name it":null);
        if(txt){
          const chip=document.createElement("span");
          chip.className=r.ccpay?"tk":"tq";
          chip.textContent=txt;
          if(!r.ccpay) chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation();
                                          openTxPane(r,M.k); };
          el.insertBefore(chip,el.querySelector(".amt"));
        }
        /* this is the one a recurring line came out of */
        if(g.rule&&(S.rules||[]).some(x=>x.id===g.rule)){
          const d=document.createElement("span");
          d.className="rec"; d.textContent="\u25C6";
          d.title="A repeating line was made from this one";
          el.insertBefore(d,el.querySelector(".amt"));
        }
      }
      /* v70.1 — the "not seen" chip is gone. It was written for a column that only
         held predictions, where a line past its day and unmatched was the only
         evidence something had happened. The transactions are all sitting right
         there now, struck through, so the chip was asking a question the column
         had already answered. `r.late` is still computed; nothing renders it. */
      if(r.hit){
        el.classList.add("hit");
        const chip=document.createElement("span");
        chip.className="paid";
        /* it used to read "was -$2,650" when the number moved, which pushed "Mortgage"
           down to "M…". The real amount is already sitting in the row. */
        chip.textContent="paid";
        chip.title="Matched to \""+(r.hit.desc||"a transaction")+"\" on "+fmtDate(r.hit.date)
                  +". Tap to go back to the predicted amount.";
        chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); unmatch(r.key); };
        el.insertBefore(chip,el.querySelector(".amt"));
      }
      /* the flash rides on its own element — the heat ramp owns both pseudo-elements */
      if(el.classList.contains("livecc")){
        const fl=document.createElement("i"); fl.className="rowflash"; el.appendChild(fl);
        /* a typed number on the live row stops the feed updating it, which looks
           exactly like the feed being wrong. Say so, and make it one tap to undo. */
        if(r.ovr){
          const chip=document.createElement("span");
          chip.className="frz"; chip.textContent="typed";
          chip.title="This row is holding a number you typed. Tap to follow the card feed again.";
          chip.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation();
            delete S.over[r.key]; save(); render();
            const lt=liveTotal();
            toast(lt===null?"Back on the live feed":"Back on the live feed · "+money(-lt)); };
          el.insertBefore(chip,el.querySelector(".amt"));
        }
      }
      el.querySelector(".amt").onclick=e=>{
        /* what the bank says it was. There is nothing here to edit, so the tap
           does the useful thing instead and opens the row. */
        if(r.real){ openTxPane(r,M.k); return; }
        editAmt(e.target,r,M.k);
      };
      el.querySelector(".kill").onclick=()=>removeRow(r);
      if(el.dataset.ccMonth){
        const lb=el.querySelector(".lbl");
        const amtEl=el.querySelector(".amt");
        /* The number used to be the only way in and the label the only way to the
           pane. Now the whole row opens the pane and the number comes out on a long
           press, or a double click with a mouse. A double *tap* was asked for and
           left out on purpose: it forces every single tap to sit for ~250ms waiting
           to see whether a second one is coming, and opening the pane feels broken. */
        const openPane=ev=>{ ev.preventDefault(); ev.stopPropagation(); hideTip();
          nav={month:prevMonth(el.dataset.ccMonth),cat:null};
          cardView="cat"; openDrawer("card"); };
        /* Wiring only the label and the number left the middle of the row dead, which
           is most of it — the gap between "Credit card" and the amount is the easiest
           place on the line to hit with a thumb, and it did nothing. */
        el.onclick=ev=>{ if(ev.target.closest(".kill,.paid,.frz,.late")) return; openPane(ev); };
        amtEl.onclick=openPane;
        let lpT=null,lpX=0,lpY=0,lpFired=false;
        const cancelLP=()=>{ clearTimeout(lpT); lpT=null; };
        el.addEventListener("pointerdown",ev=>{
          if(ev.pointerType==="mouse") return;              /* mouse gets dblclick instead */
          if(ev.target.closest(".kill,.paid,.frz")) return;  /* those have their own jobs */
          lpFired=false; lpX=ev.clientX; lpY=ev.clientY; cancelLP();
          lpT=setTimeout(()=>{ lpFired=true;
            if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
            editAmt(amtEl,r,M.k); },500);
        });
        /* a swipe across the grid must not count as a press */
        el.addEventListener("pointermove",ev=>{
          if(Math.abs(ev.clientX-lpX)>10||Math.abs(ev.clientY-lpY)>10) cancelLP(); });
        ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,cancelLP));
        /* and the lift at the end of a long press must not then open the pane */
        el.addEventListener("click",ev=>{
          if(lpFired){ ev.preventDefault(); ev.stopPropagation(); lpFired=false; } },true);
        el.ondblclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); editAmt(amtEl,r,M.k); };
        if(lb){ lb.style.cursor="pointer";
          /* plain click is right here — the reason it failed on iOS was the
             hover handler above eating the first tap, and cc rows no longer
             have one. pointerup opened the drawer but the click that followed
             reached the scrim and shut it again. */
          lb.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); hideTip();
            /* the column is the month the bill arrives; the drawer wants the
               month the money was spent, which is the cycle before it. Handing
               the raw column key over showed the NEXT statement — so the August
               row opened the live cycle. */
            nav={month:prevMonth(el.dataset.ccMonth),cat:null};
            cardView="cat"; openDrawer("card"); }; }
      }
      if(r.oneoff) el.querySelector(".lbl").ondblclick=()=>{
        const n=prompt("Rename line",r.oneoff.name); if(n){r.oneoff.name=n;save();render();}
      };
      /* Tap opens the same card the desktop shows on hover, parked in a pane where
         it can be read and scrolled rather than floating over the column. Only rows
         that don't already own their tap: a group toggles, the card opens spending,
         and an open swipe is a close instruction, not a request to drill in. */
      if(!el.onclick&&!r.info) el.onclick=ev=>{
        if(ev.target.closest(".amt,.kill,.swx,.tri,.frz,.paid,.late,.tq,.tk")) return;
        if(el.classList.contains("swopen")) return;
        r.real?openTxPane(r,M.k):openLinePane(r,M.k);
      };
      if(!el.dataset.ccMonth) el.onmouseenter=e=>showTip(e,r,M.k);
      el.onmousemove=ev=>{ if(innerWidth>=760) moveTip(ev); };
      el.onmouseleave=()=>{ if(innerWidth>=760) hideTip(); };
      box.appendChild(el);
    });
    col.querySelector(".addbtn").onclick=()=>budOpen?addBudgetLine(M.k):addOneoff(M.k);
    rail.appendChild(col);
  });

  /* After layout, not before: scrollHeight on a column that hasn't been measured
     yet is its content height with no scrollbox, and every one of these would be
     a no-op. */
  requestAnimationFrame(()=>{
    rail.querySelectorAll(".mcol").forEach(c=>{
      const b=c.querySelector(".rows"), k=c.dataset.k;
      if(!b||!k) return;
      if(!ccSeen.has(k)){
        ccSeen.add(k);
        /* only worth doing where there is something below the fold, and only
           where the card block is actually down there */
        if(b.scrollHeight>b.clientHeight+2&&b.querySelector(".row.cc,.row.bud"))
          b.scrollTop=b.scrollHeight;
      } else if(keepScroll[k]!==undefined){
        b.scrollTop=Math.min(keepScroll[k],Math.max(0,b.scrollHeight-b.clientHeight));
      }
    });
  });

  const hint=null;
  if(hint){
    const [lo,hi]=yearBounds();
    hint.querySelector("[data-nav='-1']").disabled = viewIndex<=lo;
    hint.querySelector("[data-nav='1']").disabled  = viewIndex>=hi;
    const sp=hint.querySelector("span");
    if(sp) sp.textContent = viewIndex>=hi ? "tap a year to go further" : "swipe to move a month";
  }

  const appT=(S.meta&&S.meta.title)||"Household Budget";
  const thEl=document.getElementById("appTitle");
  if(thEl&&thEl.dataset.t!==appT){
    thEl.dataset.t=appT;
    thEl.innerHTML=`<span class="tt">${appT}</span><span class="vtag">${APP_V}</span>`;
    document.title=appT+" "+APP_V;
  }

  if(rollLoans()) reReadAssets();
  paintAssets();
  fitGrid(); localSave(); stampSaved();
  const cb=document.getElementById("btnCard");
  if(cb){ const st=cardBtnState(); cb.textContent=st.label;
          cb.classList.toggle("warn",st.mode==="waiting"); }
  const n=insights().filter(i=>i.tone!=="good").length;
  const ic=document.getElementById("insCount");
  if(ic) ic.textContent=n?("· "+n):"";
  const pc=propCount(), mb=document.getElementById("btnMatch");
  /* This drawer is also the only way to attach something by hand, so gating it on
     proposals alone meant a paycheck that never matched had no route in at all —
     and kept being counted on top of money already in the account. */
  const mNow=MODEL.find(x=>x.k===NOW);
  const lateN=mNow?mNow.rows.filter(r=>r.late&&!r.hit).length:0;
  if(mb){
    mb.hidden=true;              /* with it, the drawer behind it — see above */
    mb.firstChild.nodeValue="Not seen yet ";
    document.getElementById("matchCount").textContent=
      pc?("· "+pc):lateN?("· "+lateN):"";
  }
  const bb=document.getElementById("btnBank");
  if(bb) bb.hidden=!bankRows().length;
  wireNowBal();
  if(firstPaint){ firstPaint=false; centerNow(true); setTimeout(centerWide,30); }
}

/* What's actually in the account today — the number every end-of-month figure is
   walking away from. Until the bank is connected that's the opening balance of the
   month we're in; after that it'll be the real one. */
/* the balance line opens the account, when there is one to open */
function wireNowBal(){
  document.querySelectorAll(".mfoot .nowbal.live").forEach(el=>{
    el.onclick=ev=>{ ev.stopPropagation(); openDrawer("bank"); };
  });
}
function nowBalance(){
  const t=totalNow();
  if(t!==null) return t;
  const m=MODEL.find(x=>x.k===NOW);
  return m?m.onhand:(Number(S.meta.opening)||0);
}
/* put the month we're actually in in the middle of the screen */
function centerNow(pulse){
  const i=MODEL.findIndex(m=>m.k===NOW);
  if(i>=0){ viewIndex=i; clampView(); render(null); }
  const col=document.querySelector(".mcol.now");
  if(col&&pulse){ col.classList.remove("pulse"); void col.offsetWidth; col.classList.add("pulse"); }
  if(pulse) pulseLiveCard();
}
/* same two beats as the current month, two seconds behind it (the delay is in the CSS) */
function pulseLiveCard(){
  document.querySelectorAll(".row.livecc").forEach(el=>{
    el.classList.remove("livepulse"); void el.offsetWidth; el.classList.add("livepulse");
  });
}

/* What this cell would show if nobody had typed in it. `amountAt` alone isn't
   that number on the card row: the live cycle comes from the feed, and later
   months carry their planned purchases. Comparing against the wrong baseline is
   what let a tap-and-tap-away freeze the live total. */
function naturalAmt(r,k){
  if(r.ruleId==="cc"&&k===liveCycle().bill){
    const lt=liveTotal();
    if(lt!==null) return -Math.round(lt*100)/100;
  }
  let a=amountAt(r.rule,k);
  if(r.ruleId==="cc"){ const ex=plannedOnBill(k); if(ex) a-=ex; }
  return a;
}
/* sign lock: money out stays money out unless you lead with + */
function signed(raw,anchor){
  const s=String(raw).trim();
  const v=Math.abs(parseFloat(s.replace(/[^0-9.]/g,"")));
  if(isNaN(v)) return null;
  if(s[0]==="+") return v;
  if(s[0]==="-") return -v;
  return anchor>=0?v:-v;
}
function editAmt(span,r,k){
  if(r.info){ feedMonth=k; openDrawer("feed"); return; }
  const anchor = r.oneoff ? (r.oneoff.amount||-1)
               : (r.rule.kind==="income"?1:-1);
  const inp=document.createElement("input"); inp.className="amtin";
  inp.value=Math.abs(r.amount); span.replaceWith(inp); inp.focus(); inp.select();
  const started=inp.value;
  const done=ok=>{
    /* opened it and touched nothing? that's a look, not an edit. Without this,
       tapping the live card row and tapping away pinned it at whatever the feed
       happened to say at that second, and it never moved again. */
    if(ok&&inp.value===started){ render(); return; }
    if(ok){
      const v=signed(inp.value,anchor);
      if(v!==null){
        if(r.oneoff) r.oneoff.amount=v;
        else if(v===naturalAmt(r,k)) delete S.over[r.key];   /* same as the feed = release it */
        else S.over[r.key]=v;
        save();
      }
    }
    render();
  };
  inp.onblur=()=>done(true);
  inp.onkeydown=e=>{ if(e.key==="Enter"){inp.onblur=null;done(true);} if(e.key==="Escape"){inp.onblur=null;done(false);} };
}
/* ── swipe a row left to delete ──────────────────────
   The grid also swipes sideways to change month, so a sideways drag on a row has
   to claim the gesture outright: once it is moving, touchmove and touchend stop
   at the row and never reach the scroller, which then sees no movement and stays
   on the month it was on. A drag that is more vertical than horizontal is handed
   straight back so the list still scrolls normally.

   This is also the only way to delete a line on a phone now. The × has always
   been opacity:0 until :hover, and hover no longer exists on touch.

   Wired before el.onclick and before the credit card gestures on purpose. When
   the row itself is the click target, listeners run in registration order, so
   being first is what lets the open-state guard below swallow the tap. */
/* Arbitration between the two sideways gestures. Before v89, any leftward drag
   on a row claimed the delete outright at 10px, and stopPropagation meant the
   month scroller never saw the rest of it \u2014 so swiping forward a month over a
   row, which is most of a column, peeled the row open instead.

   **Distance decides, and only distance.**

     \u00b7 under SW_CLAIM px    nothing has happened yet
     \u00b7 SW_CLAIM \u2192 SW_BAIL   the row opens; the month does not move
     \u00b7 past SW_BAIL         the row hands the gesture back mid-stroke, snaps
                            shut, and the scroller changes the month. Nothing has
                            to be released and retried.

   v93 \u2014 the angle test used to run once, at whatever the first move over the
   threshold happened to be, and a failure was final for the rest of the stroke.
   Twelve pixels in is the noisiest part of a gesture: a thumb swinging left off
   a phone starts with a real vertical component, so dx -10 / dy 9 read as a
   scroll and the row stayed dead however clean the next 200px were. Now the test
   re-runs on every move and only arms; the gesture is written off as a scroll
   only once it is unmistakably vertical, SW_VERT px of it and steeper than the
   sideways component.

   v92 \u2014 v89 also gated on speed: anything faster than 0.55 px/ms was treated as
   a flick and refused. That was wrong and it is gone. The velocity was measured
   from touchstart to the first move over the threshold, so it was really timing
   how long the finger rested before setting off. Start moving the instant you
   touch down and 20px in 20ms reads as 1.0 px/ms \u2014 a flick \u2014 and the delete never
   armed. Pause a beat first and the identical drag worked. That is what "works on
   some things and not others" was: not the row, the run-up. The angle went back
   to 1.3:1 at the same time, since 1.6:1 was refusing the ordinary diagonal a
   thumb makes swinging across a phone. */
var SW_W=58, SW_CLAIM=14, SW_BAIL=105, SW_VERT=22, swOpenEl=null;
function swClose(el){
  if(!el) return;
  el.classList.remove("swopen","swiping");
  el.style.transition="transform .18s ease"; el.style.transform="";
  if(swOpenEl===el) swOpenEl=null;
}
function wireSwipe(el,r){
  if(r.info) return;                  /* reference rows have nothing to remove */
  let x0=0,y0=0,live=false,open=false,decided=false;
  const put=(px,anim)=>{ el.style.transition=anim?"transform .18s ease":"none";
                         el.style.transform=px?"translateX("+px+"px)":""; };
  el.addEventListener("touchstart",ev=>{
    if(ev.touches.length!==1) return;
    x0=ev.touches[0].clientX; y0=ev.touches[0].clientY;
    live=false; decided=false; open=el.classList.contains("swopen");
    if(swOpenEl&&swOpenEl!==el) swClose(swOpenEl);
  },{passive:true});
  el.addEventListener("touchmove",ev=>{
    const dx=ev.touches[0].clientX-x0, dy=ev.touches[0].clientY-y0;
    if(!decided){
      /* clearly a scroll: give up on this stroke and let the list have it */
      if(Math.abs(dy)>=SW_VERT&&Math.abs(dy)>Math.abs(dx)*1.3){ decided=true; return; }
      /* not far enough sideways to judge \u2014 say nothing and wait for the next move */
      if(Math.abs(dx)<SW_CLAIM) return;
      if(!(Math.abs(dx)>Math.abs(dy)*1.3&&(dx<0||open))) return;
      decided=true; live=true;
    }
    if(!live) return;
    /* changed its mind mid-stroke: give the month scroller everything from here.
       Not stopping propagation from now on is what lets it see the movement, and
       settle() below already returns without stopping once live is false. */
    if(!open&&dx<-SW_BAIL){
      live=false; el.classList.remove("swiping"); put(0,true); return;
    }
    ev.stopPropagation();                            /* the month grid must not see this */
    if(ev.cancelable) ev.preventDefault();
    el.classList.add("swiping");                     /* lifts the heat row's own clip */
    put(Math.max(-SW_W,Math.min(0,(open?-SW_W:0)+dx)),false);
  },{passive:false});
  const settle=ev=>{
    if(!live) return;
    ev.stopPropagation();
    const dx=(ev.changedTouches&&ev.changedTouches[0]?ev.changedTouches[0].clientX:x0)-x0;
    open=((open?-SW_W:0)+dx) < -SW_W/2;              /* past halfway, it stays out */
    put(open?-SW_W:0,true);
    el.classList.remove("swiping");
    el.classList.toggle("swopen",open);
    if(open) swOpenEl=el; else if(swOpenEl===el) swOpenEl=null;
    live=false;
  };
  el.addEventListener("touchend",settle,{passive:false});
  el.addEventListener("touchcancel",settle,{passive:false});
  el.addEventListener("click",ev=>{
    if(ev.target.closest(".swx")){
      ev.preventDefault(); ev.stopImmediatePropagation();
      swClose(el); removeRow(r); return;
    }
    /* while it is open the row is a close button, not a link into a drawer */
    if(el.classList.contains("swopen")){
      ev.preventDefault(); ev.stopImmediatePropagation(); swClose(el);
    }
  },true);
}
function removeRow(r){
  /* It happened. Hiding it would put the column and the balance out of step with
     each other, and the balance is the one that can't be argued with. */
  if(r.real){ toast("That came off the account — it can't be deleted"); return; }
  if(r.info){ toast("Reference only — remove it in Feed me info"); return; }
  if(r.oneoff) S.oneoffs=S.oneoffs.filter(o=>o.id!==r.oneoff.id); else S.skip[r.key]=1; save(); render(); }
/* A budget line is a purchase you'll put on the card in THIS month. It raises this
   month's budget straight away and lands on next month's bill, because that's when
   the money actually leaves. The live cycle is the exception — real charges are
   already arriving there, so the bill is left alone and only the budget moves. */
function addBudgetLine(k){
  const n=prompt("What are you buying on the card in "+prettySpend(k)+"?  (e.g. New mattress)");
  if(!n) return;
  const a=prompt("Roughly how much?","1000"); if(a===null) return;
  const v=Math.abs(signed(a,-1)); if(!v||isNaN(v)) return;
  S.plans=S.plans||[];
  S.plans.push({id:uid(),ym:k,name:n,amt:v});
  save(); render();
  toast(nextMonth(k)===liveCycle().bill
    ? n+" added to the "+prettySpend(k)+" budget — the live card already sees the real charges"
    : n+" added to the "+prettySpend(k)+" budget — lands on the "+prettySpend(nextMonth(k))+" bill");
}
/* ── a plain line — cash, another account, anything that isn't the card ──────
   Was three prompts in a row ending in "day of month", which could only ever make
   a single month's line. A date and a cadence in one pane instead: say it repeats
   and it repeats from here, without having to add it and then go back in to make
   it recurring.

   The date wins over the column it was opened from. Pick the 2nd of next month
   from inside August and it belongs to next month — "date" has to mean date or it
   is just "day of month" wearing a calendar. */
let addCtx=null;
function addOneoff(k){ addCtx={k}; openDrawer("add"); }
function addTitle(){ return "New line in "+prettySpend(addCtx?addCtx.k:NOW); }
function addHTML(){
  const k=(addCtx&&addCtx.k)||NOW;
  const today=new Date();
  const def=(k===ym(today.getFullYear(),today.getMonth()+1))
    ? k+"-"+String(today.getDate()).padStart(2,"0") : k+"-01";
  return `
  <div class="fg" style="margin-bottom:0">
    <div class="f" style="flex:2"><label>What is it?</label>
      <input id="adName" placeholder="Vet bill, cleaner, tax refund"></div>
  </div>
  <div class="fg">
    <div class="f"><label>How much</label>
      <input id="adAmt" inputmode="decimal" placeholder="500"></div>
    <div class="f"><label>Date</label>
      <input type="date" id="adDate" value="${def}"></div>
  </div>
  <div class="hint" style="margin-top:6px">Money out by default \u2014 lead with a
    + if it's coming in.</div>

  <div class="steps"><div class="sh">Does it happen again?</div>
    <div class="fg" style="margin-top:0">
      <div class="f" style="flex:2"><label>How often</label><select id="adRep">
        ${CADENCES.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}
      </select></div>
      ${endSwapHTML("ad","date","","")}
    </div>
    <div class="hint" style="margin-top:6px">Leave it on \u201cdoesn't repeat\u201d and
      it's a one-off in that month. Anything else and a line appears in every month
      from the date on.</div>
  </div>

  <div class="crow"><button class="mini on" id="adGo">Add it</button></div>`;
}
/* No DOM in here, so it can be run in Node. Returns the rule it made, or null for
   a one-off, or a string if the input was no good. */
function addLine(a){
  const name=String(a.name||"").trim();
  if(!name) return "Give it a name";
  const v=signed(String(a.amount==null?"":a.amount),-1);
  if(v===null||!v||isNaN(v)) return "That amount didn't read as a number";
  const date=/^\d{4}-\d{2}-\d{2}$/.test(a.date||"")?a.date:null;
  if(!date) return "Pick a date";
  const k=date.slice(0,7);
  if(!a.cad){
    S.oneoffs=S.oneoffs||[];
    S.oneoffs.push({id:uid(),ym:k,name,amount:v,day:+date.slice(8,10)||99});
    return null;
  }
  /* ruleFromTx wants a transaction's shape and this has all of it — an amount, a
     day and a month. One rule builder, fed from both ends. */
  const r=ruleFromTx({date,amt:v,desc:name},a.cad,a.endM,name,k,a.payoff);
  clearAssign(TXSIG({date,amt:v,desc:name}));   /* no real transaction to answer it */
  return r;
}
function wireAdd(){
  const el=id=>document.getElementById(id);
  wireEndSwap("ad",()=>signed(String((el("adAmt")||{}).value||""),-1)||0);
  const go=el("adGo"); if(!go) return;
  go.onclick=()=>{
    const date=(el("adDate")||{}).value||"";
    const out=addLine({name:(el("adName")||{}).value,
                       amount:(el("adAmt")||{}).value,
                       date,
                       cad:(el("adRep")||{}).value||"",
                       endM:endSwapRead("ad").endM,
                       payoff:endSwapRead("ad").payoff});
    if(typeof out==="string"){ toast(out); return; }
    save(); render(); closeDrawer();
    toast(out ? out.name+" \u00b7 repeating from "+prettySpend(date.slice(0,7))
              : "Added to "+prettySpend(date.slice(0,7)));
  };
}

function drawStats(){
  /* walled-off months all carry the same frozen figure — they are not the tightest
     month in any meaningful sense. Fall back if a whole year sits behind the wall,
     otherwise Math.min of nothing is Infinity and the lookup below throws. */
  let yr=MODEL.filter(m=>parseYM(m.k).y===YEAR&&!m.noData);
  if(!yr.length) yr=MODEL.filter(m=>parseYM(m.k).y===YEAR);
  const ends=yr.map(m=>m.end), low=Math.min(...ends), lowM=yr[ends.indexOf(low)].k;
  const cur=MODEL.find(m=>m.k===NOW)||MODEL[0];
  const three=yr.filter(m=>m.payCount>2).length;
  const st=(k,v,c)=>`<div class="stat"><div class="k">${k}</div><div class="v ${c||""}">${v}</div></div>`;
  document.getElementById("stats").innerHTML=
    st("This month ends",money(cur.end),cur.end<S.meta.buffer?"amber":"teal")+
    st("Tightest in "+YEAR,money(low)+" · "+MN[parseYM(lowM).m-1],low<0?"red":low<S.meta.buffer?"amber":"teal")+
    st("Ends "+YEAR+" with",money(yr[yr.length-1].end),"cyan")+
    st("3-check months",three,"cyan");
}

/* ---------- tooltip ---------- */
const tip=document.getElementById("tip");
let tipOwner=null, tipShownAt=0, tipTimer=null;
/* Safari synthesises mouseenter on a tap, so on a phone the hover card fired on
   the way into the pane and then sat on top of it. The CSS already keeps :hover
   rules behind this same query for the same reason — one tap on iOS should do one
   thing. Gated in the one place every caller goes through rather than at each of
   the three wiring sites, so a fourth can't reintroduce it. */
const FINE=(()=>{ try{ return matchMedia("(hover:hover) and (pointer:fine)").matches; }
                  catch(e){ return false; } })();
function showTip(e,r,k){
  if(!FINE) return;
  clearTimeout(tipTimer);
  const ev={clientX:e.clientX,clientY:e.clientY,currentTarget:e.currentTarget};
  tipTimer=setTimeout(()=>reallyShowTip(ev,r,k),360);   /* let the pointer settle first */
}
function reallyShowTip(e,r,k){
  /* A transaction has no rule and no schedule, so none of the year-to-date
     arithmetic below means anything for it — and worse, the loop that gathers it
     matches rows on ruleId, which is undefined on all of these and would fold
     every transaction in the month into one. Its own card, and out. */
  if(r.real){
    const t=r.tx;
    let h=`<div class="tt">${txLabel(t)}</div>
      <div class="td">${fmtDate(t.date)} \u00b7 off the account</div>
      <div class="tr"><span>Amount</span><b>${money(t.amt)}</b></div>
      <div class="tr"><span>The bank called it</span><b>${String(t.desc||"—").slice(0,32)}</b></div>`;
    if(r.ccpay) h+=`<div class="note">Your credit card payment. It shows here and is
      left out of the month's total — the card row already takes that money out.</div>`;
    else if(r.transfer) h+=`<div class="note">A transfer. It won't remember this name;
      you'll be asked again next time.</div>`;
    if(r.assignedKey) h+=`<div class="note">Standing in for a line you planned, so that
      line has stepped out of this month.</div>`;
    if(k===NOW) h+=`<div class="note">Already inside the balance at the top of the
      column, so it isn't subtracted a second time.</div>`;
    h+=`<div class="note">Tap it to name it, make it repeat, or sit it against a
      planned line.</div>`;
    emitTip(h,e); return;
  }
  const {y}=parseYM(k);
  const name=r.oneoff?r.oneoff.name
             :(r.rule?r.rule.name:(String(r.label||"").split(" · ")[0]||"—"));

  if(rule&&rule.cap){

  }

    const M=MODEL.find(x=>x.k===k);
    h+=`<div class="hr"></div><div class="tr"><span>Visits this month</span><b>${M.cleanCount}${M.cleanCount>2?" (3-visit)":""}</b></div>
        <div class="tr"><span>Month total</span><b>${money(monthTotal)}</b></div>`;
  }
  if(r.budgetPlan){
    const p=r.budgetPlan;
    if(p.bare){
      tip.innerHTML=`<div class="tt">CC budget</div>
        <div class="td">no finished statements yet</div>
        <div class="tr"><span>Target</span><b>${money(p.target)}</b></div>
        <div class="note">Planned purchases for this month are listed underneath.
        They land on next month's card bill.</div>`;
      tip.classList.add("show");
      tipOwner=e.currentTarget||null; tipShownAt=Date.now(); moveTip(e); return;
    }
    let hh=`<div class="tt">CC budget</div><div class="td">from ${p.n} statements</div>
      <div class="tr"><span>Card averages</span><b>${money(p.avgTot)} a month</b></div>
      <div class="tr"><span>Target</span><b>${money(p.target)}</b></div>
      <div class="tr"><span>Over by</span><b>${money(p.over)}</b></div><div class="hr"></div>
      <div class="tr"><span>${p.hold} held at</span><b>${money(p.keep)}</b></div>
      <div class="tr"><span>Everything else</span><b>${(p.f*100).toFixed(0)}% of today</b></div>
      <div class="note">That's a ${((1-p.f)*100).toFixed(0)}% cut to every category except ${p.hold.toLowerCase()}.
      Tap the row to see each target.</div>`;
    tip.innerHTML=hh; tip.classList.add("show");
    tipOwner=e.currentTarget||null; tipShownAt=Date.now(); moveTip(e); return;
  }
  if(r.ruleId==="cc"&&k===liveCycle().bill&&liveStmt()){
    const st=liveStmt(), cats=catsOf(st.rows);
    h+=`<div class="hr"></div><div class="tr"><span>Live · ${st.cycle.start} to ${st.cycle.end}</span><b>${st.rows.length} charges</b></div>`;
    cats.slice(0,8).forEach(([c,v])=>{ h+=`<div class="tr"><span>${c}</span><b>${money(-v)}</b></div>`; });

  else if(rule&&rule.account&&rule.account!=="Main") h+=`<div class="note">Tracked against ${acctLabel(rule.account)}. Still counted in the total.</div>`;

/* One place decides where a tip's HTML lands. With tipSink set, the same content

   This is where it earns the rest of the year: give it a cadence and it stops
   being a single month's guess and becomes a line every month, waiting for the
   real transaction to be sat against it. */
function lineExtra(){

  if(!r) return "";

  return `<div class="steps"><div class="sh">Does it happen again?</div>

    <div class="crow"><button class="mini on" id="lnGo">Make it repeat</button></div>

/* ── removing one line of a repeating series ─────────────────────────────────
   Three different intentions that a single delete button can't tell apart: a
   month you're skipping, the day the thing stopped, and the day it stops after
   one last go. Scoped to this rule and nothing else — every other line in the
   column is untouched.

   The awkward case is a cadence with more than one occurrence in a month. Ending
   the rule at the previous month would take out the earlier ones in THIS month
   too, which isn't what "this one and every one after" means when you're stood on
   the second of the fortnight. So when this isn't the month's first occurrence,
   the rule ends here and the occurrences from this one on are skipped by hand. */
function ruleRowIdx(r){ const p=String(r.key||"").split("#"); return +p[2]||0; }
/* The three removals, with no DOM in them so they can be run in Node. `mode` is
   "one" (skip this month's occurrence), "fwd" (this one and everything after) or
   "rest" (this one stands, nothing after it). Returns what happened, for the
   toast and for the tests. */
function removeSeries(rule,key,k,mode){
  const idx=(+String(key).split("#")[2])||0;
  S.skip=S.skip||{};
  if(mode==="one"){ S.skip[key]=1; return {kind:"skipped",month:k}; }
  const occ=occDates(rule,k);
  if(mode==="rest"){
    rule.end=k;
    for(let i=idx+1;i<occ.length;i++) S.skip[rule.id+"#"+k+"#"+i]=1;
    return {kind:"endsAfter",month:k};
  }
  /* fwd */
  if(idx>0){
    /* stood on the second of a fortnight: the earlier one this month survives, so
       the rule ends HERE and the occurrences from this one on are skipped by hand.
       Ending at the previous month would have taken the earlier one out too. */
    rule.end=k;
    for(let i=idx;i<occ.length;i++) S.skip[rule.id+"#"+k+"#"+i]=1;
    return {kind:"endsAfter",month:k};
  }
  if(cmpYM(String(rule.start).slice(0,7),k)>=0){
    /* it never ran before this month, so ending it would leave an empty rule */
    dropRule(rule.id);
    return {kind:"dropped"};
  }
  rule.end=prevMonth(k);
  return {kind:"endsAfter",month:prevMonth(k)};
}
function dropRule(id){
  S.rules=(S.rules||[]).filter(x=>x.id!==id);
  const strip=o=>{ if(!o) return; Object.keys(o).forEach(kk=>{
    if(String(kk).split("#")[0]===id) delete o[kk]; }); };
  strip(S.skip); strip(S.hits); strip(S.props); strip(S.over); strip(S.assign);
  if(S.payee) delete S.payee[id];
  /* a transaction still pointing at a rule that no longer exists would keep its
     diamond and offer to edit a ghost */
  Object.keys(S.tag||{}).forEach(sig=>{ if(S.tag[sig]&&S.tag[sig].rule===id) delete S.tag[sig].rule; });
}
function lineRemoveHTML(){
  const r=lineCtx&&lineCtx.r, k=lineCtx&&lineCtx.k;
  if(!r||r.info||r.real||r.budget||r.group) return "";
  if(r.oneoff) return `<div class="steps"><div class="sh">Remove</div>
    <div class="crow"><button class="mini" id="rmOne">Delete this line</button></div>
    <div class="hint" style="margin-top:6px">It only exists in ${prettySpend(k)},
      so this is the whole of it.</div></div>`;
  if(!r.rule||r.ruleId==="cc") return "";
  return `<div class="steps"><div class="sh">Remove</div>
    <div class="crow" style="flex-direction:column;align-items:stretch">
      <button class="mini" id="rmOne">Just this one</button>
      <button class="mini" id="rmFwd">This one and every one after</button>
      <button class="mini" id="rmRest">Keep this one, drop the rest</button>
    </div>
    <div class="hint" style="margin-top:6px">Only ${esc(r.rule.name)}. Every other
      line in the column is left where it is.</div></div>`;
}

    const t={date:k+"-"+String(day).padStart(2,"0"), amt:o.amount, desc:o.name};
    ruleFromTx(t,cad,endM,o.name);

function lineTitle(){

function moveTip(e){
  const pad=8, vw=innerWidth, vh=innerHeight;
  const narrow = vw<760;

  if(narrow){
    /* no room beside anything — span the width and sit above the row */
    tip.style.left=pad+"px";
    tip.style.right=pad+"px";
    tip.style.width="auto";
    const r=tipOwner?tipOwner.getBoundingClientRect():{top:e.clientY,bottom:e.clientY};
    const h=tip.offsetHeight;
    let top=r.top-h-10;
    if(top<pad) top=r.bottom+10;                 // no room above? drop below
    if(top+h>vh-pad) top=Math.max(pad,vh-h-pad); // still overflowing? pin inside
    tip.style.top=top+"px";
    return;
  }

  tip.style.right="auto"; tip.style.width="";
  const w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+16, y=e.clientY+16;
  if(x+w>vw-pad) x=e.clientX-w-16;               // flip to the other side
  if(x<pad) x=pad;
  if(y+h>vh-pad) y=Math.max(pad,vh-h-pad);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ clearTimeout(tipTimer); tip.classList.remove("show"); tipOwner=null; }
/* on a touch screen the card sticks after a tap, so any tap clears it */

/* ── budget adjustment ───────────────────────────────
   The CC budget as a set of category amounts rather than one number. The total
   IS `ccTarget` — change anything here and the target, the heat ramp and Buddy's
   messages all move with it. The percentage slider works off a baseline captured
   when the panel opens, so dragging it back and forth doesn't compound. */
const BUDGET_SPLIT=[["Groceries",.26],["Dining",.16],["Shopping",.16],["Gas & auto",.10],
                    ["Home",.09],["Health",.07],["Kids",.06],["Personal care",.05],
                    ["Travel",.05]];
function seedCatBudget(){
  const tgt=Math.abs(Number(S.meta.ccTarget)||5000), out={};
  const p=(typeof trimPlan==="function")?trimPlan():null;
  if(p&&p.rows&&p.rows.length){
    /* if there's statement history, start from what actually gets spent */
    const tot=p.rows.reduce((a,r)=>a+Math.abs(r.target||0),0)||1;
    p.rows.forEach(r=>{ out[r.cat]=Math.max(0,Math.round(Math.abs(r.target)/tot*tgt/50)*50); });
  }else{
    BUDGET_SPLIT.forEach(([c,f])=>{ out[c]=Math.round(tgt*f/50)*50; });
  }
  return out;
}
function catBudget(){
  const b=S.meta.catBudget;
  if(!b||typeof b!=="object"||!Object.keys(b).length) S.meta.catBudget=seedCatBudget();
  return S.meta.catBudget;
}
function budgetTotal(){ const b=catBudget();
  return Object.keys(b).reduce((a,k)=>a+(Math.abs(+b[k])||0),0); }
function budgetSync(){ S.meta.ccTarget=budgetTotal(); save(); render(); paintBudget(); }

let bgBase=null;                       /* the amounts as they were when the panel opened */
function budgetHTML(){
  const b=catBudget();
  bgBase=Object.assign({},b);
  const cats=Object.keys(b);
  return `<div class="flag"><div class="ft">What the card is allowed</div><div class="fb">
      Everything here adds up to your <b>CC budget</b> — the line the card row is
      measured against, and the number Buddy quotes at 8pm.</div></div>

    <div class="bgtot"><span class="k">CC budget</span>
      <span class="v" id="bgTotal">${money(budgetTotal())}</span></div>

    <div class="fg" style="margin:10px 0 4px">

        <input id="bgSet" placeholder="${budgetTotal()}"></div>
    </div>
    <div class="hint" style="margin-bottom:14px">Type what you want the whole thing to
      be and everything below moves to fit, keeping the same shape.</div>

    <div class="bglab"><span>Move everything at once</span><b id="bgPctLab">0%</b></div>
    <input type="range" class="bgrange" id="bgPct" min="-50" max="100" step="5" value="0">
    <div class="hint" style="margin:-2px 0 16px">In steps of 5%. Let go and it sticks.</div>

    <div class="sh" style="margin-bottom:6px">Or nudge one at a time — $50 a tap</div>
    <div id="bgRows">${cats.map(c=>`
      <div class="bgrow" data-c="${c}">
        <span class="nm" style="color:${(typeof CATCOLOR!=="undefined"&&CATCOLOR[c])||"var(--txt)"}">${c}</span>
        <button class="mini" data-step="-50">−</button>
        <span class="am">${money(b[c])}</span>
        <button class="mini" data-step="50">+</button>
      </div>`).join("")}</div>

    <div class="crow" style="margin-top:14px">
      <button class="mini" id="bgEven">Even it out</button>
      <button class="mini" id="bgReset">Start from spending</button>
    </div>`;
}
function paintBudget(){
  const b=catBudget();
  const t=document.getElementById("bgTotal"); if(t) t.textContent=money(budgetTotal());
  document.querySelectorAll("#bgRows .bgrow").forEach(row=>{
    const c=row.dataset.c, am=row.querySelector(".am");
    if(am) am.textContent=money(b[c]||0);
  });
  const set=document.getElementById("bgSet"); if(set) set.placeholder=String(budgetTotal());
}
/* scale every category so the whole thing lands on `want`, to the nearest $50,
   with the rounding leftover pushed onto the biggest line */
function budgetScaleTo(want){
  const base=bgBase||catBudget();
  const from=Object.keys(base).reduce((a,k)=>a+(Math.abs(+base[k])||0),0);
  if(!from) return;
  const f=want/from, b=catBudget();
  let sum=0, biggest=null, bigv=-1;
  Object.keys(base).forEach(k=>{
    const v=Math.max(0,Math.round(Math.abs(base[k])*f/50)*50);
    b[k]=v; sum+=v;
    if(v>bigv){ bigv=v; biggest=k; }
  });
  if(biggest&&sum!==want) b[biggest]=Math.max(0,b[biggest]+(want-sum));
  budgetSync();
}
function wireBudget(){
  const pct=document.getElementById("bgPct"), lab=document.getElementById("bgPctLab");
  const apply=()=>{
    const p=+pct.value;
    lab.textContent=(p>0?"+":"")+p+"%";
    const base=bgBase||catBudget(), b=catBudget();
    Object.keys(base).forEach(k=>{
      b[k]=Math.max(0,Math.round(Math.abs(base[k])*(1+p/100)/50)*50);
    });
    budgetSync();
  };
  pct.oninput=apply; pct.onchange=apply;

  const set=document.getElementById("bgSet");
  set.onchange=()=>{
    const want=Math.abs(parseFloat(String(set.value).replace(/[^0-9.]/g,""))||0);
    if(!want) return;
    const base=bgBase||catBudget();
    const from=Object.keys(base).reduce((a,k)=>a+(Math.abs(+base[k])||0),0)||1;
    budgetScaleTo(want);
    /* park the slider on the nearest 5% so the two controls agree */
    const p=Math.round(((want/from)-1)*100/5)*5;
    pct.value=Math.max(-50,Math.min(100,p));
    lab.textContent=(pct.value>0?"+":"")+pct.value+"%";
    set.value=""; toast("CC budget set to "+money(budgetTotal()));
  };

  document.querySelectorAll("#bgRows .bgrow [data-step]").forEach(btn=>{
    btn.onclick=()=>{
      const c=btn.closest(".bgrow").dataset.c, b=catBudget();
      b[c]=Math.max(0,(Math.abs(+b[c])||0)+(+btn.dataset.step));
      bgBase=Object.assign({},b);          /* a hand nudge becomes the new baseline */
      pct.value=0; lab.textContent="0%";
      budgetSync();
    };
  });

  document.getElementById("bgEven").onclick=()=>{
    const b=catBudget(), keys=Object.keys(b), tot=budgetTotal();
    const each=Math.max(0,Math.round(tot/keys.length/50)*50);
    keys.forEach(k=>b[k]=each);
    bgBase=Object.assign({},b); pct.value=0; lab.textContent="0%";
    budgetSync(); toast("Split evenly");
  };
  document.getElementById("bgReset").onclick=()=>{
    S.meta.catBudget=seedCatBudget();
    bgBase=Object.assign({},catBudget()); pct.value=0; lab.textContent="0%";
    budgetSync();
    toast("Back to the shape of your spending");
  };
}

function labelBlock(which,title){
  const cats=allCats();
  const col=catColor;
  const own=S.meta.myCats||[];
  /* Only your own labels can go. The built-ins drive the spending breakdown and the

  const canDrop=c=>c!=="Other"&&own.includes(c);
  const hid=[];
