/* ── PIN ─────────────────────────────────────────────── */
const PIN="6669", IDLE_MS=180000;
let entry="", idleTimer=null, locked=false;
function drawDots(bad){
  const d=document.getElementById("lockDots");
  d.className="dots"+(bad?" bad":"");
  d.innerHTML=[0,1,2,3].map(i=>`<i class="${i<entry.length?"on":""}"></i>`).join("");
}
function lock(why){
  if(locked) return;
  locked=true; entry="";
  document.getElementById("lockWhy").textContent=why||"Locked after three minutes idle";
  document.getElementById("lockWrap").classList.add("on");
  document.body.classList.add("locked");
  drawDots(false);
}
function unlock(){
  locked=false; entry="";
  document.getElementById("lockWrap").classList.remove("on");
  document.body.classList.remove("locked");
  armIdle();
}
function armIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>lock(),IDLE_MS); }
/* Ctrl+L is wired in the main keydown handler above, ahead of everything else so it
   works from inside a text field too. */
function keyIn(ch){
  if(ch==="del"){ entry=entry.slice(0,-1); drawDots(false); return; }
  if(entry.length>=4) return;
  entry+=ch; drawDots(false);
  if(entry.length===4){
    if(entry===PIN) setTimeout(unlock,120);
    else setTimeout(()=>{ entry=""; drawDots(true); setTimeout(()=>drawDots(false),700); },140);
  }
}
(function(){
  const k=document.getElementById("lockKeys");
  k.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")
    +`<button class="wide" data-k="del">Del</button><button data-k="0">0</button><span></span>`;
  k.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>keyIn(b.dataset.k));
  addEventListener("keydown",e=>{
    if(!locked) return;
    if(/^[0-9]$/.test(e.key)) keyIn(e.key);
    else if(e.key==="Backspace") keyIn("del");
    e.stopPropagation();
  },true);
  ["pointerdown","keydown","wheel","touchstart"].forEach(t=>
    addEventListener(t,()=>{ if(!locked) armIdle(); },{passive:true,capture:true}));
  /* Leaving the tab does NOT lock — it was tried, and every glance at another
     window demanded the PIN again. Coming back just restarts the idle clock.
     The only two ways in are three minutes idle and Ctrl+L. */
  document.addEventListener("visibilitychange",()=>{ if(!locked) armIdle(); });
})();

/* ── three checks a day, whether or not you remember ──
   A web page can't run while it's closed, so these are catch-ups: the first time
   the app is open in a stretch of the day, that stretch gets its sync. Slot state
   is synced, so two devices don't spend the same slot twice. */
const AUTO_SLOTS=[["morning",5,11],["midday",11,17],["evening",17,23]];
const SFIN_RESERVE=4;        /* calls held back for whatever you do by hand */
function autoSlotNow(d){
  const h=(d||new Date()).getHours();
  const s=AUTO_SLOTS.find(x=>h>=x[1]&&h<x[2]);
  return s?s[0]:null;
}
async function autoSyncTick(){
  if(netBlocked()||syncing) return;
  if(!syncOn()&&!sfinOn()) return;
  if(syncOn()&&!pulledOK) return;              /* never act on state we haven't verified */
  const d=new Date(), day=ymdLocal(d), slot=autoSlotNow(d);
  if(!slot) return;
  const a=S.meta.autoSync;
  if(a&&a.day===day&&a.done&&a.done[slot]) return;
  const done=(a&&a.day===day&&a.done)?Object.assign({},a.done):{};
  done[slot]=1;
  S.meta.autoSync={day,done}; save();
  syncing=true;
  try{
    if(syncOn()) await syncPull(true);
    /* the card only if there's room left under the cap */
    if(sfinOn()&&sfinLeft()>SFIN_RESERVE) await sfinPull(true);
    await nudgeSchedule();
  }catch(e){ }
  finally{ syncing=false; }
}

render();
stampSaved();
lock("Enter your PIN to open the budget");
if(syncOn()&&!netBlocked()) syncPull(true);
snapNow();
/* check for a newer copy every few minutes */
setInterval(()=>{ if(syncOn()&&!netBlocked()&&document.visibilityState!=="hidden") syncPull(true); },180000);
/* morning, midday and night — checked on open, on return, and every ten minutes
   while you're looking at it. Each slot fires once a day and no more. */
setTimeout(autoSyncTick,3500);
setInterval(autoSyncTick,600000);
/* left open all day? top the card up every three hours, but only while there's
   plenty of headroom under the cap */
setInterval(()=>{ if(sfinOn()&&!netBlocked()&&document.visibilityState!=="hidden"
                     &&sfinLeft()>8) sfinPull(true); },10800000);
/* Duplicates from a reconnect are already in state before any of this runs, so
   the sweep needs one pass on load as well as one per pull. After the gist has
   had a chance to land, so it judges the merged state and not this device's. */
setTimeout(()=>{ try{ if(dupSweep()) render(); }catch(e){} },6000);
/* after the card has had a chance to land, see if Buddy owes anyone a message */
setTimeout(()=>nudgeSchedule(),7000);
setInterval(()=>{ if(document.visibilityState!=="hidden") nudgeSchedule(); },3600000);
document.addEventListener("visibilitychange",()=>{
  /* going away: spend whatever time we have left sending, not waiting */
  if(document.visibilityState==="hidden"){ flushPush(); return; }
  if(netBlocked()) return;
  if(syncOn()) syncPull(true);
  setTimeout(autoSyncTick,1200);
});
/* pagehide is the one iOS actually fires on a swipe-away or a tab close, and it
   fires on the bfcache path where unload never does. Both are wired because
   neither is reliable alone, and flushPush() is a no-op with nothing pending. */
window.addEventListener("pagehide",flushPush);
