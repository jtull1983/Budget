function monthLen(d){ return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
/* which of the four moods fits where the live cycle currently sits */
function nudgeBucket(d){
  /* the day the cycle turns over gets its own announcement, and it fires whether
     or not there's a target or a feed yet — there's nothing to measure on day one */
  if(d.getDate()===CYCLE_DAY) return "cycle";
  const tgt=effTarget(liveCycle(d).spend), lt=liveTotal();
  if(!tgt||lt===null) return null;
  const pct=Math.abs(lt)/tgt, day=d.getDate(), left=monthLen(d)-day;
  if(pct>=1) return "blown";
  if(day<=12&&pct>=0.45) return "early";
  if(left<=8&&pct>=0.85) return "close";
  return "good";
}
function buddyLine(b){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  return pick(BUDDY_HI)+" "+pick(BUDDY[b]);
}

const ymdLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
                  +"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const at8pm=d=>Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate(),NUDGE_HOUR,0,0)/1000);
const seqFor=d=>"buddy"+ymdLocal(d).replace(/-/g,"");

/* ntfy documents that posting to <topic>/<sequence-id> replaces an undelivered
   message already sitting under that id. Tested live against ntfy.sh and it did
   NOT — both copies arrived. So nothing here trusts replace. Every requeue is an
   explicit DELETE first, and a message is only published once the cancel came
   back clean. Worst case we lose a nudge; we never send two. */
const ntfyURL=seq=>"https://ntfy.sh/"+encodeURIComponent(ntfy.topic)
                  +(seq?"/"+encodeURIComponent(seq):"");
async function ntfySend(msg,tag,seq,atEpoch,title){
  const h={"X-Title":title||"Buddy the Budget","X-Tags":tag||"moneybag"};
  if(atEpoch) h["X-Delay"]=String(atEpoch);
  const r=await fetch(ntfyURL(seq),{method:"POST",body:msg,headers:h});
  if(!r.ok) throw new Error("ntfy said "+r.status);
}
/* 404 means there was nothing under that id, which is the state we wanted anyway */
async function ntfyCancel(seq){
  const r=await fetch(ntfyURL(seq),{method:"DELETE"});
  if(!r.ok&&r.status!==404) throw new Error("ntfy said "+r.status);
  return true;
}
/* what is actually sitting on the server, undelivered. sched=1 is the only way to
   see it — a plain poll hides anything that hasn't been delivered yet. */
async function ntfyPending(){
  const r=await fetch("https://ntfy.sh/"+encodeURIComponent(ntfy.topic)
                      +"/json?poll=1&sched=1&since=all");
  if(!r.ok) throw new Error("ntfy said "+r.status);
  /* everything the topic will admit to. No filtering on `time` — a scheduled
     message may be stamped with its delivery time or its publish time depending
     on the server, and guessing wrong makes a real queue look empty. The check
     tells the two apart with a one-off title instead. */
  return (await r.text()).split("\n").filter(Boolean).map(l=>{
    try{ return JSON.parse(l); }catch(e){ return null; }
  }).filter(m=>m&&m.event==="message");
}
const TAGS={good:"tada",early:"eyes",blown:"fire",close:"crossed_fingers",
            cycle:"calendar",silent:"see_no_evil"};

/* What the message would SAY, boiled down. Re-queue only when this changes —
   otherwise the random wording would look like new info every single hour. */
function nudgeSig(d){
  const b=nudgeBucket(d); if(!b) return null;
  const lt=liveTotal();
  /* to the nearest $50. Every requeue now costs a cancel plus a publish, so the
     bar for "this is different news" is higher than it was. */
  return b+"|"+(lt===null?"-":Math.round(Math.abs(lt)/50)*50);
}
/* every other day, 5th through the 30th. the last-sent date lives in state so it
   syncs — otherwise the phone and the Mac would each fire their own copy. */
/* Keeps three slots filled: tonight, tomorrow night, and the night after —
   that last one being the "nobody has opened this" message, which only ever
   arrives if you genuinely don't come back. Each open rewrites the ones that
   haven't fired yet, so what's pending is always as fresh as your last visit. */
async function nudgeSchedule(now){
  if(!ntfyOn()||netBlocked()) return;
  if(syncOn()&&!pulledOK) return;
  const d=now||new Date(), today=ymdLocal(d);
  if(!S.meta.buddyQ||typeof S.meta.buddyQ!=="object") S.meta.buddyQ={};
  const q=S.meta.buddyQ;
  /* v26 and earlier stored a bare signature string here */
  Object.keys(q).forEach(id=>{ if(typeof q[id]==="string") q[id]={sig:q[id]}; });
  let touched=false, failed="";

  /* gone long enough that the silent message already went out? say hello properly,
     right now, whatever the hour — that's the point of coming back. */
  const ran=S.meta.buddyRan;
  const gap=ran?Math.round((new Date(today)-new Date(ran))/86400000):0;
  if(ran&&gap>=2){
    const b=nudgeBucket(d)||"good";
    try{ await ntfySend("(back at last) "+buddyLine(b),TAGS[b]); touched=true; }
    catch(e){ failed=String(e.message||e); }
  }

  const sig=nudgeSig(d);
  if(sig){
    const slots=[];
    if(d.getHours()<NUDGE_HOUR) slots.push([0,sig]);   /* tonight, if 8pm hasn't passed */
    slots.push([1,sig]);                               /* tomorrow, same picture */
    slots.push([2,"silent"]);                          /* and if we never hear from you */
    for(const [n,want] of slots){
      const day=addDays(d,n), id=seqFor(day), have=q[id];
      if(have&&have.sig===want&&!have.unsure) continue;      /* nothing has changed */
      if(have&&have.stuck) continue;                         /* a cancel already failed here */
      /* clear the slot before filling it. if this throws, the old message stays and
         we leave well alone — one stale nudge beats two fresh ones. */
      if(have){
        try{ await ntfyCancel(id); }
        catch(e){ have.stuck=1; touched=true; failed=String(e.message||e); continue; }
      }
      const b=want==="silent"?"silent":want.split("|")[0];
      /* written down BEFORE the send, so a reply we never see can't turn into a
         second copy tomorrow — it comes back as unsure and gets cancelled first */
      q[id]={sig:want,unsure:1}; touched=true;
      try{ await ntfySend(buddyLine(b),TAGS[b],id,at8pm(day)); delete q[id].unsure; }
      catch(e){ failed=String(e.message||e); }
    }
  }

  Object.keys(q).forEach(id=>{ if(id<seqFor(d)){ delete q[id]; touched=true; } });

  ntfy.lastErr=failed;
  if(!failed&&touched) ntfy.lastSent=Date.now();
  saveNtfy();
  S.meta.buddyRan=today;
  if(touched){ S.meta.lastNudge=today; save(); }
}
/* the Send-one-now button: straight out, no delay, no sequence id, no bookkeeping */
function nudgeCheck(force,now){
  if(!ntfyOn()||netBlocked()) return Promise.resolve();
  const d=now||new Date();
  const b=nudgeBucket(d)||"good";
  return ntfySend(buddyLine(b),TAGS[b]).then(()=>{
    ntfy.lastErr=""; ntfy.lastSent=Date.now(); ntfy.lastMood=b; saveNtfy();
  }).catch(e=>{ ntfy.lastErr=String(e.message||e); saveNtfy(); });
}

  accts.forEach(a=>{
    const txs=a.transactions||[];

}

}
function wireSync(){
  const tok=document.getElementById("sTok"), gid=document.getElementById("sGist");
  document.getElementById("sConnect").onclick=async()=>{
    const t=tok.value.trim();
    if(t&&!/^•+$/.test(t)) sync.token=t;
    if(!sync.token){ toast("Paste a token first"); return; }
    sync.gistId=gid.value.trim();
    saveSync();
    if(!sync.gistId){
      setSync("busy","creating…");
      try{
        const g=await ghCreate(S);
        sync.gistId=g.id; sync.lastPulled=ts(S); saveSync();
        setSync("ok","gist created");
        toast("Created gist "+g.id.slice(0,8));
      }catch(e){ setSync("err",netMsg(e)); toast(netMsg(e)); }
    } else {
      await syncPull(true);
    }
    openDrawer("sync");
  };
  document.getElementById("sPull").onclick=()=>syncPull().then(()=>openDrawer("sync"));
  document.getElementById("sPush").onclick=()=>syncPush(true).then(()=>openDrawer("sync"));
  const off=document.getElementById("sOff");
  if(off) off.onclick=()=>{ if(confirm("Disconnect this device? The gist stays where it is.")){
    sync={token:"",gistId:"",lastPulled:0}; saveSync(); setSync("ok",""); openDrawer("sync"); toast("Disconnected"); } };
  const sfc=document.getElementById("sfConnect");
  if(sfc) sfc.onclick=async()=>{
    const v=document.getElementById("sfTok").value.trim();
    if(!v){ toast("Paste the setup token first"); return; }
    setSync("busy","connecting card…");
    try{ await sfinClaim(v); await sfinPull(); toast("Card connected"); }
    catch(e){ setSync("err",e.message.slice(0,40)); toast(e.message); }
    openDrawer("sync");
  };
  const ntr=document.getElementById("ntRoll"), nts=document.getElementById("ntSave");
  if(ntr) ntr.onclick=()=>{ document.getElementById("ntTopic").value=rollTopic(); };
  if(nts) nts.onclick=()=>{
    const v=document.getElementById("ntTopic").value.trim();
    if(v.length<8){ toast("Make it longer than that"); return; }
    ntfy.topic=v; saveNtfy(); openDrawer("sync"); toast("Buddy is listening");
  };
  const ntc=document.getElementById("ntCopy");
  if(ntc) ntc.onclick=async()=>{
    try{ await navigator.clipboard.writeText(ntfy.topic); toast("Topic copied"); }
    catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("ntShow"));
      getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected — copy it"); }
  };
  const ntt=document.getElementById("ntTest"), nto=document.getElementById("ntOff");
  if(ntt) ntt.onclick=()=>nudgeCheck(true).then(()=>{ openDrawer("sync");
    toast(ntfy.lastErr?"Didn't send":"Sent"); });
  /* Publish, look, publish again, look, cancel, look. Everything is scheduled a
     quarter of an hour out and cancelled at the end, so nothing reaches a phone
     unless a step genuinely failed — in which case the message says so. */
  const nsc=document.getElementById("ntSched");
  if(nsc) nsc.onclick=async()=>{
    const box=document.getElementById("ntDiag");
    const line=(k,v,ok)=>`<div class="dline"><span>${k}</span><span class="${
      ok===true?"yes":ok===false?"no":"maybe"}">${v}</span></div>`;
    box.innerHTML=`<div class="flag"><div class="ft">Checking</div><div class="fb">talking to ntfy…</div></div>`;
    /* a title nothing else can wear, so anything matching is from this run and
       no timestamp guessing is needed */
    const seq="buddydiag", at=Math.floor(Date.now()/1000)+900;
    const T="Buddy diagnostics "+Math.random().toString(36).slice(2,6);
    let seen=0;
    const read=async()=>{ const all=await ntfyPending(); seen=all.length;
                          return all.filter(m=>m.title===T).length; };
    let h="";
    try{
      await ntfyCancel(seq);
      await ntfySend("If this reaches a phone, cancelling failed.","wrench",seq,at,T);
      const a=await read();
      const blind=a===0;      /* the topic won't show us its queue */
      h+=line("Scheduled one",
              a===1?"the server has it":blind?"can't see it":"server shows "+a,
              a===1?true:blind?null:false);
      await ntfySend("Second one, same id.","wrench",seq,at,T);
      const b=await read();
      h+=line("Sent a second under that id",
              blind?"can't tell":b===1?"replaced the first":"server now holds "+b,
              blind?null:b===1);
      await ntfyCancel(seq);
      const c=await read();
      h+=line("Cancelled it",
              blind?"delete sent":c===0?"gone":"still holding "+c,
              blind?null:c===0);
      h+=`<div class="dnote">${blind
        ? `This topic returned ${seen} message${seen===1?"":"s"} and none of them
           were the ones just queued, so the check can't see what ntfy is holding
           and can't answer the replace question either way. It doesn't change
           anything: the app cancels before every requeue, so a replace that
           doesn't work still can't produce two messages.`
        : `Either way the app cancels before it requeues, so a broken replace
           can't make two messages.`}</div>`;
      box.innerHTML=`<div class="flag ${blind?"":"good"}"><div class="ft">ntfy queue check</div>
        <div class="fb">${h}</div></div>`;
    }catch(e){
      box.innerHTML=`<div class="flag bad"><div class="ft">ntfy queue check</div>
        <div class="fb">${h}${line("Stopped",String(e.message||e),false)}</div></div>`;
      try{ await ntfyCancel(seq); }catch(_){}
    }
  };
  if(nto) nto.onclick=()=>{ ntfy={}; saveNtfy(); openDrawer("sync"); toast("Buddy off"); };
  const sfk=document.getElementById("sfPeek");
  if(sfk) sfk.onclick=()=>{
    const box=document.getElementById("sfPeekBox");
    box.style.display=box.style.display==="none"?"":"none";
    document.getElementById("sfPeekBody").innerHTML=sfinPeekHTML();
  };
  const sfp=document.getElementById("sfPull");
  if(sfp) sfp.onclick=()=>sfinPull().then(()=>openDrawer("sync"));
  const sfo=document.getElementById("sfOff");
  if(sfo) sfo.onclick=()=>{ if(confirm("Disconnect the card feed? Charges already pulled stay put.")){
    sfin={}; saveSfin(); openDrawer("sync"); toast("Card disconnected"); } };
}


/* ============================================================
   CARD YEAR REVIEW
   A statement paid in month M covers the month before it, so a
   calendar year of spending runs Feb..Jan of the following year.
   ============================================================ */
function prevMonth(k){ const {y,m}=parseYM(k); return m===1?ym(y-1,12):ym(y,m-1); }
function spendYearOf(k){ return parseYM(prevMonth(k)).y; }

function cardYear(y){
  const keys=Object.keys(S.stmts)
    .filter(k=>S.stmts[k]&&S.stmts[k].rows&&S.stmts[k].rows.length&&spendYearOf(k)===y)
    .sort();
  const closer=ym(y+1,1);                       /* the statement holding December */
  const complete=keys.includes(closer);
  const by={}, months=[], merchants={};
  let charged=0, credits=0;
  keys.forEach(k=>{
    const st=S.stmts[k]; let mTot=0;
    st.rows.forEach(r=>{
      by[r.cat]=(by[r.cat]||0)+r.amt; mTot+=r.amt;
      if(r.amt>0){ charged+=r.amt; const m=normMerchant(r.desc); merchants[m]=(merchants[m]||0)+r.amt; }
      else credits+=r.amt;
    });
    months.push({filed:k, spend:prevMonth(k), total:mTot});
  });
  const total=charged+credits;
  return {y,keys,complete,closer,total,charged,credits,months,
    cats:Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]),
    top:Object.entries(merchants).sort((a,b)=>b[1]-a[1]).slice(0,8),
    avg: months.length?total/months.length:0};
}
function cardTx(y,cat,spendMonth){
  const out=[];
  Object.keys(S.stmts).filter(k=>spendYearOf(k)===y).sort().forEach(k=>{
    const st=S.stmts[k]; if(!st||!st.rows) return;
    if(spendMonth&&prevMonth(k)!==spendMonth) return;
    st.rows.forEach((r,i)=>{ if(!cat||r.cat===cat) out.push({...r,filed:k,spend:prevMonth(k),idx:i}); });
  });
  return out.sort((a,b)=>b.amt-a.amt);
}
/* every category present, biggest first — nothing dropped */
function catsOf(tx){
  const by={}; tx.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.amt);
  return Object.entries(by).filter(e=>Math.abs(e[1])>0.005).sort((a,b)=>b[1]-a[1]);
}
/* what every category has to come down to so the card lands on target,
   with one category (groceries by default) left alone */
function trimPlan(){
  const keys=Object.keys(S.stmts||{}).filter(k=>S.stmts[k]&&S.stmts[k].rows&&S.stmts[k].rows.length&&!S.stmts[k].live);
  if(keys.length<2) return null;
  const by={}; let tot=0;
  keys.forEach(k=>S.stmts[k].rows.forEach(r=>{ by[r.cat]=(by[r.cat]||0)+r.amt; tot+=r.amt; }));
  const n=keys.length, avgTot=tot/n, hold=S.meta.holdCat||"Groceries";
  const avg={}; Object.entries(by).forEach(([c,v])=>avg[c]=v/n);
  const keep=avg[hold]||0, rest=avgTot-keep, room=(S.meta.ccTarget||5000)-keep;
  const f=rest>0?Math.max(0,room/rest):0;
  const rows=Object.entries(avg).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{
    const t=c===hold?v:v*f;
    return {cat:c,now:v,target:t,cut:v-t,held:c===hold};
  });
  return {n,avgTot,hold,keep,room,f,rows,target:S.meta.ccTarget||5000,
          over:avgTot-(S.meta.ccTarget||5000)};
}

  return {label:"Card spending so far", mode:"partial", d};
}

  });
  h+=`</div></div>`;

  let planned=0, matched=0;
  d.keys.forEach(k=>{
    const M=MODEL.find(x=>x.k===k);
    if(M){ const row=M.rows.find(r=>r.ruleId==="cc"); if(row){ planned+=Math.abs(row.amount); matched++; } }
  });
  if(matched){
    const diff=d.total-planned;
    h+=`<div class="flag ${Math.abs(diff)>planned*0.1?"bad":"good"}"><div class="ft">Plan vs reality</div>
      <div class="fb">Your budget carried <b>${money(planned)}</b> across those ${matched} months.
      The statements say <b>${money(d.total)}</b> — ${diff>0?`<b>${money(diff)}</b> more than planned`
      :diff<0?`<b>${money(-diff)}</b> less than planned`:"exactly as planned"}.
      ${Math.abs(diff)>planned*0.1?`That gap compounds: at this rate it's about ${money(diff/matched*12)} a year off.`:""}</div></div>`;
  }
  return h;
}

function openPicker(filed,idx){
  const row=S.stmts[filed]&&S.stmts[filed].rows[idx]; if(!row) return;
  const same=[];
  Object.values(S.stmts).forEach(st=>st&&st.rows&&st.rows.forEach(o=>{
    if(normMerchant(o.desc)===normMerchant(row.desc)) same.push(o); }));
  const wrap=document.getElementById("pickWrap");
  document.getElementById("pick").innerHTML=
    `<div class="pt">${row.desc}</div>
     <div class="pd">${money(row.amt)} · currently <b style="color:${CATCOLOR[row.cat]}">${row.cat}</b>${
       same.length>1?` · ${same.length} charges from this merchant will move together`:""}</div>
     <div class="pickgrid">${CATS.map(c=>
       `<button data-pick="${c}" class="${c===row.cat?"cur":""}" style="color:${CATCOLOR[c]||"var(--dim)"}">${c}</button>`).join("")}</div>
     <button class="pclose" id="pickCancel">Cancel</button>`;
  wrap.classList.add("on");
  document.getElementById("pickCancel").onclick=closePicker;
  wrap.onclick=e=>{ if(e.target===wrap) closePicker(); };
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const cat=b.dataset.pick, key=normMerchant(row.desc);
    S.learned[key]=cat;
    Object.values(S.stmts).forEach(st=>st&&st.rows&&st.rows.forEach(o=>{
      if(normMerchant(o.desc)===key) o.cat=cat; }));
    save(); render(); closePicker(); openDrawer("card");
    toast(same.length>1?same.length+" moved to "+cat:"Moved to "+cat);
  });
}

function insights(){
  const out=[];
  const neg=MODEL.filter(m=>m.end<0);
  if(neg.length) out.push({tone:"bad",t:"Months that go below zero",
    b:neg.map(m=>MN[parseYM(m.k).m-1]+" "+parseYM(m.k).y+" ends at "+money(m.end)).join(" · ")});
  const low=MODEL.filter(m=>m.end>=0&&m.end<S.meta.buffer);
  if(low.length) out.push({tone:"warn",t:"Months under "+money(S.meta.buffer),
    b:low.map(m=>MN[parseYM(m.k).m-1]+" "+String(parseYM(m.k).y).slice(2)+" ("+money(m.end)+")").join(", ")});

  const odd=S.oneoffs.filter(o=>o.odd);
  if(odd.length) out.push({tone:"warn",t:"Two different water amounts — which is the real bill?",
    b:`On the Dec / Mar / Jun / Sep cycle your sheet shows <b>$180</b> (Jun-26, Mar-27, Jun-27), so I've used those exact figures on the cycle months and $370 on the ones that were blank. But there are also <b>$370</b> charges in Apr-26, Jan-27 and Apr-27 — each sitting exactly one month after a cycle month. If those are the same quarterly bill just paid late, delete these three lines with the × and set Water to a single amount. If it's a separate charge, tell me and I'll give it its own line.`});

  const three=MODEL.filter(m=>m.payCount>2);
  if(three.length) out.push({tone:"good",t:"Three-paycheck months",
    b:three.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      ". Your natural catch-up months — the extra check is the one worth aiming at a goal before it gets absorbed."});

  const bl=Object.keys(S.balancers||{});
  if(bl.length) out.push({tone:"warn",t:"Balancer in play",
    b:bl.map(k=>{const M=MODEL.find(x=>x.k===k),row=M&&M.rows.find(r=>r.balancer);
      return `${MFULL[parseYM(k).m-1]} ${parseYM(k).y}: ${row?money(row.amount):"—"} to land the next month at ${money(S.balancers[k])}`;}).join(" · ")+
      `. A balancer is a plug, not a real transaction — it's there to force a month to open at a number you know is true. Worth replacing with the actual line item once you know what it was.`});
  const ob=S.rules.filter(r=>r.offbook);
  if(ob.length) out.push({tone:"good",t:"Shown but not counted",
    b:ob.map(r=>`${r.name} (${acctLabel(r.account)})`).join(" · ")+
      `. These sit in the grid in purple so you can see the full picture, but they never touch the ending balance. Across the plan that's ${money(Math.abs(MODEL.reduce((s,m)=>s+m.offTot,0)))} of spending you're seeing but not carrying.`});
  const c3=MODEL.filter(m=>m.cleanCount>2);
  const clRule=S.rules.find(r=>r.id==="cleaner");
  if(c3.length&&clRule) out.push({tone:"good",t:"Three-visit months for "+clRule.name,
    b:c3.map(m=>MFULL[parseYM(m.k).m-1]+" "+parseYM(m.k).y).join(" · ")+
      `. Those months carry an extra visit, so they cost more than a normal month.`});

  S.rules.filter(r=>r.cap).forEach(r=>{
    [...new Set(MODEL.map(m=>parseYM(m.k).y))].forEach(y=>{
      let t=0; MODEL.filter(m=>parseYM(m.k).y===y).forEach(m=>m.rows.filter(x=>x.ruleId===r.id).forEach(x=>t+=x.amount));
      if(Math.abs(t)>r.cap) out.push({tone:"warn",t:`${r.name} runs past its ${y} limit`,
        b:`${money(Math.abs(t))} planned against ${money(r.cap)} — ${money(Math.abs(t)-r.cap)} over.`});
      else if(t!==0&&Math.abs(t)<r.cap) out.push({tone:"good",t:`${r.name} · ${y}`,
        b:`${money(Math.abs(t))} of ${money(r.cap)} contributed. ${money(r.cap-Math.abs(t))} of room left.`});
    });
  });

  S.rules.filter(r=>r.payoff).forEach(r=>{
    const fin=payoffDone(r);
    out.push({tone:"good",t:`${r.name} payoff`,
      b:fin?`Clears in ${MFULL[parseYM(fin).m-1]} ${parseYM(fin).y}.`
           :`${money(payoffLeft(r,S.meta.end))} still outstanding when the plan ends. Add a year to see the payoff date.`});
  });

  const cc=MODEL.filter(m=>m.rows.some(r=>r.ruleId==="cc"));
  const ccTot=cc.reduce((s,m)=>s+m.rows.filter(r=>r.ruleId==="cc").reduce((a,b)=>a+b.amount,0),0);
  out.push({tone:"warn",t:"The credit card is the whole story",
    b:`${money(Math.abs(ccTot))} across ${cc.length} months — far and away your biggest outflow. Every $250 a month you shave off adds about ${money(250*cc.length)} to the plan. Nothing else on this board moves the needle as hard.`});
  return out;
}

/* iOS in-app browsers swallow <a download>, so offer the share sheet first —
   that gives you "Save to Files" and it actually lands somewhere you can find. */
async function deliver(text,name,mime){
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      toast("Shared "+name);
      return true;
    }
  }catch(err){
    if(err&&err.name==="AbortError"){ toast("Cancelled"); return true; }
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Saved "+name);
    return true;
  }catch(err){}
  toast("This browser blocked the download");
  alert("This browser wouldn't save the file.\n\nIf you're inside an app's built-in browser, tap the ⋯ menu and choose \"Open in Safari\", then try again.");
  return false;
}

function stepBack(){
  const pick=document.getElementById("pickWrap");
  if(pick&&pick.classList.contains("on")){ closePicker(); return true; }
  if(drawer.classList.contains("open")){
    /* card drawer drills year > month > category; unwind it a level at a time */
    if(nav.cat){ nav.cat=null; openDrawer("card"); return true; }
    if(nav.month){ nav.month=null; openDrawer("card"); return true; }
    closeDrawer(); return true;
  }
  const mp=document.getElementById("menuPanel");
  if(mp.classList.contains("open")){ closeMenu(); return true; }
  return false;
}
function menuOpen(){ return document.getElementById("menuPanel").classList.contains("open"); }
/* everything the keyboard can land on, in the order it appears. disabled and
   off-screen controls are dropped — .focus() is a no-op on those and Tab would
   sit there forever looking broken. */
const KBSEL="button,input,select,textarea,label.btn,[tabindex]";
function kbIn(root){
  return [...root.querySelectorAll(KBSEL)].filter(el=>{
    if(el.disabled||el.hidden) return false;
    if(el.tagName==="INPUT"&&/^(file|hidden)$/.test(el.type)) return false;
    if(el.tabIndex<0) return false;
    return el.offsetParent!==null;
  });
}
/* the flashing box. only ever one, and only ever in the menu. */
function kbMark(el){
  document.querySelectorAll(".kbfocus").forEach(x=>x.classList.remove("kbfocus"));
  if(el){ el.classList.add("kbfocus"); el.focus(); }
}
function openMenu(){ document.getElementById("menuPanel").classList.add("open");
                     document.getElementById("btnMenu").classList.add("open");
                     /* Tab starts here, and it says so */
                     kbMark(kbIn(document.getElementById("menuPanel"))[0]); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open");
  kbMark(null);
  if(document.activeElement&&document.activeElement.closest&&
     document.activeElement.closest("#menuPanel")) document.activeElement.blur();
                      document.getElementById("btnMenu").classList.remove("open"); }
/* typing in a field? keys belong to the field, not the app */
function typing(t){ return t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable); }

document.addEventListener("keydown",e=>{
  if(locked) return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey&&e.key.toLowerCase()==="l"){ e.preventDefault(); lock("Locked from the keyboard"); return; }

  /* Tab is handled before the typing check — in a text field it moves on anyway,
     and letting the browser have it would walk focus out of the app entirely */
  if(e.key==="Tab"){
    const dOpen=drawer.classList.contains("open");
    const list = dOpen ? kbIn(drawer)
               : menuOpen() ? kbIn(document.getElementById("menuPanel"))
               : [...document.querySelectorAll(".ytab:not(.arrow)")];
    if(!list.length) return;
    e.preventDefault();
    const at=list.indexOf(document.activeElement);
    let next;
    if(at<0) next = (dOpen||menuOpen()) ? 0
                  : Math.max(0,list.findIndex(b=>b.classList.contains("on")));
    else next=(at+(e.shiftKey?-1:1)+list.length)%list.length;
    if(menuOpen()&&!dOpen) kbMark(list[next]); else list[next].focus();
    return;
  }
  /* Enter on something we made tabbable by hand */
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute
     &&e.target.getAttribute("role")==="button"){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key==="Enter"&&e.target&&e.target.tagName==="LABEL"&&e.target.classList.contains("btn")){
    e.preventDefault(); e.target.click(); return;
  }
  /* Esc in a field gives the field up first, then the app takes the next one */
  if(e.key==="Escape"&&typing(e.target)){ e.target.blur(); e.preventDefault(); return; }
  if(typing(e.target)) return;

  if(e.key==="Escape"||e.key==="Backspace"){ if(stepBack()) e.preventDefault(); return; }

  if(e.key==="ArrowDown"){ if(!menuOpen()&&!drawer.classList.contains("open")){ e.preventDefault(); openMenu(); } return; }
  if(e.key==="ArrowUp"){ if(menuOpen()){ e.preventDefault(); closeMenu(); } return; }

  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    if(drawer.classList.contains("open")) return;
    const d=e.key==="ArrowRight"?1:-1;
    /* wide + expanded: slide the rail. everywhere else: page the window of months */
    if(innerWidth>1100&&!fitMode) nudgeCols(d); else shiftView(d);
    e.preventDefault();
  }
});

/* a trackpad two-finger swipe arrives as wheel events with deltaX. they come in a
   stream, so latch one move per gesture and wait for the stream to go quiet. */
let swipeLatch=false, swipeQuiet=null;
addEventListener("wheel",e=>{
  if(locked||drawer.classList.contains("open")||menuOpen()) return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<8) return;
  clearTimeout(swipeQuiet);
  swipeQuiet=setTimeout(()=>{ swipeLatch=false; },140);
  if(swipeLatch) return;
  swipeLatch=true;
  const d=e.deltaX>0?1:-1;
  if(innerWidth>1100&&!fitMode) nudgeCols(d); else shiftView(d);
},{passive:true});

function nudgeCols(dir){
  const sc=document.getElementById("scroller");
  if(!sc||fitMode) return;
  const col=sc.querySelector(".mcol");
  const w=col?col.offsetWidth:Math.floor(sc.clientWidth/6);
  sc.scrollBy({left:dir*w,behavior:"smooth"});
}
{ const L=document.getElementById("btnLeft"), R=document.getElementById("btnRight");
  if(L) L.onclick=()=>nudgeCols(-1);
  if(R) R.onclick=()=>nudgeCols(1); }
const menuPanel=document.getElementById("menuPanel");
const menuBtn=document.getElementById("btnMenu");
menuBtn.onclick=()=>{ menuOpen()?closeMenu():openMenu(); };
menuPanel.querySelectorAll(".btn,label.btn").forEach(b=>b.addEventListener("click",closeMenu));

/* swipe the grid a month at a time */

(function(){
  const sc=document.getElementById("scroller");
  let x0=null,y0=null,moved=false;
  sc.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  sc.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4) moved=true;
  },{passive:true});
  sc.addEventListener("touchend",e=>{
    if(x0===null||!moved){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45) shiftView(dx<0?1:-1);   /* drag left = go forward */
    x0=null;
  },{passive:true});
})();

/* rotating the phone changes how many months fit */
let rzTimer=null, lastPer=perView();
addEventListener("resize",()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{ fitGrid(); if(perView()!==lastPer){ lastPer=perView(); render(null); } centerWide(); },160);

/* ── PIN ─────────────────────────────────────────────── */
const PIN="6669", IDLE_MS=180000;
let entry="", idleTimer=null, locked=false;
function drawDots(bad){
  const d=document.getElementById("lockDots");
  d.className="dots"+(bad?" bad":"");
  d.innerHTML=[0,1,2,3].map(i=>`<i class="${i<entry.length?"on":""}"></i>`).join("");
}
function lock(why){
  if(locked) return;
  locked=true; entry="";
  document.getElementById("lockWhy").textContent=why||"Locked after three minutes idle";
  document.getElementById("lockWrap").classList.add("on");
  document.body.classList.add("locked");
  drawDots(false);
}
function unlock(){
  locked=false; entry="";
  document.getElementById("lockWrap").classList.remove("on");
  document.body.classList.remove("locked");
  armIdle();
}
function armIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>lock(),IDLE_MS); }
/* Ctrl+L is wired in the main keydown handler above, ahead of everything else so it
   works from inside a text field too. */
function keyIn(ch){
  if(ch==="del"){ entry=entry.slice(0,-1); drawDots(false); return; }
  if(entry.length>=4) return;
  entry+=ch; drawDots(false);
  if(entry.length===4){
    if(entry===PIN) setTimeout(unlock,120);
    else setTimeout(()=>{ entry=""; drawDots(true); setTimeout(()=>drawDots(false),700); },140);
  }
}
(function(){
  const k=document.getElementById("lockKeys");
  k.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")
    +`<button class="wide" data-k="del">Del</button><button data-k="0">0</button><span></span>`;
  k.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>keyIn(b.dataset.k));
  addEventListener("keydown",e=>{
    if(!locked) return;
    if(/^[0-9]$/.test(e.key)) keyIn(e.key);
    else if(e.key==="Backspace") keyIn("del");
    e.stopPropagation();
  },true);
  ["pointerdown","keydown","wheel","touchstart"].forEach(t=>
    addEventListener(t,()=>{ if(!locked) armIdle(); },{passive:true,capture:true}));
  /* Leaving the tab does NOT lock — it was tried, and every glance at another
     window demanded the PIN again. Coming back just restarts the idle clock.
     The only two ways in are three minutes idle and Ctrl+L. */
  document.addEventListener("visibilitychange",()=>{ if(!locked) armIdle(); });
})();
